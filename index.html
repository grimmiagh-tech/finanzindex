<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================== Konfiguration ============================== */

// Trade Republic und ING sind echte Bankkonten, alle anderen Namen im
// Konten-Blatt sind virtuelle Budget-Töpfe, die real auf Trade Republic liegen.
const REAL_ACCOUNTS = ["Trade Republic", "ING"];
// Icon + Hintergrundfarbe für jedes Konto/jeden Topf. Bei ING, Trade Republic
// und Model 3 sind das bewusst eigene, generische Symbole (keine
// Original-Logos, siehe Markenrecht) in an die Marke angelehnten, aber
// gedämpften Farben. Alle anderen Farben sind bewusst dunkel/gedämpft
// gewählt, damit das weiße Icon darauf gut lesbar bleibt.
const ACCOUNT_BADGES = {
  "Trade Republic": { icon: "trend", bg: "#1f6f5c" },
  "ING": { icon: "landmark", bg: "#c96a2e" },
  "Model 3": { icon: "car", bg: "#8a3d3d" },
  "Laden": { icon: "bolt", bg: "#0e7490" },
  "E-Liquids": { icon: "vape", bg: "#6b5b73" },
  "Lebensmittel": { icon: "cart", bg: "#b45309" },
  "Freizeit": { icon: "coaster", bg: "#6d28d9" },
  "Kosmetik": { icon: "lipstick", bg: "#be185d" },
  "Rücklage": { icon: "piggy", bg: "#a16207" },
  "Jahres Rückstellung": { icon: "wrench", bg: "#0369a1" },
  "Transit": { icon: "road", bg: "#1d4ed8" },
  "Abo & ETF": { icon: "repeat", bg: "#7e22ce" },
  "Puffer": { icon: "lifering", bg: "#15803d" },
  "Ausgaberest": { icon: "wallet", bg: "#4338ca" },
};
// Diese Töpfe bekommen keinen einzelnen "monatlichen Startbetrag" zugewiesen
// (Transit wird aus mehreren Fixkosten-Positionen gespeist, Puffer ist ein
// reiner Reservetopf) und zeigen daher keinen Klammer-Betrag.
const POTS_OHNE_STARTBETRAG = ["Transit", "Puffer"];
// Diese Töpfe werden beim Monatsabschluss NICHT in den Ausgaberest gefegt,
// da sie Spar-/Rücklagentöpfe sind, kein monatliches Ausgabenbudget.
const POTS_OHNE_AUSGABEREST = ["Model 3", "Rücklage", "Jahres Rückstellung", "Transit", "Ausgaberest"];
// Für diese Töpfe wird im Prognose-Tab eine 24-Monats-Vorschau berechnet.
const PROGNOSE_TOEPFE = ["Model 3", "Rücklage"];
const ACCOUNT_COLOR = (name) => (ACCOUNT_BADGES[name] ? ACCOUNT_BADGES[name].bg : "#94a3b8");
const STORAGE_KEY = "finanzindex_state_v1";
const GAS_KEY = "finanzindex_gas_url";

/* ============================== Hilfsfunktionen ============================== */

const eur = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(Number.isFinite(n) ? n : 0);
const dateDE = (iso) => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? iso : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); };
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthKey = (iso) => (iso || "").slice(0, 7);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function parseGermanNumber(v) {
  if (typeof v === "number") return v;
  if (v === null || v === undefined || v === "") return 0;
  let s = String(v).replace(/[^0-9,.\-]/g, "").trim();
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

function parseGermanDate(v) {
  if (!v) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v).slice(0, 10);
  const m = String(v).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (!m) return "";
  return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}

function easterSunday(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}
function germanHolidays(year) {
  const easter = easterSunday(year);
  const add = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  return [new Date(year,0,1), add(easter,-2), add(easter,1), new Date(year,4,1), add(easter,39), add(easter,50), new Date(year,9,3), new Date(year,11,25), new Date(year,11,26)];
}
function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isBankBusinessDay(date){ const day=date.getDay(); if(day===0||day===6) return false; return !germanHolidays(date.getFullYear()).some(h=>sameDate(h,date)); }
function lastBankBusinessDayOfMonth(year, monthIndex){ const d=new Date(year, monthIndex+1, 0); while(!isBankBusinessDay(d)) d.setDate(d.getDate()-1); return d; }
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

// Liefert alle Fixkosten_Plan-Positionen, die für den angegebenen Monat gültig
// sind (Gültig-ab/-bis-Prüfung). Wird sowohl vom Monatslauf als auch von der
// Gehaltsverteilung und den Topf-Startbeträgen verwendet, damit überall
// exakt dieselbe Definition von "aktiv" gilt.
function getActiveFixedCosts(fixedCosts, year, monthIdx) {
  return fixedCosts.filter((f) => {
    const abOk = !f.gueltigAb || f.gueltigAb <= toISO(new Date(year, monthIdx, 28));
    const bisOk = !f.gueltigBis || f.gueltigBis >= toISO(new Date(year, monthIdx, 1));
    return abOk && bisOk;
  });
}

// Summiert je Zielkonto (Topf) alle aktiven Fixkosten-Positionen, die dorthin
// fließen - das ist der "monatliche Startbetrag" dieses Topfes.
function getMonthlyPotAllocations(fixedCosts) {
  const now = new Date();
  const active = getActiveFixedCosts(fixedCosts, now.getFullYear(), now.getMonth());
  const map = {};
  active.forEach((f) => {
    if (!f.ziel || f.ziel === "Extern") return;
    map[f.ziel] = (map[f.ziel] || 0) + Number(f.betrag || 0);
  });
  return map;
}

function computeGehaltsverteilung(fixedCosts) {
  const now = new Date();
  const active = getActiveFixedCosts(fixedCosts, now.getFullYear(), now.getMonth());
  const gehalt = active.filter((f) => f.typ === "Einnahme").reduce((s, f) => s + Number(f.betrag || 0), 0);
  const aufING = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && (!f.ziel || f.ziel === "Extern"))
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  const aufTR = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && f.ziel && f.ziel !== "Extern")
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  return { gehalt, aufING, aufTR, differenz: gehalt - aufING - aufTR };
}

// Zinssatz-Zellen können als "2,25%" (Text), 2.25 (Zahl, gemeint als Prozent)
// oder 0.0225 (Zahl, gemeint als Dezimalanteil) vorliegen - alle drei Formen abdecken.
function parseRate(v) {
  if (typeof v === "number") return v > 1 ? v / 100 : v;
  if (!v) return 0;
  let s = String(v).trim();
  const hatProzent = s.includes("%");
  s = s.replace(/[^0-9,.\-]/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s) || 0;
  if (hatProzent) return n / 100;
  return n > 1 ? n / 100 : n;
}

function getRateSchedule(einstellungen, kontoName) {
  return einstellungen
    .filter((r) => r.Konto === kontoName)
    .map((r) => ({ ab: parseGermanDate(r["Gültig Ab"] || r["Gültig Ab "]), satz: parseRate(r["Zinssatz"]) }))
    .filter((r) => r.ab)
    .sort((a, b) => (a.ab < b.ab ? -1 : 1));
}

function rateForDate(schedule, isoDate) {
  let satz = schedule.length ? schedule[0].satz : 0;
  for (const r of schedule) { if (r.ab <= isoDate) satz = r.satz; else break; }
  return satz;
}

// Tagesgenaue Simulation: Zinsen werden täglich berechnet (Tagessaldo * Jahreszins / 365)
// und am Monatsende gutgeschrieben. Am 1. jeden Monats (außer heute) kommt der
// aktuell gültige monatliche Fixkosten-Beitrag hinzu.
function simulateForecast(startBalance, monthlyContribution, schedule, monthsAhead) {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  const end = new Date(start.getFullYear(), start.getMonth() + monthsAhead + 1, 0);
  let balance = startBalance;
  let pending = 0;
  const rows = [];
  let d = new Date(start);
  while (d <= end) {
    if (d.getDate() === 1 && d.getTime() !== start.getTime()) balance += monthlyContribution;
    const satz = rateForDate(schedule, toISO(d));
    pending += (balance * satz) / 365;
    const next = new Date(d); next.setDate(next.getDate() + 1);
    if (next.getMonth() !== d.getMonth()) {
      balance += pending;
      rows.push({ monat: `${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`, saldo: Math.round(balance * 100) / 100, zinsen: Math.round(pending * 100) / 100 });
      pending = 0;
    }
    d = next;
  }
  return rows.slice(0, monthsAhead);
}

/* ============================== Saldenlogik ============================== */

function computeBalances(accounts, transactions) {
  const balances = {};
  accounts.forEach((a) => (balances[a.name] = a.saldo));
  const externalSources = new Set(["extern", "arbeitgeber"]);

  // Reines Doppel-Buchungsprinzip, ohne Sonderfälle: "Trade Republic" ist hier
  // nur der freie, noch keinem Topf zugeordnete Betrag. Die auf dem Dashboard
  // angezeigte Trade-Republic-Gesamtsumme wird an anderer Stelle als
  // (freier Betrag + Summe aller Töpfe) DEFINIERT – dadurch kann sie
  // rechnerisch nie von der Realität abweichen, ganz gleich wie viele
  // Buchungen dazwischenliegen.
  transactions.forEach((t) => {
    const betrag = Number(t.betrag) || 0;
    if (t.typ === "Ausgabe") {
      if (balances[t.quelle] !== undefined) balances[t.quelle] -= betrag;
    } else if (t.typ === "Einnahme") {
      const qKey = (t.quelle || "").toLowerCase();
      if (!externalSources.has(qKey) && balances[t.quelle] !== undefined) balances[t.quelle] += betrag;
      if (balances[t.ziel] !== undefined) balances[t.ziel] += betrag;
    } else if (t.typ === "Umbuchung") {
      if (balances[t.quelle] !== undefined) balances[t.quelle] -= betrag;
      if (balances[t.ziel] !== undefined) balances[t.ziel] += betrag;
    }
  });
  return balances;
}

/* ============================== Lokale Persistenz (localStorage) ============================== */

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveLocal(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* Speicher nicht verfügbar */ }
}
function loadGasUrl() {
  try { return localStorage.getItem(GAS_KEY) || ""; } catch (e) { return ""; }
}
function saveGasUrl(url) {
  try { localStorage.setItem(GAS_KEY, url); } catch (e) { /* ignorieren */ }
}

/* ============================== Google-Apps-Script-Client ============================== */

function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

async function fetchJsonWithRetry(gasUrl, options, attempts = 2) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetch(gasUrl, options);
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (parseErr) {
        throw new Error("Google hat statt Daten eine Zwischenseite geliefert (kommt gelegentlich beim ersten Aufruf vor).");
      }
      return { res, json };
    } catch (err) {
      lastErr = err;
      if (i < attempts - 1) await delay(900);
    }
  }
  throw lastErr;
}

async function gasGet(gasUrl) {
  const { json } = await fetchJsonWithRetry(gasUrl, { method: "GET" });
  if (json.status !== "ok") throw new Error(json.error || "Unbekannter Serverfehler beim Laden.");
  return json.data;
}

async function gasPost(gasUrl, body) {
  const { json } = await fetchJsonWithRetry(gasUrl, {
    method: "POST",
    mode: "cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
  });
  if (json.status !== "ok") throw new Error(json.error || "Server meldete einen Fehler.");
  return json;
}

function mapRemoteData(data) {
  const accounts = (data.konten || [])
    .filter((r) => r.Konto && r.Konto !== "Gesamt")
    .map((r) => ({
      id: r.Konto,
      name: r.Konto,
      saldo: parseGermanNumber(r["Aktueller Saldo"]),
      typ: REAL_ACCOUNTS.includes(r.Konto) ? "echt" : "virtuell",
      farbe: ACCOUNT_COLOR(r.Konto),
    }));

  // Der Wert für "Trade Republic" im Sheet ist der ECHTE Gesamtbetrag
  // (zum Abgleich mit der Trade-Republic-App), nicht der freie Rest. Da
  // Trade Republic komplett aus den Töpfen besteht, ziehen wir die Summe
  // der Topf-Eröffnungssalden einmalig ab, um den tatsächlich freien,
  // keinem Topf zugeordneten Betrag zu erhalten. Ab da wird nur noch dieser
  // freie Betrag fortgeschrieben – die Töpfe laufen ohnehin separat mit.
  const trAccount = accounts.find((a) => a.name === "Trade Republic");
  if (trAccount) {
    const potSum = accounts.filter((a) => a.typ === "virtuell").reduce((s, a) => s + a.saldo, 0);
    trAccount.saldo = trAccount.saldo - potSum;
  }

  const categories = (data.kategorien || []).map((r, i) => ({
    id: "cat-" + i, name: r.Kategorie, typ: r.Typ,
  }));

  const fixedCosts = (data.fixkosten || []).map((r, i) => ({
    id: "fix-" + i,
    bezeichnung: r.Bezeichnung,
    betrag: parseGermanNumber(r.Betrag),
    kategorie: r.Kategorie,
    typ: r.Typ,
    quelle: r.Konto,
    ziel: r.Zielkonto || "",
    gueltigAb: parseGermanDate(r["Gültig Ab"] || r["Gültig Ab "]),
    gueltigBis: parseGermanDate(r["Gültig bis"]),
  }));

  const transactions = (data.transaktionen || [])
    .filter((r) => r.ID)
    .map((r) => ({
      id: r.ID, datum: parseGermanDate(r.Datum) || r.Datum, titel: r.Titel,
      kategorie: r.Kategorie, typ: r.Typ, betrag: parseGermanNumber(r.Betrag),
      quelle: r.Quelle, ziel: r.Ziel || "", notiz: r.Notiz || "",
    }))
    .sort((a, b) => (a.datum < b.datum ? 1 : -1));

  const einstellungen = data.einstellungen || [];

  return { accounts, categories, fixedCosts, transactions, einstellungen };
}

  return <svg {...p}>{paths[name] || null}</svg>;
}

function AccountIcon({ name, size = 16, fallbackColor }) {
  const badge = ACCOUNT_BADGES[name];
  if (badge) {
    return (
      <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl" style={{ backgroundColor: badge.bg }}>
        <Icon name={badge.icon} size={size} className="text-white" />
      </div>
    );
  }
  return <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ backgroundColor: fallbackColor }} />;
}

function TypBadge({ typ }) {
  const map = {
    Ausgabe: { icon: "arrowDown", cls: "text-rose-400 bg-rose-500/10 border-rose-500/30" },
    Einnahme: { icon: "arrowUp", cls: "text-emerald-400 bg-emerald-500/10 border-emerald-500/30" },
    Umbuchung: { icon: "arrowLR", cls: "text-cyan-400 bg-cyan-500/10 border-cyan-500/30" },
  };
  const conf = map[typ] || map.Ausgabe;
  return <span className={`inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-xs ${conf.cls}`}><Icon name={conf.icon} size={13} /> {typ}</span>;
}

function Toast({ toast, onClose }) {
  if (!toast) return null;
  const isError = toast.type === "error";
  return (
    <div className={`fixed bottom-20 left-1/2 z-50 w-[92%] max-w-sm -translate-x-1/2 rounded-xl border px-4 py-3 text-sm shadow-lg md:bottom-6 ${isError ? "border-rose-500/40 bg-rose-950/90 text-rose-200" : "border-emerald-500/40 bg-emerald-950/90 text-emerald-200"}`}>
      <div className="flex items-start gap-2">
        <Icon name={isError ? "alert" : "check"} size={16} className="mt-0.5 shrink-0" />
        <div className="flex-1">{toast.message}</div>
        <button onClick={onClose} className="shrink-0 opacity-70 hover:opacity-100"><Icon name="x" size={14} /></button>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <label className="block"><span className="mb-1 block text-xs font-medium text-zinc-400">{label}</span>{children}</label>;
}
const inputCls = "w-full rounded-lg border border-zinc-700 bg-zinc-800/70 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/50";

function SyncIndicator({ status, onClick }) {
  const conf = {
    connected: { icon: "wifi", cls: "text-emerald-400", label: "Verbunden" },
    syncing: { icon: "loader", cls: "text-amber-400 animate-spin", label: "Synchronisiere…" },
    offline: { icon: "wifiOff", cls: "text-amber-400 animate-pulse", label: "Offline / Fehler" },
    none: { icon: "wifiOff", cls: "text-zinc-500", label: "Keine GAS-URL hinterlegt" },
  }[status];
  return (
    <button onClick={onClick} title={conf.label} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 bg-zinc-800/60 px-2.5 py-1.5 text-xs text-zinc-300 hover:border-zinc-600">
      <Icon name={conf.icon} size={14} className={conf.cls} />
      <span className="hidden sm:inline">{conf.label}</span>
    </button>
  );
}

/* ============================== Hauptkomponente ============================== */

function App() {
  const initial = loadLocal();
  const [accounts, setAccounts] = useState(initial?.accounts || []);
  const [categories, setCategories] = useState(initial?.categories || []);
  const [transactions, setTransactions] = useState(initial?.transactions || []);
  const [fixedCosts, setFixedCosts] = useState(initial?.fixedCosts || []);
  const [einstellungen, setEinstellungen] = useState(initial?.einstellungen || []);
  const [gasUrl, setGasUrl] = useState(loadGasUrl());
  const [activeTab, setActiveTab] = useState("dashboard");
  const [syncStatus, setSyncStatus] = useState(gasUrl ? "offline" : "none");
  const [isLight, setIsLight] = useState(() => { try { return localStorage.getItem("finanzindex_theme") === "light"; } catch (e) { return false; } });
  const [toast, setToast] = useState(null);
  const [editingTx, setEditingTx] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [journalFilter, setJournalFilter] = useState({ monat: "alle", konto: "alle", kategorie: "alle", typ: "alle" });
  const [showFilters, setShowFilters] = useState(false);
  const [forceRun, setForceRun] = useState(false);
  const [lastRunInfo, setLastRunInfo] = useState(null);
  const toastTimer = useRef(null);

  const showToast = useCallback((message, type = "success") => {
    setToast({ message, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 4500);
  }, []);

  // Persistiere jeden Zustand lokal (local-first)
  useEffect(() => {
    saveLocal({ accounts, categories, transactions, fixedCosts });
  }, [accounts, categories, transactions, fixedCosts]);

  // Initialer Sync beim Start, falls eine GAS-URL hinterlegt ist
  useEffect(() => {
    if (gasUrl) syncFromRemote(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const syncFromRemote = useCallback(async (silent) => {
    if (!gasUrl) { setSyncStatus("none"); return; }
    setSyncStatus("syncing");
    try {
      const data = await gasGet(gasUrl);
      const mapped = mapRemoteData(data);
      setAccounts(mapped.accounts);
      setCategories(mapped.categories);
      setFixedCosts(mapped.fixedCosts);
      setEinstellungen(mapped.einstellungen);
      setTransactions(mapped.transactions);
      setSyncStatus("connected");
      if (!silent) showToast("Mit Google Sheet synchronisiert.");
    } catch (err) {
      setSyncStatus("offline");
      if (!silent) showToast("Verbindung fehlgeschlagen: " + err.message + " Es werden lokale Daten verwendet.", "error");
    }
  }, [gasUrl, showToast]);

  const balances = useMemo(() => computeBalances(accounts, transactions), [accounts, transactions]);
  const realAccounts = accounts.filter((a) => a.typ === "echt");
  const virtualAccounts = accounts.filter((a) => a.typ === "virtuell");
  const ingBalance = balances["ING"] || 0;
  const trFrei = balances["Trade Republic"] || 0;
  const gebundenesBudget = virtualAccounts.reduce((s, a) => s + (balances[a.name] || 0), 0);
  const trGesamt = trFrei + gebundenesBudget; // 1:1 vergleichbar mit der echten Trade-Republic-App
  const gesamtvermoegen = ingBalance + trGesamt;
  const potAllocations = useMemo(() => getMonthlyPotAllocations(fixedCosts), [fixedCosts]);

  const currentMonth = monthKey(todayISO());
  const monthTx = transactions.filter((t) => monthKey(t.datum) === currentMonth);
  const monatEinnahmen = monthTx.filter((t) => t.typ === "Einnahme").reduce((s, t) => s + Number(t.betrag), 0);
  const monatAusgaben = monthTx.filter((t) => t.typ === "Ausgabe").reduce((s, t) => s + Number(t.betrag), 0);

  /* ---------- Buchung anlegen / bearbeiten / löschen: optimistic update + Rollback + Persistenz-Verifikation ---------- */
  const writeTransaction = useCallback(async (action, payload, snapshot) => {
    if (!gasUrl) {
      showToast("Keine Google-Apps-Script-URL hinterlegt. Änderung wurde nur lokal gespeichert.", "error");
      return true;
    }
    setSyncStatus("syncing");
    try {
      await gasPost(gasUrl, { action, ...payload });
      setSyncStatus("connected");
      showToast(action === "delete" ? "Buchung gelöscht und synchronisiert." : "Buchung gespeichert und synchronisiert.");
      setTimeout(async () => {
        try {
          const data = await gasGet(gasUrl);
          const mapped = mapRemoteData(data);
          const found = action === "delete" ? !mapped.transactions.some((t) => t.id === payload.id) : mapped.transactions.some((t) => t.id === payload.id);
          if (!found) showToast("Warnung: Buchung konnte im Sheet nicht bestätigt werden. Bitte manuell prüfen.", "error");
        } catch (e) { /* Verifikation optional, kein harter Fehler */ }
      }, 1500);
      return true;
    } catch (err) {
      setTransactions(snapshot);
      setSyncStatus("offline");
      showToast("Speichern fehlgeschlagen (" + err.message + "). Änderung wurde zurückgerollt.", "error");
      return false;
    }
  }, [gasUrl, showToast]);

  const handleAddOrUpdate = useCallback(async (form, isEdit) => {
    const snapshot = transactions;
    const tx = isEdit ? { ...form } : { ...form, id: uid() };
    const next = isEdit ? transactions.map((t) => (t.id === tx.id ? tx : t)) : [tx, ...transactions];
    setTransactions(next);
    const ok = await writeTransaction(isEdit ? "update" : "create", tx, snapshot);
    if (ok) { setEditingTx(null); if (!isEdit) setActiveTab("journal"); }
  }, [transactions, writeTransaction]);

  const handleDelete = useCallback(async (id) => {
    const snapshot = transactions;
    const next = transactions.filter((t) => t.id !== id);
    setTransactions(next);
    setConfirmDeleteId(null);
    await writeTransaction("delete", { id }, snapshot);
  }, [transactions, writeTransaction]);

  /* ---------- Monatslauf: Fixkosten & Besoldung ---------- */
  const runMonthlyBooking = useCallback(async () => {
    const now = new Date();
    const year = now.getFullYear(), monthIdx = now.getMonth();
    const targetMonthKey = `${year}-${String(monthIdx + 1).padStart(2, "0")}`;
    const salaryDate = toISO(lastBankBusinessDayOfMonth(year, monthIdx - 1));
    const fixedDate = toISO(new Date(year, monthIdx, 1));

    // Vor der Duplikatprüfung IMMER frisch vom Sheet abgleichen. Andernfalls
    // könnte die App Buchungen doppelt anlegen, die serverseitig bereits
    // existieren, ihr lokaler Stand davon aber (z. B. nach einem vorherigen
    // Fehler) nichts weiß.
    let currentTx = transactions;
    if (gasUrl) {
      setSyncStatus("syncing");
      try {
        const data = await gasGet(gasUrl);
        const mapped = mapRemoteData(data);
        currentTx = mapped.transactions;
        setAccounts(mapped.accounts);
        setCategories(mapped.categories);
        setFixedCosts(mapped.fixedCosts);
        setEinstellungen(mapped.einstellungen);
        setTransactions(mapped.transactions);
      } catch (err) {
        setSyncStatus("offline");
        showToast("Monatslauf abgebrochen: Konnte vorab nicht mit dem Sheet abgleichen (" + err.message + ").", "error");
        return;
      }
    }

    const active = getActiveFixedCosts(fixedCosts, year, monthIdx);

    const toBook = [];
    let skipped = 0;
    active.forEach((f) => {
      const alreadyBooked = currentTx.some((t) => t.titel === f.bezeichnung && monthKey(t.datum) === targetMonthKey);
      if (alreadyBooked && !forceRun) { skipped += 1; return; }
      const isEinnahme = f.typ === "Einnahme";
      const zielIstIntern = f.ziel && f.ziel !== "Extern";
      // Automatische Korrektur: Fixkosten mit internem Zielkonto werden als
      // Umbuchung gebucht, damit der Zielsaldo korrekt gutgeschrieben wird.
      const typ = isEinnahme ? "Einnahme" : (zielIstIntern ? "Umbuchung" : "Ausgabe");
      toBook.push({
        id: uid(),
        datum: isEinnahme ? salaryDate : fixedDate,
        titel: f.bezeichnung, kategorie: f.kategorie, typ, betrag: Number(f.betrag),
        quelle: f.quelle, ziel: zielIstIntern || isEinnahme ? f.ziel : "",
        notiz: "Automatischer Monatslauf" + (typ !== f.typ ? ` (korrigiert von ${f.typ} zu ${typ})` : ""),
      });
    });

    // Nacheinander buchen statt alles auf einmal optimistisch anzunehmen:
    // Jede erfolgreich geschriebene Buchung bleibt bestehen, auch wenn eine
    // spätere Position fehlschlägt. So driften App und Sheet nie auseinander.
    let created = 0;
    let stoppedAt = null;
    for (const tx of toBook) {
      setTransactions((prev) => [tx, ...prev]);
      if (!gasUrl) { created += 1; continue; }
      setSyncStatus("syncing");
      try {
        await gasPost(gasUrl, { action: "create", ...tx });
        created += 1;
      } catch (err) {
        setTransactions((prev) => prev.filter((t) => t.id !== tx.id));
        setSyncStatus("offline");
        stoppedAt = { titel: tx.titel, error: err.message };
        break;
      }
    }
    if (gasUrl && !stoppedAt) setSyncStatus("connected");

    setLastRunInfo({ created, skipped, salaryDate, fixedDate, targetMonthKey });
    if (stoppedAt) {
      showToast(`Monatslauf gestoppt bei "${stoppedAt.titel}" (${stoppedAt.error}). ${created} Buchung(en) wurden vorher bereits erfolgreich gespeichert und bleiben bestehen. Führe den Lauf erneut aus, um die restlichen Positionen nachzuholen.`, "error");
    } else {
      showToast(created > 0
        ? `Monatslauf: ${created} Buchung(en) angelegt${skipped ? `, ${skipped} übersprungen (bereits gebucht)` : ""}.`
        : `Monatslauf: keine neuen Buchungen (${skipped} bereits vorhanden). "Erzwingen" aktivieren, um erneut zu buchen.`,
        created > 0 ? "success" : "error");
    }
  }, [fixedCosts, transactions, forceRun, gasUrl, showToast]);

  const downloadBackup = useCallback(() => {
    const data = { accounts, categories, transactions, fixedCosts, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `finanzindex-export-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast("Datenexport heruntergeladen.");
  }, [accounts, categories, transactions, fixedCosts, showToast]);

  const downloadJahresbericht = useCallback(() => {
    const jahr = new Date().getFullYear();
    const zeilen = [["Monat", "Einnahmen", "Ausgaben", "Netto"]];
    for (let m = 0; m < 12; m++) {
      const mk = `${jahr}-${String(m + 1).padStart(2, "0")}`;
      const monthTx = transactions.filter((t) => monthKey(t.datum) === mk);
      const ein = monthTx.filter((t) => t.typ === "Einnahme").reduce((s, t) => s + Number(t.betrag), 0);
      const aus = monthTx.filter((t) => t.typ === "Ausgabe").reduce((s, t) => s + Number(t.betrag), 0);
      zeilen.push([mk, ein.toFixed(2).replace(".", ","), aus.toFixed(2).replace(".", ","), (ein - aus).toFixed(2).replace(".", ",")]);
    }
    const csv = zeilen.map((r) => r.join(";")).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `jahresbericht-${jahr}.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast(`Jahresbericht ${jahr} heruntergeladen (öffnet sich direkt in Excel/Google Sheets).`);
  }, [transactions, showToast]);

  const toggleTheme = () => {
    setIsLight((prev) => {
      const next = !prev;
      document.documentElement.classList.toggle("light", next);
      try { localStorage.setItem("finanzindex_theme", next ? "light" : "dark"); } catch (e) {}
      return next;
    });
  };

  const applyGasUrl = (url) => {
    setGasUrl(url);
    saveGasUrl(url);
    setSyncStatus(url ? "offline" : "none");
  };

  const tabs = [
    { id: "dashboard", label: "Dashboard", icon: "dashboard", primary: true },
    { id: "buchen", label: "Buchen", icon: "plus", primary: true },
    { id: "journal", label: "Journal", icon: "list", primary: true },
    { id: "fixkosten", label: "Fixkosten", icon: "repeat" },
    { id: "prognose", label: "Prognose", icon: "trend" },
    { id: "auswertung", label: "Auswertung", icon: "chart" },
    { id: "einstellungen", label: "Einstellungen", icon: "settings" },
  ];
  const primaryTabs = tabs.filter((t) => t.primary);
  const secondaryTabs = tabs.filter((t) => !t.primary);
  const [showMoreMenu, setShowMoreMenu] = useState(false);

  return (
    <div className="min-h-[100dvh] w-full bg-zinc-950 text-zinc-100">
      <header className="sticky top-0 z-30 flex items-center justify-between border-b border-zinc-800 bg-zinc-950/95 px-4 py-3 backdrop-blur md:px-6">
        <div className="flex items-center gap-2.5">
          <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500/15 text-emerald-400"><Icon name="wallet" size={18} /></div>
          <div>
            <h1 className="text-[15px] font-semibold leading-tight text-zinc-100">Finanzindex</h1>
            <p className="hidden text-[11px] leading-tight text-zinc-500 sm:block">Persönliche Finanzverwaltung</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <SyncIndicator status={syncStatus} onClick={() => syncFromRemote(false)} />
          <button onClick={toggleTheme} title={isLight ? "Dunkles Design" : "Helles Design"} className="flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 bg-zinc-800/60 text-zinc-300 hover:border-zinc-600">
            <Icon name={isLight ? "moon" : "sun"} size={15} />
          </button>
          <nav className="hidden items-center gap-1 rounded-xl border border-zinc-800 bg-zinc-900/60 p-1 md:flex">
            {tabs.map((t) => (
              <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm transition-colors ${activeTab === t.id ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400 hover:text-zinc-200"}`}>
                <Icon name={t.icon} size={15} />{t.label}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="mx-auto max-w-6xl px-4 pb-28 pt-5 md:px-6 md:pb-10">
        {!gasUrl && (
          <div className="mb-5 rounded-xl border border-amber-500/30 bg-amber-500/5 px-4 py-3 text-sm text-amber-200">
            Es ist noch keine Google-Apps-Script-URL hinterlegt. Die App speichert vorerst nur lokal in diesem Browser. Trage die URL unter „Einstellungen" ein, um mit deinem Google Sheet zu synchronisieren.

        {activeTab === "dashboard" && (
          <Dashboard accounts={accounts} balances={balances} realAccounts={realAccounts} virtualAccounts={virtualAccounts}
            ingBalance={ingBalance} trFrei={trFrei} trGesamt={trGesamt} gebundenesBudget={gebundenesBudget} gesamtvermoegen={gesamtvermoegen}
            monatEinnahmen={monatEinnahmen} monatAusgaben={monatAusgaben} transactions={transactions} potAllocations={potAllocations} onGoBuchen={() => setActiveTab("buchen")} />
        )}
        {activeTab === "buchen" && (
          <BuchungsForm accounts={accounts} categories={categories} onSubmit={(f) => handleAddOrUpdate(f, false)} submitting={syncStatus === "syncing"} />

            showFilters={showFilters} setShowFilters={setShowFilters} onEdit={(tx) => setEditingTx(tx)} onDelete={(id) => setConfirmDeleteId(id)} />
        )}
        {activeTab === "fixkosten" && (
          <Fixkosten fixedCosts={fixedCosts} setFixedCosts={setFixedCosts} categories={categories} accounts={accounts}
            forceRun={forceRun} setForceRun={setForceRun} onRun={runMonthlyBooking} lastRunInfo={lastRunInfo} showToast={showToast} />
        )}
        {activeTab === "prognose" && (
          <Prognose accounts={accounts} balances={balances} fixedCosts={fixedCosts} einstellungen={einstellungen} />

          <Auswertung transactions={transactions} accounts={accounts} ingBalance={ingBalance} trGesamt={trGesamt} />

          <Einstellungen gasUrl={gasUrl} onApplyGasUrl={applyGasUrl} onDownloadBackup={downloadBackup} onDownloadJahresbericht={downloadJahresbericht} onManualSync={() => syncFromRemote(false)} />
        )}
      </main>

      <nav className="fixed inset-x-0 bottom-0 z-30 flex items-center justify-around border-t border-zinc-800 bg-zinc-950/95 px-1 py-1.5 backdrop-blur md:hidden">
        {primaryTabs.map((t) => (
          <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-1 flex-col items-center gap-0.5 rounded-lg py-1.5 text-[10.5px] ${activeTab === t.id ? "text-emerald-400" : "text-zinc-500"}`}>
            <Icon name={t.icon} size={19} />{t.label}
          </button>
        ))}
        <button onClick={() => setShowMoreMenu(true)} className={`flex flex-1 flex-col items-center gap-0.5 rounded-lg py-1.5 text-[10.5px] ${secondaryTabs.some((t) => t.id === activeTab) ? "text-emerald-400" : "text-zinc-500"}`}>
          <Icon name="more" size={19} />Mehr
        </button>
      </nav>

      {showMoreMenu && (
        <div className="fixed inset-0 z-40 flex items-end bg-black/60 backdrop-blur-sm md:hidden" onClick={() => setShowMoreMenu(false)}>
          <div className="w-full rounded-t-2xl border-t border-zinc-800 bg-zinc-950 p-3 pb-6" onClick={(e) => e.stopPropagation()}>
            <div className="mx-auto mb-3 h-1 w-10 rounded-full bg-zinc-700" />
            {secondaryTabs.map((t) => (
              <button key={t.id} onClick={() => { setActiveTab(t.id); setShowMoreMenu(false); }} className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm ${activeTab === t.id ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-300 hover:bg-zinc-800/50"}`}>
                <Icon name={t.icon} size={18} />{t.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {editingTx && <EditModal tx={editingTx} accounts={accounts} categories={categories} onClose={() => setEditingTx(null)} onSave={(f) => handleAddOrUpdate(f, true)} />}
      {confirmDeleteId && <ConfirmModal title="Buchung löschen?" message="Diese Aktion entfernt die Buchung endgültig im Sheet und berechnet alle Salden neu." onCancel={() => setConfirmDeleteId(null)} onConfirm={() => handleDelete(confirmDeleteId)} />}
      <Toast toast={toast} onClose={() => setToast(null)} />
    </div>
  );
}

/* ============================== Dashboard ============================== */

function StatCard({ label, value, icon, accent, small }) {

  return (
    <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
      <div className={`mb-3 flex h-8 w-8 items-center justify-center rounded-lg ${accentMap[accent]}`}><Icon name={icon} size={16} /></div>
      <p className="text-[11px] text-zinc-500">{label}</p>
      <p className={`mt-0.5 font-semibold tabular-nums text-zinc-100 ${small ? "text-[15px]" : "text-lg"}`}>{value}</p>
    </div>
  );
}

    <div className="space-y-6">

          <span className="font-medium">Budget aufgebraucht:</span> {aufgebrauchteToepfe.map((a) => a.name).join(", ")} {aufgebrauchteToepfe.length === 1 ? "ist" : "sind"} vor Monatsende bereits leer.

      <div className="grid grid-cols-2 gap-3 md:grid-cols-4">

        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
          <div className="mb-3"><AccountIcon name="Trade Republic" size={16} /></div>
          <p className="text-[11px] text-zinc-500">Trade Republic gesamt</p>
          <p className="mt-0.5 text-lg font-semibold tabular-nums text-zinc-100">{eur(trGesamt)}</p>
        </div>
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
          <div className="mb-3"><AccountIcon name="ING" size={16} /></div>
          <p className="text-[11px] text-zinc-500">ING</p>
          <p className="mt-0.5 text-lg font-semibold tabular-nums text-zinc-100">{eur(ingBalance)}</p>
        </div>
        <div className="flex items-center rounded-2xl border border-cyan-500/20 bg-cyan-500/5 p-4">
          <p className="text-[11.5px] leading-relaxed text-cyan-200">Sollte exakt der Trade-Republic-App entsprechen – eine Abweichung zeigt eine fehlende oder falsche Buchung.</p>
        </div>
      </div>
      <div className="grid gap-4 lg:grid-cols-5">
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4 lg:col-span-3">
          <div className="mb-3 flex items-center justify-between">
            <h2 className="text-sm font-semibold text-zinc-200">Konten & Budget-Töpfe</h2>
            <button onClick={onGoBuchen} className="text-xs text-emerald-400 hover:text-emerald-300">+ Neue Buchung</button>

          <div className="space-y-2.5">
            <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <AccountIcon name="Trade Republic" fallbackColor="#10b981" />
                  <div><p className="text-sm text-zinc-200">Trade Republic</p><p className="text-[11px] text-zinc-500">Realkonto · besteht komplett aus den Töpfen unten</p></div>
                </div>
                <p className="text-sm font-medium tabular-nums text-zinc-100">{eur(trGesamt)}</p>
              </div>
            </div>
            <div className="flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
              <div className="flex items-center gap-2.5">
                <AccountIcon name="ING" fallbackColor="#10b981" />
                <div><p className="text-sm text-zinc-200">ING</p><p className="text-[11px] text-zinc-500">Realkonto</p></div>
              </div>
              <p className="text-sm font-medium tabular-nums text-zinc-100">{eur(ingBalance)}</p>
            </div>
          </div>
          <p className="mb-2 mt-4 text-[11px] font-medium uppercase tracking-wide text-zinc-600">Töpfe innerhalb von Trade Republic</p>
          <div className="space-y-2.5">
            {virtualAccounts.map((a) => {
              const val = balances[a.name] || 0;
              const hatStartbetrag = !POTS_OHNE_STARTBETRAG.includes(a.name) && (potAllocations[a.name] || 0) > 0;
              const startbetrag = potAllocations[a.name] || 0;
              return (
                <div key={a.id} className="flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">

          <div className="space-y-1">

/* ============================== Buchungsformular ============================== */

function emptyForm() { return { id: null, datum: todayISO(), titel: "", kategorie: "", typ: "Ausgabe", betrag: "", quelle: "", ziel: "", notiz: "" }; }

function BuchungsForm({ accounts, categories, onSubmit, submitting, initial, onCancel }) {
  const [form, setForm] = useState(initial || emptyForm());
  const [errors, setErrors] = useState({});
  const accountOptions = accounts.map((a) => a.name);
  const catOptions = categories.filter((c) => c.typ === form.typ || form.typ === "Umbuchung");

  const validate = () => {
    const e = {};
    if (!form.titel.trim()) e.titel = "Titel erforderlich";
    if (!form.betrag || Number(form.betrag) <= 0) e.betrag = "Gültigen Betrag angeben";
    if (!form.quelle) e.quelle = form.typ === "Einnahme" ? "Herkunft angeben" : "Quelle wählen";
    if (form.typ !== "Ausgabe" && !form.ziel) e.ziel = "Ziel wählen";
    if (form.typ === "Ausgabe" && !form.kategorie) e.kategorie = "Kategorie wählen";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    onSubmit({ ...form, betrag: Number(form.betrag) });
    if (!initial) setForm(emptyForm());
  };
  const setTyp = (typ) => setForm((f) => ({ ...f, typ, kategorie: "", quelle: "", ziel: "" }));

  return (
    <form onSubmit={handleSubmit} className="mx-auto max-w-xl space-y-5">
      {!initial && <h2 className="text-base font-semibold text-zinc-200">Neue Buchung</h2>}
      <div className="grid grid-cols-3 gap-2">
        {["Ausgabe", "Einnahme", "Umbuchung"].map((typ) => {
          const active = form.typ === typ;
          const colors = { Ausgabe: "border-rose-500/50 bg-rose-500/10 text-rose-300", Einnahme: "border-emerald-500/50 bg-emerald-500/10 text-emerald-300", Umbuchung: "border-cyan-500/50 bg-cyan-500/10 text-cyan-300" };
          return <button key={typ} type="button" onClick={() => setTyp(typ)} className={`rounded-xl border px-3 py-2.5 text-sm font-medium transition-colors ${active ? colors[typ] : "border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200"}`}>{typ}</button>;
        })}
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Datum"><input type="date" className={inputCls} value={form.datum} onChange={(e) => setForm((f) => ({ ...f, datum: e.target.value }))} /></Field>
        <Field label="Betrag (€)">
          <input type="number" step="0.01" min="0" placeholder="0,00" className={inputCls} value={form.betrag} onChange={(e) => setForm((f) => ({ ...f, betrag: e.target.value }))} />
          {errors.betrag && <p className="mt-1 text-xs text-rose-400">{errors.betrag}</p>}
        </Field>
      </div>
      <Field label="Titel">
        <input type="text" placeholder="z. B. Wocheneinkauf Rewe" className={inputCls} value={form.titel} onChange={(e) => setForm((f) => ({ ...f, titel: e.target.value }))} />
        {errors.titel && <p className="mt-1 text-xs text-rose-400">{errors.titel}</p>}
      </Field>
      {form.typ !== "Umbuchung" && (
        <Field label="Kategorie">
          <select className={inputCls} value={form.kategorie} onChange={(e) => setForm((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="">Kategorie wählen</option>
            {catOptions.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          {errors.kategorie && <p className="mt-1 text-xs text-rose-400">{errors.kategorie}</p>}
        </Field>
      )}
      <div className="grid grid-cols-2 gap-3">
        <Field label={form.typ === "Einnahme" ? "Herkunft" : "Quelle"}>
          {form.typ === "Einnahme" ? (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Wählen</option><option value="arbeitgeber">Arbeitgeber</option><option value="extern">Extern</option>
              {accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          ) : (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Konto wählen</option>{accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          )}
          {errors.quelle && <p className="mt-1 text-xs text-rose-400">{errors.quelle}</p>}
        </Field>
        {form.typ !== "Ausgabe" && (
          <Field label="Ziel">
            <select className={inputCls} value={form.ziel} onChange={(e) => setForm((f) => ({ ...f, ziel: e.target.value }))}>
              <option value="">Konto wählen</option>
              {accountOptions.filter((n) => n !== form.quelle).map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            {errors.ziel && <p className="mt-1 text-xs text-rose-400">{errors.ziel}</p>}
          </Field>
        )}
      </div>
      <Field label="Notiz (optional)"><textarea rows={2} className={inputCls} value={form.notiz} onChange={(e) => setForm((f) => ({ ...f, notiz: e.target.value }))} placeholder="Zusätzliche Details" /></Field>
      <div className="flex items-center gap-2 pt-1">
        <button type="submit" disabled={submitting} className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-emerald-500 disabled:opacity-60">
          {submitting && <Icon name="loader" size={15} className="animate-spin" />}{initial ? "Änderungen speichern" : "Buchung speichern"}
        </button>
        {onCancel && <button type="button" onClick={onCancel} className="rounded-xl border border-zinc-700 px-4 py-2.5 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>}
      </div>
    </form>
  );
}

/* ============================== Journal ============================== */

function Journal({ transactions, accounts, categories, filter, setFilter, showFilters, setShowFilters, onEdit, onDelete }) {
  const months = Array.from(new Set(transactions.map((t) => monthKey(t.datum)))).sort().reverse();
  const filtered = transactions.filter((t) => {
    if (filter.monat !== "alle" && monthKey(t.datum) !== filter.monat) return false;
    if (filter.konto !== "alle" && t.quelle !== filter.konto && t.ziel !== filter.konto) return false;
    if (filter.kategorie !== "alle" && t.kategorie !== filter.kategorie) return false;
    if (filter.typ !== "alle" && t.typ !== filter.typ) return false;
    return true;
  });
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Journal</h2>
        <button onClick={() => setShowFilters((s) => !s)} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">
          <Icon name="filter" size={13} /> Filter <Icon name="chevron" size={13} className={showFilters ? "rotate-180 transition-transform" : "transition-transform"} />
        </button>
      </div>
      {showFilters && (
        <div className="grid grid-cols-2 gap-2.5 rounded-xl border border-zinc-800 bg-zinc-900/50 p-3 md:grid-cols-4">
          <select className={inputCls} value={filter.monat} onChange={(e) => setFilter((f) => ({ ...f, monat: e.target.value }))}>
            <option value="alle">Alle Monate</option>{months.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
          <select className={inputCls} value={filter.konto} onChange={(e) => setFilter((f) => ({ ...f, konto: e.target.value }))}>
            <option value="alle">Alle Konten</option>{accounts.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
          <select className={inputCls} value={filter.kategorie} onChange={(e) => setFilter((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="alle">Alle Kategorien</option>{categories.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          <select className={inputCls} value={filter.typ} onChange={(e) => setFilter((f) => ({ ...f, typ: e.target.value }))}>
            <option value="alle">Alle Typen</option><option value="Ausgabe">Ausgabe</option><option value="Einnahme">Einnahme</option><option value="Umbuchung">Umbuchung</option>
          </select>
        </div>
      )}
      <div className="space-y-2">
        {filtered.map((t) => (
          <div key={t.id} className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-3">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2"><p className="truncate text-sm font-medium text-zinc-200">{t.titel}</p><TypBadge typ={t.typ} /></div>
              <p className="mt-1 truncate text-[11.5px] text-zinc-500">{dateDE(t.datum)} · {t.kategorie} · {t.typ === "Ausgabe" ? t.quelle : `${t.quelle} → ${t.ziel}`}{t.notiz ? ` · ${t.notiz}` : ""}</p>
            </div>
            <p className={`shrink-0 text-sm font-semibold tabular-nums ${t.typ === "Einnahme" ? "text-emerald-400" : t.typ === "Ausgabe" ? "text-rose-400" : "text-cyan-400"}`}>
              {t.typ === "Ausgabe" ? "-" : t.typ === "Einnahme" ? "+" : "↔"} {eur(t.betrag)}
            </p>
            <div className="flex shrink-0 items-center gap-1">
              <button onClick={() => onEdit(t)} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200"><Icon name="pencil" size={15} /></button>
              <button onClick={() => onDelete(t.id)} className="rounded-lg p-1.5 text-zinc-400 hover:bg-rose-500/10 hover:text-rose-400"><Icon name="trash" size={15} /></button>
            </div>
          </div>
        ))}
        {filtered.length === 0 && <p className="py-10 text-center text-sm text-zinc-500">Keine Buchungen für diese Filter gefunden.</p>}
      </div>
    </div>
  );
}

function EditModal({ tx, accounts, categories, onClose, onSave }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm md:items-center">
      <div className="max-h-[90dvh] w-full max-w-xl overflow-y-auto rounded-t-2xl border border-zinc-800 bg-zinc-950 p-5 md:rounded-2xl">
        <div className="mb-4 flex items-center justify-between"><h3 className="text-base font-semibold text-zinc-200">Buchung bearbeiten</h3><button onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800"><Icon name="x" size={18} /></button></div>
        <BuchungsForm accounts={accounts} categories={categories} initial={tx} onSubmit={onSave} onCancel={onClose} />
      </div>

}

function ConfirmModal({ title, message, onCancel, onConfirm }) {

    <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 px-4 backdrop-blur-sm">
      <div className="w-full max-w-sm rounded-2xl border border-zinc-800 bg-zinc-900 p-5">
        <div className="mb-3 flex items-center gap-2 text-rose-400"><Icon name="alert" size={18} /><h3 className="text-sm font-semibold">{title}</h3></div>
        <p className="mb-5 text-sm text-zinc-400">{message}</p>
        <div className="flex gap-2">
          <button onClick={onConfirm} className="flex-1 rounded-xl bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-500">Löschen</button>
          <button onClick={onCancel} className="flex-1 rounded-xl border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>
        </div>
      </div>
    </div>
  );
}

/* ============================== Fixkosten ============================== */

function Fixkosten({ fixedCosts, setFixedCosts, categories, accounts, forceRun, setForceRun, onRun, lastRunInfo, showToast }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const verteilung = useMemo(() => computeGehaltsverteilung(fixedCosts), [fixedCosts]);
  const remove = (id) => { setFixedCosts((prev) => prev.filter((f) => f.id !== id)); showToast("Fixkosten-Position lokal entfernt (im Sheet manuell löschen, falls gewünscht)."); };
  const save = (form) => {
    if (form.id) setFixedCosts((prev) => prev.map((f) => (f.id === form.id ? form : f)));
    else setFixedCosts((prev) => [...prev, { ...form, id: uid() }]);
    setShowForm(false); setEditing(null);
    showToast("Fixkosten-Position lokal gespeichert (im Sheet manuell ergänzen, falls gewünscht).");
  };
  return (
    <div className="space-y-5">
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <h2 className="mb-3 text-sm font-semibold text-zinc-200">Gehaltsverteilung (aktueller Monat)</h2>
        <div className="grid grid-cols-1 gap-2.5 sm:grid-cols-3">
          <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
            <p className="text-[11px] text-zinc-500">Gehaltseingang gesamt</p>
            <p className="mt-0.5 text-base font-semibold tabular-nums text-zinc-100">{eur(verteilung.gehalt)}</p>
          </div>
          <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
            <p className="text-[11px] text-zinc-500">Auf ING behalten</p>
            <p className="mt-0.5 text-base font-semibold tabular-nums text-amber-300">{eur(verteilung.aufING)}</p>
          </div>
          <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
            <p className="text-[11px] text-zinc-500">Auf Trade Republic überweisen</p>
            <p className="mt-0.5 text-base font-semibold tabular-nums text-cyan-300">{eur(verteilung.aufTR)}</p>
          </div>
        </div>
        {Math.abs(verteilung.differenz) > 0.5 && (
          <p className="mt-3 text-[11.5px] text-amber-300">
            Hinweis: Gehalt minus ING-Anteil minus Trade-Republic-Anteil ergibt eine Differenz von {eur(verteilung.differenz)}. Prüfe, ob alle Fixkosten-Positionen korrekt als Quelle "ING" hinterlegt sind.
          </p>
        )}
        <p className="mt-2 text-[11.5px] text-zinc-500">Berechnet aus den aktuell gültigen Positionen im Fixkosten_Plan. "Auf ING behalten" sind alle externen Zahlungen (Miete, Versicherungen usw.), "Auf Trade Republic überweisen" ist alles, was in deine Budget-Töpfe fließt.</p>
      </div>
      <div className="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-4">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div className="flex items-start gap-2.5">
            <Icon name="calendar" size={18} className="mt-0.5 shrink-0 text-amber-400" />
            <div>
              <p className="text-sm font-medium text-zinc-200">Monatliche Fixkosten & Besoldung jetzt buchen</p>
              <p className="text-xs text-zinc-500">Besoldung auf letzten Bankwerktag des Vormonats, Fixkosten auf den 1. des Monats. Positionen mit internem Zielkonto werden automatisch als Umbuchung gebucht. Läuft ab jetzt zusätzlich automatisch (siehe Google Apps Script) – dieser Button bleibt als manuelle Möglichkeit bestehen.</p>
            </div>
          </div>
          <div className="flex shrink-0 items-center gap-2">
            <label className="flex items-center gap-1.5 text-xs text-zinc-400"><input type="checkbox" checked={forceRun} onChange={(e) => setForceRun(e.target.checked)} className="accent-amber-500" />Erzwingen</label>
            <button onClick={onRun} className="rounded-xl bg-amber-500 px-4 py-2 text-sm font-medium text-zinc-900 hover:bg-amber-400">Jetzt buchen</button>
          </div>
        </div>
        {lastRunInfo && <p className="mt-3 border-t border-amber-500/20 pt-2.5 text-[11.5px] text-zinc-500">Letzter Lauf ({lastRunInfo.targetMonthKey}): Besoldungsdatum {dateDE(lastRunInfo.salaryDate)}, Fixkosten-Datum {dateDE(lastRunInfo.fixedDate)} · {lastRunInfo.created} gebucht, {lastRunInfo.skipped} übersprungen.</p>}
      </div>
      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Fixkosten & Daueraufträge</h2>
        <button onClick={() => { setEditing(null); setShowForm(true); }} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="plus" size={14} /> Neue Position</button>
      </div>
      <div className="space-y-2">
        {fixedCosts.map((f) => (
          <div key={f.id} className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-3">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2"><p className="truncate text-sm font-medium text-zinc-200">{f.bezeichnung}</p><TypBadge typ={f.typ} /></div>
              <p className="mt-1 truncate text-[11.5px] text-zinc-500">{f.kategorie} · {f.typ === "Ausgabe" && (!f.ziel || f.ziel === "Extern") ? f.quelle : `${f.quelle} → ${f.ziel}`} · gültig ab {dateDE(f.gueltigAb)}{f.gueltigBis ? ` bis ${dateDE(f.gueltigBis)}` : ""}</p>
            </div>
            <p className="shrink-0 text-sm font-semibold tabular-nums text-zinc-200">{eur(f.betrag)}</p>
            <div className="flex shrink-0 items-center gap-1">
              <button onClick={() => { setEditing(f); setShowForm(true); }} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200"><Icon name="pencil" size={15} /></button>
              <button onClick={() => remove(f.id)} className="rounded-lg p-1.5 text-zinc-400 hover:bg-rose-500/10 hover:text-rose-400"><Icon name="trash" size={15} /></button>
            </div>
          </div>
        ))}
        {fixedCosts.length === 0 && <p className="py-8 text-center text-sm text-zinc-500">Noch keine Fixkosten geladen.</p>}
      </div>
      {showForm && <FixkostenForm categories={categories} accounts={accounts} initial={editing} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={save} />}
    </div>
  );
}

function FixkostenForm({ categories, accounts, initial, onCancel, onSave }) {
  const [form, setForm] = useState(initial || { id: null, bezeichnung: "", betrag: "", kategorie: "", typ: "Ausgabe", quelle: "", ziel: "", gueltigAb: todayISO(), gueltigBis: "" });
  const handleSubmit = (e) => { e.preventDefault(); if (!form.bezeichnung.trim() || !form.betrag || !form.quelle) return; onSave({ ...form, betrag: Number(form.betrag) }); };
  return (
    <form onSubmit={handleSubmit} className="space-y-3 rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
      <h3 className="text-sm font-semibold text-zinc-200">{initial ? "Position bearbeiten" : "Neue Fixkosten-Position"}</h3>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Bezeichnung"><input className={inputCls} value={form.bezeichnung} onChange={(e) => setForm((f) => ({ ...f, bezeichnung: e.target.value }))} /></Field>
        <Field label="Betrag (€)"><input type="number" step="0.01" className={inputCls} value={form.betrag} onChange={(e) => setForm((f) => ({ ...f, betrag: e.target.value }))} /></Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Typ"><select className={inputCls} value={form.typ} onChange={(e) => setForm((f) => ({ ...f, typ: e.target.value, kategorie: "" }))}><option value="Ausgabe">Ausgabe</option><option value="Einnahme">Einnahme</option></select></Field>
        <Field label="Kategorie"><select className={inputCls} value={form.kategorie} onChange={(e) => setForm((f) => ({ ...f, kategorie: e.target.value }))}><option value="">Wählen</option>{categories.filter((c) => c.typ === form.typ).map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}</select></Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label={form.typ === "Einnahme" ? "Herkunft" : "Quelle"}>
          <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
            <option value="">Wählen</option>{form.typ === "Einnahme" && <><option value="arbeitgeber">Arbeitgeber</option><option value="extern">Extern</option></>}
            {accounts.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
        </Field>
        <Field label="Zielkonto (optional – Extern für externe Zahlungsempfänger)">
          <select className={inputCls} value={form.ziel} onChange={(e) => setForm((f) => ({ ...f, ziel: e.target.value }))}>
            <option value="">Kein Zielkonto</option><option value="Extern">Extern</option>
            {accounts.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
        </Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Gültig ab"><input type="date" className={inputCls} value={form.gueltigAb} onChange={(e) => setForm((f) => ({ ...f, gueltigAb: e.target.value }))} /></Field>
        <Field label="Gültig bis (optional)"><input type="date" className={inputCls} value={form.gueltigBis} onChange={(e) => setForm((f) => ({ ...f, gueltigBis: e.target.value }))} /></Field>
      </div>
      <div className="flex gap-2 pt-1">
        <button type="submit" className="flex-1 rounded-xl bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500">Speichern</button>
        <button type="button" onClick={onCancel} className="flex-1 rounded-xl border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>
      </div>
    </form>
  );
}

/* ============================== Prognose ============================== */

function Prognose({ accounts, balances, fixedCosts, einstellungen }) {
  const MONATE_VORAUS = 24;
  const potAllocations = useMemo(() => getMonthlyPotAllocations(fixedCosts), [fixedCosts]);
  const trSchedule = useMemo(() => getRateSchedule(einstellungen, "Trade Republic"), [einstellungen]);

  const verfuegbareToepfe = PROGNOSE_TOEPFE.filter((name) => accounts.some((a) => a.name === name));

  const reihen = useMemo(() => {
    return verfuegbareToepfe.map((name) => ({
      name,
      daten: simulateForecast(balances[name] || 0, potAllocations[name] || 0, trSchedule, MONATE_VORAUS),
    }));
  }, [verfuegbareToepfe.join(","), balances, potAllocations, trSchedule]);

  const rows = reihen[0] ? reihen[0].daten.map((_, i) => {
    const row = { monat: reihen[0].daten[i].monat };
    let zinsGesamt = 0;
    reihen.forEach((r) => {
      row[r.name + "_saldo"] = r.daten[i].saldo;
      row[r.name + "_zins"] = r.daten[i].zinsen;
      zinsGesamt += r.daten[i].zinsen;
    });
    row.zinsGesamt = Math.round(zinsGesamt * 100) / 100;
    return row;
  }) : [];

  const canvasRefs = useRef({});
  const chartRefs = useRef({});
  const seriesColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100"];

  useEffect(() => {
    if (typeof Chart === "undefined" || rows.length === 0) return;
    verfuegbareToepfe.forEach((name, i) => {
      const canvas = canvasRefs.current[name];
      if (!canvas) return;
      if (chartRefs.current[name]) chartRefs.current[name].destroy();
      chartRefs.current[name] = new Chart(canvas, {
        type: "bar",
        data: {
          labels: rows.map((r) => r.monat),
          datasets: [{ data: rows.map((row) => row[name + "_saldo"]), backgroundColor: seriesColors[i % seriesColors.length], borderRadius: 4 }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { autoSkip: true, maxRotation: 45, color: "#898781" }, grid: { display: false } },
            y: { ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
          },
        },
      });
    });
    return () => { Object.values(chartRefs.current).forEach((c) => c && c.destroy()); };
  }, [JSON.stringify(rows), verfuegbareToepfe.join(",")]);

  if (verfuegbareToepfe.length === 0) {
    return <p className="text-sm text-zinc-500">Keine passenden Konten (Model 3, Rücklage) gefunden.</p>;
  }
  if (trSchedule.length === 0) {
    return (
      <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 px-4 py-3 text-sm text-amber-200">
        Im Blatt "Einstellungen" wurden keine Zinssätze für "Trade Republic" gefunden. Bitte prüfe, ob das Blatt existiert und die Spalten Konto, Gültig Ab, Zinssatz korrekt befüllt sind.
      </div>
    );
  }

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-base font-semibold text-zinc-200">Prognose: {verfuegbareToepfe.join(" & ")}</h2>
        <p className="mt-1 text-[12.5px] text-zinc-500">
          Rollierende {MONATE_VORAUS}-Monats-Vorschau ab heute, basierend auf dem aktuellen Kontostand, den derzeit hinterlegten monatlichen Fixkosten-Beiträgen und dem aktuell gültigen Zinssatz. Ungeplante zukünftige Sondereinnahmen sind naturgemäß nicht enthalten.
        </p>
      </div>
      {verfuegbareToepfe.map((name, i) => (
        <div key={name}>
          <p className="mb-2 text-sm font-medium text-zinc-300">{name}</p>
          <div className="relative h-56 w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
            <canvas ref={(el) => (canvasRefs.current[name] = el)} />
          </div>
        </div>
      ))}
      <div className="overflow-x-auto rounded-2xl border border-zinc-800">
        <table className="w-full border-collapse text-[12.5px]">
          <thead>
            <tr>
              <th rowSpan={2} className="border-b border-zinc-800 px-3 py-2.5 text-left font-medium text-zinc-500">Monat</th>
              {verfuegbareToepfe.map((name, i) => (
                <th key={name} colSpan={2} className="border-b border-l border-zinc-800 px-3 py-2 text-center font-medium" style={{ color: seriesColors[i % seriesColors.length] }}>{name}</th>
              ))}
              <th rowSpan={2} className="border-b border-l border-zinc-800 px-3 py-2.5 text-right font-medium text-zinc-500">Zinsen gesamt</th>
            </tr>
            <tr>
              {verfuegbareToepfe.map((name) => (
                <React.Fragment key={name}>
                  <th className="border-b border-l border-zinc-800 px-3 py-2 text-right font-medium text-zinc-600">Saldo</th>
                  <th className="border-b border-zinc-800 px-3 py-2 text-right font-medium text-zinc-600">Zinsen</th>
                </React.Fragment>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((row, i) => (
              <tr key={row.monat} className={i % 2 === 1 ? "bg-zinc-900/40" : ""}>
                <td className="px-3 py-2 font-medium text-zinc-200">{row.monat}</td>
                {verfuegbareToepfe.map((name) => (
                  <React.Fragment key={name}>
                    <td className="border-l border-zinc-800/60 px-3 py-2 text-right text-zinc-200">{eur(row[name + "_saldo"])}</td>
                    <td className="px-3 py-2 text-right text-zinc-500">{eur(row[name + "_zins"])}</td>
                  </React.Fragment>
                ))}
                <td className="border-l border-zinc-800/60 px-3 py-2 text-right font-medium text-zinc-200">{eur(row.zinsGesamt)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================== Auswertung ============================== */

function computeVermoegensverlauf(accounts, transactions) {
  const currentMK = monthKey(todayISO());
  const monthsSet = new Set(transactions.map((t) => monthKey(t.datum)));
  monthsSet.add(currentMK);
  const months = Array.from(monthsSet).filter(Boolean).sort();
  return months.map((mk) => {
    const [y, m] = mk.split("-").map(Number);
    const cutoff = toISO(new Date(y, m, 0));
    const txUpTo = transactions.filter((t) => t.datum <= cutoff);
    const bal = computeBalances(accounts, txUpTo);
    const ing = bal["ING"] || 0;
    const trFrei = bal["Trade Republic"] || 0;
    const pots = accounts.filter((a) => a.typ === "virtuell").reduce((s, a) => s + (bal[a.name] || 0), 0);
    return { monat: mk, gesamt: Math.round((ing + trFrei + pots) * 100) / 100 };
  });
}

function computeKategorienAuswertung(transactions, monatsFilter) {
  const monthTx = transactions.filter((t) => t.typ === "Ausgabe" && (!monatsFilter || monthKey(t.datum) === monatsFilter));
  const map = {};
  monthTx.forEach((t) => { map[t.kategorie || "Sonstiges"] = (map[t.kategorie || "Sonstiges"] || 0) + Number(t.betrag || 0); });
  return Object.entries(map).map(([kategorie, betrag]) => ({ kategorie, betrag: Math.round(betrag * 100) / 100 })).sort((a, b) => b.betrag - a.betrag);
}

function Auswertung({ transactions, accounts }) {
  const [ansicht, setAnsicht] = useState("monat");
  const currentMK = monthKey(todayISO());

  const verlauf = useMemo(() => computeVermoegensverlauf(accounts, transactions), [accounts, transactions]);
  const kategorien = useMemo(() => computeKategorienAuswertung(transactions, ansicht === "monat" ? currentMK : null), [transactions, ansicht]);

  const verlaufRef = useRef(null);
  const verlaufChart = useRef(null);
  const katRef = useRef(null);
  const katChart = useRef(null);

  useEffect(() => {
    if (!verlaufRef.current || typeof Chart === "undefined" || verlauf.length === 0) return;
    if (verlaufChart.current) verlaufChart.current.destroy();
    verlaufChart.current = new Chart(verlaufRef.current, {
      type: "line",
      data: {
        labels: verlauf.map((r) => r.monat),
        datasets: [{ label: "Gesamtvermögen", data: verlauf.map((r) => r.gesamt), borderColor: "#10b981", backgroundColor: "rgba(16,185,129,0.15)", fill: true, tension: 0.3, pointRadius: 3 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#898781", maxRotation: 45 }, grid: { display: false } },
          y: { ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
        },
      },
    });
    return () => { if (verlaufChart.current) verlaufChart.current.destroy(); };
  }, [JSON.stringify(verlauf)]);

  useEffect(() => {
    if (!katRef.current || typeof Chart === "undefined") return;
    if (katChart.current) katChart.current.destroy();
    const colors = ["#f59e0b", "#a78bfa", "#fb923c", "#fb7185", "#38bdf8", "#c084fc", "#4ade80", "#f472b6", "#818cf8", "#94a3b8"];
    katChart.current = new Chart(katRef.current, {
      type: "bar",
      data: {
        labels: kategorien.map((k) => k.kategorie),
        datasets: [{ data: kategorien.map((k) => k.betrag), backgroundColor: kategorien.map((_, i) => colors[i % colors.length]), borderRadius: 4 }],
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
          y: { ticks: { color: "#898781" }, grid: { display: false } },
        },
      },
    });
    return () => { if (katChart.current) katChart.current.destroy(); };
  }, [JSON.stringify(kategorien)]);

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-base font-semibold text-zinc-200">Vermögensverlauf</h2>
        <p className="mt-1 text-[12.5px] text-zinc-500">Rückblickend berechnet aus deinen tatsächlichen Buchungen – Gesamtvermögen (ING + Trade Republic) am Ende jedes Monats.</p>
      </div>
      <div className="relative h-64 w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        {verlauf.length > 1 ? <canvas ref={verlaufRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Noch nicht genug Buchungen für einen Verlauf.</p>}
      </div>

      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Wofür geht dein Geld weg?</h2>
        <div className="flex gap-1 rounded-lg border border-zinc-800 bg-zinc-900/50 p-1">
          <button onClick={() => setAnsicht("monat")} className={`rounded-md px-2.5 py-1 text-xs ${ansicht === "monat" ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400"}`}>Dieser Monat</button>
          <button onClick={() => setAnsicht("alle")} className={`rounded-md px-2.5 py-1 text-xs ${ansicht === "alle" ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400"}`}>Gesamt</button>
        </div>
      </div>
      <div className="relative rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4" style={{ height: Math.max(220, kategorien.length * 34 + 40) }}>
        {kategorien.length > 0 ? <canvas ref={katRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Keine Ausgaben in diesem Zeitraum.</p>}
      </div>
    </div>
  );
}

          <button onClick={onManualSync} className="rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">Jetzt synchronisieren</button>
        </div>
        <p className="mt-2 text-[11.5px] text-zinc-500">Die URL wird lokal in diesem Browser gespeichert (localStorage) und für echte GET/POST-Aufrufe an dein Apps-Script-Backend verwendet.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Datenexport</p>
          <button onClick={onDownloadBackup} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> Herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Lädt Konten, Kategorien, Transaktionen und Fixkosten als JSON-Datei herunter.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Jahresbericht</p>
          <button onClick={onDownloadJahresbericht} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> CSV herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Monatliche Einnahmen, Ausgaben und Netto für das laufende Jahr als CSV-Datei – öffnet sich direkt in Excel, Numbers oder Google Sheets.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="text-sm font-medium text-zinc-200">Automatisches Backup</p>
        <p className="mt-1 text-[11.5px] text-zinc-500">Läuft serverseitig über Google Apps Script (Funktion "backupErstellen"), unabhängig davon, ob diese App-Seite gerade geöffnet ist. Legt monatlich automatisch eine datierte Kopie deines gesamten Google Sheets in Google Drive ab. Einrichtung: siehe Kommentar am Anfang der Apps-Script-Datei.</p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
