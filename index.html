// Konten-Blatt sind virtuelle Budget-Töpfe, die real auf Trade Republic liegen.
const REAL_ACCOUNTS = ["Trade Republic", "ING"];

  "Trade Republic": { icon: "trend", bg: "#1f6f5c" },
  "ING": { icon: "landmark", bg: "#c96a2e" },
  "Model 3": { icon: "car", bg: "#8a3d3d" },

// (Transit wird aus mehreren Fixkosten-Positionen gespeist, Puffer ist ein
// reiner Reservetopf) und zeigen daher keinen Klammer-Betrag.
const POTS_OHNE_STARTBETRAG = ["Transit", "Puffer"];
// Diese Töpfe werden beim Monatsabschluss NICHT in den Ausgaberest gefegt,
// da sie Spar-/Rücklagentöpfe sind, kein monatliches Ausgabenbudget.
const POTS_OHNE_AUSGABEREST = ["Model 3", "Rücklage", "Jahres Rückstellung", "Transit", "Ausgaberest"];
// Für diese Töpfe wird im Prognose-Tab eine 24-Monats-Vorschau berechnet.
const PROGNOSE_TOEPFE = ["Model 3", "Rücklage"];
const ACCOUNT_COLOR = (name) => (ACCOUNT_BADGES[name] ? ACCOUNT_BADGES[name].bg : "#94a3b8");
// Dezenter Verlauf statt Flächenfarbe für die Topf-Kacheln.
function adjustHexColor(hex, amt) {
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const num = parseInt(hex.slice(1), 16);
  const r = clamp(((num >> 16) & 0xff) + amt);
  const g = clamp(((num >> 8) & 0xff) + amt);
  const b = clamp((num & 0xff) + amt);
  return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}
function potGradient(hex) {
  return `linear-gradient(135deg, ${adjustHexColor(hex, 28)} 0%, ${hex} 55%, ${adjustHexColor(hex, -22)} 100%)`;
}

};// Erkennung von Marken-Logos anhand des Buchungstexts (einfacher, case-
// insensitiver Teilstring-Abgleich, siehe faq.html). Reihenfolge ist
// bewusst so gewählt, dass speziellere Treffer (z.B. "Uber Eats") vor

// Schlüsselwörter (<=3 Zeichen, z.B. "dm", "dhl") wird zusätzlich eine

function merchantKeywordMatches(text, keyword) {
  const t = text.toLowerCase();
  const k = keyword.toLowerCase();
  if (k.length <= 3) {
    const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`(^|[^a-zà-öø-ÿ0-9])${escaped}([^a-zà-öø-ÿ0-9]|$)`, "i");
    return re.test(t);
  }
  return t.includes(k);
}

function findMerchantLogoKey(titel) {
  if (!titel) return null;
  for (const entry of MERCHANT_MATCH) {
    for (const kw of entry.match) {
      if (merchantKeywordMatches(titel, kw)) return entry.key;
    }
  }
  return null;
}

// memo: verhindert, dass jede Zeile bei jedem Sync-Tick (z.B. "Geräte
// online"-Update alle 25s, unabhängig von Buchungen) unnötig neu die
// Logo-Zuordnung berechnet - titel/isLight sind einfache Werte, die
// React zuverlässig vergleichen kann.
// Töpfe, die statt ihres Namens ein Bank-Logo zeigen (siehe AccountIcon) -
// für diese beiden ergibt ein Topf-Icon als Buchungs-Ersatzlogo keinen Sinn.
const MERCHANT_ICON_POT_AUSNAHMEN = ["ING", "Trade Republic"];
function potIconFallbackName(quelle, ziel) {
  if (ACCOUNT_BADGES[ziel] && !MERCHANT_ICON_POT_AUSNAHMEN.includes(ziel)) return ziel;
  if (ACCOUNT_BADGES[quelle] && !MERCHANT_ICON_POT_AUSNAHMEN.includes(quelle)) return quelle;
  return null;
}
const MerchantIcon = memo(function MerchantIcon({ titel, isLight, quelle, ziel }) {
  const key = findMerchantLogoKey(titel);
  if (key && MERCHANT_LOGOS[key]) {
    const src = !isLight && MERCHANT_LOGOS_DARK[key] ? MERCHANT_LOGOS_DARK[key] : MERCHANT_LOGOS[key];
    return (
      <div className="flex h-[34px] w-[34px] shrink-0 items-center justify-center">
        <img src={src} alt="" className="h-full w-full object-contain" />
      </div>
    );
  }
  // Kein Markenlogo gefunden, aber Quelle/Ziel ist ein bekannter Topf (z.B.
  // automatische Monatsbuchungen auf Rücklage, Model 3, ...) - dessen Icon
  // statt eines nichtssagenden grauen Buchstabens nutzen.
  const potName = potIconFallbackName(quelle, ziel);
  if (potName) {
    const badge = ACCOUNT_BADGES[potName];
    return (
      <div className="flex h-[34px] w-[34px] shrink-0 items-center justify-center rounded-[9px]" style={{ background: potGradient(badge.bg) }}>
        <Icon name={badge.icon} size={17} className="text-white" />
      </div>
    );
  }
  const letter = (titel || "").trim().charAt(0).toUpperCase() || "?";
  return (
    <div className="flex h-[34px] w-[34px] shrink-0 items-center justify-center rounded-full bg-zinc-700 text-[13px] font-semibold text-zinc-300">
      {letter}
    </div>
  );
});

// Inhaltlicher Vergleich zweier Geräte-Listen (Performance: der Heartbeat
// liefert alle 25s ein neues Array, meist mit identischem Inhalt - ohne
// diesen Vergleich würde jeder Heartbeat einen unnötigen Re-Render der
// gesamten App auslösen, nur weil die Array-Referenz sich geändert hat).
function geraeteListenGleich(a, b) {
  if (a === b) return true;
  if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    const x = a[i], y = b[i];
    if (x.id !== y.id || x.name !== y.name || x.online !== y.online || x.gesperrt !== y.gesperrt || x.zuletztGesehen !== y.zuletztGesehen) return false;
  }
  return true;
}

const LOCK_PIN_HASH_KEY = "finanzindex_lock_pin_hash";
const LOCK_PIN_SALT_KEY = "finanzindex_lock_pin_salt";

function isTouchDevice() {
  try { return ("ontouchstart" in window) || navigator.maxTouchPoints > 0; } catch (e) { return false; }
}

function randomHex(byteLen) {
  const arr = new Uint8Array(byteLen);
  crypto.getRandomValues(arr);
  return Array.from(arr).map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ":" + pin);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64) { return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); }

async function webauthnRegister() {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: "Finanzindex" },
      user: { id: userId, name: "nutzer", displayName: "Nutzer" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
      timeout: 60000,
    },
  });
  return bufToB64(cred.rawId);
}

async function webauthnVerify(credentialIdB64) {
  await navigator.credentials.get({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: "public-key", id: b64ToBuf(credentialIdB64) }],
      userVerification: "required",
      timeout: 60000,
    },
  });
  return true; // wirft bei Fehlschlag/Abbruch, kommt sonst nur bei Erfolg hier an
}

// Merkt sich den Zeitpunkt der letzten erfolgreichen Entsperrung NUR für die
// Dauer dieses Browser-Tabs (sessionStorage - verschwindet automatisch beim
// echten Schließen). Damit löst z. B. die Pull-to-Refresh-Geste (kompletter
// Seiten-Neuladen, aber derselbe Tab) nicht jedes Mal erneut die PIN-Abfrage
// aus, solange die letzte Entsperrung noch keine 3 Minuten her ist -
// dieselbe Karenzzeit wie beim Sperren nach Zeit im Hintergrund.
const UNLOCK_GRACE_MS = 3 * 60 * 1000;
function markUnlocked() {
  try { sessionStorage.setItem("finanzindex_unlock_ts", String(Date.now())); } catch (e) {}
}
function wasRecentlyUnlocked() {
  try {
    const ts = Number(sessionStorage.getItem("finanzindex_unlock_ts") || 0);
    return ts > 0 && (Date.now() - ts) < UNLOCK_GRACE_MS;
  } catch (e) { return false; }
}


function loadQueue() {
  try {
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveQueue(queue) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch (e) { /* Speicher nicht verfügbar */ }
}
// Überlagert die vom Server geladenen Transaktionen mit noch nicht
// synchronisierten Warteschlangen-Einträgen, damit lokal wartende Buchungen
// beim Synchronisieren nicht kurzzeitig aus der Ansicht verschwinden.
function mergeWithQueue(serverTx, queue) {
  let result = serverTx;
  queue.forEach((item) => {
    if (item.action === "create") {
      if (!result.some((t) => t.id === item.payload.id)) result = [item.payload, ...result];
    } else if (item.action === "update") {
      result = result.map((t) => (t.id === item.payload.id ? item.payload : t));
    } else if (item.action === "delete") {
      result = result.filter((t) => t.id !== item.payload.id);
    }
  });
  return result;
}
// Gleiches Prinzip wie mergeWithQueue, nur für Fixkosten_Plan-Positionen.
function mergeFixkostenWithQueue(serverFk, queue) {
  let result = serverFk;
  queue.forEach((item) => {
    if (item.action === "fixkosten-create") {
      if (!result.some((f) => f.id === item.payload.id)) result = [...result, item.payload];
    } else if (item.action === "fixkosten-update") {
      result = result.map((f) => (f.id === item.payload.id ? item.payload : f));
    } else if (item.action === "fixkosten-delete") {
      result = result.filter((f) => f.id !== item.payload.id);
    }
  });
  return result;
}

function parseGermanNumber(v) {
  if (typeof v === "number") return v;
  if (v === null || v === undefined || v === "") return 0;
  let s = String(v).replace(/[^0-9,.\-]/g, "").trim();
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

function parseGermanDate(v) {
  if (!v) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v).slice(0, 10);
  const m = String(v).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (!m) return "";
  return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}

function easterSunday(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}
function germanHolidays(year) {
  const easter = easterSunday(year);
  const add = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  return [new Date(year,0,1), add(easter,-2), add(easter,1), new Date(year,4,1), add(easter,39), add(easter,50), new Date(year,9,3), new Date(year,11,25), new Date(year,11,26)];
}
function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isBankBusinessDay(date){ const day=date.getDay(); if(day===0||day===6) return false; return !germanHolidays(date.getFullYear()).some(h=>sameDate(h,date)); }
function lastBankBusinessDayOfMonth(year, monthIndex){ const d=new Date(year, monthIndex+1, 0); while(!isBankBusinessDay(d)) d.setDate(d.getDate()-1); return d; }
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

// Liefert alle Fixkosten_Plan-Positionen, die für den angegebenen Monat gültig
// sind (Gültig-ab/-bis-Prüfung). Wird sowohl vom Monatslauf als auch von der
// Gehaltsverteilung und den Topf-Startbeträgen verwendet, damit überall
// exakt dieselbe Definition von "aktiv" gilt.
function getActiveFixedCosts(fixedCosts, year, monthIdx) {
  return fixedCosts.filter((f) => {
    const abOk = !f.gueltigAb || f.gueltigAb <= toISO(new Date(year, monthIdx, 28));
    const bisOk = !f.gueltigBis || f.gueltigBis >= toISO(new Date(year, monthIdx, 1));
    return abOk && bisOk;
  });
}

// Summiert je Zielkonto (Topf) alle aktiven Fixkosten-Positionen, die dorthin
// fließen - das ist der "monatliche Startbetrag" dieses Topfes.
function getMonthlyPotAllocations(fixedCosts) {
  const now = new Date();
  const active = getActiveFixedCosts(fixedCosts, now.getFullYear(), now.getMonth());
  const map = {};
  active.forEach((f) => {
    if (!f.ziel || f.ziel === "Extern") return;
    map[f.ziel] = (map[f.ziel] || 0) + Number(f.betrag || 0);
  });
  return map;
}

// Töpfe, die tatsächlich als "zur Seite gelegtes" Sparen zählen - bewusst
// nicht "Puffer" (Ausgabe-Puffer, wird monatlich verrechnet) und nicht die
// übrigen Positionen im Topf "Abo & ETF" (laufende Abo-Kosten, kein Sparen).
const SPAR_ZIELE = ["Rücklage", "Model 3", "Jahres Rückstellung"];

// Diese beiden Ziele sind zwar echtes monatliches Zurücklegen, werden aber
// absehbar wieder verbraucht (Model 3 bei Fälligkeit, Jahresrückstellung im
// Laufe des Jahres) - anders als Rücklage/ETF, die unbefristet angespart
// werden. Wird in der Sparen-Ansicht als "Verbrauchssparen" gekennzeichnet.
const VERBRAUCHSSPAREN_ZIELE = ["Model 3", "Jahres Rückstellung"];

// Fasst die aktiven Fixkosten-Positionen zusammen, die monatlich fürs Sparen
// zur Seite gelegt werden: Rücklage, Model 3, Jahresrückstellung, sowie
// gezielt die ETF-Sparrate (nicht die übrigen Abo-Kosten, die zufällig in
// denselben Topf "Abo & ETF" fließen).
function computeMonatlichesSparen(fixedCosts) {
  const now = new Date();
  const active = getActiveFixedCosts(fixedCosts, now.getFullYear(), now.getMonth());
  const posten = active
    .filter((f) => f.typ === "Ausgabe" && f.kategorie === "Sparen" && (SPAR_ZIELE.includes(f.ziel) || f.bezeichnung === "ETF"))
    .map((f) => ({ bezeichnung: f.bezeichnung, ziel: f.ziel, betrag: Number(f.betrag) || 0, verbrauchssparen: VERBRAUCHSSPAREN_ZIELE.includes(f.ziel) }));
  const summe = posten.reduce((s, p) => s + p.betrag, 0);
  return { posten, summe };
}

// Wie sich die Fixkosten (Ausgaben und Einnahmen) über die kommenden
// Monate entwickeln, basierend auf "Gültig ab/bis" - erkennt Positionen,
// die in dem Zeitraum teurer/günstiger werden, wegfallen oder neu
// hinzukommen (Namensabgleich zwischen den Monaten).
function computeVorausschau(fixedCosts, monateVoraus = 3) {
  const heute = new Date();
  const monate = [];
  for (let i = 0; i < monateVoraus; i++) {
    const d = new Date(heute.getFullYear(), heute.getMonth() + i, 1);
    const aktiv = getActiveFixedCosts(fixedCosts, d.getFullYear(), d.getMonth());
    // Die Puffer-Zeile selbst ausklammern (siehe computeGehaltsverteilungFuerMonat)
    // - ihr gespeicherter Betrag ist nur der Stand von heute und würde die
    // Summe hier sonst um denselben veralteten Wert verfälschen, sobald sich
    // eine andere Position ändert.
    const ausgaben = aktiv.filter((f) => f.typ === "Ausgabe" && f.ziel !== "Puffer").reduce((s, f) => s + (Number(f.betrag) || 0), 0);
    const einnahmen = aktiv.filter((f) => f.typ === "Einnahme").reduce((s, f) => s + (Number(f.betrag) || 0), 0);
    const jahresZusatz = d.getFullYear() !== heute.getFullYear() ? ` ${d.getFullYear()}` : "";
    const verteilung = computeGehaltsverteilungFuerMonat(fixedCosts, d.getFullYear(), d.getMonth());
    monate.push({ label: MONATSNAMEN_VOLL[d.getMonth()] + jahresZusatz, ausgaben, einnahmen, aktiv, ...verteilung });
  }

  // Leerzeichen am Anfang/Ende ignorieren - sonst werden zwei eigentlich
  // gleiche Positionen (z.B. einmal am PC direkt im Sheet eingetragen,
  // einmal über die App gespeichert) fälschlich als "läuft aus" + "neu"
  // statt als eine einzige Preisänderung erkannt.
  const normName = (n) => (n || "").trim();
  const changes = [];
  for (let i = 1; i < monate.length; i++) {
    const vorMap = new Map(monate[i - 1].aktiv.map((f) => [normName(f.bezeichnung), f]));
    const neuMap = new Map(monate[i].aktiv.map((f) => [normName(f.bezeichnung), f]));
    const namen = new Set([...vorMap.keys(), ...neuMap.keys()]);
    namen.forEach((name) => {
      const vor = vorMap.get(name);
      const neu = neuMap.get(name);
      if (vor && neu && Number(vor.betrag) !== Number(neu.betrag)) {
        changes.push({ bezeichnung: name, typ: neu.typ, von: Number(vor.betrag), nach: Number(neu.betrag), abMonat: monate[i].label, quelle: neu.quelle, ziel: neu.ziel, pufferAbMonat: monate[i].puffer });
      } else if (vor && !neu) {
        changes.push({ bezeichnung: name, typ: vor.typ, von: Number(vor.betrag), nach: null, abMonat: monate[i].label, quelle: vor.quelle, ziel: vor.ziel, pufferAbMonat: monate[i].puffer });
      } else if (!vor && neu) {
        changes.push({ bezeichnung: name, typ: neu.typ, von: null, nach: Number(neu.betrag), abMonat: monate[i].label, quelle: neu.quelle, ziel: neu.ziel, pufferAbMonat: monate[i].puffer });
      }
    });
  }

  return { monate, changes };
}
// Ob eine Vorausschau-Änderung überhaupt über die Gehaltsverteilung läuft
// und sich damit auf den Puffer auswirkt: Einnahmen immer (sie verändern
// direkt das Gehalt), sonst nur wenn die Quelle ING ist (egal ob die
// Position am Ende auf ING bleibt oder als Umbuchung in einen Topf wie
// "Abo & ETF" fließt - beides läuft über aufING/aufTRBenannt und damit
// über den Puffer). Positionen, deren Quelle direkt ein Topf ist, bypassen
// die Gehaltsverteilung komplett (siehe computeVorausschauTopfAuswirkungen).
function vorausschauBeeinflusstPuffer(c) {
  return c.typ === "Einnahme" || c.quelle === "ING";
}
// Ob eine Vorausschau-Änderung sich finanziell nachteilig auswirkt (für
// die rot/grün-Einfärbung in der Änderungsliste).
function vorausschauIstSchlechter(c) {
  if (c.nach === null) return c.typ === "Einnahme"; // wegfallende Einnahme ist schlechter
  if (c.von === null) return c.typ === "Ausgabe"; // neue Ausgabe ist schlechter
  return c.typ === "Ausgabe" ? c.nach > c.von : c.nach < c.von;
}
// Fasst zusammen, wie sich die erkannten Änderungen auf die monatlich
// "übrige" Summe je Topf auswirken - bei einer Ausgabe wird der Topf
// (Quelle) um die Differenz kleiner, bei einer Einnahme der Zieltopf um
// die Differenz größer. Nur echte Budget-Töpfe (nicht ING/Trade Republic),
// da "Topf" hier wörtlich gemeint ist.
function computeVorausschauTopfAuswirkungen(changes) {
  const summen = {};
  changes.forEach((c) => {
    const topf = c.typ === "Ausgabe" ? c.quelle : c.ziel;
    if (!topf || !ACCOUNT_BADGES[topf] || topf === "ING" || topf === "Trade Republic") return;
    const diff = (c.nach ?? 0) - (c.von ?? 0);
    const wirkung = c.typ === "Ausgabe" ? -diff : diff;
    summen[topf] = (summen[topf] || 0) + wirkung;
  });
  return Object.entries(summen)
    .filter(([, wirkung]) => Math.abs(wirkung) > 0.004)
    .map(([topf, wirkung]) => ({ topf, wirkung }))
    .sort((a, b) => a.wirkung - b.wirkung);
}

// Für einen beliebigen Monat (nicht nur "jetzt") - Grundlage sowohl für
// die aktuelle Gehaltsverteilung als auch für deren Entwicklung in der
// Vorausschau.
function computeGehaltsverteilungFuerMonat(fixedCosts, year, monthIdx) {
  const active = getActiveFixedCosts(fixedCosts, year, monthIdx);
  const gehalt = active.filter((f) => f.typ === "Einnahme").reduce((s, f) => s + Number(f.betrag || 0), 0);
  const aufING = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && (!f.ziel || f.ziel === "Extern"))
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  // Summe der Fixkosten-Positionen, die konkret einem Topf zugewiesen sind
  // (Rücklage, Model 3, ...). Die Überweisung insgesamt ist per Definition
  // Gehalt minus dem, was auf ING bleibt - nie mehr und nie weniger, sonst
  // würde das Gehalt nicht ausreichen.
  const aufTRBenannt = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && f.ziel && f.ziel !== "Extern")
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  // Puffer hat im Fixkosten-Plan zwar selbst eine Zeile (Konto=ING, Ziel=
  // Puffer), die sich dort aber live nachrechnet ("was bleibt heute übrig")
  // - für vergangene/zukünftige Monate in der Vorausschau ist dieser Wert
  // deshalb veraltet, sobald sich eine andere Position ändert. Wir ignorieren
  // den gespeicherten Betrag dieser Zeile bewusst und berechnen den Puffer
  // stattdessen selbst neu: alles, was nach ING und den ÜBRIGEN benannten
  // Töpfen von der Trade-Republic-Überweisung übrig bleibt. So zieht sich
  // die Puffer-Zeile nicht versehentlich von sich selbst ab (das drückte
  // den angezeigten Puffer künstlich auf ~0).
  const aufTRBenanntOhnePuffer = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && f.ziel && f.ziel !== "Extern" && f.ziel !== "Puffer")
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  const aufTR = gehalt - aufING;
  const pufferRoh = aufTR - aufTRBenanntOhnePuffer;
  // Rundungsreste (z.B. -0.0000000001) nicht als "-0,00 €" anzeigen.
  const puffer = Math.abs(pufferRoh) < 0.005 ? 0 : pufferRoh;
  return { gehalt, aufING, aufTR, aufTRBenannt, puffer };
}
function computeGehaltsverteilung(fixedCosts) {
  const now = new Date();
  return computeGehaltsverteilungFuerMonat(fixedCosts, now.getFullYear(), now.getMonth());
}

// Zinssatz-Zellen können als "2,25%" (Text), 2.25 (Zahl, gemeint als Prozent)
// oder 0.0225 (Zahl, gemeint als Dezimalanteil) vorliegen - alle drei Formen abdecken.
function parseRate(v) {
  if (typeof v === "number") return v > 1 ? v / 100 : v;
  if (!v) return 0;
  let s = String(v).trim();
  const hatProzent = s.includes("%");
  s = s.replace(/[^0-9,.\-]/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s) || 0;
  if (hatProzent) return n / 100;
  return n > 1 ? n / 100 : n;
}

function getRateSchedule(einstellungen, kontoName) {
  return einstellungen
    .filter((r) => r.Konto === kontoName)
    .map((r) => ({
      ab: parseGermanDate(r["Gültig Ab"] || r["Gültig Ab "]),
      bis: parseGermanDate(r["Gültig bis"]) || null,
      satz: parseRate(r["Zinssatz"]),
    }))
    .filter((r) => r.ab)
    .sort((a, b) => (a.ab < b.ab ? -1 : 1));
}

// Liefert den gültigen Zinssatz für ein Datum, oder null, wenn keine Zeile im
// Blatt "Einstellungen" dieses Datum abdeckt (Lücke oder fehlende Zeile) -
// damit lässt sich das im Aufrufer als klare Fehlermeldung statt als
// stillschweigend falsche Zahl behandeln.
function rateForDate(schedule, isoDate) {
  const treffer = schedule.find((r) => r.ab <= isoDate && (!r.bis || r.bis >= isoDate));
  return treffer ? treffer.satz : null;
}

// Tagesgenaue Simulation: Zinsen werden täglich berechnet (Tagessaldo * Jahreszins / 365)
// und am Monatsende gutgeschrieben. Der bereits VERGANGENE Teil des laufenden
// Monats wird taggenau aus den echten Buchungen dieses Kontos nachvollzogen -
// nur für Tage, die wirklich noch in der Zukunft liegen, wird die aktuell
// hinterlegte monatliche Fixkosten-Zuweisung als Annahme verwendet, da
// zukünftige, ungeplante Buchungen naturgemäß niemand vorhersehen kann.
function simulateForecast(accountName, accounts, transactions, monthlyContribution, schedule, monthsAhead) {
  const heute = new Date();
  heute.setHours(0, 0, 0, 0);
  const start = new Date(heute.getFullYear(), heute.getMonth(), 1);
  const end = new Date(start.getFullYear(), start.getMonth() + monthsAhead + 1, 0);
  const startIso = toISO(start);

  // Echter Kontostand unmittelbar VOR dem 1. des laufenden Monats als Basis.
  const vorMonatsTx = transactions.filter((t) => t.datum < startIso);
  let balance = computeBalances(accounts, vorMonatsTx)[accountName] || 0;

  // Echte Buchungen dieses Kontos innerhalb des laufenden Monats, chronologisch.
  const monatsTx = transactions
    .filter((t) => t.datum >= startIso && (t.quelle === accountName || t.ziel === accountName))
    .sort((a, b) => (a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0));

  let pending = 0;
  const rows = [];
  let d = new Date(start);
  let txIndex = 0;
  while (d <= end) {
    const heuteIso = toISO(d);
    // Echte, bereits erfolgte Buchungen dieses Tages anwenden.
    while (txIndex < monatsTx.length && monatsTx[txIndex].datum === heuteIso) {
      const t = monatsTx[txIndex];
      const betrag = Number(t.betrag) || 0;
      if (t.typ === "Ausgabe" && t.quelle === accountName) balance -= betrag;
      else if (t.typ === "Einnahme" && t.ziel === accountName) balance += betrag;
      else if (t.typ === "Umbuchung") {
        if (t.quelle === accountName) balance -= betrag;
        if (t.ziel === accountName) balance += betrag;
      }
      txIndex++;
    }
    // Nur für Tage, die noch in der Zukunft liegen, die bekannte monatliche
    // Zuweisung am 1. eines Folgemonats als Annahme hinzufügen.
    if (d.getDate() === 1 && d.getTime() > heute.getTime()) balance += monthlyContribution;

    const satz = rateForDate(schedule, heuteIso);
    if (satz === null) {
      throw new Error(`Kein gültiger Zinssatz für den ${dateDE(heuteIso)} im Blatt "Einstellungen" hinterlegt (Lücke zwischen zwei "Gültig Ab"/"Gültig bis"-Zeilen). Bitte prüfen.`);
    }
    pending += (balance * satz) / 365;

    const next = new Date(d); next.setDate(next.getDate() + 1);
    if (next.getMonth() !== d.getMonth()) {
      balance += pending;
      rows.push({ monat: `${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`, saldo: Math.round(balance * 100) / 100, zinsen: Math.round(pending * 100) / 100 });
      pending = 0;
    }
    d = next;
  }
  return rows.slice(0, monthsAhead);
}

/* ============================== Saldenlogik ============================== */

function computeBalances(accounts, transactions) {
  const balances = {};
  accounts.forEach((a) => (balances[a.name] = a.saldo));
  const externalSources = new Set(["extern", "arbeitgeber"]);

  // Reines Doppel-Buchungsprinzip, ohne Sonderfälle: "Trade Republic" ist hier
  // nur der freie, noch keinem Topf zugeordnete Betrag. Die auf dem Dashboard
  // angezeigte Trade-Republic-Gesamtsumme wird an anderer Stelle als
  // (freier Betrag + Summe aller Töpfe) DEFINIERT – dadurch kann sie
  // rechnerisch nie von der Realität abweichen, ganz gleich wie viele
  // Buchungen dazwischenliegen.
  transactions.forEach((t) => {
    const betrag = Number(t.betrag) || 0;
    if (t.typ === "Ausgabe") {
      if (balances[t.quelle] !== undefined) balances[t.quelle] -= betrag;
    } else if (t.typ === "Einnahme") {
      const qKey = (t.quelle || "").toLowerCase();
      if (!externalSources.has(qKey) && balances[t.quelle] !== undefined) balances[t.quelle] += betrag;
      if (balances[t.ziel] !== undefined) balances[t.ziel] += betrag;
    } else if (t.typ === "Umbuchung") {
      if (balances[t.quelle] !== undefined) balances[t.quelle] -= betrag;
      if (balances[t.ziel] !== undefined) balances[t.ziel] += betrag;
    }
  });
  return balances;
}

/* ============================== Google-Apps-Script-Client ============================== */

function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

// Verhindert, dass eine einzelne Anfrage bei schlechter Verbindung unbegrenzt
// "hängen" bleibt - nach 20 Sekunden wird abgebrochen und als Fehler
// behandelt (statt endlos zu warten).
// 30s statt vorher 20s: Google Apps Script braucht nach einer Pause
// gelegentlich einen "kalten Start", der allein schon einige Sekunden
// dauern kann - kombiniert mit einer schwächeren Mobilfunkverbindung riss
// das bei 20s öfter den Timeout, obwohl die Anfrage eigentlich nur langsam
// (nicht wirklich fehlgeschlagen) war.
async function fetchWithTimeout(url, options, timeoutMs = 30000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } catch (err) {
    if (err.name === "AbortError") throw new Error(`Zeitüberschreitung - keine Antwort innerhalb von ${timeoutMs / 1000} Sekunden.`);
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchJsonWithRetry(gasUrl, options, attempts = 2) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetchWithTimeout(gasUrl, options);
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (parseErr) {
        throw new Error("Google hat statt Daten eine Zwischenseite geliefert (kommt gelegentlich beim ersten Aufruf vor).");
      }
      return { res, json };
    } catch (err) {
      lastErr = err;
      if (i < attempts - 1) await delay(900);
    }
  }
  throw lastErr;
}

async function gasGet(gasUrl) {
  const key = loadApiKey();
  const url = gasUrl + (gasUrl.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key) + "&geraeteId=" + encodeURIComponent(getDeviceId());
  const { json } = await fetchJsonWithRetry(url, { method: "GET" });
  if (json.status !== "ok") throw new Error(json.error || "Unbekannter Serverfehler beim Laden.");
  return json.data;
}

async function gasPost(gasUrl, body, timeoutMs) {
  // WICHTIG: Kein automatischer Wiederholungsversuch bei Schreibvorgängen!
  // Anders als ein Lesevorgang (GET) ist "Buchung anlegen" nicht gefahrlos
  // wiederholbar: Kam die Anfrage beim Server tatsächlich an, würde ein
  // zweiter Versuch dieselbe Buchung ein zweites Mal anlegen. Schlägt das
  // Lesen der Antwort fehl, wird das als echter Fehler behandelt (inkl.
  // Rollback im UI) statt automatisch erneut zu senden.
  const res = await fetchWithTimeout(
    gasUrl,
    {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ ...body, key: loadApiKey() }),
    },
    timeoutMs
  );
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (parseErr) {
    throw new Error("Antwort konnte nicht gelesen werden. Bitte im Journal prüfen, ob die Buchung eventuell trotzdem angekommen ist, bevor du es erneut versuchst.");
  }
  if (json.status !== "ok") throw new Error(json.error || "Server meldete einen Fehler.");
  return json;
}

function mapRemoteData(data) {
  const accounts = (data.konten || [])
    .filter((r) => r.Konto && r.Konto !== "Gesamt")
    .map((r) => ({
      id: r.Konto,
      name: r.Konto,
      saldo: parseGermanNumber(r["Aktueller Saldo"]),
      typ: REAL_ACCOUNTS.includes(r.Konto) ? "echt" : "virtuell",
      farbe: ACCOUNT_COLOR(r.Konto),
    }));

  // Der Wert für "Trade Republic" im Sheet ist der ECHTE Gesamtbetrag
  // (zum Abgleich mit der Trade-Republic-App), nicht der freie Rest. Da
  // Trade Republic komplett aus den Töpfen besteht, ziehen wir die Summe
  // der Topf-Eröffnungssalden einmalig ab, um den tatsächlich freien,
  // keinem Topf zugeordneten Betrag zu erhalten. Ab da wird nur noch dieser
  // freie Betrag fortgeschrieben – die Töpfe laufen ohnehin separat mit.
  const trAccount = accounts.find((a) => a.name === "Trade Republic");
  if (trAccount) {
    const potSum = accounts.filter((a) => a.typ === "virtuell").reduce((s, a) => s + a.saldo, 0);
    trAccount.saldo = trAccount.saldo - potSum;
  }

  const categories = (data.kategorien || []).map((r, i) => ({
    id: "cat-" + i, name: r.Kategorie, typ: r.Typ,
  }));

  const fixedCosts = (data.fixkosten || []).map((r, i) => ({
    id: r.ID || ("fix-" + i),
    bezeichnung: r.Bezeichnung,
    betrag: parseGermanNumber(r.Betrag),
    kategorie: r.Kategorie,
    typ: r.Typ,
    quelle: r.Konto,
    ziel: r.Zielkonto || "",
    gueltigAb: parseGermanDate(r["Gültig Ab"] || r["Gültig Ab "]),
    gueltigBis: parseGermanDate(r["Gültig bis"]),
  }));

  // WICHTIG: Bewusst NICHT nach "Datum" sortiert - das Datum kann frei
  // gewählt werden (z. B. eine Buchung von vorgestern heute nachtragen) und
  // spiegelt daher nicht wider, wann etwas wirklich eingegeben wurde. Jede
  // neue Buchung landet im Sheet immer ganz oben (Zeile 2) - die natürliche
  // Zeilenreihenfolge ist dadurch bereits ein exaktes Protokoll der
  // tatsächlichen Buchungsreihenfolge und wird unverändert übernommen.
  const transactions = (data.transaktionen || [])
    .filter((r) => r.ID)
    .map((r) => ({
      id: r.ID, datum: parseGermanDate(r.Datum) || r.Datum, titel: r.Titel,
      kategorie: r.Kategorie, typ: r.Typ, betrag: parseGermanNumber(r.Betrag),
      quelle: r.Quelle, ziel: r.Ziel || "", notiz: r.Notiz || "",
    }));

  const einstellungen = data.einstellungen || [];
  const kontoauszuege = data.kontoauszuege || [];
  const geraete = Array.isArray(data.geraete) ? data.geraete : null;
  const geraetGesperrt = data.gesperrt === true;

  return { accounts, categories, fixedCosts, transactions, einstellungen, kontoauszuege, geraete, geraetGesperrt };
}

// Wählt eine deutsche Stimme für die Sprachausgabe: eine vom Nutzer explizit
// gewählte (per Name), sonst die vermutlich natürlichste automatisch
// verfügbare. Netzwerk-/Cloud-Stimmen (localService=false) klingen auf
// Android i.d.R. deutlich natürlicher als die kompakte Offline-Standardstimme,
// die sonst automatisch gewählt würde.
function waehleDeutscheStimme(voices, bevorzugterName) {
  const deutsche = (voices || []).filter((v) => v.lang && v.lang.toLowerCase().startsWith("de"));
  if (deutsche.length === 0) return null;
  if (bevorzugterName) {
    const gewaehlte = deutsche.find((v) => v.name === bevorzugterName);
    if (gewaehlte) return gewaehlte;
  }
  const netzwerk = deutsche.filter((v) => !v.localService);
  return netzwerk[0] || deutsche[0];
}

function relativeTime(ts) {
  if (!ts) return "";
  const diffSec = Math.floor((Date.now() - ts) / 1000);
  if (diffSec < 10) return "gerade eben";
  if (diffSec < 60) return `vor ${diffSec}s`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `vor ${diffMin} Min`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `vor ${diffHr} Std`;
  return `vor ${Math.floor(diffHr / 24)} Tg`;
}

// Eigener Tick nur für diese kleine Anzeige (statt einen Tick auf App-Ebene
// zu forcieren) - damit lässt die "vor X Min"-Angabe nur sich selbst neu
// rendern, nicht den kompletten restlichen Baum, alle 15s, dauerhaft.
function useRelativeTimeTick(aktiv) {
  const [, tick] = useState(0);
  useEffect(() => {
    if (!aktiv) return;
    const t = setInterval(() => tick((n) => n + 1), 15000);
    return () => clearInterval(t);
  }, [aktiv]);
}
function SyncIndicator({ status, lastSync, onClick }) {
  useRelativeTimeTick(status === "connected" && !!lastSync);
  const conf = {
    connected: { icon: "wifi", cls: "text-emerald-400", text: lastSync ? relativeTime(lastSync) : "Verbunden", title: "Zuletzt erfolgreich synchronisiert" },
    syncing: { icon: "loader", cls: "text-amber-400 animate-spin", text: "läuft…", title: "Synchronisiere gerade" },
    offline: { icon: "wifiOff", cls: "text-amber-400 animate-pulse", text: "Fehler", title: "Synchronisierung fehlgeschlagen" },
    none: { icon: "wifiOff", cls: "text-zinc-500", text: "getrennt", title: "Keine Google-Apps-Script-URL hinterlegt" },
  }[status];
  return (
    <button onClick={onClick} title={conf.title} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 bg-zinc-800/60 px-2.5 py-1.5 text-xs text-zinc-300 hover:border-zinc-600">
      <Icon name={conf.icon} size={14} className={conf.cls} />
      <span>{conf.text}</span>
    </button>
  );
}

function LockScreen({ onUnlock, onCancel, title = "Finanzindex ist gesperrt" }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const [tried, setTried] = useState(false);
  const hasWebauthn = !!localStorage.getItem(LOCK_WEBAUTHN_KEY);

  const tryWebauthn = useCallback(async () => {
    try {
      await webauthnVerify(localStorage.getItem(LOCK_WEBAUTHN_KEY));
      onUnlock();
    } catch (e) { setTried(true); }
  }, [onUnlock]);

  useEffect(() => { if (hasWebauthn) tryWebauthn(); }, []);

  const checkPin = async (value) => {
    const salt = localStorage.getItem(LOCK_PIN_SALT_KEY);
    const stored = localStorage.getItem(LOCK_PIN_HASH_KEY);
    const hash = await hashPin(value, salt);
    if (hash === stored) { onUnlock(); }
    else { setError(true); setTimeout(() => { setPin(""); setError(false); }, 500); }
  };

  const onDigit = (d) => {
    if (pin.length >= 4) return;
    const next = pin + d;
    setPin(next);
    if (next.length === 4) checkPin(next);
  };

  return (
    <div className="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-zinc-950 px-6">
      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/15">
        <Icon name="lock" size={28} className="text-emerald-400" />
      </div>
      <p className="text-base font-semibold text-zinc-200">{title}</p>
      {hasWebauthn && (
        <button onClick={tryWebauthn} className="rounded-xl border border-emerald-500/30 bg-emerald-500/15 px-5 py-2.5 text-sm font-medium text-emerald-400">
          Mit Fingerabdruck entsperren
        </button>
      )}
      {tried && hasWebauthn && <p className="text-xs text-amber-300">Fingerabdruck fehlgeschlagen - bitte PIN verwenden.</p>}
      <p className="text-xs text-zinc-500">{hasWebauthn ? "oder PIN eingeben" : "PIN eingeben"}</p>
      <PinDots value={pin} error={error} />
      <Numpad onDigit={onDigit} onDelete={() => setPin((p) => p.slice(0, -1))} />
      {onCancel && <button onClick={onCancel} className="text-xs text-zinc-600">Abbrechen</button>}
    </div>
  );
}

function LockSetup({ onDone, onCancel }) {
  const [step, setStep] = useState("pin1"); // pin1 -> pin2 -> webauthn -> done
  const [pin1, setPin1] = useState("");
  const [pin2, setPin2] = useState("");
  const [error, setError] = useState(false);
  const [webauthnStatus, setWebauthnStatus] = useState(null);

  const onDigit = (d) => {
    if (step === "pin1") {
      if (pin1.length >= 4) return;
      const next = pin1 + d;
      setPin1(next);
      if (next.length === 4) setStep("pin2");
    } else if (step === "pin2") {
      if (pin2.length >= 4) return;
      const next = pin2 + d;
      setPin2(next);
      if (next.length === 4) {
        if (next === pin1) {
          (async () => {
            const salt = randomHex(16);
            const hash = await hashPin(pin1, salt);
            localStorage.setItem(LOCK_PIN_SALT_KEY, salt);
            localStorage.setItem(LOCK_PIN_HASH_KEY, hash);
            setStep("webauthn");
          })();
        } else {
          setError(true);
          setTimeout(() => { setPin1(""); setPin2(""); setError(false); setStep("pin1"); }, 600);
        }
      }
    }
  };
  const onDelete = () => {
    if (step === "pin1") setPin1((p) => p.slice(0, -1));
    else setPin2((p) => p.slice(0, -1));
  };

  const setupWebauthn = async () => {
    try {
      const id = await webauthnRegister();
      localStorage.setItem(LOCK_WEBAUTHN_KEY, id);
      setWebauthnStatus("ok");
    } catch (e) { setWebauthnStatus("error"); }
  };

  return (
    <div className="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-zinc-950 px-6">
      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/15">
        <Icon name="lock" size={28} className="text-emerald-400" />
      </div>
      {(step === "pin1" || step === "pin2") && (
        <>
          <p className="text-base font-semibold text-zinc-200">Sicherheitssperre einrichten</p>
          <p className="max-w-[240px] text-center text-[12.5px] text-zinc-500">Schützt die App auf diesem Gerät vor fremdem Zugriff.</p>
          <p className="text-xs text-zinc-500">{step === "pin1" ? "4-stelligen PIN festlegen" : "PIN zur Bestätigung erneut eingeben"}</p>
          <PinDots value={step === "pin1" ? pin1 : pin2} error={error} />
          <Numpad onDigit={onDigit} onDelete={onDelete} />
          <button onClick={onCancel} className="text-xs text-zinc-600">Abbrechen</button>
        </>
      )}
      {step === "webauthn" && (
        <>
          <p className="text-base font-semibold text-zinc-200">PIN gespeichert</p>
          <p className="max-w-[240px] text-center text-[12.5px] text-zinc-500">Zusätzlich Fingerabdruck/Gesichtserkennung für schnelleres Entsperren einrichten?</p>
          {webauthnStatus === "ok" && <p className="text-sm text-emerald-400">Eingerichtet.</p>}
          {webauthnStatus === "error" && <p className="text-sm text-amber-300">Fehlgeschlagen oder abgebrochen - PIN funktioniert trotzdem.</p>}
          {webauthnStatus !== "ok" && (
            <button onClick={setupWebauthn} className="rounded-xl bg-emerald-500 px-5 py-2.5 text-sm font-semibold text-emerald-950">Fingerabdruck einrichten</button>
          )}
          <button onClick={onDone} className="mt-2 text-sm text-zinc-400">{webauthnStatus === "ok" ? "Fertig" : "Überspringen"}</button>
        </>
      )}
    </div>
  );
}

function App() {
  const initial = loadLocal();
  const [lockConfigured, setLockConfigured] = useState(() => !!localStorage.getItem(LOCK_PIN_HASH_KEY));
  const [betraegeVersteckt, setBetraegeVersteckt] = useState(() => { try { return localStorage.getItem(BETRAEGE_VERSTECKT_KEY) === "true"; } catch (e) { return false; } });
  const [confirmRevealBetraege, setConfirmRevealBetraege] = useState(false);
  const hideBetraege = () => {
    setBetraegeVersteckt(true);
    try { localStorage.setItem(BETRAEGE_VERSTECKT_KEY, "true"); } catch (e) {}
  };
  const requestRevealBetraege = () => {
    if (lockConfigured) { setConfirmRevealBetraege(true); return; }
    setBetraegeVersteckt(false); // keine Sperre auf diesem Gerät eingerichtet - nichts zum Bestätigen
    try { localStorage.setItem(BETRAEGE_VERSTECKT_KEY, "false"); } catch (e) {}
  };
  const [locked, setLocked] = useState(() => isTouchDevice() && !!localStorage.getItem(LOCK_PIN_HASH_KEY) && !wasRecentlyUnlocked());
  const [showLockSetup, setShowLockSetup] = useState(false);
  const hiddenAtRef = useRef(null);

  useEffect(() => {
    const handleVisibility = () => {
      if (document.visibilityState === "hidden") {
        hiddenAtRef.current = Date.now();
      } else if (document.visibilityState === "visible") {
        if (hiddenAtRef.current && lockConfigured && isTouchDevice()) {
          if (Date.now() - hiddenAtRef.current >= 3 * 60 * 1000) setLocked(true);
          else markUnlocked(); // Zeitstempel auffrischen, solange innerhalb der Karenzzeit zurückgekehrt
        }
        hiddenAtRef.current = null;
      }
    };
    document.addEventListener("visibilitychange", handleVisibility);
    return () => document.removeEventListener("visibilitychange", handleVisibility);
  }, [lockConfigured]);

  const [accounts, setAccounts] = useState(initial?.accounts || []);
  const [categories, setCategories] = useState(initial?.categories || []);
  const [transactions, setTransactions] = useState(initial?.transactions || []);
  const [fixedCosts, setFixedCosts] = useState(initial?.fixedCosts || []);
  const [einstellungen, setEinstellungen] = useState(initial?.einstellungen || []);
  const [kontoauszuege, setKontoauszuege] = useState(initial?.kontoauszuege || []);
  const [geraete, setGeraete] = useState(null);
  const [deviceBlocked, setDeviceBlocked] = useState(false);
  const [showGeraetePopup, setShowGeraetePopup] = useState(false);
  const [gasUrl, setGasUrl] = useState(loadGasUrl());
  const [apiKey, setApiKey] = useState(loadApiKey());
  const [activeTab, setActiveTab] = useState("dashboard");
  const handleGoBuchen = useCallback(() => setActiveTab("buchen"), []);
  const [syncStatus, setSyncStatus] = useState(gasUrl ? "offline" : "none");
  const [lastSync, setLastSync] = useState(() => {
    try { const v = localStorage.getItem("finanzindex_last_sync"); return v ? Number(v) : null; } catch (e) { return null; }
  });
  const markSynced = useCallback(() => {
    const now = Date.now();
    setLastSync(now);
    try { localStorage.setItem("finanzindex_last_sync", String(now)); } catch (e) {}
  }, []);
  const [isLight, setIsLight] = useState(() => { try { return localStorage.getItem("finanzindex_theme") === "light"; } catch (e) { return false; } });
  const [toast, setToast] = useState(null);
  const [editingTx, setEditingTx] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  // useCallback statt Inline-Funktion, damit Journal (memo) diese Referenz
  // als unverändert erkennt und nicht bei jedem Sync-Tick neu rendert.
  const handleEditTx = useCallback((tx) => setEditingTx(tx), []);
  const handleDeleteTxRequest = useCallback((id) => setConfirmDeleteId(id), []);
  const [journalFilter, setJournalFilter] = useState({ monat: "alle", konto: "alle", kategorie: "alle", typ: "alle" });
  const [showFilters, setShowFilters] = useState(false);
  const [forceRun, setForceRun] = useState(false);
  const [lastRunInfo, setLastRunInfo] = useState(null);
  const toastTimer = useRef(null);

  // KI-Assistent (Chat, Sprache, Buchungsvorschläge)
  const [aiMessages, setAiMessages] = useState([]);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiVorlesen, setAiVorlesen] = useState(() => {
    try { return localStorage.getItem("finanzindex_ai_vorlesen") === "true"; } catch (e) { return false; }
  });
  const toggleAiVorlesen = useCallback(() => {
    setAiVorlesen((prev) => {
      const next = !prev;
      try { localStorage.setItem("finanzindex_ai_vorlesen", String(next)); } catch (e) {}
      return next;
    });
  }, []);
  const [aiVoiceName, setAiVoiceName] = useState(() => {
    try { return localStorage.getItem("finanzindex_ai_voice") || ""; } catch (e) { return ""; }
  });
  const handleAiVoiceChange = useCallback((name) => {
    setAiVoiceName(name);
    try { localStorage.setItem("finanzindex_ai_voice", name); } catch (e) {}
  }, []);

  const showToast = useCallback((message, type = "success") => {
    setToast({ message, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 4500);
  }, []);

  // Persistiere jeden Zustand lokal (local-first)
  useEffect(() => {
    saveLocal({ accounts, categories, transactions, fixedCosts });
  }, [accounts, categories, transactions, fixedCosts]);

  // Initialer Sync beim Start, falls eine GAS-URL hinterlegt ist
  useEffect(() => {
    if (gasUrl) { syncFromRemote(true).then(() => processQueue()); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Sobald der Browser erkennt, dass die Verbindung wieder da ist, sofort
  // versuchen zu synchronisieren und die Warteschlange abzuarbeiten - ohne
  // dass dafür ein manueller Klick nötig ist.
  useEffect(() => {
    const handler = () => { if (gasUrl) syncFromRemote(true).then(() => processQueue()); };
    window.addEventListener("online", handler);
    return () => window.removeEventListener("online", handler);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [gasUrl]);

  // Zusätzliches Sicherheitsnetz: Solange etwas in der Warteschlange liegt,
  // alle 45 Sekunden automatisch einen neuen Versuch starten - auch wenn der
  // Browser das "online"-Ereignis (z. B. bei manchen Mobilfunk-Wechseln)
  // nicht zuverlässig auslöst. Steht der Sync zusätzlich auf "offline" (z.B.
  // eine einzelne Zeitüberschreitung kurz nach dem Start), wird hier auch
  // ohne Warteschlange automatisch ein neuer Sync-Versuch gestartet - vorher
  // blieb die App in diesem Fall dauerhaft auf "Fehler" stehen, bis man
  // manuell auf das Symbol getippt hat, weil weder das "online"-Ereignis
  // (die Verbindung war ja nie wirklich weg) noch die Warteschlange
  // (nichts Neues zu buchen) einen erneuten Versuch ausgelöst haben.
  useEffect(() => {
    if (!gasUrl) return;
    const interval = setInterval(() => {
      if (syncStatus === "offline") syncFromRemote(true).then(() => processQueue());
      else if (loadQueue().length > 0) processQueue();
    }, 45000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [gasUrl, syncStatus]);

  // "Geräte online"-Lebenszeichen: alle 25 Sekunden, solange die App
  // tatsächlich offen ist. Beim Schließen zusätzlich sofort per sendBeacon
  // abmelden (zuverlässig genug, um auch beim Schließen der Seite noch
  // rauszugehen) - stirbt die Verbindung mal unsauber (z. B. App auf Android
  // aus der Übersicht weggewischt, ohne dass ein sauberes Beenden-Ereignis
  // ausgelöst wird), korrigiert sich die Zahl serverseitig ohnehin
  // spätestens nach GERAETE_TIMEOUT_MS (55s, siehe .gs) von selbst - als
  // "vertraut" markierte Geräte werden danach zusätzlich automatisch aus
  // dem Sheet entfernt (siehe upsertGeraet im Backend).
  useEffect(() => {
    if (!gasUrl || deviceBlocked) return;
    const geraeteId = getDeviceId();
    let ersterHeartbeatErledigt = false;
    const sendHeartbeat = () => {
      gasPost(gasUrl, { action: "heartbeat", geraeteId, geraeteName: getDeviceName() })
        .then((res) => {
          if (res.gesperrt) { setDeviceBlocked(true); clearInterval(interval); return; }
          // Performance-Optimierung: Der Heartbeat bringt die aktuelle
          // Geräteliste direkt in seiner Antwort mit - dadurch reicht dieser
          // eine Aufruf alle 25s für die "Geräte online"-Anzeige, ohne dass
          // dafür zusätzlich eine separate Abfrage nötig ist (das hat vorher
          // spürbar zur Serverlast/Sync-Trägheit bei mehreren Geräten
          // beigetragen).
          if (Array.isArray(res.geraete)) setGeraete((prev) => (geraeteListenGleich(prev, res.geraete) ? prev : res.geraete));
          // Der initiale Datensync (GET) startet parallel zu diesem ersten
          // Heartbeat (POST) und kommt oft schneller zurück, als dieses
          // Gerät serverseitig in der Geräte-Tabelle eingetragen ist -
          // dadurch zeigte "Geräte online" beim Start kurzzeitig 0/zu wenig
          // an, bis zum nächsten manuellen Sync. Direkt nach dem ersten
          // erfolgreichen Heartbeat einmal still nachsynchronisieren behebt das.
          if (!ersterHeartbeatErledigt) {
            ersterHeartbeatErledigt = true;
            syncFromRemote(true);
          }
        })
        .catch(() => {});
    };
    sendHeartbeat();
    const interval = setInterval(sendHeartbeat, 25000);
    const handlePageHide = () => {
      try {
        const url = gasUrl + (gasUrl.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(loadApiKey());
        navigator.sendBeacon(url, JSON.stringify({ action: "geraet-abmelden", geraeteId, key: loadApiKey() }));
      } catch (e) {}
    };
    window.addEventListener("pagehide", handlePageHide);
    return () => { clearInterval(interval); window.removeEventListener("pagehide", handlePageHide); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [gasUrl, deviceBlocked]);

  const sperreGeraetClient = useCallback((id) => {
    if (!gasUrl) return;
    gasPost(gasUrl, { action: "geraet-sperren", geraeteId: id }).then(() => syncFromRemote(true)).catch(() => {});
  }, [gasUrl]);

  const syncFromRemote = useCallback(async (silent) => {
    if (!gasUrl) { setSyncStatus("none"); return; }
    setSyncStatus("syncing");
    try {
      const data = await gasGet(gasUrl);
      const mapped = mapRemoteData(data);
      setAccounts(mapped.accounts);
      setCategories(mapped.categories);
      setFixedCosts(mergeFixkostenWithQueue(mapped.fixedCosts, loadQueue()));
      setEinstellungen(mapped.einstellungen);
      setKontoauszuege(mapped.kontoauszuege);
      if (mapped.geraete !== null) setGeraete((prev) => (geraeteListenGleich(prev, mapped.geraete) ? prev : mapped.geraete));
      if (mapped.geraetGesperrt) setDeviceBlocked(true);
      setTransactions(mergeWithQueue(mapped.transactions, loadQueue()));
      setSyncStatus("connected");
      markSynced();
      if (!silent) showToast("Mit Google Sheet synchronisiert.");
    } catch (err) {
      setSyncStatus("offline");
      // Anders als der Erfolgs-Toast wird der Fehler-Toast bewusst IMMER
      // gezeigt, auch bei "stillen" Hintergrund-Syncs (App-Start,
      // Wiederverbinden, nach der Warteschlange) - sonst sieht man nur das
      // Fehler-Symbol im Kopfbereich, aber nie den eigentlichen Grund dafür.
      showToast("Verbindung fehlgeschlagen: " + err.message + " Es werden lokale Daten verwendet.", "error");
    }
  }, [gasUrl, showToast]);

  const balances = useMemo(() => computeBalances(accounts, transactions), [accounts, transactions]);
  // useMemo statt Neuberechnung bei jedem Render, damit memo(Dashboard)
  // und memo(ToepfeKarussell) diese Referenz als unverändert erkennen.
  const realAccounts = useMemo(() => accounts.filter((a) => a.typ === "echt"), [accounts]);
  const virtualAccounts = useMemo(() => accounts.filter((a) => a.typ === "virtuell"), [accounts]);
  const ingBalance = balances["ING"] || 0;
  const trFrei = balances["Trade Republic"] || 0;
  const gebundenesBudget = virtualAccounts.reduce((s, a) => s + (balances[a.name] || 0), 0);
  const trGesamt = trFrei + gebundenesBudget; // 1:1 vergleichbar mit der echten Trade-Republic-App
  const gesamtvermoegen = ingBalance + trGesamt;
  const potAllocations = useMemo(() => getMonthlyPotAllocations(fixedCosts), [fixedCosts]);

  const currentMonth = monthKey(todayISO());
  const monthTx = transactions.filter((t) => monthKey(t.datum) === currentMonth);
  const monatEinnahmen = monthTx.filter((t) => t.typ === "Einnahme").reduce((s, t) => s + Number(t.betrag), 0);
  const monatAusgaben = monthTx.filter((t) => t.typ === "Ausgabe").reduce((s, t) => s + Number(t.betrag), 0);

  /* ---------- Buchung anlegen / bearbeiten / löschen: optimistic update + Rollback + Persistenz-Verifikation ---------- */
  const [queueCount, setQueueCount] = useState(() => loadQueue().length);

  const enqueue = useCallback((action, payload) => {
    const queue = loadQueue();
    queue.push({ action, payload });
    saveQueue(queue);
    setQueueCount(queue.length);
  }, []);

  const writeTransaction = useCallback(async (action, payload, snapshot) => {
    if (!gasUrl) {
      showToast("Keine Google-Apps-Script-URL hinterlegt. Änderung wurde nur lokal gespeichert.", "error");
      return true;
    }
    setSyncStatus("syncing");
    try {
      await gasPost(gasUrl, { action, ...payload });
      setSyncStatus("connected");
      markSynced();
      showToast(action === "delete" ? "Buchung gelöscht und synchronisiert." : "Buchung gespeichert und synchronisiert.");
      setTimeout(async () => {
        try {
          const data = await gasGet(gasUrl);
          const mapped = mapRemoteData(data);
          const found = action === "delete" ? !mapped.transactions.some((t) => t.id === payload.id) : mapped.transactions.some((t) => t.id === payload.id);
          if (!found) showToast("Warnung: Buchung konnte im Sheet nicht bestätigt werden. Bitte manuell prüfen.", "error");
        } catch (e) { /* Verifikation optional, kein harter Fehler */ }
      }, 1500);
      return true;
    } catch (err) {
      // Statt zurückzurollen: Buchung bleibt sichtbar (lokal), die Aktion
      // wandert in die Warteschlange und wird beim nächsten erfolgreichen
      // Synchronisieren automatisch nachgeholt.
      enqueue(action, payload);
      setSyncStatus("offline");
      showToast("Kein Netz oder Verbindung fehlgeschlagen (" + err.message + "). Buchung bleibt gespeichert und wird automatisch nachgeholt, sobald es wieder klappt.", "error");
      return true;
    }
  }, [gasUrl, showToast, enqueue]);

  /* ---------- Fixkosten-Position anlegen / bearbeiten / löschen: gleiches Prinzip wie Buchungen ---------- */
  const writeFixkosten = useCallback(async (action, payload) => {
    if (!gasUrl) {
      showToast("Keine Google-Apps-Script-URL hinterlegt. Änderung wurde nur lokal gespeichert.", "error");
      return;
    }
    setSyncStatus("syncing");
    try {
      await gasPost(gasUrl, { action, ...payload });
      setSyncStatus("connected");
      markSynced();
      showToast(action === "fixkosten-delete" ? "Fixkosten-Position gelöscht und synchronisiert." : "Fixkosten-Position gespeichert und synchronisiert.");
    } catch (err) {
      enqueue(action, payload);
      setSyncStatus("offline");
      showToast("Kein Netz oder Verbindung fehlgeschlagen (" + err.message + "). Änderung bleibt gespeichert und wird automatisch nachgeholt.", "error");
    }
  }, [gasUrl, showToast, enqueue]);

  const handleFixkostenSave = useCallback((form) => {
    const isEdit = fixedCosts.some((f) => f.id === form.id);
    const payload = isEdit ? form : { ...form, id: uid() };
    setFixedCosts((prev) => (isEdit ? prev.map((f) => (f.id === payload.id ? payload : f)) : [...prev, payload]));
    writeFixkosten(isEdit ? "fixkosten-update" : "fixkosten-create", payload);
  }, [fixedCosts, writeFixkosten]);

  const handleFixkostenDelete = useCallback((id) => {
    setFixedCosts((prev) => prev.filter((f) => f.id !== id));
    writeFixkosten("fixkosten-delete", { id });
  }, [writeFixkosten]);

  const processingQueueRef = useRef(false);
  const [isProcessingQueue, setIsProcessingQueue] = useState(false);

  const processQueue = useCallback(async () => {
    if (!gasUrl) return;
    // Sperre: Läuft schon ein Versuch, wird ein zweiter, gleichzeitiger
    // Versuch einfach übersprungen. Ohne diese Sperre könnten zwei parallele
    // Aufrufe (z. B. Timer + Antippen) dieselbe Buchung beide für "noch nicht
    // vorhanden" halten und sie doppelt anlegen.
    if (processingQueueRef.current) return;
    let queue = loadQueue();
    if (queue.length === 0) return;
    processingQueueRef.current = true;
    setIsProcessingQueue(true);
    try {
      let currentTx = [], currentFixedCosts = [];
      try {
        const data = await gasGet(gasUrl);
        const mapped = mapRemoteData(data);
        currentTx = mapped.transactions;
        currentFixedCosts = mapped.fixedCosts;
      } catch (e) {
        return; // noch kein Netz - beim nächsten Mal erneut versuchen
      }
      const remaining = [];
      let erledigt = 0;
      for (let i = 0; i < queue.length; i++) {
        const item = queue[i];
        try {
          if (item.action === "create") {
            const existiertBereits = currentTx.some((t) => t.id === item.payload.id);
            if (!existiertBereits) await gasPost(gasUrl, { action: "create", ...item.payload });
          } else if (item.action === "update") {
            await gasPost(gasUrl, { action: "update", ...item.payload });
          } else if (item.action === "delete") {
            try {
              await gasPost(gasUrl, { action: "delete", id: item.payload.id });
            } catch (delErr) {
              if (!/nicht gefunden/i.test(delErr.message)) throw delErr;
            }
          } else if (item.action === "fixkosten-create") {
            const existiertBereits = currentFixedCosts.some((f) => f.id === item.payload.id);
            if (!existiertBereits) await gasPost(gasUrl, { action: "fixkosten-create", ...item.payload });
          } else if (item.action === "fixkosten-update") {
            await gasPost(gasUrl, { action: "fixkosten-update", ...item.payload });
          } else if (item.action === "fixkosten-delete") {
            try {
              await gasPost(gasUrl, { action: "fixkosten-delete", id: item.payload.id });
            } catch (delErr) {
              if (!/nicht gefunden/i.test(delErr.message)) throw delErr;
            }
          }
          erledigt++;
        } catch (err) {
          // Ab hier abbrechen und Rest (in ursprünglicher Reihenfolge) für den
          // nächsten Versuch aufheben, damit die zeitliche Reihenfolge erhalten bleibt.
          remaining.push(...queue.slice(i));
          break;
        }
      }
      saveQueue(remaining);
      setQueueCount(remaining.length);
      if (erledigt > 0) {
        showToast(`${erledigt} nachgeholte Änderung(en) erfolgreich synchronisiert.`);
        syncFromRemote(true);
      }
    } finally {
      processingQueueRef.current = false;
      setIsProcessingQueue(false);
    }
  }, [gasUrl, showToast]);

  const handleAddOrUpdate = useCallback(async (form, isEdit, opts = {}) => {
    const snapshot = transactions;
    const tx = isEdit ? { ...form } : { ...form, id: uid() };
    const next = isEdit ? transactions.map((t) => (t.id === tx.id ? tx : t)) : [tx, ...transactions];
    setTransactions(next);
    const ok = await writeTransaction(isEdit ? "update" : "create", tx, snapshot);
    if (ok) { setEditingTx(null); if (!isEdit && opts.switchTab !== false) setActiveTab("journal"); }
    return ok;
  }, [transactions, writeTransaction]);

  // Schickt eine Nachricht (getippt oder per Spracheingabe transkribiert) an den
  // KI-Assistenten und hängt Frage + Antwort an den Chatverlauf an. Schickt bewusst
  // nur die letzten Nachrichten als Verlauf mit (nicht die komplette Historie), um
  // die Anfrage klein und schnell zu halten.
  const sendAiMessage = useCallback(async (text) => {
    const trimmed = (text || "").trim();
    if (!trimmed || aiLoading) return;
    if (!gasUrl) { showToast("Keine Google-Apps-Script-URL hinterlegt.", "error"); return; }
    const userMsg = { id: uid(), role: "user", text: trimmed };
    setAiMessages((prev) => [...prev, userMsg]);
    setAiLoading(true);
    try {
      const verlauf = [...aiMessages, userMsg].slice(-10).map((m) => ({ role: m.role, text: m.text }));
      // Längeres Zeitlimit als bei normalen Buchungen: die KI-Anfrage liest
      // zusätzlich mehrere Tabellenblätter aus UND ruft extern Gemini auf -
      // beides zusammen dauert grundsätzlich länger als ein reiner
      // Sheet-Zugriff.
      const res = await gasPost(gasUrl, { action: "ai-chat", nachricht: trimmed, verlauf }, 45000);
      const antwortMsg = { id: uid(), role: "assistant", text: res.antwort || "", buchungsvorschlag: res.buchungsvorschlag || null, vorschlagStatus: null };
      setAiMessages((prev) => [...prev, antwortMsg]);
      if (aiVorlesen && antwortMsg.text && "speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(antwortMsg.text);
          u.lang = "de-DE";
          const stimme = waehleDeutscheStimme(window.speechSynthesis.getVoices(), aiVoiceName);
          if (stimme) u.voice = stimme;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    } catch (err) {
      setAiMessages((prev) => [...prev, { id: uid(), role: "assistant", text: "Fehler: " + err.message, isError: true }]);
    } finally {
      setAiLoading(false);
    }
  }, [gasUrl, aiMessages, aiLoading, aiVorlesen, aiVoiceName, showToast]);

  // Übernimmt einen Buchungsvorschlag der KI in eine echte Buchung - läuft über
  // denselben Weg wie das normale Buchungsformular (inkl. Warteschlange bei
  // fehlender Verbindung), bleibt aber bewusst im Assistent-Tab statt ins
  // Journal zu wechseln, damit der Chat weiterläuft.
  const handleVorschlagBuchen = useCallback(async (msgId, vorschlag) => {
    const form = {
      datum: vorschlag.datum || toISO(new Date()),
      titel: vorschlag.titel || "",
      kategorie: vorschlag.kategorie || "Sonstiges",
      typ: vorschlag.typ || "Ausgabe",
      betrag: Number(vorschlag.betrag) || 0,
      quelle: vorschlag.quelle || "ING",
      ziel: vorschlag.ziel || "",
      notiz: vorschlag.notiz || "",
    };
    setAiMessages((prev) => prev.map((m) => (m.id === msgId ? { ...m, vorschlagStatus: "gebucht" } : m)));
    await handleAddOrUpdate(form, false, { switchTab: false });
  }, [handleAddOrUpdate]);

  const handleVorschlagVerwerfen = useCallback((msgId) => {
    setAiMessages((prev) => prev.map((m) => (m.id === msgId ? { ...m, vorschlagStatus: "verworfen" } : m)));
  }, []);

  const handleDelete = useCallback(async (id) => {
    const snapshot = transactions;
    const next = transactions.filter((t) => t.id !== id);
    setTransactions(next);
    setConfirmDeleteId(null);
    await writeTransaction("delete", { id }, snapshot);
  }, [transactions, writeTransaction]);

  /* ---------- Monatslauf: Fixkosten & Besoldung ---------- */
  const runMonthlyBooking = useCallback(async () => {
    const now = new Date();
    const year = now.getFullYear(), monthIdx = now.getMonth();
    const targetMonthKey = `${year}-${String(monthIdx + 1).padStart(2, "0")}`;
    const salaryDate = toISO(lastBankBusinessDayOfMonth(year, monthIdx - 1));
    const fixedDate = toISO(new Date(year, monthIdx, 1));

    // Vor der Duplikatprüfung IMMER frisch vom Sheet abgleichen. Andernfalls
    // könnte die App Buchungen doppelt anlegen, die serverseitig bereits
    // existieren, ihr lokaler Stand davon aber (z. B. nach einem vorherigen
    // Fehler) nichts weiß.
    let currentTx = transactions;
    if (gasUrl) {
      setSyncStatus("syncing");
      try {
        const data = await gasGet(gasUrl);
        const mapped = mapRemoteData(data);
        currentTx = mergeWithQueue(mapped.transactions, loadQueue());
        setAccounts(mapped.accounts);
        setCategories(mapped.categories);
        setFixedCosts(mergeFixkostenWithQueue(mapped.fixedCosts, loadQueue()));
        setEinstellungen(mapped.einstellungen);
        setTransactions(currentTx);
      } catch (err) {
        setSyncStatus("offline");
        showToast("Monatslauf abgebrochen: Konnte vorab nicht mit dem Sheet abgleichen (" + err.message + ").", "error");
        return;
      }
    }

    const active = getActiveFixedCosts(fixedCosts, year, monthIdx);

    const toBook = [];
    let skipped = 0;
    active.forEach((f) => {
      const alreadyBooked = currentTx.some((t) => t.titel === f.bezeichnung && monthKey(t.datum) === targetMonthKey);
      if (alreadyBooked && !forceRun) { skipped += 1; return; }
      const isEinnahme = f.typ === "Einnahme";
      const zielIstIntern = f.ziel && f.ziel !== "Extern";
      // Automatische Korrektur: Fixkosten mit internem Zielkonto werden als
      // Umbuchung gebucht, damit der Zielsaldo korrekt gutgeschrieben wird.
      const typ = isEinnahme ? "Einnahme" : (zielIstIntern ? "Umbuchung" : "Ausgabe");
      toBook.push({
        id: uid(),
        datum: isEinnahme ? salaryDate : fixedDate,
        titel: f.bezeichnung, kategorie: f.kategorie, typ, betrag: Number(f.betrag),
        quelle: f.quelle, ziel: zielIstIntern || isEinnahme ? f.ziel : "",
        notiz: "Automatischer Monatslauf" + (typ !== f.typ ? ` (korrigiert von ${f.typ} zu ${typ})` : ""),
      });
    });

    // Nacheinander buchen statt alles auf einmal optimistisch anzunehmen:
    // Jede erfolgreich geschriebene Buchung bleibt bestehen, auch wenn eine
    // spätere Position fehlschlägt. So driften App und Sheet nie auseinander.
    let created = 0;
    let stoppedAt = null;
    for (const tx of toBook) {
      setTransactions((prev) => [tx, ...prev]);
      if (!gasUrl) { created += 1; continue; }
      setSyncStatus("syncing");
      try {
        await gasPost(gasUrl, { action: "create", ...tx });
        created += 1;
      } catch (err) {
        setTransactions((prev) => prev.filter((t) => t.id !== tx.id));
        setSyncStatus("offline");
        stoppedAt = { titel: tx.titel, error: err.message };
        break;
      }
    }
    if (gasUrl && !stoppedAt) { setSyncStatus("connected"); markSynced(); }

    setLastRunInfo({ created, skipped, salaryDate, fixedDate, targetMonthKey });
    if (stoppedAt) {
      showToast(`Monatslauf gestoppt bei "${stoppedAt.titel}" (${stoppedAt.error}). ${created} Buchung(en) wurden vorher bereits erfolgreich gespeichert und bleiben bestehen. Führe den Lauf erneut aus, um die restlichen Positionen nachzuholen.`, "error");
    } else {
      showToast(created > 0
        ? `Monatslauf: ${created} Buchung(en) angelegt${skipped ? `, ${skipped} übersprungen (bereits gebucht)` : ""}.`
        : `Monatslauf: keine neuen Buchungen (${skipped} bereits vorhanden). "Erzwingen" aktivieren, um erneut zu buchen.`,
        created > 0 ? "success" : "error");
    }
  }, [fixedCosts, transactions, forceRun, gasUrl, showToast]);

  const downloadBackup = useCallback(() => {
    const data = { accounts, categories, transactions, fixedCosts, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `finanzindex-export-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast("Datenexport heruntergeladen.");
  }, [accounts, categories, transactions, fixedCosts, showToast]);

  const downloadJahresbericht = useCallback(() => {
    const jahr = new Date().getFullYear();
    const zeilen = [["Monat", "Einnahmen", "Ausgaben", "Netto"]];
    for (let m = 0; m < 12; m++) {
      const mk = `${jahr}-${String(m + 1).padStart(2, "0")}`;
      const monthTx = transactions.filter((t) => monthKey(t.datum) === mk);
      const ein = monthTx.filter((t) => t.typ === "Einnahme").reduce((s, t) => s + Number(t.betrag), 0);
      const aus = monthTx.filter((t) => t.typ === "Ausgabe").reduce((s, t) => s + Number(t.betrag), 0);
      zeilen.push([mk, ein.toFixed(2).replace(".", ","), aus.toFixed(2).replace(".", ","), (ein - aus).toFixed(2).replace(".", ",")]);
    }
    const csv = zeilen.map((r) => r.join(";")).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `jahresbericht-${jahr}.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast(`Jahresbericht ${jahr} heruntergeladen (öffnet sich direkt in Excel/Google Sheets).`);
  }, [transactions, showToast]);

  const toggleTheme = () => {
    setIsLight((prev) => {
      const next = !prev;
      document.documentElement.classList.toggle("light", next);
      try { localStorage.setItem("finanzindex_theme", next ? "light" : "dark"); } catch (e) {}
      return next;
    });
  };

  const applyGasUrl = (url) => {
    setGasUrl(url);
    saveGasUrl(url);
    setSyncStatus(url ? "offline" : "none");
  };

  const applyApiKey = (key) => {
    setApiKey(key);
    try { localStorage.setItem(API_KEY_STORAGE, key); } catch (e) {}
  };

  const tabs = [
    { id: "dashboard", label: "Dashboard", icon: "dashboard", primary: true },
    { id: "buchen", label: "Buchen", icon: "plus", primary: true },
    { id: "assistent", label: "Assistent", icon: "gemini", primary: true },
    { id: "journal", label: "Journal", icon: "list", primary: true },
    { id: "fixkosten", label: "Fixkosten", icon: "repeat" },
    { id: "prognose", label: "Prognose", icon: "trend" },
    { id: "auswertung", label: "Auswertung", icon: "chart" },
    { id: "einstellungen", label: "Einstellungen", icon: "settings" },

  const primaryTabs = tabs.filter((t) => t.primary);
  const secondaryTabs = tabs.filter((t) => !t.primary);
  const [showMoreMenu, setShowMoreMenu] = useState(false);

  if (deviceBlocked) return <BlockedScreen />;
  if (locked) return <LockScreen onUnlock={() => { markUnlocked(); setLocked(false); }} />;
  if (showLockSetup) return <LockSetup onDone={() => { markUnlocked(); setLockConfigured(true); setShowLockSetup(false); }} onCancel={() => setShowLockSetup(false)} />;
  if (confirmRevealBetraege) {
    return (
      <LockScreen
        title="Zum Anzeigen bestätigen"
        onUnlock={() => {
          setBetraegeVersteckt(false);
          try { localStorage.setItem(BETRAEGE_VERSTECKT_KEY, "false"); } catch (e) {}
          setConfirmRevealBetraege(false);
        }}
        onCancel={() => setConfirmRevealBetraege(false)}
      />
    );
  }

  return (
    <div className="min-h-[100dvh] w-full bg-zinc-950 text-zinc-100">
      <header className="sticky top-0 z-30 flex items-center justify-between border-b border-zinc-800 bg-zinc-950/95 px-4 py-3 backdrop-blur md:px-6">
        <div className="flex items-center gap-2.5">
          <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500/15 text-emerald-400"><Icon name="wallet" size={18} /></div>
          <div className="relative">
            <h1 className="text-[15px] font-semibold leading-tight text-zinc-100">Finanzindex</h1>
            {geraete !== null ? (
              <button onClick={() => setShowGeraetePopup((v) => !v)} className="flex items-center gap-1 text-[10.5px] leading-tight text-zinc-500 hover:text-zinc-300">
                <span className="inline-block h-1.5 w-1.5 rounded-full bg-emerald-400" />
                <span className="underline decoration-dotted underline-offset-2">{geraete.filter((g) => g.online).length} {geraete.filter((g) => g.online).length === 1 ? "Gerät" : "Geräte"} online</span>
              </button>
            ) : (
              <p className="hidden text-[11px] leading-tight text-zinc-500 sm:block">Persönliche Finanzverwaltung</p>
            )}
            {showGeraetePopup && geraete !== null && (
              <>
                <div className="fixed inset-0 z-40" onClick={() => setShowGeraetePopup(false)} />
                <div className="absolute left-0 top-full z-50 mt-1.5 w-64 rounded-xl border border-zinc-800 bg-zinc-900 p-1 shadow-xl">
                  {geraete.length === 0 && <p className="px-3 py-2.5 text-xs text-zinc-500">Keine Geräte bekannt.</p>}
                  {geraete.map((g) => (
                    <div key={g.id} className="flex items-center justify-between gap-2 rounded-lg px-2.5 py-2 hover:bg-zinc-800/60">
                      <div className="min-w-0">
                        <p className="truncate text-xs text-zinc-200">
                          {g.name || "Unbenanntes Gerät"}

                          {g.gesperrt && <span className="ml-1.5 text-[10px] text-rose-400">(gesperrt)</span>}
                        </p>
                        <p className="text-[10px] text-zinc-500">{g.online ? "gerade eben" : g.zuletztGesehen ? "zuletzt " + dateDE(new Date(g.zuletztGesehen).toISOString()) : ""}</p>
                      </div>
                      {!g.gesperrt && g.id !== getDeviceId() && (
                        <button onClick={() => sperreGeraetClient(g.id)} className="shrink-0 rounded-lg border border-zinc-700 px-2 py-1 text-[10.5px] text-zinc-400 hover:border-rose-500/40 hover:text-rose-400">Sperren</button>
                      )}
                    </div>

                </div>
              </>
            )}
          </div>
        </div>
        <div className="flex items-center gap-2">
          {queueCount > 0 && (
            <button

            >

            </button>
          )}
          <SyncIndicator status={syncStatus} lastSync={lastSync} onClick={() => syncFromRemote(false).then(() => processQueue())} />
          <button onClick={toggleTheme} title={isLight ? "Dunkles Design" : "Helles Design"} className="flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 bg-zinc-800/60 text-zinc-300 hover:border-zinc-600">

          </button>
          <nav className="hidden items-center gap-1 rounded-xl border border-zinc-800 bg-zinc-900/60 p-1 lg:flex">
            {tabs.map((t) => (

                <Icon name={t.icon} size={15} />{t.label}

        </div>
      </header>

      <main className="mx-auto max-w-6xl overflow-x-hidden px-4 pb-28 pt-5 md:px-6 lg:pb-10">
        {!gasUrl && (
