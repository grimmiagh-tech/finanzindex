            Es ist noch keine Google-Apps-Script-URL hinterlegt. Die App speichert vorerst nur lokal in diesem Browser. Trage die URL unter „Einstellungen" ein, um mit deinem Google Sheet zu synchronisieren.
          </div>
        )}

        {activeTab === "dashboard" && (
          <Dashboard accounts={accounts} balances={balances} realAccounts={realAccounts} virtualAccounts={virtualAccounts}
            ingBalance={ingBalance} trFrei={trFrei} trGesamt={trGesamt} gebundenesBudget={gebundenesBudget} gesamtvermoegen={gesamtvermoegen}
            monatEinnahmen={monatEinnahmen} monatAusgaben={monatAusgaben} transactions={transactions} potAllocations={potAllocations} onGoBuchen={handleGoBuchen} isLight={isLight}
            betraegeVersteckt={betraegeVersteckt} onHideBetraege={hideBetraege} onRequestRevealBetraege={requestRevealBetraege} />
        )}
        {activeTab === "buchen" && (
          <BuchungsForm accounts={accounts} categories={categories} transactions={transactions} onSubmit={(f) => handleAddOrUpdate(f, false)} submitting={syncStatus === "syncing"} />
        )}
        {activeTab === "assistent" && (
          <AiAssistent messages={aiMessages} loading={aiLoading} onSend={sendAiMessage} onBuchen={handleVorschlagBuchen} onVerwerfen={handleVorschlagVerwerfen}
            vorlesen={aiVorlesen} onToggleVorlesen={toggleAiVorlesen} voiceName={aiVoiceName} onVoiceChange={handleAiVoiceChange} />
        )}
        {activeTab === "journal" && (
          <Journal transactions={transactions} accounts={accounts} categories={categories} filter={journalFilter} setFilter={setJournalFilter}
            showFilters={showFilters} setShowFilters={setShowFilters} onEdit={handleEditTx} onDelete={handleDeleteTxRequest} isLight={isLight} />
        )}
        {activeTab === "fixkosten" && (
          <Fixkosten fixedCosts={fixedCosts} onSaveFixkosten={handleFixkostenSave} onDeleteFixkosten={handleFixkostenDelete} categories={categories} accounts={accounts}
            forceRun={forceRun} setForceRun={setForceRun} onRun={runMonthlyBooking} lastRunInfo={lastRunInfo} showToast={showToast} />
        )}
        {activeTab === "prognose" && (
          <Prognose accounts={accounts} balances={balances} fixedCosts={fixedCosts} einstellungen={einstellungen} transactions={transactions} />
        )}
        {activeTab === "auswertung" && (
          <Auswertung transactions={transactions} accounts={accounts} categories={categories} ingBalance={ingBalance} trGesamt={trGesamt} kontoauszuege={kontoauszuege} fixedCosts={fixedCosts} />
        )}
        {activeTab === "einstellungen" && (
          <Einstellungen gasUrl={gasUrl} apiKey={apiKey} onApplyGasUrl={applyGasUrl} onApplyApiKey={applyApiKey} onDownloadBackup={downloadBackup} onDownloadJahresbericht={downloadJahresbericht} onManualSync={() => syncFromRemote(false).then(() => processQueue())} queueCount={queueCount}
            lockConfigured={lockConfigured} onSetupLock={() => setShowLockSetup(true)} isLight={isLight}
            onDisableLock={() => { localStorage.removeItem(LOCK_PIN_HASH_KEY); localStorage.removeItem(LOCK_PIN_SALT_KEY); localStorage.removeItem(LOCK_WEBAUTHN_KEY); setLockConfigured(false); }} />
        )}
      </main>

      <nav className="fixed inset-x-0 bottom-0 z-30 flex items-center justify-around border-t border-zinc-800 bg-zinc-950/95 px-1 py-1.5 backdrop-blur lg:hidden">
        {primaryTabs.map((t) => (
          t.id === "assistent" ? (
            <button key={t.id} onClick={() => setActiveTab(t.id)} aria-label="Assistent" className="flex flex-1 flex-col items-center justify-center gap-0.5 rounded-lg py-1.5">
              <Icon name="gemini" size={22} />
            </button>
          ) : (
            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-1 flex-col items-center gap-0.5 rounded-lg py-1.5 text-[10.5px] ${activeTab === t.id ? "text-emerald-400" : "text-zinc-500"}`}>
              <Icon name={t.icon} size={19} />{t.label}
            </button>
          )
        ))}
        <button onClick={() => setShowMoreMenu(true)} className={`flex flex-1 flex-col items-center gap-0.5 rounded-lg py-1.5 text-[10.5px] ${secondaryTabs.some((t) => t.id === activeTab) ? "text-emerald-400" : "text-zinc-500"}`}>
          <Icon name="more" size={19} />Mehr
        </button>
      </nav>

      {showMoreMenu && (
        <div className="fixed inset-0 z-40 flex items-end bg-black/60 backdrop-blur-sm lg:hidden" onClick={() => setShowMoreMenu(false)}>
          <div className="w-full rounded-t-2xl border-t border-zinc-800 bg-zinc-950 p-3 pb-6" onClick={(e) => e.stopPropagation()}>
            <div className="mx-auto mb-3 h-1 w-10 rounded-full bg-zinc-700" />
            {secondaryTabs.map((t) => (
              <button key={t.id} onClick={() => { setActiveTab(t.id); setShowMoreMenu(false); }} className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm ${activeTab === t.id ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-300 hover:bg-zinc-800/50"}`}>
                <Icon name={t.icon} size={18} />{t.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {editingTx && <EditModal tx={editingTx} accounts={accounts} categories={categories} transactions={transactions} onClose={() => setEditingTx(null)} onSave={(f) => handleAddOrUpdate(f, true)} />}
      {confirmDeleteId && <ConfirmModal title="Buchung löschen?" message="Diese Aktion entfernt die Buchung endgültig im Sheet und berechnet alle Salden neu." onCancel={() => setConfirmDeleteId(null)} onConfirm={() => handleDelete(confirmDeleteId)} />}
      <Toast toast={toast} onClose={() => setToast(null)} />
    </div>
  );
}

const ToepfeKarussell = memo(function ToepfeKarussell({ virtualAccounts, balances, potAllocations }) {
  const scrollRef = useRef(null);
  const [seite, setSeite] = useState(0);

  const ausgaberest = virtualAccounts.find((a) => a.name === "Ausgaberest");
  const karussellToepfe = virtualAccounts.filter((a) => a.name !== "Ausgaberest");
  const seiten = [];
  for (let i = 0; i < karussellToepfe.length; i += 3) seiten.push(karussellToepfe.slice(i, i + 3));

  const budgetrestSumme = POTS_BUDGETREST.reduce((s, name) => s + (balances[name] || 0), 0);
  const aktuellerMonatsname = MONATSNAMEN_VOLL[new Date().getMonth()];

  const handleScroll = () => {
    const el = scrollRef.current;
    if (!el) return;
    const idx = Math.round(el.scrollLeft / el.clientWidth);
    setSeite(idx);
  };

  return (
    <div className="min-w-0 space-y-3">
      {seiten.length > 0 && (
        <>
          <div ref={scrollRef} onScroll={handleScroll} className="flex min-w-0 snap-x snap-mandatory gap-3 overflow-x-auto pb-1" style={{ scrollbarWidth: "none" }}>
            {seiten.map((gruppe, i) => (
              <div key={i} className="karussell-seite flex w-full shrink-0 snap-center flex-col gap-2 rounded-2xl border border-cyan-500/20 p-2.5">
                {gruppe.map((a) => {
                  const val = balances[a.name] || 0;
                  const hatStartbetrag = !POTS_OHNE_STARTBETRAG.includes(a.name) && (potAllocations[a.name] || 0) > 0;
                  return <PotRow key={a.id} a={a} val={val} hatStartbetrag={hatStartbetrag} startbetrag={potAllocations[a.name] || 0} />;
                })}
              </div>
            ))}
          </div>
          {seiten.length > 1 && (
            <div className="flex justify-center gap-1.5">
              {seiten.map((_, i) => (
                <span key={i} className={`h-1.5 w-1.5 rounded-full ${i === seite ? "bg-emerald-400" : "bg-zinc-700"}`} />
              ))}
            </div>
          )}
        </>
      )}
      {ausgaberest && (
        <PotRow a={ausgaberest} val={balances["Ausgaberest"] || 0} hatStartbetrag={false} startbetrag={0} />
      )}
      <div className="flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
        <div className="flex items-center gap-2.5">
          <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-600"><Icon name="coinstack" size={20} className="text-white" /></div>
          <span className="text-sm text-zinc-300">Budgetrest ({aktuellerMonatsname})</span>
        </div>
        <span className={`text-sm font-medium tabular-nums ${amountColor(budgetrestSumme)}`}>{eur(budgetrestSumme)}</span>
      </div>
    </div>
  );
});

// memo aus demselben Grund wie bei Journal (siehe dort) - alle Props
// kommen mittlerweile aus useMemo/useCallback und bleiben zwischen
// reinen Sync-Ticks (z.B. "Geräte online") unverändert.
const Dashboard = memo(function Dashboard({ accounts, balances, realAccounts, virtualAccounts, ingBalance, trFrei, trGesamt, gebundenesBudget, gesamtvermoegen, monatEinnahmen, monatAusgaben, transactions, potAllocations, onGoBuchen, isLight, betraegeVersteckt, onHideBetraege, onRequestRevealBetraege }) {
  const recent = transactions.slice(0, 4);
  const heute = new Date();
  const istMonatsende = heute.getDate() >= new Date(heute.getFullYear(), heute.getMonth() + 1, 0).getDate() - 2;
  const aufgebrauchteToepfe = virtualAccounts.filter((a) => {
    if (POTS_OHNE_STARTBETRAG.includes(a.name)) return false;
    if (!(potAllocations[a.name] > 0)) return false;
    return (balances[a.name] || 0) <= 0;
  });
  return (

/* ============================== Buchungsformular ============================== */

function emptyForm() { return { id: null, datum: todayISO(), titel: "", kategorie: "", typ: "Ausgabe", betrag: "", quelle: "", ziel: "", notiz: "" }; }

function BuchungsForm({ accounts, categories, transactions, onSubmit, submitting, initial, onCancel }) {
  const [form, setForm] = useState(initial || emptyForm());
  const [errors, setErrors] = useState({});
  const [showSuggestions, setShowSuggestions] = useState(false);
  const accountOptions = accounts.map((a) => a.name);
  const catOptions = categories.filter((c) => c.typ === form.typ || form.typ === "Umbuchung");

  // Für jeden bisher verwendeten Titel (passend zum aktuell gewählten Typ)
  // die zuletzt genutzte Buchung merken, um Kategorie/Quelle/Ziel beim
  // Auswählen eines Vorschlags automatisch mit übernehmen zu können.
  const titelVorschlaege = useMemo(() => {
    if (!transactions) return [];
    const map = new Map();
    transactions.forEach((t) => {
      if (t.typ !== form.typ || !t.titel) return;
      if (!map.has(t.titel)) map.set(t.titel, t); // Journal ist neueste zuerst sortiert
    });
    return Array.from(map.values());
  }, [transactions, form.typ]);

  const gefilterteVorschlaege = form.titel.trim()
    ? titelVorschlaege.filter((t) => t.titel.toLowerCase().includes(form.titel.toLowerCase()) && t.titel.toLowerCase() !== form.titel.toLowerCase()).slice(0, 5)
    : [];

  const vorschlagWaehlen = (t) => {
    setForm((f) => ({ ...f, titel: t.titel, kategorie: t.kategorie || f.kategorie, quelle: t.quelle || f.quelle, ziel: t.ziel || f.ziel }));
    setShowSuggestions(false);
  };

  const validate = () => {
    const e = {};
    if (!form.titel.trim()) e.titel = "Titel erforderlich";
    if (!form.betrag || Number(form.betrag) <= 0) e.betrag = "Gültigen Betrag angeben";
    if (!form.quelle) e.quelle = form.typ === "Einnahme" ? "Herkunft angeben" : "Quelle wählen";
    if (form.typ !== "Ausgabe" && !form.ziel) e.ziel = "Ziel wählen";
    if (form.typ === "Ausgabe" && !form.kategorie) e.kategorie = "Kategorie wählen";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    onSubmit({ ...form, betrag: Number(form.betrag) });
    if (!initial) setForm(emptyForm());
  };
  const setTyp = (typ) => setForm((f) => ({ ...f, typ, kategorie: "", quelle: "", ziel: "" }));

  return (
    <form onSubmit={handleSubmit} className="mx-auto max-w-xl space-y-5">
      {!initial && <h2 className="text-base font-semibold text-zinc-200">Neue Buchung</h2>}
      <div className="grid grid-cols-3 gap-2">
        {["Ausgabe", "Einnahme", "Umbuchung"].map((typ) => {
          const active = form.typ === typ;
          const colors = { Ausgabe: "border-rose-500/50 bg-rose-500/10 text-rose-300", Einnahme: "border-emerald-500/50 bg-emerald-500/10 text-emerald-300", Umbuchung: "border-cyan-500/50 bg-cyan-500/10 text-cyan-300" };
          return <button key={typ} type="button" onClick={() => setTyp(typ)} className={`rounded-xl border px-3 py-2.5 text-sm font-medium transition-colors ${active ? colors[typ] : "border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200"}`}>{typ}</button>;
        })}
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Datum"><input type="date" className={inputCls} value={form.datum} onChange={(e) => setForm((f) => ({ ...f, datum: e.target.value }))} /></Field>
        <Field label="Betrag (€)">
          <input type="number" step="0.01" min="0" placeholder="0,00" className={inputCls} value={form.betrag} onChange={(e) => setForm((f) => ({ ...f, betrag: e.target.value }))} />
          {errors.betrag && <p className="mt-1 text-xs text-rose-400">{errors.betrag}</p>}
        </Field>
      </div>
      <Field label="Titel">
        <div className="relative">
          <input
            type="text"
            placeholder="z. B. Wocheneinkauf Rewe"
            className={inputCls}
            value={form.titel}
            onChange={(e) => { setForm((f) => ({ ...f, titel: e.target.value })); setShowSuggestions(true); }}
            onFocus={() => setShowSuggestions(true)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
            autoComplete="off"
          />
          {showSuggestions && gefilterteVorschlaege.length > 0 && (
            <div className="absolute z-20 mt-1 w-full overflow-hidden rounded-lg border border-zinc-700 bg-zinc-800 shadow-lg">
              {gefilterteVorschlaege.map((t) => (
                <button
                  key={t.titel}
                  type="button"
                  onMouseDown={() => vorschlagWaehlen(t)}
                  className="flex w-full items-center justify-between px-3 py-2 text-left text-sm text-zinc-200 hover:bg-zinc-700"
                >
                  <span className="truncate">{t.titel}</span>
                  <span className="ml-2 shrink-0 text-[11px] text-zinc-500">{t.kategorie}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        {errors.titel && <p className="mt-1 text-xs text-rose-400">{errors.titel}</p>}
      </Field>
      {form.typ !== "Umbuchung" && (
        <Field label="Kategorie">
          <select className={inputCls} value={form.kategorie} onChange={(e) => setForm((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="">Kategorie wählen</option>
            {catOptions.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          {errors.kategorie && <p className="mt-1 text-xs text-rose-400">{errors.kategorie}</p>}
        </Field>
      )}
      <div className="grid grid-cols-2 gap-3">
        <Field label={form.typ === "Einnahme" ? "Herkunft" : "Quelle"}>
          {form.typ === "Einnahme" ? (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Wählen</option><option value="arbeitgeber">Arbeitgeber</option><option value="extern">Extern</option>
              {accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          ) : (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Konto wählen</option>{accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          )}
          {errors.quelle && <p className="mt-1 text-xs text-rose-400">{errors.quelle}</p>}
        </Field>
        {form.typ !== "Ausgabe" && (
          <Field label="Ziel">
            <select className={inputCls} value={form.ziel} onChange={(e) => setForm((f) => ({ ...f, ziel: e.target.value }))}>
              <option value="">Konto wählen</option>
              {accountOptions.filter((n) => n !== form.quelle).map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            {errors.ziel && <p className="mt-1 text-xs text-rose-400">{errors.ziel}</p>}
          </Field>
        )}
      </div>
      <Field label="Notiz (optional)"><textarea rows={2} className={inputCls} value={form.notiz} onChange={(e) => setForm((f) => ({ ...f, notiz: e.target.value }))} placeholder="Zusätzliche Details" /></Field>
      <div className="flex items-center gap-2 pt-1">
        <button type="submit" disabled={submitting} className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-emerald-500 disabled:opacity-60">
          {submitting && <Icon name="loader" size={15} className="animate-spin" />}{initial ? "Änderungen speichern" : "Buchung speichern"}
        </button>
        {onCancel && <button type="button" onClick={onCancel} className="rounded-xl border border-zinc-700 px-4 py-2.5 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>}
      </div>
    </form>
  );
}

/* ============================== Journal ============================== */

// memo: transactions/accounts/categories/filter ändern sich nur bei
// echten Datenänderungen, nicht bei jedem Sync-Tick (z.B. "Geräte
// online") - onEdit/onDelete kommen als stabile useCallback-Referenzen
// von App, damit der Vergleich hier tatsächlich greift.
const Journal = memo(function Journal({ transactions, accounts, categories, filter, setFilter, showFilters, setShowFilters, onEdit, onDelete, isLight }) {
  const [detailTx, setDetailTx] = useState(null);
  const months = Array.from(new Set(transactions.map((t) => monthKey(t.datum)))).sort().reverse();
  const filtered = transactions.filter((t) => {
    if (filter.monat !== "alle" && monthKey(t.datum) !== filter.monat) return false;
    if (filter.konto !== "alle" && t.quelle !== filter.konto && t.ziel !== filter.konto) return false;
    if (filter.kategorie !== "alle" && t.kategorie !== filter.kategorie) return false;
    if (filter.typ !== "alle" && t.typ !== filter.typ) return false;
    return true;
  });
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Journal</h2>
        <button onClick={() => setShowFilters((s) => !s)} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">
          <Icon name="filter" size={13} /> Filter <Icon name="chevron" size={13} className={showFilters ? "rotate-180 transition-transform" : "transition-transform"} />
        </button>
      </div>
      {showFilters && (
        <div className="grid grid-cols-2 gap-2.5 rounded-xl border border-zinc-800 bg-zinc-900/50 p-3 md:grid-cols-4">
          <select className={inputCls} value={filter.monat} onChange={(e) => setFilter((f) => ({ ...f, monat: e.target.value }))}>
            <option value="alle">Alle Monate</option>{months.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
          <select className={inputCls} value={filter.konto} onChange={(e) => setFilter((f) => ({ ...f, konto: e.target.value }))}>
            <option value="alle">Alle Konten</option>{accounts.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
          <select className={inputCls} value={filter.kategorie} onChange={(e) => setFilter((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="alle">Alle Kategorien</option>{categories.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          <select className={inputCls} value={filter.typ} onChange={(e) => setFilter((f) => ({ ...f, typ: e.target.value }))}>
            <option value="alle">Alle Typen</option><option value="Ausgabe">Ausgabe</option><option value="Einnahme">Einnahme</option><option value="Umbuchung">Umbuchung</option>
          </select>
        </div>
      )}
      <div className="space-y-2">
        {filtered.map((t) => (
          <div key={t.id} onClick={() => setDetailTx(t)} className="flex cursor-pointer items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-3 hover:border-zinc-700 hover:bg-zinc-900">
            <div className="flex min-w-0 flex-1 items-center gap-2.5">
              <MerchantIcon titel={t.titel} isLight={isLight} quelle={t.quelle} ziel={t.ziel} />
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2"><p className="truncate text-sm font-medium text-zinc-200">{t.titel}</p><TypBadge typ={t.typ} /></div>
                <p className="mt-1 truncate text-[11.5px] text-zinc-500">{dateDE(t.datum)} · {t.kategorie} · {t.typ === "Ausgabe" ? t.quelle : `${t.quelle} → ${t.ziel}`}{t.notiz ? ` · ${t.notiz}` : ""}</p>
              </div>
            </div>
            <p className={`shrink-0 text-sm font-semibold tabular-nums ${t.typ === "Einnahme" ? "text-emerald-400" : t.typ === "Ausgabe" ? "text-rose-400" : "text-cyan-400"}`}>
              {t.typ === "Ausgabe" ? "-" : t.typ === "Einnahme" ? "+" : "↔"} {eur(t.betrag)}
            </p>
            <div className="flex shrink-0 items-center gap-1">
              <button onClick={(e) => { e.stopPropagation(); onEdit(t); }} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200"><Icon name="pencil" size={15} /></button>
              <button onClick={(e) => { e.stopPropagation(); onDelete(t.id); }} className="rounded-lg p-1.5 text-zinc-400 hover:bg-rose-500/10 hover:text-rose-400"><Icon name="trash" size={15} /></button>
            </div>
          </div>
        ))}
        {filtered.length === 0 && <p className="py-10 text-center text-sm text-zinc-500">Keine Buchungen für diese Filter gefunden.</p>}
      </div>
      {detailTx && (
        <DetailModal
          title={detailTx.titel}
          betrag={detailTx.betrag}
          typ={detailTx.typ}
          fields={[
            ["Datum", dateDE(detailTx.datum)],
            ["Kategorie", detailTx.kategorie],
            [detailTx.typ === "Ausgabe" ? "Konto" : "Von → Nach", detailTx.typ === "Ausgabe" ? detailTx.quelle : `${detailTx.quelle} → ${detailTx.ziel}`],
            ["Notiz", detailTx.notiz],
          ]}
          onClose={() => setDetailTx(null)}
          onEdit={() => { setDetailTx(null); onEdit(detailTx); }}
          onDelete={() => { setDetailTx(null); onDelete(detailTx.id); }}
        />
      )}
    </div>
  );
});

function EditModal({ tx, accounts, categories, transactions, onClose, onSave }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm md:items-center">
      <div className="max-h-[90dvh] w-full max-w-xl overflow-y-auto rounded-t-2xl border border-zinc-800 bg-zinc-950 p-5 md:rounded-2xl">
        <div className="mb-4 flex items-center justify-between"><h3 className="text-base font-semibold text-zinc-200">Buchung bearbeiten</h3><button onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800"><Icon name="x" size={18} /></button></div>
        <BuchungsForm accounts={accounts} categories={categories} transactions={transactions} initial={tx} onSubmit={onSave} onCancel={onClose} />

}

        <p className="mb-5 text-sm text-zinc-400">{message}</p>
        <div className="flex gap-2">
          <button onClick={onConfirm} className="flex-1 rounded-xl bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-500">Löschen</button>
          <button onClick={onCancel} className="flex-1 rounded-xl border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>
        </div>
      </div>
    </div>

}

// Zeigt alle Infos zu einer Buchung/Fixkosten-Position übersichtlich an,
// bevor darüber entschieden wird, ob bearbeitet oder gelöscht werden soll -
// nutzt bewusst die schon vorhandenen Bearbeiten-/Löschen-Wege weiter
// (EditModal bzw. FixkostenForm, ConfirmModal), statt sie zu verdoppeln.
function DetailModal({ title, betrag, typ, fields, onClose, onEdit, onDelete }) {
  const farbe = typ === "Einnahme" ? "text-emerald-400" : typ === "Ausgabe" ? "text-rose-400" : "text-cyan-400";
  const vorzeichen = typ === "Ausgabe" ? "- " : typ === "Einnahme" ? "+ " : "↔ ";
  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm md:items-center">
      <div className="w-full max-w-md rounded-t-2xl border border-zinc-800 bg-zinc-950 p-5 md:rounded-2xl">
        <div className="mb-4 flex items-start justify-between gap-3">
          <h3 className="text-base font-semibold text-zinc-200">{title}</h3>
          <button onClick={onClose} className="shrink-0 rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800"><Icon name="x" size={18} /></button>
        </div>
        <div className="mb-5 text-center">
          <p className={`text-2xl font-bold tabular-nums ${farbe}`}>{vorzeichen}{eur(betrag)}</p>
          <p className="mt-1 text-xs text-zinc-500">{typ}</p>
        </div>
        <div className="border-t border-zinc-800">
          {fields.filter(([, v]) => v).map(([k, v]) => (
            <div key={k} className="flex items-start justify-between gap-3 border-b border-zinc-800 py-2.5 text-sm">
              <span className="shrink-0 text-zinc-500">{k}</span>
              <span className="text-right text-zinc-200">{v}</span>
            </div>
          ))}
        </div>
        <div className="mt-5 flex gap-2">

function AiAssistent({ messages, loading, onSend, onBuchen, onVerwerfen, vorlesen, onToggleVorlesen, voiceName, onVoiceChange }) {
  const [input, setInput] = useState("");
  const [listening, setListening] = useState(false);
  const [deutscheStimmen, setDeutscheStimmen] = useState([]);
  const recognitionRef = useRef(null);
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
  }, [messages, loading]);

  // Browser laden die Liste der verfügbaren Stimmen teils erst asynchron
  // nach - direkt beim Öffnen des Tabs ist getVoices() oft noch leer, daher
  // zusätzlich auf "voiceschanged" hören.
  useEffect(() => {
    if (!("speechSynthesis" in window)) return;
    const ladeStimmen = () => {
      setDeutscheStimmen(window.speechSynthesis.getVoices().filter((v) => v.lang && v.lang.toLowerCase().startsWith("de")));
    };
    ladeStimmen();
    window.speechSynthesis.addEventListener("voiceschanged", ladeStimmen);
    return () => window.speechSynthesis.removeEventListener("voiceschanged", ladeStimmen);
  }, []);

  const stimmeTesten = () => {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("Hallo, so klingt diese Stimme.");
    u.lang = "de-DE";
    const stimme = waehleDeutscheStimme(window.speechSynthesis.getVoices(), voiceName);
    if (stimme) u.voice = stimme;
    window.speechSynthesis.speak(u);
  };

  // Nur in Chrome/Chromium-Browsern zuverlässig verfügbar - andere Browser
  // zeigen dann einfach keinen funktionierenden Mikrofon-Knopf, Tippen geht
  // aber immer.
  const speechSupported = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  const startListening = () => {
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionCtor) return;
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = "de-DE";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      onSend(transcript);
    };
    recognition.onend = () => setListening(false);
    recognition.onerror = () => setListening(false);
    recognitionRef.current = recognition;
    setListening(true);
    recognition.start();
  };

  const stopListening = () => {
    recognitionRef.current?.stop();
    setListening(false);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!input.trim()) return;
    onSend(input);
    setInput("");
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Assistent</h2>
        <label className="flex items-center gap-1.5 text-[11px] text-zinc-500">
          <input type="checkbox" checked={vorlesen} onChange={onToggleVorlesen} className="h-3.5 w-3.5 accent-emerald-500" />
          Antworten vorlesen
        </label>
      </div>
      {vorlesen && deutscheStimmen.length > 0 && (
        <div className="-mt-2 flex items-center gap-2">
          <select value={voiceName} onChange={(e) => onVoiceChange(e.target.value)} className="min-w-0 flex-grow rounded-lg border border-zinc-700 bg-zinc-800/70 px-2.5 py-1.5 text-[12px] text-zinc-200">
            <option value="">Automatisch (beste verfügbare)</option>
            {deutscheStimmen.map((v) => (
              <option key={v.name} value={v.name}>{v.name}{v.localService ? "" : " (Netzwerk)"}</option>
            ))}
          </select>
          <button type="button" onClick={stimmeTesten} className="shrink-0 rounded-lg border border-zinc-700 px-2.5 py-1.5 text-[12px] text-zinc-400">Testen</button>
        </div>
      )}
      <p className="-mt-2 text-[11.5px] text-zinc-500">Frag mich etwas zu deinen Finanzen oder ganz allgemein, oder buche per Text/Sprache - jede Buchung zeige ich dir erst als Vorschlag zur Bestätigung.</p>

      <div className="space-y-2.5">
        {messages.length === 0 && (
          <p className="rounded-2xl border border-zinc-800 bg-zinc-900/40 p-4 text-center text-sm text-zinc-500">Noch keine Unterhaltung – frag einfach los.</p>
        )}
        {messages.map((m) => (
          <div key={m.id} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
            <div
              className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 text-[13.5px] leading-relaxed ${
                m.role === "user"
                  ? "rounded-br-sm border border-emerald-500/30 bg-emerald-500/10 text-emerald-50"
                  : m.isError
                  ? "rounded-bl-sm border border-rose-500/30 bg-rose-500/10 text-rose-200"
                  : "rounded-bl-sm border border-zinc-800 bg-zinc-900/70 text-zinc-200"
              }`}
            >
              {m.text}
              {m.buchungsvorschlag && (
                <div className="mt-2.5 space-y-2 rounded-xl border border-zinc-800 bg-zinc-950/60 p-2.5">
                  <p className="text-[11px] text-zinc-500">
                    {m.vorschlagStatus === "gebucht" ? "Gebucht:" : m.vorschlagStatus === "verworfen" ? "Verworfen:" : "Vorschlag – bitte prüfen:"}
                  </p>
                  <div className="space-y-1 text-[12.5px]">
                    <div className="flex justify-between">
                      <span className="text-zinc-500">{m.buchungsvorschlag.typ}</span>
                      <span className={`font-semibold ${m.buchungsvorschlag.typ === "Ausgabe" ? "text-rose-300" : "text-emerald-300"}`}>{eur(Number(m.buchungsvorschlag.betrag) || 0)}</span>
                    </div>
                    <div className="flex justify-between"><span className="text-zinc-500">Titel</span><span className="text-zinc-200">{m.buchungsvorschlag.titel}</span></div>
                    <div className="flex justify-between"><span className="text-zinc-500">Kategorie</span><span className="text-zinc-200">{m.buchungsvorschlag.kategorie}</span></div>
                    <div className="flex justify-between"><span className="text-zinc-500">Konto</span><span className="text-zinc-200">{m.buchungsvorschlag.quelle}{m.buchungsvorschlag.ziel ? " → " + m.buchungsvorschlag.ziel : ""}</span></div>
                  </div>
                  {!m.vorschlagStatus && (
                    <div className="flex gap-2 pt-0.5">
                      <button onClick={() => onBuchen(m.id, m.buchungsvorschlag)} className="flex-1 rounded-lg bg-emerald-500 py-1.5 text-[12.5px] font-semibold text-emerald-950">Buchen</button>
                      <button onClick={() => onVerwerfen(m.id)} className="flex-1 rounded-lg border border-zinc-700 py-1.5 text-[12.5px] text-zinc-400">Verwerfen</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        ))}
        {loading && (
          <div className="flex justify-start">
            <div className="rounded-2xl rounded-bl-sm border border-zinc-800 bg-zinc-900/70 px-3.5 py-2.5 text-[13px] text-zinc-500">…denkt nach</div>
          </div>
        )}
      </div>

      <form onSubmit={handleSubmit} className="flex items-center gap-2">
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          placeholder="Frag mich etwas oder buche per Sprache…"
          className="flex-grow rounded-full border border-zinc-700 bg-zinc-800/70 px-4 py-2.5 text-[13.5px] text-zinc-100 outline-none focus:border-emerald-500"
        />
        {speechSupported && (
          <button
            type="button"
            onClick={listening ? stopListening : startListening}
            title={listening ? "Aufnahme beenden" : "Spracheingabe starten"}
            className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${listening ? "animate-pulse bg-rose-500" : "bg-emerald-500"}`}
          >
            <Icon name="mic" size={17} className={listening ? "text-white" : "text-emerald-950"} />
          </button>
        )}
        <button type="submit" disabled={!input.trim()} title="Senden" className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-zinc-700 text-zinc-300 disabled:opacity-40">
          <Icon name="send" size={16} />
        </button>
      </form>
      <div ref={bottomRef} />
    </div>
  );
}

/* ============================== Prognose ============================== */

function Prognose({ accounts, balances, fixedCosts, einstellungen, transactions }) {
  const MONATE_VORAUS = 24;
  const potAllocations = useMemo(() => getMonthlyPotAllocations(fixedCosts), [fixedCosts]);
  const trSchedule = useMemo(() => getRateSchedule(einstellungen, "Trade Republic"), [einstellungen]);

  const verfuegbareToepfe = PROGNOSE_TOEPFE.filter((name) => accounts.some((a) => a.name === name));

  let prognoseFehler = null;
  const reihen = useMemo(() => {
    return verfuegbareToepfe.map((name) => {
      try {
        return { name, daten: simulateForecast(name, accounts, transactions, potAllocations[name] || 0, trSchedule, MONATE_VORAUS) };
      } catch (err) {
        return { name, daten: [], fehler: err.message };
      }
    });
  }, [verfuegbareToepfe.join(","), accounts, transactions, potAllocations, trSchedule]);
  reihen.forEach((r) => { if (r.fehler && !prognoseFehler) prognoseFehler = r.fehler; });

  const rows = !prognoseFehler && reihen[0] ? reihen[0].daten.map((_, i) => {
    const row = { monat: reihen[0].daten[i].monat };
    let zinsGesamt = 0;
    reihen.forEach((r) => {
      row[r.name + "_saldo"] = r.daten[i].saldo;
      row[r.name + "_zins"] = r.daten[i].zinsen;
      zinsGesamt += r.daten[i].zinsen;
    });
    row.zinsGesamt = Math.round(zinsGesamt * 100) / 100;
    return row;
  }) : [];

  const seriesColors = ["#eda100", "#38bdf8", "#1baf7a", "#eb6834"];
  const [ansicht, setAnsicht] = useState(verfuegbareToepfe[0] || "Gesamt");
  const verfuegbareJahre = useMemo(() => Array.from(new Set(rows.map((r) => r.monat.split("/")[1]))), [JSON.stringify(rows)]);
  const [jahr, setJahr] = useState(null);
  const aktivesJahr = jahr || verfuegbareJahre[0];
  const rowsGefiltert = rows.filter((r) => r.monat.split("/")[1] === aktivesJahr);

  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (typeof Chart === "undefined" || !canvasRef.current || rowsGefiltert.length === 0) return;
    if (chartRef.current) chartRef.current.destroy();

    if (ansicht === "Gesamt") {

/* ============================== Auswertung ============================== */

function computeVermoegensverlauf(accounts, transactions) {
  const currentMK = monthKey(todayISO());
  const monthsSet = new Set(transactions.map((t) => monthKey(t.datum)));
  monthsSet.add(currentMK);
  const months = Array.from(monthsSet).filter(Boolean).sort();
  return months.map((mk) => {
    const [y, m] = mk.split("-").map(Number);
    const cutoff = toISO(new Date(y, m, 0));
    const txUpTo = transactions.filter((t) => t.datum <= cutoff);
    const bal = computeBalances(accounts, txUpTo);
    const ing = bal["ING"] || 0;
    const trFrei = bal["Trade Republic"] || 0;
    const pots = accounts.filter((a) => a.typ === "virtuell").reduce((s, a) => s + (bal[a.name] || 0), 0);
    return { monat: mk, gesamt: Math.round((ing + trFrei + pots) * 100) / 100 };
  });
}

function computeKategorienAuswertung(transactions, monatsFilter) {
  const monthTx = transactions.filter((t) => t.typ === "Ausgabe" && (!monatsFilter || monthKey(t.datum) === monatsFilter));
  const map = {};
  monthTx.forEach((t) => { map[t.kategorie || "Sonstiges"] = (map[t.kategorie || "Sonstiges"] || 0) + Number(t.betrag || 0); });
  return Object.entries(map).map(([kategorie, betrag]) => ({ kategorie, betrag: Math.round(betrag * 100) / 100 })).sort((a, b) => b.betrag - a.betrag);
}

// Bewusst weit auseinanderliegende Farbtöne (nicht mehrere Violett-/Rosatöne
// nebeneinander wie zuvor), mittlere Helligkeit/Sättigung, damit jede Farbe
// sowohl auf hellem als auch auf dunklem Hintergrund gut lesbar bleibt.
// Bewährte, gut unterscheidbare Kategorie-Palette (Tableau10-Variante),
// abgestimmt für gute Lesbarkeit sowohl im hellen als auch im dunklen Design.
const KATEGORIE_FARBPALETTE = ["#4e79a7", "#f28e2b", "#59a14f", "#e15759", "#b07aa1", "#76b7b2", "#ff9da7", "#9c755f", "#d4a017", "#8c8681"];
// Feste Farbe pro Kategorie-Name (statt nach Rang), damit dieselbe Kategorie
// über alle Ansichten und Monate hinweg immer dieselbe Farbe hat - Grundlage
// für einen sinnvollen Vergleich im Jahresverlauf. Nur Ausgabe-Kategorien
// werden gezählt, da Einnahme-Kategorien (z. B. "Gehalt") in diesem
// Ausgaben-Diagramm ohnehin nie auftauchen und sonst unnötig eine
// Farb-Position "verbrauchen" würden.
function getKategorieFarbe(name, categories) {
  const ausgabeNamen = categories.filter((c) => c.typ === "Ausgabe").map((c) => c.name);
  const alleNamen = Array.from(new Set([...ausgabeNamen, "Sonstiges"])).sort();
  const index = alleNamen.indexOf(name);
  return KATEGORIE_FARBPALETTE[(index >= 0 ? index : 0) % KATEGORIE_FARBPALETTE.length];
}

// Nur die letzten zwei Kalenderjahre stehen zur Auswahl (aktuelles Jahr und
// ggf. das direkt vorherige, falls dafür Daten existieren) - ältere Jahre
// fallen automatisch aus der Auswahl heraus.
function getVerfuegbareJahre(transactions) {
  const heute = new Date().getFullYear();
  const vorhanden = new Set(transactions.map((t) => Number((t.datum || "").slice(0, 4))).filter((y) => !isNaN(y)));
  return [heute - 1, heute].filter((y) => vorhanden.has(y) || y === heute);
}

const MONATSNAMEN_KURZ = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const MONATSNAMEN_VOLL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
// Dieselben Töpfe, die auch den Ausgaberest speisen - Grundlage für die
// zusätzliche, rein berechnete "Budgetrest"-Anzeige (kein echtes Konto).
const POTS_BUDGETREST = ["Laden", "E-Liquids", "Lebensmittel", "Freizeit", "Kosmetik", "Abo & ETF", "Puffer"];

function computeJahresverlauf(transactions, jahr) {
  const heute = new Date();
  const maxMonat = jahr === heute.getFullYear() ? heute.getMonth() : 11;
  const monate = [];
  for (let m = 0; m <= maxMonat; m++) {
    const mk = `${jahr}-${String(m + 1).padStart(2, "0")}`;
    const monthTx = transactions.filter((t) => t.typ === "Ausgabe" && monthKey(t.datum) === mk);
    const perKategorie = {};
    monthTx.forEach((t) => { const k = t.kategorie || "Sonstiges"; perKategorie[k] = (perKategorie[k] || 0) + Number(t.betrag || 0); });
    monate.push({ label: MONATSNAMEN_KURZ[m], kategorien: perKategorie });
  }
  const alleKategorien = Array.from(new Set(monate.flatMap((m) => Object.keys(m.kategorien))));
  return { monate, kategorien: alleKategorien };
}

function Auswertung({ transactions, accounts, categories, kontoauszuege, fixedCosts }) {
  const [ansicht, setAnsicht] = useState("monat");
  const currentMK = monthKey(todayISO());
  const verfuegbareJahre = useMemo(() => getVerfuegbareJahre(transactions), [transactions]);
  const istJahresansicht = ansicht.startsWith("jahr-");
  const ausgewaehltesJahr = istJahresansicht ? Number(ansicht.split("-")[1]) : null;
  const sparen = useMemo(() => computeMonatlichesSparen(fixedCosts), [fixedCosts]);
  const vorausschau = useMemo(() => computeVorausschau(fixedCosts), [fixedCosts]);
  const topfAuswirkungen = useMemo(() => computeVorausschauTopfAuswirkungen(vorausschau.changes), [vorausschau.changes]);
  const SPAR_FARBEN = ["#34d399", "#10b981", "#059669", "#065f46"];

  const verlauf = useMemo(() => computeVermoegensverlauf(accounts, transactions), [accounts, transactions]);
  const kategorien = useMemo(() => computeKategorienAuswertung(transactions, ansicht === "monat" ? currentMK : null), [transactions, ansicht]);
  const jahresdaten = useMemo(() => (istJahresansicht ? computeJahresverlauf(transactions, ausgewaehltesJahr) : null), [transactions, ansicht]);

  useEffect(() => {

    if (verlaufChart.current) verlaufChart.current.destroy();
    verlaufChart.current = new Chart(verlaufRef.current, {

        datasets: [{ label: "Gesamtvermögen", data: verlauf.map((r) => r.gesamt), borderColor: "#10b981", backgroundColor: "rgba(16,185,129,0.15)", fill: true, tension: 0.3, pointRadius: 3 }],
      },

        responsive: true, maintainAspectRatio: false,

        scales: {
          x: { ticks: { color: "#898781", maxRotation: 45 }, grid: { display: false } },

        },

    });
    return () => { if (verlaufChart.current) verlaufChart.current.destroy(); };
  }, [JSON.stringify(verlauf)]);

  useEffect(() => {

    if (katChart.current) katChart.current.destroy();

        scales: {

          y: { ticks: { color: "#898781" }, grid: { display: false } },
        },

    });

  useEffect(() => {

  useEffect(() => {

    if (sparChartRef.current) sparChartRef.current.destroy();

  return (

        <div className="flex gap-0.5 rounded-lg border border-zinc-800 bg-zinc-900/50 p-1">
          <button onClick={() => setAnsicht("monat")} className={`min-w-0 flex-1 truncate rounded-md px-1 py-1 text-center text-[10px] ${ansicht === "monat" ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400"}`}>laufend</button>

            <p className="text-[11.5px] text-zinc-400">Monatliches Sparen gesamt</p>
            <p className="mt-1 text-3xl font-semibold text-emerald-400">{eur(sparen.summe)}</p>
            <p className="mt-1.5 text-[12.5px] leading-relaxed text-zinc-400">So viel legst du dir jeden Monat bewusst für die Zukunft zur Seite – ganz gleich, ob als Rücklage, für die nächste größere Anschaffung oder für Ausgaben, die erst einmal im Jahr fällig werden.</p>
            <p className="mt-1.5 text-[11.5px] text-zinc-500">Aus deinem aktuellen Fixkosten-Plan – ändert sich automatisch, sobald du dort Beträge anpasst.</p>
          </div>

          <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-2">
            {sparen.posten.length === 0 && <p className="p-3 text-sm text-zinc-500">Keine aktiven Sparraten im Fixkosten-Plan gefunden.</p>}
            {sparen.posten.map((p, i) => (
              <div key={p.bezeichnung + p.ziel} className="flex items-center justify-between rounded-xl px-3 py-2.5">
                <span className="flex items-center gap-2 text-sm text-zinc-300">
                  <span className="h-2.5 w-2.5 rounded-sm" style={{ backgroundColor: SPAR_FARBEN[i % SPAR_FARBEN.length] }} />
                  {p.bezeichnung}
                  {p.verbrauchssparen && <span className="text-[10.5px] text-zinc-500">(Verbrauchssparen)</span>}
                </span>
                <span className="text-sm text-zinc-200">{eur(p.betrag)}</span>
              </div>
            ))}
            {sparen.posten.length > 0 && (
              <div className="mt-1 flex items-center justify-between rounded-xl border-t border-zinc-800 px-3 py-2.5">
                <span className="text-sm font-medium text-zinc-100">Summe</span>
                <span className="text-sm font-semibold text-emerald-400">{eur(sparen.summe)}</span>
              </div>
            )}
          </div>

          {sparen.posten.length > 0 && (
            <div className="relative w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4" style={{ height: Math.max(220, sparen.posten.length * 46 + 40) }}>
              <canvas ref={sparRef} />
            </div>
          )}
        </>
      ) : ansicht === "vorausschau" ? (
        <>
          <p className="-mt-2 text-[12.5px] text-zinc-500">Basierend auf "Gültig ab/bis" im Fixkosten-Plan – so entwickelt sich dein Fixkosten-Block, wenn bereits hinterlegte Preisänderungen greifen.</p>
          <div className="grid grid-cols-3 gap-2.5">
            {vorausschau.monate.map((m, i) => {
              const diff = i === 0 ? 0 : m.ausgaben - vorausschau.monate[i - 1].ausgaben;
              return (
                <div key={m.label} className={`rounded-2xl border p-3 text-center ${i === 0 ? "border-emerald-500/30 bg-emerald-500/5" : "border-zinc-800 bg-zinc-900/50"}`}>
                  <p className="text-[11px] text-zinc-500">{m.label}</p>
                  <p className="mt-1 text-base font-bold tabular-nums text-zinc-100">{eur(m.ausgaben)}</p>
                  <p className={`mt-0.5 text-[10.5px] ${i === 0 ? "text-zinc-500" : diff > 0 ? "text-rose-400" : diff < 0 ? "text-emerald-400" : "text-zinc-500"}`}>
                    {i === 0 ? "aktuell" : `${diff > 0 ? "+" : diff < 0 ? "" : "±"}${eur(diff)}`}
                  </p>
                </div>
              );
            })}
          </div>

          <div className="relative h-48 w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
            <canvas ref={vorausschauRef} />
          </div>

          <div>
            <h3 className="mb-2 text-sm font-semibold text-zinc-200">Änderungen im Zeitraum</h3>
            {vorausschau.changes.length === 0 ? (
              <p className="text-sm text-zinc-500">Keine Änderungen in den kommenden Monaten hinterlegt.</p>
            ) : (
              <div className="space-y-2">
                {vorausschau.changes.map((c, i) => (
                  <div key={i} className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-2.5">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2"><p className="truncate text-sm text-zinc-200">{c.bezeichnung}</p><TypBadge typ={c.typ} /></div>
                      <p className="mt-0.5 text-[11px] text-zinc-500">ab {c.abMonat}{c.nach === null ? " · entfällt" : c.von === null ? " · neu" : ""}</p>
                      {vorausschauBeeinflusstPuffer(c) && (
                        <p className="mt-0.5 text-[11px] text-zinc-500">
                          Puffer ab {c.abMonat}: <span className={`font-medium tabular-nums ${c.pufferAbMonat < 0 ? "text-rose-400" : "text-zinc-300"}`}>{eur(c.pufferAbMonat)}</span>
                        </p>
                      )}
                    </div>
                    <p className={`shrink-0 text-sm font-medium tabular-nums ${vorausschauIstSchlechter(c) ? "text-rose-400" : "text-emerald-400"}`}>
                      {c.von !== null && c.nach !== null ? `${eur(c.von)} → ${eur(c.nach)}` : c.nach === null ? "entfällt" : `neu: ${eur(c.nach)}`}
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div>
            <h3 className="mb-2 text-sm font-semibold text-zinc-200">Gehaltsverteilung im Zeitverlauf</h3>
            <div className="space-y-2">
              {vorausschau.monate.map((m, i) => {
                const vorM = i > 0 ? vorausschau.monate[i - 1] : null;
                const diffING = vorM ? m.aufING - vorM.aufING : 0;
                const diffTR = vorM ? m.aufTR - vorM.aufTR : 0;
                const diffPuffer = vorM ? m.puffer - vorM.puffer : 0;
                return (
                  <div key={m.label} className="rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-2.5">
                    <p className="mb-1.5 text-[11px] font-medium uppercase tracking-wide text-zinc-500">{m.label}</p>
                    <div className="flex items-center justify-between text-sm">
                      <span className="text-zinc-300">Gehalt</span>
                      <span className="font-medium tabular-nums text-zinc-200">{eur(m.gehalt)}</span>
                    </div>
                    <div className="mt-1 flex items-center justify-between text-sm">
                      <span className="text-zinc-300">Auf ING behalten</span>
                      <span className="font-medium tabular-nums text-amber-300">
                        {eur(m.aufING)}{Math.abs(diffING) > 0.004 && <span className="text-zinc-500"> ({diffING > 0 ? "+" : ""}{eur(diffING)})</span>}
                      </span>
                    </div>
                    <div className="mt-1 flex items-center justify-between text-sm">
                      <span className="text-zinc-300">Auf Trade Republic überweisen</span>
                      <span className="font-medium tabular-nums text-cyan-300">
                        {eur(m.aufTR)}{Math.abs(diffTR) > 0.004 && <span className="text-zinc-500"> ({diffTR > 0 ? "+" : ""}{eur(diffTR)})</span>}
                      </span>
                    </div>
                    <div className="mt-1.5 flex items-center justify-between border-t border-zinc-800 pt-1.5 text-sm">
                      <span className="font-medium text-zinc-200">davon Puffer</span>
                      <span className={`font-semibold tabular-nums ${m.puffer < 0 ? "text-rose-400" : "text-emerald-400"}`}>
                        {eur(m.puffer)}{Math.abs(diffPuffer) > 0.004 && <span className={diffPuffer > 0 ? "text-emerald-400" : "text-rose-400"}> ({diffPuffer > 0 ? "+" : ""}{eur(diffPuffer)})</span>}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {topfAuswirkungen.length > 0 && (
            <div>
              <h3 className="mb-2 text-sm font-semibold text-zinc-200">Auswirkung auf deine Töpfe</h3>
              <p className="mb-2 -mt-1 text-[11.5px] text-zinc-500">Zusätzlich zur Gehaltsverteilung oben: Änderungen, die direkt aus einem Topf bezahlt werden (nicht über ING), wirken sich hier auf dessen monatlich übrige Summe aus.</p>
              <div className="space-y-2">
                {topfAuswirkungen.map((t) => (
                  <div key={t.topf} className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-2.5">
                    <span className="flex items-center gap-2 text-sm text-zinc-300">
                      <span className="h-2.5 w-2.5 rounded-sm" style={{ backgroundColor: ACCOUNT_COLOR(t.topf) }} />
                      {t.topf}
                    </span>
                    <span className={`text-sm font-medium tabular-nums ${t.wirkung < 0 ? "text-rose-400" : "text-emerald-400"}`}>
                      {t.wirkung > 0 ? "+" : ""}{eur(t.wirkung)} / Monat
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      ) : istJahresansicht ? (
        <>
          {jahresdaten && jahresdaten.kategorien.length > 0 && (
            <div className="flex flex-wrap gap-3 text-[11.5px] text-zinc-400">
              {jahresdaten.kategorien.map((kat) => (
                <span key={kat} className="flex items-center gap-1.5">
                  <span className="h-2.5 w-2.5 rounded-sm" style={{ backgroundColor: getKategorieFarbe(kat, categories) }} />
                  {kat}
                </span>
              ))}
            </div>
          )}
          <div className="relative h-72 w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
            {jahresdaten && jahresdaten.kategorien.length > 0 ? <canvas ref={jahrRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Keine Ausgaben für {ausgewaehltesJahr} vorhanden.</p>}
          </div>
        </>
      ) : (
        <div className="relative rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4" style={{ height: Math.max(220, kategorien.length * 34 + 40) }}>
          {kategorien.length > 0 ? <canvas ref={katRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Keine Ausgaben in diesem Zeitraum.</p>}
        </div>
      )}

      <h2 className="text-base font-semibold text-zinc-200">Kontoauszüge</h2>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-2">
        {(kontoauszuege || []).length === 0 && (
          <p className="p-3 text-sm text-zinc-500">Noch keine Kontoauszüge vorhanden – der erste entsteht automatisch beim nächsten Monatswechsel.</p>
        )}
        {(kontoauszuege || []).map((k) => (
          <a key={k.url} href={k.url} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between rounded-xl px-3 py-2.5 text-sm text-zinc-300 hover:bg-zinc-800/50">
            <span className="flex items-center gap-2"><Icon name="download" size={14} className="text-zinc-500" />{k.name.replace(".pdf", "")}</span>
            <Icon name="chevron" size={14} className="-rotate-90 text-zinc-500" />
          </a>
        ))}
      </div>
    </div>
  );
}

/* ============================== Einstellungen ============================== */

function Einstellungen({ gasUrl, apiKey, onApplyGasUrl, onApplyApiKey, onDownloadBackup, onDownloadJahresbericht, onManualSync, queueCount, lockConfigured, onSetupLock, onDisableLock, isLight }) {
  const [value, setValue] = useState(gasUrl);
  const [keyValue, setKeyValue] = useState(apiKey);
  const [deviceName, setDeviceName] = useState(getDeviceName());
  const [showSecrets, setShowSecrets] = useState(false);
  const [confirmReveal, setConfirmReveal] = useState(false);
  const secretType = showSecrets ? "text" : "password";

  const handleToggleSecrets = () => {
    if (showSecrets) { setShowSecrets(false); return; }
    if (lockConfigured) setConfirmReveal(true);
    else setShowSecrets(true); // keine Sperre auf diesem Gerät eingerichtet - nichts zum Bestätigen
  };

  if (confirmReveal) {
    return (
      <LockScreen
        title="Zum Anzeigen bestätigen"
        onUnlock={() => { setShowSecrets(true); setConfirmReveal(false); }}
        onCancel={() => setConfirmReveal(false)}
      />
    );
  }

  return (
    <div className="mx-auto max-w-xl space-y-5">
      <h2 className="text-base font-semibold text-zinc-200">Einstellungen</h2>
      {queueCount > 0 && (
        <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 px-4 py-2.5 text-[12.5px] text-amber-200">
          {queueCount} Buchung(en) konnten noch nicht synchronisiert werden und warten lokal auf diesem Gerät. Sie werden automatisch nachgeholt, sobald wieder eine Verbindung besteht – oder klicke unten auf "Jetzt synchronisieren".
        </div>
      )}
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-3 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Verbindung</p>
          <button onClick={handleToggleSecrets} className="flex items-center gap-1 text-[11px] text-zinc-500 hover:text-zinc-300">
            <Icon name={showSecrets ? "eyeOff" : "eye"} size={13} />{showSecrets ? "Verbergen" : "Anzeigen"}
          </button>
        </div>
        <Field label="Google Apps Script Web-App URL">
          <input type={secretType} autoComplete="off" className={inputCls} placeholder="https://script.google.com/macros/s/…/exec" value={value} onChange={(e) => setValue(e.target.value)} />
        </Field>
        <div className="mt-3">
          <Field label="API-Schlüssel">
            <input type={secretType} autoComplete="off" className={inputCls} placeholder="im Apps Script bei API_SECRET eingetragener Wert" value={keyValue} onChange={(e) => setKeyValue(e.target.value)} />
          </Field>
        </div>
        <div className="mt-3 flex gap-2">
          <button onClick={() => { onApplyGasUrl(value.trim()); onApplyApiKey(keyValue.trim()); }} className="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500">Speichern & verbinden</button>
          <button onClick={onManualSync} className="rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">Jetzt synchronisieren</button>
        </div>
        <p className="mt-2 text-[11.5px] text-zinc-500">Beide Werte werden nur lokal in diesem Browser gespeichert und bei jeder Anfrage an dein Apps-Script-Backend mitgeschickt. Ohne passenden API-Schlüssel antwortet das Skript auf keine Anfrage.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="mb-3 text-sm font-medium text-zinc-200">Gerätename</p>
        <Field label="Wie soll dieses Gerät in der Geräte-Liste heißen?">
          <input className={inputCls} placeholder="z. B. Mi 13, Mi Pad 7 Pro, PC" value={deviceName} onChange={(e) => setDeviceName(e.target.value)} />
        </Field>
        <button onClick={() => saveDeviceName(deviceName.trim())} className="mt-3 rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500">Speichern</button>
        <p className="mt-2 text-[11.5px] text-zinc-500">Erscheint im Kopfbereich beim Antippen von "X Geräte online", damit du deine eigenen Geräte wiedererkennst.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Datenexport</p>
          <button onClick={onDownloadBackup} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> Herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Lädt Konten, Kategorien, Transaktionen und Fixkosten als JSON-Datei herunter.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Jahresbericht</p>
          <button onClick={onDownloadJahresbericht} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> CSV herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Monatliche Einnahmen, Ausgaben und Netto für das laufende Jahr als CSV-Datei – öffnet sich direkt in Excel, Numbers oder Google Sheets.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="text-sm font-medium text-zinc-200">Automatisches Backup</p>
        <p className="mt-1 text-[11.5px] text-zinc-500">Läuft serverseitig über Google Apps Script (Funktion "backupErstellen"), unabhängig davon, ob diese App-Seite gerade geöffnet ist. Legt monatlich automatisch eine datierte Kopie deines gesamten Google Sheets in Google Drive ab. Einrichtung: siehe Kommentar am Anfang der Apps-Script-Datei.</p>
      </div>
      <a href="faq.html" className="flex items-center justify-between rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4 hover:border-zinc-700">
        <div>
          <p className="text-sm font-medium text-zinc-200">FAQ &amp; technischer Überblick</p>
          <p className="mt-1 text-[11.5px] text-zinc-500">Buchungslogik, Automatisierung, Backup und Aufbau der App zum Nachlesen.</p>
        </div>
        <Icon name="chevron" size={16} className="shrink-0 -rotate-90 text-zinc-500" />
      </a>
      {isTouchDevice() && (
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
          <p className="text-sm font-medium text-zinc-200">Sicherheitssperre (Fingerabdruck/PIN)</p>
          <p className="mt-1 text-[11.5px] text-zinc-500">
            {lockConfigured
              ? "Aktiv auf diesem Gerät. Sperrt beim Start und nach 3 Minuten im Hintergrund."
              : "Schützt die App auf diesem Gerät vor fremdem Zugriff. Auf dem PC nicht nötig, da dort nicht angeboten."}
          </p>
          <div className="mt-3 flex gap-2">
            {lockConfigured ? (
              <>
                <button onClick={onSetupLock} className="rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:border-zinc-600">PIN ändern</button>
                <button onClick={onDisableLock} className="rounded-lg border border-rose-500/30 px-3 py-1.5 text-xs text-rose-400 hover:bg-rose-500/10">Deaktivieren</button>
              </>
            ) : (
              <button onClick={onSetupLock} className="rounded-lg bg-emerald-500 px-3 py-1.5 text-xs font-medium text-emerald-950">Einrichten</button>
            )}
          </div>
        </div>
      )}
      <div className="pt-2 text-center">
        <p className="text-sm font-semibold text-zinc-200">Finanzindex</p>
        <p className="mt-0.5 text-[11px] font-medium tracking-wide text-zinc-600">Version {APP_VERSION}</p>
        <div className="mx-auto my-3.5 h-px w-full max-w-[240px] bg-zinc-800" />
        <p className="text-[11px] text-zinc-500">Konzeption &amp; Design:</p>
        <img src={isLight ? LOGO_AGH_SCHWARZ : LOGO_AGH_GOLD} alt="A.G.-H." className="mx-auto my-2 h-9 w-auto" />
        <p className="text-[11px] text-zinc-500">Technische Umsetzung: <span className="text-zinc-400">Claude (Anthropic)</span></p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
