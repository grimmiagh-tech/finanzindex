        <p className="text-[12.5px] font-semibold text-zinc-400">Kontoauszug nachtragen</p>
        <p className="mt-1 text-[11px] text-zinc-500">Normale monatliche Tilgung läuft automatisch. Nur nötig für Gebühren, Sondertilgungen, die Ablösung selbst oder Korrekturen gegenüber dem Kontoauszug.</p>
        <form onSubmit={handleBuchungSubmit} className="mt-2.5 space-y-2.5">
          <div className="flex gap-2">
            <input type="date" value={neueBuchung.datum} onChange={(e) => setNeueBuchung((p) => ({ ...p, datum: e.target.value }))}
              className="flex-1 rounded-lg border border-zinc-700 bg-zinc-800/70 px-2.5 py-2 text-[12.5px] text-zinc-200" />
            <select value={neueBuchung.typ} onChange={(e) => {
              const typ = e.target.value;
              setNeueBuchung((p) => ({ ...p, typ, restschuldNach: typ === "Sondertilgung" ? berechneRestschuldSondertilgung(p.betrag) : p.restschuldNach }));
            }} className="flex-1 rounded-lg border border-zinc-700 bg-zinc-800/70 px-2.5 py-2 text-[12.5px] text-zinc-200">
              <option>Zinsbelastung</option>
              <option>Tilgung</option>
              <option>Gebühr</option>
              <option>Sondertilgung</option>
              <option>Ablösung</option>
            </select>
          </div>
          <input type="number" step="0.01" placeholder="Betrag (€)" value={neueBuchung.betrag} onChange={(e) => {
            const betrag = e.target.value;
            setNeueBuchung((p) => ({ ...p, betrag, restschuldNach: p.typ === "Sondertilgung" ? berechneRestschuldSondertilgung(betrag) : p.restschuldNach }));
          }} className="w-full rounded-lg border border-zinc-700 bg-zinc-800/70 px-2.5 py-2 text-[12.5px] text-zinc-200" />
          <input type="number" step="0.01" placeholder="Restschuld danach (€)" value={neueBuchung.restschuldNach} onChange={(e) => setNeueBuchung((p) => ({ ...p, restschuldNach: e.target.value }))}
            className="w-full rounded-lg border border-zinc-700 bg-zinc-800/70 px-2.5 py-2 text-[12.5px] text-zinc-200" />
          {neueBuchung.typ === "Sondertilgung" && (
            <p className="px-0.5 text-[10px] text-zinc-600">Restschuld danach wird automatisch berechnet (aktuelle Restschuld minus Betrag) - bei Bedarf überschreibbar.</p>
          )}
          <input type="text" placeholder="Notiz (optional)" value={neueBuchung.notiz} onChange={(e) => setNeueBuchung((p) => ({ ...p, notiz: e.target.value }))}
            className="w-full rounded-lg border border-zinc-700 bg-zinc-800/70 px-2.5 py-2 text-[12.5px] text-zinc-200" />
          <button type="submit" className="w-full rounded-lg bg-emerald-500 py-2 text-[12.5px] font-semibold text-emerald-950">Buchung speichern</button>
        </form>

        {kreditBuchungen.length > 0 && (
          <div className="mt-3 space-y-1">
            {[...kreditBuchungen].reverse().slice(0, 5).map((b) => (
              <div key={b.id} className="flex items-center justify-between rounded-lg px-2 py-1.5 text-[11.5px] text-zinc-400 hover:bg-zinc-800/40">
                <span>{dateDE(b.datum)} · {b.typ} · {eur(b.betrag)} → Restschuld {eur(b.restschuldNach)}</span>
                <button type="button" onClick={() => onDeleteBuchung(b.id)} className="text-zinc-600 hover:text-rose-400"><Icon name="trash" size={13} /></button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="text-[12.5px] font-semibold text-zinc-400">Checkliste Ablösung</p>
        <div className="mt-2.5 space-y-1.5">
          {checkliste.map((c) => (
            <label key={c.item} className="flex items-start gap-2.5 text-[12.5px] text-zinc-300">
              <input type="checkbox" checked={c.erledigt} onChange={(e) => onToggleChecklisteItem(c.item, e.target.checked)}
                className="mt-0.5 h-4 w-4 shrink-0 accent-emerald-500" />
              <span className={c.erledigt ? "text-zinc-600 line-through" : ""}>{c.item}</span>
            </label>
          ))}
        </div>
      </div>
      </>
      )}

      {pendingStrategie && (
        <ConfirmModal
          title="Strategie wechseln?"
          message={`Aktive Strategie wird auf "${AUTOKREDIT_SZENARIO_DEFS.find((d) => d.key === pendingStrategie).label}" gesetzt. Bucht nichts automatisch - reine Anzeige-Einstellung, jederzeit wieder änderbar.`}
          confirmLabel="Wechseln"
          tone="neutral"
          onCancel={() => setPendingStrategie(null)}
          onConfirm={() => { onWaehleStrategie(pendingStrategie); setPendingStrategie(null); }}
        />
      )}
    </div>
  );
}

/* ============================== Einstellungen ============================== */

function Einstellungen({ supabaseUrl, supabaseAnonKey, onApplySupabaseUrl, onApplySupabaseAnonKey, onDownloadBackup, onDownloadJahresbericht, onManualSync, queueCount, lockConfigured, onSetupLock, onDisableLock, isLight }) {
  const [supaUrlValue, setSupaUrlValue] = useState(supabaseUrl);
  const [supaKeyValue, setSupaKeyValue] = useState(supabaseAnonKey);
  const [deviceName, setDeviceName] = useState(getDeviceName());
  const [showSecrets, setShowSecrets] = useState(false);
  const [confirmReveal, setConfirmReveal] = useState(false);
  const secretType = showSecrets ? "text" : "password";

  const handleToggleSecrets = () => {
    if (showSecrets) { setShowSecrets(false); return; }
    if (lockConfigured) setConfirmReveal(true);
    else setShowSecrets(true); // keine Sperre auf diesem Gerät eingerichtet - nichts zum Bestätigen
  };

  if (confirmReveal) {
    return (
      <LockScreen
        title="Zum Anzeigen bestätigen"
        onUnlock={() => { setShowSecrets(true); setConfirmReveal(false); }}
        onCancel={() => setConfirmReveal(false)}
      />
    );
  }

  return (
    <div className="mx-auto max-w-xl space-y-5">
      <h2 className="text-base font-semibold text-zinc-200">Einstellungen</h2>
      {queueCount > 0 && (
        <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 px-4 py-2.5 text-[12.5px] text-amber-200">
          {queueCount} Buchung(en) konnten noch nicht synchronisiert werden und warten lokal auf diesem Gerät. Sie werden automatisch nachgeholt, sobald wieder eine Verbindung besteht – oder klicke unten auf "Jetzt synchronisieren".
        </div>
      )}
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-3 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Verbindung (Supabase – Buchungen, Konten, Kategorien, Fixkosten)</p>
          <button onClick={handleToggleSecrets} className="flex items-center gap-1 text-[11px] text-zinc-500 hover:text-zinc-300">
            <Icon name={showSecrets ? "eyeOff" : "eye"} size={13} />{showSecrets ? "Verbergen" : "Anzeigen"}
          </button>
        </div>
        <Field label="Supabase-Projekt-URL">
          <input type={secretType} autoComplete="off" className={inputCls} placeholder="https://xxxxxxxx.supabase.co" value={supaUrlValue} onChange={(e) => setSupaUrlValue(e.target.value)} />
        </Field>
        <div className="mt-3">
          <Field label="Supabase anon key">
            <input type={secretType} autoComplete="off" className={inputCls} placeholder="öffentlicher API-Schlüssel aus den Supabase-Projekteinstellungen" value={supaKeyValue} onChange={(e) => setSupaKeyValue(e.target.value)} />
          </Field>
        </div>
        <div className="mt-3 flex gap-2">
          <button onClick={() => { onApplySupabaseUrl(supaUrlValue.trim()); onApplySupabaseAnonKey(supaKeyValue.trim()); }} className="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500">Speichern & verbinden</button>
          <button onClick={onManualSync} className="rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">Jetzt synchronisieren</button>
        </div>
        <p className="mt-2 text-[11.5px] text-zinc-500">Beide Werte werden nur lokal in diesem Browser gespeichert und bei jeder Anfrage an Supabase mitgeschickt.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="mb-3 text-sm font-medium text-zinc-200">Gerätename</p>
        <Field label="Wie soll dieses Gerät in der Geräte-Liste heißen?">
          <input className={inputCls} placeholder="z. B. Mi 13, Mi Pad 7 Pro, PC" value={deviceName} onChange={(e) => setDeviceName(e.target.value)} />
        </Field>
        <button onClick={() => saveDeviceName(deviceName.trim())} className="mt-3 rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500">Speichern</button>
        <p className="mt-2 text-[11.5px] text-zinc-500">Erscheint im Kopfbereich beim Antippen von "X Geräte online", damit du deine eigenen Geräte wiedererkennst.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Datenexport</p>
          <button onClick={onDownloadBackup} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> Herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Lädt Konten, Kategorien, Transaktionen und Fixkosten als JSON-Datei herunter.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Jahresbericht</p>
          <button onClick={onDownloadJahresbericht} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> CSV herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Monatliche Einnahmen, Ausgaben und Netto für das laufende Jahr als CSV-Datei – öffnet sich direkt in Excel, Numbers oder Google Sheets.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="text-sm font-medium text-zinc-200">Automatischer Monatswechsel</p>
        <p className="mt-1 text-[11.5px] text-zinc-500">Läuft serverseitig über eine Supabase Cloud-Funktion, unabhängig davon, ob diese App-Seite gerade geöffnet ist. Am 1. jeden Monats: Ausgaberest-Ausgleich, PDF-Kontoauszug, neue Fixkosten/Besoldung und eine Sicherung – jeweils mit Bestätigungs-E-Mail.</p>
      </div>
      <a href="faq.html" className="flex items-center justify-between rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4 hover:border-zinc-700">
        <div>
          <p className="text-sm font-medium text-zinc-200">FAQ &amp; technischer Überblick</p>
          <p className="mt-1 text-[11.5px] text-zinc-500">Buchungslogik, Automatisierung, Backup und Aufbau der App zum Nachlesen.</p>
        </div>
        <Icon name="chevron" size={16} className="shrink-0 -rotate-90 text-zinc-500" />
      </a>
      {isTouchDevice() && (
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
          <p className="text-sm font-medium text-zinc-200">Sicherheitssperre (Fingerabdruck/PIN)</p>
          <p className="mt-1 text-[11.5px] text-zinc-500">
            {lockConfigured
              ? "Aktiv auf diesem Gerät. Sperrt beim Start und nach 3 Minuten im Hintergrund."
              : "Schützt die App auf diesem Gerät vor fremdem Zugriff. Auf dem PC nicht nötig, da dort nicht angeboten."}
          </p>
          <div className="mt-3 flex gap-2">
            {lockConfigured ? (
              <>
                <button onClick={onSetupLock} className="rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:border-zinc-600">PIN ändern</button>
                <button onClick={onDisableLock} className="rounded-lg border border-rose-500/30 px-3 py-1.5 text-xs text-rose-400 hover:bg-rose-500/10">Deaktivieren</button>
              </>
            ) : (
              <button onClick={onSetupLock} className="rounded-lg bg-emerald-500 px-3 py-1.5 text-xs font-medium text-emerald-950">Einrichten</button>
            )}
          </div>
        </div>
      )}
      <div className="pt-2 text-center">
        <p className="text-sm font-semibold text-zinc-200">Finanzindex</p>
        <p className="mt-0.5 text-[11px] font-medium tracking-wide text-zinc-600">Version {APP_VERSION}</p>
        <div className="mx-auto my-3.5 h-px w-full max-w-[240px] bg-zinc-800" />
        <p className="text-[11px] text-zinc-500">Konzeption &amp; Design:</p>
        <img src={isLight ? LOGO_AGH_SCHWARZ : LOGO_AGH_GOLD} alt="agh originals" className="mx-auto my-2 h-9 w-auto" />
        <p className="text-[11px] text-zinc-500">Technische Umsetzung: <span className="text-zinc-400">Claude (Anthropic)</span></p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
