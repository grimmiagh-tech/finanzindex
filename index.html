/* ============================== Assistent-Kopf ==============================
 * Kopf+Schulter-Ausschnitt des Strichmännchens für den Assistent-Startknopf
 * (Navigation) und das gesamte Chatfenster - "wartend" wird hier über Mimik
 * (Blinzeln, Augenbrauen, Lächeln) statt über Körperhaltung gezeigt, da nur
 * der Kopf sichtbar ist. Zustände:
 * - idle: wartet - neigt sich sanft, blinzelt, wechselt zw. neutral/Lächeln
 * - hoert: nimmt per Mikrofon auf - Kopf lauschend geneigt, Schallwellen
 * - spricht: liest die Antwort vor - Mund im Sprech-Rhythmus, Ton-Balken
 * - rechnend: die KI denkt nach - nachdenklicher Blick, pulsierende Punkte

  const KOERPER = "#8a8a93";

  if (zustand === "hoert") {

      <>
        <g style={{ transform: "rotate(-6deg)", transformOrigin: "50px 82px" }}>

  } else if (zustand === "spricht") {
    inhalt = (
      <>
        {schultern}{kopf}

        <path d="M53 38 Q58 36 64 38" stroke={AUGE} strokeWidth="1.8" fill="none" strokeLinecap="round"/>

        <g stroke="#10b981" strokeWidth="2" strokeLinecap="round">

          <line className="kopf-ton-linie" x1="94" y1="46" x2="94" y2="39"/>
        </g>
      </>
    );
  } else if (zustand === "rechnend") {
    inhalt = (
      <>
        {schultern}{kopf}

          <circle className="kopf-denk-punkt" cx="94" cy="20" r="2.4"/>
        </g>
      </>
    );
  } else {
    // idle - wartet: neigt sich sanft, blinzelt, wechselt zw. neutral/Lächeln,
    // winkt alle ~16s kurz mit der Hand (siehe kopfWinken-Animation oben).
    inhalt = (
      <g className="kopf-neigen">
        {schultern}
        <g className="kopf-arm-winken">
          <path d="M70 90 Q84 78 83 58" stroke={KOERPER} strokeWidth="7" fill="none" strokeLinecap="round"/>

}

// Wählt eine deutsche Stimme für die Sprachausgabe: eine vom Nutzer explizit
// gewählte (per Name), sonst die vermutlich natürlichste automatisch
// verfügbare. Netzwerk-/Cloud-Stimmen (localService=false) klingen auf
// Android i.d.R. deutlich natürlicher als die kompakte Offline-Standardstimme,
// die sonst automatisch gewählt würde.
function waehleDeutscheStimme(voices, bevorzugterName) {
  const deutsche = (voices || []).filter((v) => v.lang && v.lang.toLowerCase().startsWith("de"));
  if (deutsche.length === 0) return null;
  if (bevorzugterName) {
    const gewaehlte = deutsche.find((v) => v.name === bevorzugterName);
    if (gewaehlte) return gewaehlte;
  }
  const netzwerk = deutsche.filter((v) => !v.localService);
  return netzwerk[0] || deutsche[0];
}

function relativeTime(ts) {
  if (!ts) return "";
  const diffSec = Math.floor((Date.now() - ts) / 1000);
  if (diffSec < 10) return "gerade eben";
  if (diffSec < 60) return `vor ${diffSec}s`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `vor ${diffMin} Min`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `vor ${diffHr} Std`;
  return `vor ${Math.floor(diffHr / 24)} Tg`;
}

// Eigener Tick nur für diese kleine Anzeige (statt einen Tick auf App-Ebene
// zu forcieren) - damit lässt die "vor X Min"-Angabe nur sich selbst neu
// rendern, nicht den kompletten restlichen Baum, alle 15s, dauerhaft.
function useRelativeTimeTick(aktiv) {
  const [, tick] = useState(0);
  useEffect(() => {
    if (!aktiv) return;
    const t = setInterval(() => tick((n) => n + 1), 15000);
    return () => clearInterval(t);
  }, [aktiv]);
}
function SyncIndicator({ status, lastSync, onClick }) {
  useRelativeTimeTick(status === "connected" && !!lastSync);
  const conf = {
    connected: { icon: "wifi", cls: "text-emerald-400", text: lastSync ? relativeTime(lastSync) : "Verbunden", title: "Zuletzt erfolgreich synchronisiert" },
    syncing: { icon: "loader", cls: "text-amber-400 animate-spin", text: "läuft…", title: "Synchronisiere gerade" },
    offline: { icon: "wifiOff", cls: "text-amber-400 animate-pulse", text: "Fehler", title: "Synchronisierung fehlgeschlagen" },
    none: { icon: "wifiOff", cls: "text-zinc-500", text: "getrennt", title: "Keine Google-Apps-Script-URL hinterlegt" },
  }[status];
  return (
    <button onClick={onClick} title={conf.title} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 bg-zinc-800/60 px-2 py-1 text-xs text-zinc-300 hover:border-zinc-600">
      <Icon name={conf.icon} size={14} className={conf.cls} />
      <span>{conf.text}</span>
    </button>
  );
}

function LockScreen({ onUnlock, onCancel, title = "Finanzindex ist gesperrt" }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const [tried, setTried] = useState(false);
  const hasWebauthn = !!localStorage.getItem(LOCK_WEBAUTHN_KEY);

  const tryWebauthn = useCallback(async () => {
    try {
      await webauthnVerify(localStorage.getItem(LOCK_WEBAUTHN_KEY));
      onUnlock();
    } catch (e) { setTried(true); }
  }, [onUnlock]);

  useEffect(() => { if (hasWebauthn) tryWebauthn(); }, []);

  const checkPin = async (value) => {
    const salt = localStorage.getItem(LOCK_PIN_SALT_KEY);
    const stored = localStorage.getItem(LOCK_PIN_HASH_KEY);
    const hash = await hashPin(value, salt);
    if (hash === stored) { onUnlock(); }
    else { setError(true); setTimeout(() => { setPin(""); setError(false); }, 500); }
  };

  const onDigit = (d) => {
    if (pin.length >= 4) return;
    const next = pin + d;
    setPin(next);
    if (next.length === 4) checkPin(next);
  };

  return (
    <div className="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-zinc-950 px-6">
      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/15">
        <Icon name="lock" size={28} className="text-emerald-400" />
      </div>
      <p className="text-base font-semibold text-zinc-200">{title}</p>
      {hasWebauthn && (
        <button onClick={tryWebauthn} className="rounded-xl border border-emerald-500/30 bg-emerald-500/15 px-5 py-2.5 text-sm font-medium text-emerald-400">
          Mit Fingerabdruck entsperren
        </button>
      )}
      {tried && hasWebauthn && <p className="text-xs text-amber-300">Fingerabdruck fehlgeschlagen - bitte PIN verwenden.</p>}
      <p className="text-xs text-zinc-500">{hasWebauthn ? "oder PIN eingeben" : "PIN eingeben"}</p>
      <PinDots value={pin} error={error} />
      <Numpad onDigit={onDigit} onDelete={() => setPin((p) => p.slice(0, -1))} />
      {onCancel && <button onClick={onCancel} className="text-xs text-zinc-600">Abbrechen</button>}
    </div>
  );
}

function LockSetup({ onDone, onCancel }) {
  const [step, setStep] = useState("pin1"); // pin1 -> pin2 -> webauthn -> done
  const [pin1, setPin1] = useState("");
  const [pin2, setPin2] = useState("");
  const [error, setError] = useState(false);
  const [webauthnStatus, setWebauthnStatus] = useState(null);

  const onDigit = (d) => {
    if (step === "pin1") {
      if (pin1.length >= 4) return;
      const next = pin1 + d;
      setPin1(next);
      if (next.length === 4) setStep("pin2");
    } else if (step === "pin2") {
      if (pin2.length >= 4) return;
      const next = pin2 + d;
      setPin2(next);
      if (next.length === 4) {
        if (next === pin1) {
          (async () => {
            const salt = randomHex(16);
            const hash = await hashPin(pin1, salt);
            localStorage.setItem(LOCK_PIN_SALT_KEY, salt);
            localStorage.setItem(LOCK_PIN_HASH_KEY, hash);
            setStep("webauthn");
          })();
        } else {
          setError(true);
          setTimeout(() => { setPin1(""); setPin2(""); setError(false); setStep("pin1"); }, 600);
        }
      }
    }
  };
  const onDelete = () => {
    if (step === "pin1") setPin1((p) => p.slice(0, -1));
    else setPin2((p) => p.slice(0, -1));
  };

  const setupWebauthn = async () => {
    try {
      const id = await webauthnRegister();
      localStorage.setItem(LOCK_WEBAUTHN_KEY, id);
      setWebauthnStatus("ok");
    } catch (e) { setWebauthnStatus("error"); }
  };

  return (
    <div className="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-zinc-950 px-6">
      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/15">
        <Icon name="lock" size={28} className="text-emerald-400" />
      </div>
      {(step === "pin1" || step === "pin2") && (
        <>
          <p className="text-base font-semibold text-zinc-200">Sicherheitssperre einrichten</p>
          <p className="max-w-[240px] text-center text-[12.5px] text-zinc-500">Schützt die App auf diesem Gerät vor fremdem Zugriff.</p>
          <p className="text-xs text-zinc-500">{step === "pin1" ? "4-stelligen PIN festlegen" : "PIN zur Bestätigung erneut eingeben"}</p>
          <PinDots value={step === "pin1" ? pin1 : pin2} error={error} />
          <Numpad onDigit={onDigit} onDelete={onDelete} />
          <button onClick={onCancel} className="text-xs text-zinc-600">Abbrechen</button>
        </>
      )}
      {step === "webauthn" && (
        <>
          <p className="text-base font-semibold text-zinc-200">PIN gespeichert</p>
          <p className="max-w-[240px] text-center text-[12.5px] text-zinc-500">Zusätzlich Fingerabdruck/Gesichtserkennung für schnelleres Entsperren einrichten?</p>
          {webauthnStatus === "ok" && <p className="text-sm text-emerald-400">Eingerichtet.</p>}
          {webauthnStatus === "error" && <p className="text-sm text-amber-300">Fehlgeschlagen oder abgebrochen - PIN funktioniert trotzdem.</p>}
          {webauthnStatus !== "ok" && (
            <button onClick={setupWebauthn} className="rounded-xl bg-emerald-500 px-5 py-2.5 text-sm font-semibold text-emerald-950">Fingerabdruck einrichten</button>
          )}
          <button onClick={onDone} className="mt-2 text-sm text-zinc-400">{webauthnStatus === "ok" ? "Fertig" : "Überspringen"}</button>
        </>
      )}
    </div>
  );
}

function App() {
  const initial = loadLocal();
  const [lockConfigured, setLockConfigured] = useState(() => !!localStorage.getItem(LOCK_PIN_HASH_KEY));
  const [betraegeVersteckt, setBetraegeVersteckt] = useState(() => { try { return localStorage.getItem(BETRAEGE_VERSTECKT_KEY) === "true"; } catch (e) { return false; } });
  const [confirmRevealBetraege, setConfirmRevealBetraege] = useState(false);
  const hideBetraege = () => {
    setBetraegeVersteckt(true);
    try { localStorage.setItem(BETRAEGE_VERSTECKT_KEY, "true"); } catch (e) {}
  };
  const requestRevealBetraege = () => {
    if (lockConfigured) { setConfirmRevealBetraege(true); return; }
    setBetraegeVersteckt(false); // keine Sperre auf diesem Gerät eingerichtet - nichts zum Bestätigen
    try { localStorage.setItem(BETRAEGE_VERSTECKT_KEY, "false"); } catch (e) {}
  };
  const [locked, setLocked] = useState(() => isTouchDevice() && !!localStorage.getItem(LOCK_PIN_HASH_KEY) && !wasRecentlyUnlocked());
  const [showLockSetup, setShowLockSetup] = useState(false);
  const hiddenAtRef = useRef(null);

  useEffect(() => {
    const handleVisibility = () => {
      if (document.visibilityState === "hidden") {
        hiddenAtRef.current = Date.now();
      } else if (document.visibilityState === "visible") {
        if (hiddenAtRef.current && lockConfigured && isTouchDevice()) {
          if (Date.now() - hiddenAtRef.current >= 3 * 60 * 1000) setLocked(true);
          else markUnlocked(); // Zeitstempel auffrischen, solange innerhalb der Karenzzeit zurückgekehrt
        }
        hiddenAtRef.current = null;
      }
    };
    document.addEventListener("visibilitychange", handleVisibility);
    return () => document.removeEventListener("visibilitychange", handleVisibility);
  }, [lockConfigured]);

  const [accounts, setAccounts] = useState(initial?.accounts || []);
  const [categories, setCategories] = useState(initial?.categories || []);
  const [transactions, setTransactions] = useState(initial?.transactions || []);
  const [fixedCosts, setFixedCosts] = useState(initial?.fixedCosts || []);
  const [einstellungen, setEinstellungen] = useState(initial?.einstellungen || []);
  const [kreditBuchungen, setKreditBuchungen] = useState(initial?.autokreditBuchungen || []);
  const [kreditCheckliste, setKreditCheckliste] = useState(initial?.autokreditCheckliste || []);
  const [kreditKonfiguration, setKreditKonfiguration] = useState(initial?.autokreditKonfiguration || null);
  const [kreditPlanVerlauf, setKreditPlanVerlauf] = useState(initial?.autokreditPlanVerlauf || []);
  const [kontoauszuege, setKontoauszuege] = useState(initial?.kontoauszuege || []);
  const [geraete, setGeraete] = useState(null);
  const [deviceBlocked, setDeviceBlocked] = useState(false);
  const [showGeraetePopup, setShowGeraetePopup] = useState(false);
  const [supabaseUrl, setSupabaseUrlState] = useState(loadSupabaseUrl());
  const [supabaseAnonKey, setSupabaseAnonKeyState] = useState(loadSupabaseAnonKey());
  const supabaseReady = !!supabaseUrl && !!supabaseAnonKey;
  const [activeTab, setActiveTab] = useState("dashboard");
  const handleGoBuchen = useCallback(() => setActiveTab("buchen"), []);
  const [syncStatus, setSyncStatus] = useState(supabaseReady ? "offline" : "none");
  const [lastSync, setLastSync] = useState(() => {
    try { const v = localStorage.getItem("finanzindex_last_sync"); return v ? Number(v) : null; } catch (e) { return null; }
  });
  const markSynced = useCallback(() => {
    const now = Date.now();
    setLastSync(now);
    try { localStorage.setItem("finanzindex_last_sync", String(now)); } catch (e) {}
  }, []);
  const [isLight, setIsLight] = useState(() => { try { return localStorage.getItem("finanzindex_theme") === "light"; } catch (e) { return false; } });
  const [toast, setToast] = useState(null);
  const [editingTx, setEditingTx] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  // Erinnerung "Überweisung auf Trade Republic erledigt?" - nur am letzten
  // Bankgeschäftstag des Monats, und nur solange für DIESEN Monat noch nicht
  // mit "Ja, erledigt" bestätigt wurde. "Später erinnern" setzt bewusst kein
  // Merkmal - taucht beim nächsten Öffnen der App also einfach wieder auf.
  const [showTransferPopup, setShowTransferPopup] = useState(false);
  // Das Datum wird HIER, beim Erscheinen des Popups, einmalig festgehalten
  // (nicht erst beim Klick auf "Ja, erledigt" neu bestimmt) - sonst würde ein
  // Klick kurz nach Mitternacht (Popup war schon offen, Tag ist inzwischen
  // umgesprungen) die Buchung auf den falschen Tag UND den falschen
  // Zielmonat (mit falschen Fixkosten-Beträgen) datieren.
  const [transferTag, setTransferTag] = useState(null);
  useEffect(() => {
    if (fixedCosts.length === 0) return;
    const heute = new Date();
    if (!istLetzterBankgeschaeftstagDesMonats(heute)) return;
    const monatSchluessel = heute.getFullYear() + "-" + String(heute.getMonth() + 1).padStart(2, "0");
    let schonBestaetigt = false;
    try { schonBestaetigt = localStorage.getItem("finanzindex_transfer_bestaetigt_" + monatSchluessel) === "true"; } catch (e) {}
    if (!schonBestaetigt) { setTransferTag(heute); setShowTransferPopup(true); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fixedCosts.length > 0]);

  // useCallback statt Inline-Funktion, damit Journal (memo) diese Referenz
  // als unverändert erkennt und nicht bei jedem Sync-Tick neu rendert.
  const handleEditTx = useCallback((tx) => setEditingTx(tx), []);
  const handleDeleteTxRequest = useCallback((id) => setConfirmDeleteId(id), []);
  const [journalFilter, setJournalFilter] = useState({ monat: "alle", konto: "alle", kategorie: "alle", typ: "alle" });
  const [showFilters, setShowFilters] = useState(false);
  const [forceRun, setForceRun] = useState(false);
  const [lastRunInfo, setLastRunInfo] = useState(null);
  const toastTimer = useRef(null);

  // KI-Assistent (Chat, Sprache, Buchungsvorschläge)
  const [aiMessages, setAiMessages] = useState([]);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiVorlesen, setAiVorlesen] = useState(() => {
    try { return localStorage.getItem("finanzindex_ai_vorlesen") === "true"; } catch (e) { return false; }
  });
  const toggleAiVorlesen = useCallback(() => {
    setAiVorlesen((prev) => {
      const next = !prev;
      try { localStorage.setItem("finanzindex_ai_vorlesen", String(next)); } catch (e) {}
      return next;
    });
  }, []);
  const [aiVoiceName, setAiVoiceName] = useState(() => {
    try { return localStorage.getItem("finanzindex_ai_voice") || ""; } catch (e) { return ""; }
  });
  const handleAiVoiceChange = useCallback((name) => {
    setAiVoiceName(name);
    try { localStorage.setItem("finanzindex_ai_voice", name); } catch (e) {}
  }, []);
  // Zählt nur hoch, wenn das Sternsymbol angetippt wird, während der
  // Assistent-Tab schon offen ist - AiAssistent startet dann die
  // Spracherkennung erneut (siehe dortiger Effekt), genau wie beim ersten
  // Öffnen des Tabs. Ohne das würde ein erneutes Antippen nichts auslösen,
  // da der Tab ja schon aktiv ist und sich nicht neu öffnet.
  const [aiMicTrigger, setAiMicTrigger] = useState(0);
  const handleAssistentTap = useCallback(() => {
    if (activeTab === "assistent") setAiMicTrigger((n) => n + 1);
    else setActiveTab("assistent");
  }, [activeTab]);
  // Für den Hasen-Avatar im Assistent-Tab: zeigt an, ob die Sprachausgabe
  // gerade eine Antwort vorliest (siehe Utterance-Events in sendAiMessage).
  const [aiSpeaking, setAiSpeaking] = useState(false);
  const stopAiVorlesen = useCallback(() => {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    setAiSpeaking(false);
  }, []);

  const showToast = useCallback((message, type = "success") => {
    setToast({ message, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 4500);
  }, []);

  // Bestätigung bucht jetzt tatsächlich: die Besoldung (für jede aktive
  // Einnahme-Fixkosten-Position des KOMMENDEN Monats, da das heutige Gehalt
  // ja dessen Fixkosten finanziert) sowie die Trade-Republic-Sammelbuchung,
  // beide datiert auf heute. Vorher frisch mit Supabase abgleichen, damit
  // ein zweites Gerät, das kurz zuvor schon bestätigt hat, nicht zu einer
  // Dublette führt - dieselbe Titel+Monat-Prüfung wie im nächtlichen
  // Automatik-Lauf (siehe monatsautomatik.ts), nur hier clientseitig. Der
  // eigentliche Automatik-Lauf am 1. erkennt beides danach als "schon
  // gebucht" und verteilt nur noch auf die einzelnen Töpfe weiter.
  const [erledigtLaedt, setErledigtLaedt] = useState(false);
  const bestaetigeTransferErledigt = useCallback(async () => {
    setErledigtLaedt(true);
    const heute = transferTag || new Date();
    const monatSchluessel = heute.getFullYear() + "-" + String(heute.getMonth() + 1).padStart(2, "0");
    const heuteISO = toISO(heute);
    const zielMonat = new Date(heute.getFullYear(), heute.getMonth() + 1, 1);
    const zielJahr = zielMonat.getFullYear(), zielMonthIdx = zielMonat.getMonth();

    let currentTx = transactions, currentFixedCosts = fixedCosts;
    if (supabaseReady) {
      try {
        const data = await supaGetAll();
        const mapped = mapRemoteData(data);
        currentTx = mergeWithQueue(mapped.transactions, loadQueue());
        currentFixedCosts = mergeFixkostenWithQueue(mapped.fixedCosts, loadQueue());
        setTransactions(currentTx);
        setFixedCosts(currentFixedCosts);
      } catch (err) {
        setErledigtLaedt(false);
        showToast("Konnte nicht mit Supabase abgleichen (" + err.message + "). Bitte erneut versuchen.", "error");
        return;
      }
    }

    const aktiveZielmonat = getActiveFixedCosts(currentFixedCosts, zielJahr, zielMonthIdx);
    const toBook = [];

    aktiveZielmonat.filter((f) => f.typ === "Einnahme").forEach((f) => {
      const vergleich = String(f.bezeichnung || "").trim().toLowerCase();
      const schonGebucht = currentTx.some((t) => String(t.titel || "").trim().toLowerCase() === vergleich && monthKey(t.datum) === monatSchluessel);
      if (schonGebucht) return;
      toBook.push({
        id: uid(), datum: heuteISO, titel: f.bezeichnung, kategorie: f.kategorie, typ: "Einnahme",
        betrag: Number(f.betrag), quelle: f.quelle, ziel: f.ziel,
        notiz: "Automatisch gebucht nach Bestätigung im Transfer-Popup",
      });
    });

    const TR_TITEL = "Überweisung Trade Republic";
    const trVergleich = TR_TITEL.toLowerCase();
    const trSchonGebucht = currentTx.some((t) => String(t.titel || "").trim().toLowerCase() === trVergleich && monthKey(t.datum) === monatSchluessel);
    const verteilungZielmonat = computeGehaltsverteilungFuerMonat(currentFixedCosts, zielJahr, zielMonthIdx);
    const trBetrag = Math.round(verteilungZielmonat.aufTR * 100) / 100;
    if (!trSchonGebucht && trBetrag > 0.005) {
      toBook.push({
        id: uid(), datum: heuteISO, titel: TR_TITEL, kategorie: "Sparen", typ: "Umbuchung",
        betrag: trBetrag, quelle: "ING", ziel: "Trade Republic",
        notiz: "Automatisch gebucht nach Bestätigung im Transfer-Popup",
      });
    }

    let created = 0, stoppedAt = null;
    for (const tx of toBook) {
      setTransactions((prev) => [tx, ...prev]);
      if (!supabaseReady) { created += 1; continue; }
      setSyncStatus("syncing");
      try {
        await supaWrite("create", tx);
        created += 1;
      } catch (err) {
        setTransactions((prev) => prev.filter((t) => t.id !== tx.id));
        setSyncStatus("offline");
        stoppedAt = { titel: tx.titel, error: err.message };
        break;
      }
    }
    if (supabaseReady && !stoppedAt) { setSyncStatus("connected"); markSynced(); }
    setErledigtLaedt(false);

    if (stoppedAt) {
      showToast(`Buchung gestoppt bei "${stoppedAt.titel}" (${stoppedAt.error}). ${created} Buchung(en) wurden vorher bereits gespeichert.`, "error");
      return;
    }

    try { localStorage.setItem("finanzindex_transfer_bestaetigt_" + monatSchluessel, "true"); } catch (e) {}
    setShowTransferPopup(false);
    showToast(created > 0 ? `Gehalt und Überweisung gebucht (${created} Buchung${created === 1 ? "" : "en"}).` : "War schon gebucht - nichts zu tun.");
  }, [transactions, fixedCosts, supabaseReady, showToast, markSynced, transferTag]);

  // Persistiere jeden Zustand lokal (local-first)
  useEffect(() => {
    saveLocal({ accounts, categories, transactions, fixedCosts });
  }, [accounts, categories, transactions, fixedCosts]);

  // Initialer Sync beim Start, falls Supabase konfiguriert ist
  useEffect(() => {
    if (supabaseReady) { syncFromRemote(true).then(() => processQueue()); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Sobald der Browser erkennt, dass die Verbindung wieder da ist, sofort
  // versuchen zu synchronisieren und die Warteschlange abzuarbeiten - ohne
  // dass dafür ein manueller Klick nötig ist.
  useEffect(() => {
    const handler = () => { if (supabaseReady) syncFromRemote(true).then(() => processQueue()); };
    window.addEventListener("online", handler);
    return () => window.removeEventListener("online", handler);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [supabaseReady]);

  // Zusätzliches Sicherheitsnetz: Solange etwas in der Warteschlange liegt,
  // alle 45 Sekunden automatisch einen neuen Versuch starten - auch wenn der
  // Browser das "online"-Ereignis (z. B. bei manchen Mobilfunk-Wechseln)
  // nicht zuverlässig auslöst. Steht der Sync zusätzlich auf "offline" (z.B.
  // eine einzelne Zeitüberschreitung kurz nach dem Start), wird hier auch
  // ohne Warteschlange automatisch ein neuer Sync-Versuch gestartet - vorher
  // blieb die App in diesem Fall dauerhaft auf "Fehler" stehen, bis man
  // manuell auf das Symbol getippt hat, weil weder das "online"-Ereignis
  // (die Verbindung war ja nie wirklich weg) noch die Warteschlange
  // (nichts Neues zu buchen) einen erneuten Versuch ausgelöst haben.
  useEffect(() => {
    if (!supabaseReady) return;
    const interval = setInterval(() => {
      if (syncStatus === "offline") syncFromRemote(true).then(() => processQueue());
      else if (loadQueue().length > 0) processQueue();
    }, 45000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [supabaseReady, syncStatus]);

  // "Geräte online"-Lebenszeichen: alle 12 Sekunden, solange die App
  // tatsächlich offen ist. Beim Schließen zusätzlich sofort per sendBeacon
  // abmelden (zuverlässig genug, um auch beim Schließen der Seite noch
  // rauszugehen) - stirbt die Verbindung mal unsauber (z. B. App auf Android
  // aus der Übersicht weggewischt, ohne dass ein sauberes Beenden-Ereignis
  // ausgelöst wird), korrigiert sich die Zahl serverseitig ohnehin
  // spätestens nach GERAETE_TIMEOUT_MS (55s, siehe .gs) von selbst - als
  // "vertraut" markierte Geräte werden danach zusätzlich automatisch aus
  // dem Sheet entfernt (siehe upsertGeraet im Backend).
  useEffect(() => {
    if (!supabaseReady || deviceBlocked) return;
    const geraeteId = getDeviceId();
    const sendHeartbeat = () => {
      supaHeartbeat(geraeteId, getDeviceName())
        .then((res) => {
          if (res.gesperrt) { setDeviceBlocked(true); clearInterval(interval); return; }
          // Der Heartbeat bringt die aktuelle Geräteliste direkt in seiner
          // Antwort mit - kein separater Aufruf für die "Geräte online"-
          // Anzeige nötig.
          setGeraete((prev) => (geraeteListenGleich(prev, res.geraete) ? prev : res.geraete));
        })
        .catch(() => {});
    };
    sendHeartbeat();
    const interval = setInterval(sendHeartbeat, 12000);
    // sendBeacon kann keine eigenen Header (apikey/Authorization) mitschicken,
    // die Supabase zwingend verlangt - fetch mit keepalive:true ist der
    // moderne Ersatz dafür: die Anfrage läuft auch nach dem Schließen der
    // Seite im Hintergrund weiter.
    const handlePageHide = () => {
      try {
        const url = loadSupabaseUrl();
        const key = loadSupabaseAnonKey();
        if (!url || !key) return;
        fetch(url.replace(/\/$/, "") + `/rest/v1/geraete?geraete_id=eq.${encodeURIComponent(geraeteId)}`, {
          method: "DELETE",
          keepalive: true,
          headers: { apikey: key, Authorization: "Bearer " + key },
        });
      } catch (e) {}
    };
    window.addEventListener("pagehide", handlePageHide);
    return () => { clearInterval(interval); window.removeEventListener("pagehide", handlePageHide); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [supabaseReady, deviceBlocked]);

  const sperreGeraetClient = useCallback((id) => {
    if (!supabaseReady) return;
    supaSperreGeraet(id)
      .then(() => setGeraete((prev) => (prev ? prev.map((g) => (g.id === id ? { ...g, gesperrt: true } : g)) : prev)))
      .catch(() => {});
  }, [supabaseReady]);

  const [entsperrenGeraetId, setEntsperrenGeraetId] = useState(null);
  const [entsperrenPinWert, setEntsperrenPinWert] = useState("");
  const [entsperrenLaedt, setEntsperrenLaedt] = useState(false);

  const entsperreGeraetClient = useCallback(async (id, pin) => {
    if (!supabaseReady) return;
    setEntsperrenLaedt(true);
    try {
      await supaEntsperren(id, pin);
      setGeraete((prev) => (prev ? prev.map((g) => (g.id === id ? { ...g, gesperrt: false } : g)) : prev));
      setEntsperrenGeraetId(null);
      setEntsperrenPinWert("");
      showToast("Gerät entsperrt.");
    } catch (err) {
      showToast(err.message, "error");
    } finally {
      setEntsperrenLaedt(false);
    }
  }, [supabaseReady, showToast]);

  const syncFromRemote = useCallback(async (silent) => {
    if (!supabaseReady) { setSyncStatus("none"); return; }
    setSyncStatus("syncing");
    try {
      const [data, kontoauszugeListe] = await Promise.all([supaGetAll(), supaListKontoauszuege()]);
      const mapped = mapRemoteData(data);
      setAccounts(mapped.accounts);
      setCategories(mapped.categories);
      setFixedCosts(mergeFixkostenWithQueue(mapped.fixedCosts, loadQueue()));
      setEinstellungen(mapped.einstellungen);
      setKreditBuchungen(mapped.autokreditBuchungen);
      setKreditCheckliste(mapped.autokreditCheckliste);
      setKreditKonfiguration(mapped.autokreditKonfiguration);
      setKreditPlanVerlauf(mapped.autokreditPlanVerlauf);
      setKontoauszuege(kontoauszugeListe);
      if (mapped.geraete !== null) setGeraete((prev) => (geraeteListenGleich(prev, mapped.geraete) ? prev : mapped.geraete));
      if (mapped.geraetGesperrt) setDeviceBlocked(true);
      setTransactions(mergeWithQueue(mapped.transactions, loadQueue()));
      setSyncStatus("connected");
      markSynced();
      if (!silent) showToast("Mit Supabase synchronisiert.");
    } catch (err) {
      setSyncStatus("offline");
      // Anders als der Erfolgs-Toast wird der Fehler-Toast bewusst IMMER
      // gezeigt, auch bei "stillen" Hintergrund-Syncs (App-Start,
      // Wiederverbinden, nach der Warteschlange) - sonst sieht man nur das
      // Fehler-Symbol im Kopfbereich, aber nie den eigentlichen Grund dafür.
      showToast("Verbindung fehlgeschlagen: " + err.message + " Es werden lokale Daten verwendet.", "error");
    }
  }, [supabaseReady, showToast]);

  const balances = useMemo(() => computeBalances(accounts, transactions), [accounts, transactions]);
  const verteilungAktuell = useMemo(() => computeGehaltsverteilung(fixedCosts), [fixedCosts]);
  // useMemo statt Neuberechnung bei jedem Render, damit memo(Dashboard)
  // und memo(ToepfeKarussell) diese Referenz als unverändert erkennen.
  const realAccounts = useMemo(() => accounts.filter((a) => a.typ === "echt"), [accounts]);
  const virtualAccounts = useMemo(() => accounts.filter((a) => a.typ === "virtuell"), [accounts]);
  const ingBalance = balances["ING"] || 0;
  const trFrei = balances["Trade Republic"] || 0;
  const gebundenesBudget = virtualAccounts.reduce((s, a) => s + (balances[a.name] || 0), 0);
  const trGesamt = trFrei + gebundenesBudget; // 1:1 vergleichbar mit der echten Trade-Republic-App
  const gesamtvermoegen = ingBalance + trGesamt;
  const potAllocations = useMemo(() => getMonthlyPotAllocations(fixedCosts), [fixedCosts]);

  const currentMonth = monthKey(todayISO());
  const monthTx = transactions.filter((t) => monthKey(t.datum) === currentMonth);
  const monatEinnahmen = monthTx.filter((t) => t.typ === "Einnahme").reduce((s, t) => s + Number(t.betrag), 0);
  const monatAusgaben = monthTx.filter((t) => t.typ === "Ausgabe").reduce((s, t) => s + Number(t.betrag), 0);

  /* ---------- Buchung anlegen / bearbeiten / löschen: optimistic update + Rollback + Persistenz-Verifikation ---------- */
  const [queueCount, setQueueCount] = useState(() => loadQueue().length);

  const enqueue = useCallback((action, payload) => {
    const queue = loadQueue();
    queue.push({ action, payload });
    saveQueue(queue);
    setQueueCount(queue.length);
  }, []);

  const writeTransaction = useCallback(async (action, payload, snapshot) => {
    if (!supabaseReady) {
      showToast("Keine Supabase-Verbindung hinterlegt. Änderung wurde nur lokal gespeichert.", "error");
      return true;
    }
    setSyncStatus("syncing");
    try {
      await supaWrite(action, payload);
      setSyncStatus("connected");
      markSynced();
      showToast(action === "delete" ? "Buchung gelöscht und synchronisiert." : "Buchung gespeichert und synchronisiert.");
      setTimeout(async () => {
        try {
          const data = await supaGetAll();
          const mapped = mapRemoteData(data);
          const found = action === "delete" ? !mapped.transactions.some((t) => t.id === payload.id) : mapped.transactions.some((t) => t.id === payload.id);
          if (!found) showToast("Warnung: Buchung konnte in Supabase nicht bestätigt werden. Bitte manuell prüfen.", "error");
        } catch (e) { /* Verifikation optional, kein harter Fehler */ }
      }, 1500);
      return true;
    } catch (err) {
      // Statt zurückzurollen: Buchung bleibt sichtbar (lokal), die Aktion
      // wandert in die Warteschlange und wird beim nächsten erfolgreichen
      // Synchronisieren automatisch nachgeholt.
      enqueue(action, payload);
      setSyncStatus("offline");
      showToast("Kein Netz oder Verbindung fehlgeschlagen (" + err.message + "). Buchung bleibt gespeichert und wird automatisch nachgeholt, sobald es wieder klappt.", "error");
      return true;
    }
  }, [supabaseReady, showToast, enqueue]);

  /* ---------- Fixkosten-Position anlegen / bearbeiten / löschen: gleiches Prinzip wie Buchungen ---------- */
  const writeFixkosten = useCallback(async (action, payload) => {
    if (!supabaseReady) {
      showToast("Keine Supabase-Verbindung hinterlegt. Änderung wurde nur lokal gespeichert.", "error");
      return;
    }
    setSyncStatus("syncing");
    try {
      await supaWrite(action, payload);
      setSyncStatus("connected");
      markSynced();
      showToast(action === "fixkosten-delete" ? "Fixkosten-Position gelöscht und synchronisiert." : "Fixkosten-Position gespeichert und synchronisiert.");
    } catch (err) {
      enqueue(action, payload);
      setSyncStatus("offline");
      showToast("Kein Netz oder Verbindung fehlgeschlagen (" + err.message + "). Änderung bleibt gespeichert und wird automatisch nachgeholt.", "error");
    }
  }, [supabaseReady, showToast, enqueue]);

  const handleFixkostenSave = useCallback((form) => {
    const isEdit = fixedCosts.some((f) => f.id === form.id);
    const payload = isEdit ? form : { ...form, id: uid() };
    setFixedCosts((prev) => (isEdit ? prev.map((f) => (f.id === payload.id ? payload : f)) : [...prev, payload]));
    writeFixkosten(isEdit ? "fixkosten-update" : "fixkosten-create", payload);
  }, [fixedCosts, writeFixkosten]);

  const handleFixkostenDelete = useCallback((id) => {
    setFixedCosts((prev) => prev.filter((f) => f.id !== id));
    writeFixkosten("fixkosten-delete", { id });
  }, [writeFixkosten]);

  /* ---------- Autokredit: Ist-Buchung nachtragen / löschen, Checkliste abhaken ---------- */
  const writeKredit = useCallback(async (action, payload) => {
    if (!supabaseReady) {
      showToast("Keine Supabase-Verbindung hinterlegt. Änderung wurde nur lokal gespeichert.", "error");
      return;
    }
    setSyncStatus("syncing");
    try {
      await supaWrite(action, payload);
      setSyncStatus("connected");
      markSynced();
      showToast("Gespeichert und synchronisiert.");
    } catch (err) {
      enqueue(action, payload);
      setSyncStatus("offline");
      showToast("Kein Netz oder Verbindung fehlgeschlagen (" + err.message + "). Änderung bleibt gespeichert und wird automatisch nachgeholt.", "error");
    }
  }, [supabaseReady, showToast, enqueue]);

  const handleKreditBuchungCreate = useCallback((form) => {
    const payload = { ...form, id: uid() };
    setKreditBuchungen((prev) => [...prev, payload].sort((a, b) => (a.datum < b.datum ? -1 : 1)));
    writeKredit("autokredit-buchung-create", payload);
  }, [writeKredit]);

  const handleKreditBuchungDelete = useCallback((id) => {
    setKreditBuchungen((prev) => prev.filter((b) => b.id !== id));
    writeKredit("autokredit-buchung-delete", { id });
  }, [writeKredit]);

  const handleKreditChecklisteToggle = useCallback((item, erledigt) => {
    const erledigtAm = erledigt ? toISO(new Date()) : null;
    setKreditCheckliste((prev) => prev.map((c) => (c.item === item ? { ...c, erledigt, erledigtAm } : c)));
    writeKredit("autokredit-checkliste-toggle", { item, erledigt });
  }, [writeKredit]);

  const handleKreditStrategieWaehlen = useCallback((strategie) => {
    setKreditKonfiguration((prev) => (prev ? { ...prev, strategie } : prev));
    writeKredit("autokredit-strategie-update", { strategie });
  }, [writeKredit]);

  const processingQueueRef = useRef(false);
  const [isProcessingQueue, setIsProcessingQueue] = useState(false);

  const processQueue = useCallback(async () => {
    if (!supabaseReady) return;
    // Sperre: Läuft schon ein Versuch, wird ein zweiter, gleichzeitiger
    // Versuch einfach übersprungen. Ohne diese Sperre könnten zwei parallele
    // Aufrufe (z. B. Timer + Antippen) dieselbe Buchung beide für "noch nicht
    // vorhanden" halten und sie doppelt anlegen.
    if (processingQueueRef.current) return;
    let queue = loadQueue();
    if (queue.length === 0) return;
    processingQueueRef.current = true;
    setIsProcessingQueue(true);
    try {
      let currentTx = [], currentFixedCosts = [], currentKreditBuchungen = [];
      try {
        const data = await supaGetAll();
        const mapped = mapRemoteData(data);
        currentTx = mapped.transactions;
        currentFixedCosts = mapped.fixedCosts;
        currentKreditBuchungen = mapped.autokreditBuchungen;
      } catch (e) {
        return; // noch kein Netz - beim nächsten Mal erneut versuchen
      }
      const remaining = [];
      let erledigt = 0;
      for (let i = 0; i < queue.length; i++) {
        const item = queue[i];
        try {
          if (item.action === "create") {
            const existiertBereits = currentTx.some((t) => t.id === item.payload.id);
            if (!existiertBereits) await supaWrite("create", item.payload);
          } else if (item.action === "update") {
            await supaWrite("update", item.payload);
          } else if (item.action === "delete") {
            // Löschen eines bereits gelöschten/nicht (mehr) vorhandenen
            // Datensatzes ist bei Supabase kein Fehler (0 betroffene Zeilen
            // statt einer Fehlermeldung wie zuvor bei Apps Script) - daher
            // hier kein Sonderfall mehr nötig.
            await supaWrite("delete", { id: item.payload.id });
          } else if (item.action === "fixkosten-create") {
            const existiertBereits = currentFixedCosts.some((f) => f.id === item.payload.id);
            if (!existiertBereits) await supaWrite("fixkosten-create", item.payload);
          } else if (item.action === "fixkosten-update") {
            await supaWrite("fixkosten-update", item.payload);
          } else if (item.action === "fixkosten-delete") {
            await supaWrite("fixkosten-delete", { id: item.payload.id });
          } else if (item.action === "autokredit-buchung-create") {
            const existiertBereits = currentKreditBuchungen.some((b) => b.id === item.payload.id);
            if (!existiertBereits) await supaWrite("autokredit-buchung-create", item.payload);
          } else if (item.action === "autokredit-buchung-delete") {
            await supaWrite("autokredit-buchung-delete", { id: item.payload.id });
          } else if (item.action === "autokredit-checkliste-toggle") {
            await supaWrite("autokredit-checkliste-toggle", item.payload);
          } else if (item.action === "autokredit-strategie-update") {
            await supaWrite("autokredit-strategie-update", item.payload);
          }
          erledigt++;
        } catch (err) {
          // Ab hier abbrechen und Rest (in ursprünglicher Reihenfolge) für den
          // nächsten Versuch aufheben, damit die zeitliche Reihenfolge erhalten bleibt.
          remaining.push(...queue.slice(i));
          break;
        }
      }
      saveQueue(remaining);
      setQueueCount(remaining.length);
      if (erledigt > 0) {
        showToast(`${erledigt} nachgeholte Änderung(en) erfolgreich synchronisiert.`);
        syncFromRemote(true);
      }
    } finally {
      processingQueueRef.current = false;
      setIsProcessingQueue(false);
    }
  }, [supabaseReady, showToast]);

  const handleAddOrUpdate = useCallback(async (form, isEdit, opts = {}) => {
    const snapshot = transactions;
    const tx = isEdit ? { ...form } : { ...form, id: uid() };
    const next = isEdit ? transactions.map((t) => (t.id === tx.id ? tx : t)) : [tx, ...transactions];
    setTransactions(next);
    const ok = await writeTransaction(isEdit ? "update" : "create", tx, snapshot);
    if (ok) { setEditingTx(null); if (!isEdit && opts.switchTab !== false) setActiveTab("journal"); }
    return ok;
  }, [transactions, writeTransaction]);

  // Schickt eine Nachricht (getippt oder per Spracheingabe transkribiert) an den
  // KI-Assistenten und hängt Frage + Antwort an den Chatverlauf an. Schickt bewusst
  // nur die letzten Nachrichten als Verlauf mit (nicht die komplette Historie), um
  // die Anfrage klein und schnell zu halten.
  const sendAiMessage = useCallback(async (text) => {
    const trimmed = (text || "").trim();
    if (!trimmed || aiLoading) return;
    if (!supabaseReady) { showToast("Keine Supabase-Verbindung hinterlegt.", "error"); return; }
    const userMsg = { id: uid(), role: "user", text: trimmed };
    setAiMessages((prev) => [...prev, userMsg]);
    setAiLoading(true);
    try {
      const verlauf = [...aiMessages, userMsg].slice(-10).map((m) => ({ role: m.role, text: m.text }));
      // Längeres Zeitlimit als bei normalen Buchungen: die Cloud-Funktion
      // versucht bei einer vorübergehenden Überlastung serverseitig bis zu 3x
      // mit kurzer Pause - das braucht in Summe deutlich mehr Luft als eine
      // einzelne Anfrage.
      let res;
      try {
        res = await supaAiChat(trimmed, verlauf, 90000);
      } catch (ersterFehler) {
        // "ai-chat" schreibt nie in die Datenbank (nur ein Vorschlag wird
        // erzeugt) - ein erneuter Versuch bei einem kurzzeitigen
        // Verbindungsproblem (schwaches Mobilfunknetz, abgebrochene Anfrage)
        // ist hier anders als bei "Buchung anlegen"/"ändern" völlig gefahrlos
        // möglich. Einmal automatisch erneut versuchen, bevor der Fehler
        // angezeigt wird.
        res = await supaAiChat(trimmed, verlauf, 90000);
      }
      // Bei "buchung_bearbeiten" schickt die KI oft nur die sich ändernden
      // Felder (z.B. nur den neuen Betrag) - fehlende Felder hier direkt mit
      // der Original-Buchung auffüllen, statt sie leer/verändert anzuzeigen
      // oder beim Speichern zu überschreiben.
      let vorschlag = res.buchungsvorschlag || null;
      if (vorschlag && vorschlag.id) {
        const original = transactions.find((t) => t.id === vorschlag.id);
        if (original) {
          vorschlag = {
            id: vorschlag.id,
            datum: vorschlag.datum || original.datum,
            titel: vorschlag.titel || original.titel,
            kategorie: vorschlag.kategorie || original.kategorie,
            typ: vorschlag.typ || original.typ,
            betrag: vorschlag.betrag !== undefined && vorschlag.betrag !== null ? Number(vorschlag.betrag) : Number(original.betrag),
            quelle: vorschlag.quelle || original.quelle,
            ziel: vorschlag.ziel !== undefined && vorschlag.ziel !== null ? vorschlag.ziel : (original.ziel || ""),
            notiz: vorschlag.notiz !== undefined && vorschlag.notiz !== null ? vorschlag.notiz : (original.notiz || ""),
          };
        }
      }
      const antwortMsg = { id: uid(), role: "assistant", text: res.antwort || "", buchungsvorschlag: vorschlag, vorschlagStatus: null };
      setAiMessages((prev) => [...prev, antwortMsg]);
      // Navigation läuft ohne Bestätigung, da harmlos/jederzeit umkehrbar -
      // eine Extra-Bestätigung würde dem eigentlichen Zweck (schneller
      // Sprung per Sprache) nur im Weg stehen.
      const gueltigeTabs = ["dashboard", "buchen", "journal", "fixkosten", "prognose", "auswertung", "einstellungen"];
      if (res.navigation && gueltigeTabs.includes(res.navigation)) {
        setActiveTab(res.navigation);
      }
      if (aiVorlesen && antwortMsg.text && "speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(antwortMsg.text);
          u.lang = "de-DE";
          const stimme = waehleDeutscheStimme(window.speechSynthesis.getVoices(), aiVoiceName);
          if (stimme) u.voice = stimme;
          // Steuert den Hasen-Avatar (spricht-Zustand) im Assistent-Tab -
          // läuft parallel zur eigentlichen Sprachausgabe, ohne diese zu beeinflussen.
          u.onstart = () => setAiSpeaking(true);
          u.onend = () => setAiSpeaking(false);
          u.onerror = () => setAiSpeaking(false);
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    } catch (err) {
      setAiMessages((prev) => [...prev, { id: uid(), role: "assistant", text: "Fehler: " + err.message, isError: true }]);
    } finally {
      setAiLoading(false);
    }
  }, [supabaseReady, aiMessages, aiLoading, aiVorlesen, aiVoiceName, transactions, showToast]);

  // Übernimmt einen Buchungsvorschlag der KI in eine echte Buchung - läuft über
  // denselben Weg wie das normale Buchungsformular (inkl. Warteschlange bei
  // fehlender Verbindung), bleibt aber bewusst im Assistent-Tab statt ins
  // Journal zu wechseln, damit der Chat weiterläuft.
  const handleVorschlagBuchen = useCallback(async (msgId, vorschlag) => {
    const isEdit = !!vorschlag.id;
    const form = {
      datum: vorschlag.datum || toISO(new Date()),
      titel: vorschlag.titel || "",
      kategorie: vorschlag.kategorie || "Sonstiges",
      typ: vorschlag.typ || "Ausgabe",
      betrag: Number(vorschlag.betrag) || 0,
      quelle: vorschlag.quelle || "ING",
      ziel: vorschlag.ziel || "",
      notiz: vorschlag.notiz || "",
    };
    if (isEdit) form.id = vorschlag.id;
    setAiMessages((prev) => prev.map((m) => (m.id === msgId ? { ...m, vorschlagStatus: "gebucht" } : m)));
    await handleAddOrUpdate(form, isEdit, { switchTab: false });
  }, [handleAddOrUpdate]);

  const handleVorschlagVerwerfen = useCallback((msgId) => {
    setAiMessages((prev) => prev.map((m) => (m.id === msgId ? { ...m, vorschlagStatus: "verworfen" } : m)));
  }, []);

  const handleDelete = useCallback(async (id) => {
    const snapshot = transactions;
    const next = transactions.filter((t) => t.id !== id);
    setTransactions(next);
    setConfirmDeleteId(null);
    await writeTransaction("delete", { id }, snapshot);
  }, [transactions, writeTransaction]);

  /* ---------- Monatslauf: Fixkosten & Besoldung ---------- */
  const runMonthlyBooking = useCallback(async () => {
    const now = new Date();
    const year = now.getFullYear(), monthIdx = now.getMonth();
    const targetMonthKey = `${year}-${String(monthIdx + 1).padStart(2, "0")}`;
    const salaryDate = toISO(lastBankBusinessDayOfMonth(year, monthIdx - 1));
    const fixedDate = toISO(new Date(year, monthIdx, 1));

    // Vor der Duplikatprüfung IMMER frisch vom Sheet abgleichen. Andernfalls
    // könnte die App Buchungen doppelt anlegen, die serverseitig bereits
    // existieren, ihr lokaler Stand davon aber (z. B. nach einem vorherigen
    // Fehler) nichts weiß.
    let currentTx = transactions;
    if (supabaseReady) {
      setSyncStatus("syncing");
      try {
        const data = await supaGetAll();
        const mapped = mapRemoteData(data);
        currentTx = mergeWithQueue(mapped.transactions, loadQueue());
        setAccounts(mapped.accounts);
        setCategories(mapped.categories);
        setFixedCosts(mergeFixkostenWithQueue(mapped.fixedCosts, loadQueue()));
        setEinstellungen(mapped.einstellungen);
        setKreditBuchungen(mapped.autokreditBuchungen);
        setKreditCheckliste(mapped.autokreditCheckliste);
        setKreditKonfiguration(mapped.autokreditKonfiguration);
        setKreditPlanVerlauf(mapped.autokreditPlanVerlauf);
        setTransactions(currentTx);
      } catch (err) {
        setSyncStatus("offline");
        showToast("Monatslauf abgebrochen: Konnte vorab nicht mit Supabase abgleichen (" + err.message + ").", "error");
        return;
      }
    }

    const active = getActiveFixedCosts(fixedCosts, year, monthIdx);

    const toBook = [];
    let skipped = 0;
    active.forEach((f) => {
      const alreadyBooked = currentTx.some((t) => t.titel === f.bezeichnung && monthKey(t.datum) === targetMonthKey);
      if (alreadyBooked && !forceRun) { skipped += 1; return; }
      const isEinnahme = f.typ === "Einnahme";
      const zielIstIntern = f.ziel && f.ziel !== "Extern";
      // Automatische Korrektur: Fixkosten mit internem Zielkonto werden als
      // Umbuchung gebucht, damit der Zielsaldo korrekt gutgeschrieben wird.
      const typ = isEinnahme ? "Einnahme" : (zielIstIntern ? "Umbuchung" : "Ausgabe");
      toBook.push({
        id: uid(),
        datum: isEinnahme ? salaryDate : fixedDate,
        titel: f.bezeichnung, kategorie: f.kategorie, typ, betrag: Number(f.betrag),
        quelle: f.quelle, ziel: zielIstIntern || isEinnahme ? f.ziel : "",
        notiz: "Automatischer Monatslauf" + (typ !== f.typ ? ` (korrigiert von ${f.typ} zu ${typ})` : ""),
      });
    });

    // Nacheinander buchen statt alles auf einmal optimistisch anzunehmen:
    // Jede erfolgreich geschriebene Buchung bleibt bestehen, auch wenn eine
    // spätere Position fehlschlägt. So driften App und Sheet nie auseinander.
    let created = 0;
    let stoppedAt = null;
    for (const tx of toBook) {
      setTransactions((prev) => [tx, ...prev]);
      if (!supabaseReady) { created += 1; continue; }
      setSyncStatus("syncing");
      try {
        await supaWrite("create", tx);
        created += 1;
      } catch (err) {
        setTransactions((prev) => prev.filter((t) => t.id !== tx.id));
        setSyncStatus("offline");
        stoppedAt = { titel: tx.titel, error: err.message };
        break;
      }
    }
    if (supabaseReady && !stoppedAt) { setSyncStatus("connected"); markSynced(); }

    setLastRunInfo({ created, skipped, salaryDate, fixedDate, targetMonthKey });
    if (stoppedAt) {
      showToast(`Monatslauf gestoppt bei "${stoppedAt.titel}" (${stoppedAt.error}). ${created} Buchung(en) wurden vorher bereits erfolgreich gespeichert und bleiben bestehen. Führe den Lauf erneut aus, um die restlichen Positionen nachzuholen.`, "error");
    } else {
      showToast(created > 0
        ? `Monatslauf: ${created} Buchung(en) angelegt${skipped ? `, ${skipped} übersprungen (bereits gebucht)` : ""}.`
        : `Monatslauf: keine neuen Buchungen (${skipped} bereits vorhanden). "Erzwingen" aktivieren, um erneut zu buchen.`,
        created > 0 ? "success" : "error");
    }
  }, [fixedCosts, transactions, forceRun, supabaseReady, showToast]);

  const downloadBackup = useCallback(() => {
    const data = { accounts, categories, transactions, fixedCosts, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `finanzindex-export-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast("Datenexport heruntergeladen.");
  }, [accounts, categories, transactions, fixedCosts, showToast]);

  const downloadJahresbericht = useCallback(() => {
    const jahr = new Date().getFullYear();
    const zeilen = [["Monat", "Einnahmen", "Ausgaben", "Netto"]];
    for (let m = 0; m < 12; m++) {
      const mk = `${jahr}-${String(m + 1).padStart(2, "0")}`;
      const monthTx = transactions.filter((t) => monthKey(t.datum) === mk);
      const ein = monthTx.filter((t) => t.typ === "Einnahme").reduce((s, t) => s + Number(t.betrag), 0);
      const aus = monthTx.filter((t) => t.typ === "Ausgabe").reduce((s, t) => s + Number(t.betrag), 0);
      zeilen.push([mk, ein.toFixed(2).replace(".", ","), aus.toFixed(2).replace(".", ","), (ein - aus).toFixed(2).replace(".", ",")]);
    }
    const csv = zeilen.map((r) => r.join(";")).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `jahresbericht-${jahr}.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast(`Jahresbericht ${jahr} heruntergeladen (öffnet sich direkt in Excel/Google Sheets).`);
  }, [transactions, showToast]);

  const toggleTheme = () => {
    setIsLight((prev) => {
      const next = !prev;
      document.documentElement.classList.toggle("light", next);
      try { localStorage.setItem("finanzindex_theme", next ? "light" : "dark"); } catch (e) {}
      return next;
    });
  };

  const applySupabaseUrl = (url) => {
    setSupabaseUrlState(url);
    saveSupabaseUrl(url);
    setSyncStatus(url && supabaseAnonKey ? "offline" : "none");
  };

  const applySupabaseAnonKey = (key) => {
    setSupabaseAnonKeyState(key);
    saveSupabaseAnonKey(key);
    setSyncStatus(supabaseUrl && key ? "offline" : "none");
  };

  const tabs = [
    { id: "dashboard", label: "Dashboard", icon: "dashboard", primary: true },
    { id: "buchen", label: "Buchen", icon: "plus", primary: true },
    { id: "assistent", label: "Finz", icon: "assistant", primary: true },
    { id: "journal", label: "Journal", icon: "list", primary: true },
    { id: "fixkosten", label: "Fixkosten", icon: "repeat" },
    { id: "prognose", label: "Prognose", icon: "trend" },
    { id: "auswertung", label: "Auswertung", icon: "chart" },
    { id: "autokredit", label: "Autokredit", icon: "car" },
    { id: "einstellungen", label: "Einstellungen", icon: "settings" },
  ];
  const primaryTabs = tabs.filter((t) => t.primary);
  const secondaryTabs = tabs.filter((t) => !t.primary);
  const [showMoreMenu, setShowMoreMenu] = useState(false);

  if (deviceBlocked) return <BlockedScreen />;
  if (locked) return <LockScreen onUnlock={() => { markUnlocked(); setLocked(false); }} />;
  if (showLockSetup) return <LockSetup onDone={() => { markUnlocked(); setLockConfigured(true); setShowLockSetup(false); }} onCancel={() => setShowLockSetup(false)} />;
  if (confirmRevealBetraege) {
    return (
      <LockScreen
        title="Zum Anzeigen bestätigen"
        onUnlock={() => {
          setBetraegeVersteckt(false);
          try { localStorage.setItem(BETRAEGE_VERSTECKT_KEY, "false"); } catch (e) {}
          setConfirmRevealBetraege(false);
        }}
        onCancel={() => setConfirmRevealBetraege(false)}
      />
    );
  }

  return (
    <div className="min-h-[100dvh] w-full bg-zinc-950 text-zinc-100">
      <header className="sticky top-0 z-30 flex items-center justify-between border-b border-zinc-800 bg-zinc-950/95 px-4 py-3 backdrop-blur md:px-6">
        <div className="flex items-center gap-2.5">
          <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500/15 text-emerald-400"><Icon name="wallet" size={18} /></div>
          <div className="relative">
            <h1 className="text-[15px] font-semibold leading-tight text-zinc-100">Finanzindex</h1>
            {geraete !== null ? (
              <button onClick={() => setShowGeraetePopup((v) => !v)} className="flex items-center gap-1 text-[10.5px] leading-tight text-zinc-500 hover:text-zinc-300">
                <span className="inline-block h-1.5 w-1.5 rounded-full bg-emerald-400" />
                <span className="underline decoration-dotted underline-offset-2">{geraete.filter((g) => g.online).length} {geraete.filter((g) => g.online).length === 1 ? "Gerät" : "Geräte"} online</span>
              </button>
            ) : (
              <p className="hidden text-[11px] leading-tight text-zinc-500 sm:block">Persönliche Finanzverwaltung</p>
            )}
            {showGeraetePopup && geraete !== null && (
              <>
                <div className="fixed inset-0 z-40" onClick={() => { setShowGeraetePopup(false); setEntsperrenGeraetId(null); }} />
                <div className="absolute left-0 top-full z-50 mt-1.5 w-64 rounded-xl border border-zinc-800 bg-zinc-900 p-1 shadow-xl">
                  {geraete.length === 0 && <p className="px-3 py-2.5 text-xs text-zinc-500">Keine Geräte bekannt.</p>}
                  {geraete.map((g) => (
                    <div key={g.id} className="rounded-lg hover:bg-zinc-800/60">
                      <div className="flex items-center justify-between gap-2 px-2.5 py-2">
                        <div className="min-w-0">
                          <p className="truncate text-xs text-zinc-200">
                            {g.name || "Unbenanntes Gerät"}

                            {g.gesperrt && <span className="ml-1.5 text-[10px] text-rose-400">(gesperrt)</span>}
                          </p>
                          <p className="text-[10px] text-zinc-500">{g.online ? "gerade eben" : g.zuletztGesehen ? "zuletzt " + dateDE(new Date(g.zuletztGesehen).toISOString()) : ""}</p>
                        </div>
                        {!g.gesperrt && g.id !== getDeviceId() && (
                          <button onClick={() => sperreGeraetClient(g.id)} className="shrink-0 rounded-lg border border-zinc-700 px-2 py-1 text-[10.5px] text-zinc-400 hover:border-rose-500/40 hover:text-rose-400">Sperren</button>
                        )}
                        {g.gesperrt && entsperrenGeraetId !== g.id && (
                          <button onClick={() => { setEntsperrenGeraetId(g.id); setEntsperrenPinWert(""); }} className="shrink-0 rounded-lg border border-zinc-700 px-2 py-1 text-[10.5px] text-zinc-400 hover:border-emerald-500/40 hover:text-emerald-400">Entsperren</button>
                        )}
                      </div>
                      {g.gesperrt && entsperrenGeraetId === g.id && (
                        <form
                          onSubmit={(e) => { e.preventDefault(); if (!entsperrenLaedt && entsperrenPinWert) entsperreGeraetClient(g.id, entsperrenPinWert); }}

                        >
                          <input
                            type="password" autoComplete="off" autoFocus placeholder="PIN"
                            value={entsperrenPinWert} onChange={(e) => setEntsperrenPinWert(e.target.value)}

                          />
                          <button type="submit" disabled={entsperrenLaedt || !entsperrenPinWert} className="shrink-0 rounded-lg bg-emerald-600 px-2 py-1 text-[10.5px] font-medium text-white disabled:opacity-50">
                            {entsperrenLaedt ? "…" : "OK"}
                          </button>
                          <button type="button" onClick={() => setEntsperrenGeraetId(null)} className="shrink-0 rounded-lg border border-zinc-700 px-2 py-1 text-[10.5px] text-zinc-400 hover:bg-zinc-800">Abbrechen</button>

        <div className="flex items-center gap-2">
          {queueCount > 0 && (
            <button
              onClick={() => processQueue()}

            >

          <button onClick={toggleTheme} title={isLight ? "Dunkles Design" : "Helles Design"} className="flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 bg-zinc-800/60 text-zinc-300 hover:border-zinc-600">

          <nav className="hidden items-center gap-1 rounded-xl border border-zinc-800 bg-zinc-900/60 p-1 lg:flex">

                {t.id === "assistent" ? <AssistentKopfIcon zustand="idle" size={20} /> : <Icon name={t.icon} size={15} />}{t.label}

        </div>
      </header>

      <main className="mx-auto max-w-6xl overflow-x-hidden px-4 pb-28 pt-5 md:px-6 lg:pb-10">

          <div className="mb-5 rounded-xl border border-amber-500/30 bg-amber-500/5 px-4 py-3 text-sm text-amber-200">
            Es ist noch keine Supabase-Verbindung hinterlegt. Die App speichert vorerst nur lokal in diesem Browser. Trage URL und Schlüssel unter „Einstellungen" ein, um zu synchronisieren.

        )}

        {activeTab === "dashboard" && (
          <Dashboard accounts={accounts} balances={balances} realAccounts={realAccounts} virtualAccounts={virtualAccounts}
            ingBalance={ingBalance} trFrei={trFrei} trGesamt={trGesamt} gebundenesBudget={gebundenesBudget} gesamtvermoegen={gesamtvermoegen}
            monatEinnahmen={monatEinnahmen} monatAusgaben={monatAusgaben} transactions={transactions} potAllocations={potAllocations} onGoBuchen={handleGoBuchen} isLight={isLight}
            betraegeVersteckt={betraegeVersteckt} onHideBetraege={hideBetraege} onRequestRevealBetraege={requestRevealBetraege} />
        )}
        {activeTab === "buchen" && (
          <BuchungsForm accounts={accounts} categories={categories} transactions={transactions} onSubmit={(f) => handleAddOrUpdate(f, false)} submitting={syncStatus === "syncing"} />
        )}
        {activeTab === "assistent" && (
          <AiAssistent messages={aiMessages} loading={aiLoading} onSend={sendAiMessage} onBuchen={handleVorschlagBuchen} onVerwerfen={handleVorschlagVerwerfen}
            vorlesen={aiVorlesen} onToggleVorlesen={toggleAiVorlesen} voiceName={aiVoiceName} onVoiceChange={handleAiVoiceChange} micTrigger={aiMicTrigger} speaking={aiSpeaking} onStopSpeaking={stopAiVorlesen} />
        )}
        {activeTab === "journal" && (
          <Journal transactions={transactions} accounts={accounts} categories={categories} filter={journalFilter} setFilter={setJournalFilter}
            showFilters={showFilters} setShowFilters={setShowFilters} onEdit={handleEditTx} onDelete={handleDeleteTxRequest} isLight={isLight} />
        )}
        {activeTab === "fixkosten" && (
          <Fixkosten fixedCosts={fixedCosts} onSaveFixkosten={handleFixkostenSave} onDeleteFixkosten={handleFixkostenDelete} categories={categories} accounts={accounts}
            forceRun={forceRun} setForceRun={setForceRun} onRun={runMonthlyBooking} lastRunInfo={lastRunInfo} showToast={showToast} />
        )}
        {activeTab === "prognose" && (
          <Prognose accounts={accounts} balances={balances} fixedCosts={fixedCosts} einstellungen={einstellungen} transactions={transactions} />
        )}
        {activeTab === "auswertung" && (
          <Auswertung transactions={transactions} accounts={accounts} categories={categories} ingBalance={ingBalance} trGesamt={trGesamt} kontoauszuege={kontoauszuege} fixedCosts={fixedCosts} />
        )}
        {activeTab === "autokredit" && (
          <Autokredit balances={balances} einstellungen={einstellungen} kredit={kreditKonfiguration} planVerlauf={kreditPlanVerlauf}
            kreditBuchungen={kreditBuchungen} kreditCheckliste={kreditCheckliste} transactions={transactions}
            onAddBuchung={handleKreditBuchungCreate} onDeleteBuchung={handleKreditBuchungDelete} onToggleChecklisteItem={handleKreditChecklisteToggle}
            onWaehleStrategie={handleKreditStrategieWaehlen} />
        )}
        {activeTab === "einstellungen" && (
          <Einstellungen
            supabaseUrl={supabaseUrl} supabaseAnonKey={supabaseAnonKey} onApplySupabaseUrl={applySupabaseUrl} onApplySupabaseAnonKey={applySupabaseAnonKey}
            onDownloadBackup={downloadBackup} onDownloadJahresbericht={downloadJahresbericht} onManualSync={() => syncFromRemote(false).then(() => processQueue())} queueCount={queueCount}
            lockConfigured={lockConfigured} onSetupLock={() => setShowLockSetup(true)} isLight={isLight}
            onDisableLock={() => { localStorage.removeItem(LOCK_PIN_HASH_KEY); localStorage.removeItem(LOCK_PIN_SALT_KEY); localStorage.removeItem(LOCK_WEBAUTHN_KEY); setLockConfigured(false); }} />
        )}
      </main>

      <nav className="fixed inset-x-0 bottom-0 z-30 flex items-center justify-around border-t border-zinc-800 bg-zinc-950/95 px-1 py-1.5 backdrop-blur lg:hidden">
        {primaryTabs.map((t) => (
          t.id === "assistent" ? (
            <button key={t.id} onClick={handleAssistentTap} aria-label="Finz, Sprachaufnahme starten" className="flex flex-1 flex-col items-center justify-center gap-0.5 rounded-lg py-1.5">
              <AssistentKopfIcon zustand="idle" size={42} />
            </button>
          ) : (
            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-1 flex-col items-center gap-0.5 rounded-lg py-1.5 text-[10.5px] ${activeTab === t.id ? "text-emerald-400" : "text-zinc-500"}`}>
              <Icon name={t.icon} size={19} />{t.label}
            </button>
          )
        ))}
        <button onClick={() => setShowMoreMenu(true)} className={`flex flex-1 flex-col items-center gap-0.5 rounded-lg py-1.5 text-[10.5px] ${secondaryTabs.some((t) => t.id === activeTab) ? "text-emerald-400" : "text-zinc-500"}`}>
          <Icon name="more" size={19} />Mehr
        </button>
      </nav>

      {showMoreMenu && (
        <div className="fixed inset-0 z-40 flex items-end bg-black/60 backdrop-blur-sm lg:hidden" onClick={() => setShowMoreMenu(false)}>
          <div className="w-full rounded-t-2xl border-t border-zinc-800 bg-zinc-950 p-3 pb-6" onClick={(e) => e.stopPropagation()}>
            <div className="mx-auto mb-3 h-1 w-10 rounded-full bg-zinc-700" />
            {secondaryTabs.map((t) => (
              <button key={t.id} onClick={() => { setActiveTab(t.id); setShowMoreMenu(false); }} className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm ${activeTab === t.id ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-300 hover:bg-zinc-800/50"}`}>
                <Icon name={t.icon} size={18} />{t.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {editingTx && <EditModal tx={editingTx} accounts={accounts} categories={categories} transactions={transactions} onClose={() => setEditingTx(null)} onSave={(f) => handleAddOrUpdate(f, true)} />}
      {confirmDeleteId && <ConfirmModal title="Buchung löschen?" message="Diese Aktion entfernt die Buchung endgültig im Sheet und berechnet alle Salden neu." onCancel={() => setConfirmDeleteId(null)} onConfirm={() => handleDelete(confirmDeleteId)} />}
      <Toast toast={toast} onClose={() => setToast(null)} />
      {showTransferPopup && (
        <GehaltTransferPopup betrag={verteilungAktuell.aufTR} laedt={erledigtLaedt} onSpaeter={() => setShowTransferPopup(false)} onErledigt={bestaetigeTransferErledigt} />
      )}
    </div>
  );
}

const PotRow = memo(function PotRow({ a, val, hatStartbetrag, startbetrag }) {
  return (
    <div className="flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
      <div className="flex items-center gap-2.5">
        <AccountIcon name={a.name} fallbackColor={a.farbe} balance={val} />
        <span className="text-sm text-zinc-300">{a.name}{hatStartbetrag ? ` (${eur(startbetrag)})` : ""}</span>
      </div>
      <span className={`text-sm font-medium tabular-nums ${amountColor(val)}`}>{eur(val)}</span>
    </div>
  );
});

const ToepfeKarussell = memo(function ToepfeKarussell({ virtualAccounts, balances, potAllocations }) {
  const scrollRef = useRef(null);
  const [seite, setSeite] = useState(0);

  const ausgaberest = virtualAccounts.find((a) => a.name === "Ausgaberest");
  const karussellToepfe = virtualAccounts.filter((a) => a.name !== "Ausgaberest");
  const seiten = [];
  for (let i = 0; i < karussellToepfe.length; i += 3) seiten.push(karussellToepfe.slice(i, i + 3));

  const budgetrestSumme = POTS_BUDGETREST.reduce((s, name) => s + (balances[name] || 0), 0);
  const aktuellerMonatsname = MONATSNAMEN_VOLL[new Date().getMonth()];

  const handleScroll = () => {
    const el = scrollRef.current;
    if (!el) return;
    const idx = Math.round(el.scrollLeft / el.clientWidth);
    setSeite(idx);
  };

  return (
    <div className="min-w-0 space-y-3">
      {seiten.length > 0 && (
        <>
          <div ref={scrollRef} onScroll={handleScroll} className="flex min-w-0 snap-x snap-mandatory gap-3 overflow-x-auto pb-1" style={{ scrollbarWidth: "none" }}>
            {seiten.map((gruppe, i) => (
              <div key={i} className="karussell-seite flex w-full shrink-0 snap-center flex-col gap-2 rounded-2xl border border-emerald-500/20 p-2.5">
                {gruppe.map((a) => {
                  const val = balances[a.name] || 0;
                  const hatStartbetrag = !POTS_OHNE_STARTBETRAG.includes(a.name) && (potAllocations[a.name] || 0) > 0;
                  return <PotRow key={a.id} a={a} val={val} hatStartbetrag={hatStartbetrag} startbetrag={potAllocations[a.name] || 0} />;
                })}
              </div>
            ))}
          </div>
          {seiten.length > 1 && (
            <div className="flex justify-center gap-1.5">
              {seiten.map((_, i) => (
                <span key={i} className={`h-1.5 w-1.5 rounded-full ${i === seite ? "bg-emerald-400" : "bg-zinc-700"}`} />
              ))}
            </div>
          )}
        </>
      )}
      {ausgaberest && (
        <PotRow a={ausgaberest} val={balances["Ausgaberest"] || 0} hatStartbetrag={false} startbetrag={0} />
      )}
      <div className="flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
        <div className="flex items-center gap-2.5">
          <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-600"><Icon name="coinstack" size={20} className="text-white" /></div>
          <span className="text-sm text-zinc-300">Budgetrest ({aktuellerMonatsname})</span>
        </div>
        <span className={`text-sm font-medium tabular-nums ${amountColor(budgetrestSumme)}`}>{eur(budgetrestSumme)}</span>
      </div>
    </div>
  );
});

function StatCard({ label, value, icon, accent, small, logos, hidden }) {
  const accentMap = { emerald: "text-emerald-400 bg-emerald-500/10", cyan: "text-cyan-400 bg-cyan-500/10", amber: "text-amber-400 bg-amber-500/10", violet: "text-violet-400 bg-violet-500/10" };
  return (
    <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
      {logos ? (
        <div className="mb-3 flex items-center gap-1.5">
          {logos.map((src, i) => (
            <div key={i} className="h-7 w-7 overflow-hidden rounded-lg"><img src={src} alt="" className="h-full w-full object-cover" /></div>
          ))}
        </div>
      ) : (
        <div className={`mb-3 flex h-8 w-8 items-center justify-center rounded-lg ${accentMap[accent]}`}><Icon name={icon} size={16} /></div>
      )}
      <p className="text-[11px] text-zinc-500">{label}</p>
      <p className={`mt-0.5 font-semibold tabular-nums text-zinc-100 ${small ? "text-[15px]" : "text-lg"}${blurCls(hidden)}`}>{value}</p>

}

// memo aus demselben Grund wie bei Journal (siehe dort) - alle Props
// kommen mittlerweile aus useMemo/useCallback und bleiben zwischen
// reinen Sync-Ticks (z.B. "Geräte online") unverändert.
const Dashboard = memo(function Dashboard({ accounts, balances, realAccounts, virtualAccounts, ingBalance, trFrei, trGesamt, gebundenesBudget, gesamtvermoegen, monatEinnahmen, monatAusgaben, transactions, potAllocations, onGoBuchen, isLight, betraegeVersteckt, onHideBetraege, onRequestRevealBetraege }) {
  const recent = transactions.slice(0, 4);
  const heute = new Date();
  const istMonatsende = heute.getDate() >= new Date(heute.getFullYear(), heute.getMonth() + 1, 0).getDate() - 2;
  const aufgebrauchteToepfe = virtualAccounts.filter((a) => {
    if (POTS_OHNE_STARTBETRAG.includes(a.name)) return false;
    if (!(potAllocations[a.name] > 0)) return false;
    return (balances[a.name] || 0) <= 0;
  });

  // Echter 14-Tage-Verlauf des Gesamtvermögens aus dem Journal rekonstruiert
  // (siehe berechneGesamtvermoegenVerlauf) - keine erfundenen/Platzhalter-
  // Werte für den Trend in der Hero-Karte.
  const verlauf = useMemo(
    () => berechneGesamtvermoegenVerlauf(transactions, gesamtvermoegen, 42),
    [transactions, gesamtvermoegen]
  );
  const deltaVerlauf = Math.round((verlauf.werte[verlauf.werte.length - 1] - verlauf.werte[0]) * 100) / 100;
  const { linie, flaeche } = useMemo(() => sparklinePfade(verlauf.werte, 300, 52, 2), [verlauf]);

  return (
    <div className="space-y-6">
      {aufgebrauchteToepfe.length > 0 && !istMonatsende && (
        <div className="rounded-xl border border-rose-500/30 bg-rose-500/5 px-4 py-2.5 text-[12.5px] text-rose-200">
          <span className="font-medium">Budget aufgebraucht:</span> {aufgebrauchteToepfe.map((a) => a.name).join(", ")} {aufgebrauchteToepfe.length === 1 ? "ist" : "sind"} vor Monatsende bereits leer.
        </div>
      )}

      <div className="dash-hero relative overflow-hidden rounded-[22px] border p-5">
        <div className="flex items-start justify-between">
          <div>
            <p className="text-[11.5px] font-medium text-zinc-400">Gesamtvermögen</p>
            <p className="mt-0.5 text-[11px] text-zinc-500">ING + Trade Republic</p>
          </div>
          <button
            onClick={betraegeVersteckt ? onRequestRevealBetraege : onHideBetraege}
            title={betraegeVersteckt ? "Beträge einblenden (PIN nötig)" : "Beträge ausblenden"}
            className="rounded-lg p-1.5 text-zinc-500 hover:bg-zinc-800/60 hover:text-zinc-300"
          >
            <Icon name={betraegeVersteckt ? "eyeOff" : "eye"} size={15} />
          </button>
        </div>
        <p className={`mt-2 text-[32px] font-bold tabular-nums tracking-tight text-zinc-100${blurCls(betraegeVersteckt)}`}>{amountDisplay(gesamtvermoegen, betraegeVersteckt)}</p>
        {!betraegeVersteckt && (
          <p className={`mt-1 flex items-center gap-1.5 text-[11.5px] font-medium ${deltaVerlauf >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
            <svg width="9" height="9" viewBox="0 0 10 10" className={deltaVerlauf >= 0 ? "" : "rotate-180"}><path d="M5 1l4 6H1z" fill="currentColor" /></svg>
            {eur(Math.abs(deltaVerlauf))} · 6 Wochen
          </p>
        )}
        <svg className="mt-3 w-full" height="52" viewBox="0 0 300 52" preserveAspectRatio="none">
          <defs>
            <linearGradient id="dashVerlaufGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#10b981" stopOpacity="0.32" />
              <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={flaeche} fill="url(#dashVerlaufGradient)" />
          <path d={linie} fill="none" stroke="#34d399" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-2xl border border-zinc-800/80 bg-zinc-900/40 p-3.5">
          <AccountIcon name="Trade Republic" balance={trGesamt} />
          <p className="mt-2.5 text-[11px] text-zinc-500">Trade Republic</p>
          <p className={`mt-0.5 text-[15.5px] font-semibold tabular-nums ${amountColor(trGesamt)}${blurCls(betraegeVersteckt)}`}>{amountDisplay(trGesamt, betraegeVersteckt)}</p>
        </div>
        <div className="rounded-2xl border border-zinc-800/80 bg-zinc-900/40 p-3.5">
          <AccountIcon name="ING" balance={ingBalance} />
          <p className="mt-2.5 text-[11px] text-zinc-500">ING</p>
          <p className={`mt-0.5 text-[15.5px] font-semibold tabular-nums ${amountColor(ingBalance)}${blurCls(betraegeVersteckt)}`}>{amountDisplay(ingBalance, betraegeVersteckt)}</p>
        </div>
      </div>

      <div className="flex items-start gap-2.5 rounded-2xl border border-emerald-500/20 bg-emerald-500/5 px-4 py-3">
        <Icon name="info" size={15} className="mt-0.5 shrink-0 text-emerald-400" />
        <p className="text-[11.5px] leading-relaxed text-emerald-200"><span className="font-semibold">Kontrollhinweis:</span> Abweichungen zu Trade Republic/ING zeigen eine fehlende oder falsche Buchung an.</p>
      </div>

      <div className="grid min-w-0 gap-4 lg:grid-cols-5">

                <AccountIcon name="Trade Republic" fallbackColor="#10b981" balance={trGesamt} />
