<!DOCTYPE html>
<html lang="de">
<head>

<style>
  body { background:#09090b; margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:4px; }

  /* ============ Helles Farbschema (Umschalter) ============ */
  html.light body { background:#f4f4f3; }
  html.light ::-webkit-scrollbar-thumb { background:#d4d4d8; }

  html.light .bg-zinc-950,
  html.light .bg-zinc-950\/95 { background-color:#f4f4f3 !important; }
  html.light .bg-zinc-900,
  html.light .bg-zinc-900\/40,
  html.light .bg-zinc-900\/50,
  html.light .bg-zinc-900\/60 { background-color:#ffffff !important; }
  html.light .bg-zinc-800,
  html.light .bg-zinc-800\/60,
  html.light .bg-zinc-800\/70 { background-color:#ffffff !important; }
  html.light .hover\:bg-zinc-800:hover,
  html.light .hover\:bg-zinc-800\/40:hover { background-color:#f4f4f5 !important; }

  html.light .border-zinc-800,
  html.light .border-zinc-800\/60 { border-color:#e4e4e7 !important; }
  html.light .border-zinc-700 { border-color:#d4d4d8 !important; }
  html.light .hover\:border-zinc-600:hover { border-color:#a1a1aa !important; }

  html.light .text-zinc-100,
  html.light .text-zinc-200 { color:#18181b !important; }
  html.light .text-zinc-300 { color:#3f3f46 !important; }
  html.light .text-zinc-400,
  html.light .text-zinc-500 { color:#71717a !important; }
  html.light .text-zinc-600 { color:#a1a1aa !important; }
  html.light .hover\:text-zinc-200:hover { color:#18181b !important; }

  html.light .text-emerald-400 { color:#059669 !important; }
  html.light .text-emerald-300,
  html.light .hover\:text-emerald-300:hover { color:#047857 !important; }
  html.light .text-rose-400,
  html.light .hover\:text-rose-400:hover { color:#e11d48 !important; }
  html.light .text-cyan-400 { color:#0891b2 !important; }
  html.light .text-cyan-300 { color:#0e7490 !important; }
  html.light .text-cyan-200 { color:#155e75 !important; }
  html.light .text-amber-400 { color:#b45309 !important; }
  html.light .text-amber-300 { color:#92400e !important; }
  html.light .text-amber-200 { color:#78350f !important; }
  html.light .text-violet-400 { color:#7c3aed !important; }

  html.light input, html.light select, html.light textarea { color-scheme: light; }

  .karussell-seite { background-color: rgba(16, 185, 129, 0.14); border-color: rgba(16, 185, 129, 0.5) !important; }
  html.light .karussell-seite { background-color: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.4) !important; }

  /* Dashboard-Hero "Gesamtvermögen" - eigene Klasse statt Inline-Style, damit
     das helle Farbschema (siehe oben) auch hier greift. */
  .dash-hero { background: radial-gradient(135% 170% at 8% -15%, #103b32 0%, #0b2420 32%, #0f0f11 68%); border-color:#1e3a32; }
  html.light .dash-hero { background: radial-gradient(135% 170% at 8% -15%, #d1fae5 0%, #ecfdf5 40%, #ffffff 75%); border-color:#a7f3d0 !important; }

  /* "3D"-Kartenstil (Vorschau-Variante C), app-weit auf jede Karte mit der
     Standard-Kombination aus Rand+Hintergrund angewendet - gezielt über
     Mehrfach-Klassen-Selektoren (border-zinc-800* UND bg-zinc-900/*
     gleichzeitig), nicht über jede einzelne der ~40 Fundstellen in der JSX,
     damit das konsistent bleibt und sich künftige Karten automatisch
     einreihen. Reiner CSS-Zusatz, keine Layout-/Strukturänderung.
     html.light-Variante nach demselben Muster wie oben, mit ausreichend
     Spezifität (drei Klassen), um die bestehende helle Flächenfarbe korrekt
     zu überschreiben statt nur zu konkurrieren. */
  .border-zinc-800.bg-zinc-900\/40, .border-zinc-800.bg-zinc-900\/50, .border-zinc-800.bg-zinc-900\/60,
  .border-zinc-800\/60.bg-zinc-900\/40, .border-zinc-800\/60.bg-zinc-900\/50, .border-zinc-800\/60.bg-zinc-900\/60,
  .border-zinc-800\/80.bg-zinc-900\/40, .border-zinc-800\/80.bg-zinc-900\/50, .border-zinc-800\/80.bg-zinc-900\/60 {
    background: linear-gradient(165deg, #23232a 0%, #0e0e10 100%) !important;
    border-color: #34343c !important;
    box-shadow: 0 16px 32px -14px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.4), inset 0 1.5px 0 rgba(255,255,255,0.09), inset 0 -2px 0 rgba(0,0,0,0.4);
  }
  html.light .border-zinc-800.bg-zinc-900\/40, html.light .border-zinc-800.bg-zinc-900\/50, html.light .border-zinc-800.bg-zinc-900\/60,
  html.light .border-zinc-800\/60.bg-zinc-900\/40, html.light .border-zinc-800\/60.bg-zinc-900\/50, html.light .border-zinc-800\/60.bg-zinc-900\/60,
  html.light .border-zinc-800\/80.bg-zinc-900\/40, html.light .border-zinc-800\/80.bg-zinc-900\/50, html.light .border-zinc-800\/80.bg-zinc-900\/60 {
    background: linear-gradient(165deg, #ffffff 0%, #f4f4f5 100%) !important;
    border-color: #e4e4e7 !important;
    box-shadow: 0 10px 22px -16px rgba(0,0,0,0.14), 0 1px 2px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.9) !important;
  }

  html.light .bg-rose-500\/5.text-rose-200 { background-color:#fef2f2 !important; color:#9f1239 !important; border-color:#fca5a5 !important; }

  /* ============ Strichmännchen-Maskottchen: Animationen je Zustand ============ */
  /* Wartend: Schritt vor, auf die Uhr schauen, Schritt zurück */
  @keyframes strichSchrittPosition {
    0%, 8%   { transform: translateX(0); }
    22%      { transform: translateX(16px); }
    58%      { transform: translateX(16px); }
    74%      { transform: translateX(0); }
    100%     { transform: translateX(0); }
  }
  .strich-wartend-wrapper { animation: strichSchrittPosition 5.5s ease-in-out infinite; }

  @keyframes strichBeinVorne {
    0%, 8%   { transform: rotate(0deg); }
    22%      { transform: rotate(20deg); }
    58%      { transform: rotate(20deg); }
    74%      { transform: rotate(0deg); }
    100%     { transform: rotate(0deg); }
  }
  .strich-wartend-bein-vorne { transform-origin: 65px 76px; animation: strichBeinVorne 5.5s ease-in-out infinite; }

  @keyframes strichBeinHinten {
    0%, 8%   { transform: rotate(0deg); }
    22%      { transform: rotate(-10deg); }
    58%      { transform: rotate(-10deg); }
    74%      { transform: rotate(0deg); }
    100%     { transform: rotate(0deg); }
  }
  .strich-wartend-bein-hinten { transform-origin: 65px 76px; animation: strichBeinHinten 5.5s ease-in-out infinite; }

  @keyframes strichOberarmUhr {
    0%, 18%  { transform: rotate(0deg); }
    32%      { transform: rotate(-55deg); }
    54%      { transform: rotate(-55deg); }
    68%      { transform: rotate(0deg); }
    100%     { transform: rotate(0deg); }
  }
  .strich-wartend-oberarm { transform-origin: 65px 50px; animation: strichOberarmUhr 5.5s ease-in-out infinite; }

  @keyframes strichUnterarmUhr {
    0%, 18%  { transform: rotate(0deg); }
    32%      { transform: rotate(-75deg); }
    54%      { transform: rotate(-75deg); }
    68%      { transform: rotate(0deg); }
    100%     { transform: rotate(0deg); }
  }
  .strich-wartend-unterarm { transform-origin: 77px 64px; animation: strichUnterarmUhr 5.5s ease-in-out infinite; }

  @keyframes strichKopfNeigenUhr {
    0%, 18%  { transform: rotate(0deg); }
    32%      { transform: rotate(10deg); }
    54%      { transform: rotate(10deg); }
    68%      { transform: rotate(0deg); }
    100%     { transform: rotate(0deg); }
  }
  .strich-wartend-kopf { transform-origin: 65px 38px; animation: strichKopfNeigenUhr 5.5s ease-in-out infinite; }

  /* Verbunden: zufriedenes Daumen-hoch */
  @keyframes strichDaumenPuls { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  .strich-daumen-puls { transform-origin: 82px 39px; animation: strichDaumenPuls 1.4s ease-in-out infinite; }

  /* Sync: Telefonat, Verbindungspunkte pulsieren */
  @keyframes strichVerbindungPuls { 0%,100% { opacity: 0.35; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }
  .strich-verbindung-punkt { animation: strichVerbindungPuls 1.2s ease-in-out infinite; transform-origin: center; }
  .strich-verbindung-punkt:nth-child(2) { animation-delay: 0.15s; }
  .strich-verbindung-punkt:nth-child(3) { animation-delay: 0.3s; }

  /* Fehler: wütend hüpfen, Schild wackelt schnell */
  @keyframes strichHuepfen {
    0%, 100% { transform: translateY(0); }
    25%      { transform: translateY(-16px); }
    50%      { transform: translateY(0); }
    75%      { transform: translateY(-16px); }
  }
  .strich-huepf-wrapper { animation: strichHuepfen 0.7s ease-in-out infinite; }
  @keyframes strichSchildWackelnSchnell { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  .strich-schild-wackel-schnell { transform-origin: 65px 20px; animation: strichSchildWackelnSchnell 0.35s ease-in-out infinite; }
  @keyframes strichSchattenPulsSchnell { 0%,100% { transform: scaleX(1); opacity: 0.3; } 50% { transform: scaleX(0.7); opacity: 0.15; } }
  .strich-schatten-puls { transform-origin: 65px 116px; animation: strichSchattenPulsSchnell 0.7s ease-in-out infinite; }

  /* Rechnend/Bucht: Geld wird in den Papierkorb geworfen */
  @keyframes strichWurfArm {
    0%, 20%  { transform: rotate(35deg); }
    38%      { transform: rotate(-55deg); }
    55%, 100%{ transform: rotate(35deg); }
  }
  .strich-wurf-arm { transform-origin: 32px 50px; animation: strichWurfArm 2.6s ease-in-out infinite; }

  @keyframes strichGeldFlugKorb {
    0%, 32%  { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
    40%      { opacity: 1; transform: translate(15px, -16px) scale(0.85); }
    62%      { opacity: 1; transform: translate(40px, 4px) scale(1); }
    72%, 100%{ opacity: 0; transform: translate(50px, 26px) scale(0.35); }
  }
  .strich-geld-flug-korb { animation: strichGeldFlugKorb 2.6s ease-in-out infinite; }

  @keyframes strichKorbWackeln {
    0%, 68%  { transform: rotate(0deg); }
    72%      { transform: rotate(-4deg); }
    78%      { transform: rotate(3deg); }
    84%, 100%{ transform: rotate(0deg); }
  }
  .strich-korb-wackeln { transform-origin: 106px 100px; animation: strichKorbWackeln 2.6s ease-in-out infinite; }

  @keyframes strichPoofPuls {
    0%, 68%  { opacity: 0; transform: scale(0.4); }
    74%      { opacity: 0.9; transform: scale(1.2); }
    84%, 100%{ opacity: 0; transform: scale(1.6); }
  }
  .strich-poof { animation: strichPoofPuls 2.6s ease-in-out infinite; transform-origin: 103px 70px; }

  /* Hört zu: Schallwellen pulsieren */
  @keyframes strichWellePuls { 0% { opacity: 0.9; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.6); } }
  .strich-schallwelle { transform-origin: 89px 16px; animation: strichWellePuls 1.3s ease-out infinite; }
  .strich-schallwelle:nth-child(2) { animation-delay: 0.4s; }
  .strich-schallwelle:nth-child(3) { animation-delay: 0.8s; }

  /* Spricht: Mund im Sprech-Rhythmus, Ton-Balken */
  @keyframes strichMundSprechen { 0%,100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
  .strich-mund-sprechen { transform-origin: 65px 34px; animation: strichMundSprechen 0.35s ease-in-out infinite; }
  @keyframes strichTonLinie { 0%,100% { opacity: 0.2; transform: scaleY(0.5); } 50% { opacity: 1; transform: scaleY(1); } }
  .strich-ton-linie { animation: strichTonLinie 0.5s ease-in-out infinite; }
  .strich-ton-linie:nth-child(2) { animation-delay: 0.12s; }
  .strich-ton-linie:nth-child(3) { animation-delay: 0.24s; }

  /* ============ Assistent-Kopf: Animationen je Zustand ============ */
  @keyframes kopfBlinzeln { 0%, 92% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } 96%, 100% { transform: scaleY(1); } }
  .kopf-auge { transform-origin: center; animation: kopfBlinzeln 4s ease-in-out infinite; }
  .kopf-auge.re { animation-delay: 0.02s; }

  @keyframes kopfNeigenSanft { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .kopf-neigen { transform-origin: 50px 82px; animation: kopfNeigenSanft 4.5s ease-in-out infinite; }

  @keyframes kopfMundNeutralFade { 0%, 35% { opacity: 1; } 45%, 85% { opacity: 0; } 95%, 100% { opacity: 1; } }
  @keyframes kopfMundLaechelnFade { 0%, 35% { opacity: 0; } 45%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
  .kopf-mund-neutral { animation: kopfMundNeutralFade 6s ease-in-out infinite; }
  .kopf-mund-laecheln { animation: kopfMundLaechelnFade 6s ease-in-out infinite; }

  @keyframes kopfBrauenHeben { 0%, 60% { transform: translateY(0); } 70% { transform: translateY(-1.5px); } 80%, 100% { transform: translateY(0); } }
  .kopf-brauen-idle { animation: kopfBrauenHeben 6s ease-in-out infinite; transform-origin: center; }

  @keyframes kopfWellePuls { 0% { opacity: 0.9; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.6); } }
  .kopf-schallwelle { transform-origin: 84px 40px; animation: kopfWellePuls 1.3s ease-out infinite; }
  .kopf-schallwelle:nth-child(2) { animation-delay: 0.4s; }
  .kopf-schallwelle:nth-child(3) { animation-delay: 0.8s; }

  @keyframes kopfMundSprechen { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
  .kopf-mund-sprechen { transform-origin: 50px 62px; animation: kopfMundSprechen 0.35s ease-in-out infinite; }
  @keyframes kopfTonLinie { 0%, 100% { opacity: 0.2; transform: scaleY(0.5); } 50% { opacity: 1; transform: scaleY(1); } }
  .kopf-ton-linie { animation: kopfTonLinie 0.5s ease-in-out infinite; }
  .kopf-ton-linie:nth-child(2) { animation-delay: 0.12s; }
  .kopf-ton-linie:nth-child(3) { animation-delay: 0.24s; }

  @keyframes kopfPunktPuls { 0%, 100% { opacity: 0.3; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }
  .kopf-denk-punkt { animation: kopfPunktPuls 1.2s ease-in-out infinite; transform-origin: center; }
  .kopf-denk-punkt:nth-child(2) { animation-delay: 0.15s; }
  .kopf-denk-punkt:nth-child(3) { animation-delay: 0.3s; }
  @keyframes kopfBlickSeite { 0%, 40% { transform: translateX(0); } 55%, 85% { transform: translateX(1.4px); } 100% { transform: translateX(0); } }
  .kopf-pupille { animation: kopfBlickSeite 3.5s ease-in-out infinite; }

  /* Winken: bleibt die meiste Zeit unsichtbar, taucht alle ~16s kurz auf - */
  /* dieselbe Technik wie beim Blinzeln/Neigen oben, nur mit größerem Abstand. */
  @keyframes kopfWinken {
    0%, 78% { opacity: 0; transform: rotate(0deg); }
    80% { opacity: 1; transform: rotate(-4deg); }
    83% { transform: rotate(-16deg); }
    87% { transform: rotate(14deg); }
    91% { transform: rotate(-14deg); }
    95% { transform: rotate(8deg); }
    98% { opacity: 1; transform: rotate(0deg); }
    100% { opacity: 0; transform: rotate(0deg); }
  }
  .kopf-arm-winken { transform-origin: 70px 90px; animation: kopfWinken 16s ease-in-out infinite; }
</style>
</head>

<script>
  try {
    if (localStorage.getItem('finanzindex_theme') === 'light') document.documentElement.classList.add('light');
  } catch (e) {}
</script>
<div id="root"></div>
<script>
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      root.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:20px;border:1px solid #f43f5e;border-radius:12px;background:#1c1917;color:#fda4af;font-family:ui-sans-serif,system-ui;font-size:14px;line-height:1.6;">' +
        '<strong>Die App konnte nicht starten.</strong><br/>Fehlermeldung: ' + (e.message || 'unbekannt') +
        '<br/><br/>Öffne die Browser-Konsole (F12 → Console) für Details, oder lade die Datei erneut herunter.</div>';
    }
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, memo } = React;

/* ============================== Konfiguration ============================== */

// Trade Republic und ING sind echte Bankkonten, alle anderen Namen im
// Konten-Blatt sind virtuelle Budget-Töpfe, die real auf Trade Republic liegen.
const REAL_ACCOUNTS = ["Trade Republic", "ING"];
// Icon + Hintergrundfarbe für jedes Konto/jeden Topf. Bei ING, Trade Republic
// und Model 3 sind das bewusst eigene, generische Symbole (keine
// Original-Logos, siehe Markenrecht) in an die Marke angelehnten, aber
// gedämpften Farben. Alle anderen Farben sind bewusst dunkel/gedämpft
// gewählt, damit das weiße Icon darauf gut lesbar bleibt.
const ACCOUNT_BADGES = {
  "Trade Republic": { icon: "trend", bg: "#1f6f5c" },
  "ING": { icon: "landmark", bg: "#c96a2e" },
  "Model 3": { icon: "car", bg: "#8a3d3d" },
  "Ablösung": { icon: "lock", bg: "#275d8a" },
  "Laden": { icon: "bolt", bg: "#0e7490" },
  "E-Liquids": { icon: "vape", bg: "#6b5b73" },
  "Lebensmittel": { icon: "cart", bg: "#b45309" },
  "Freizeit": { icon: "umbrella", bg: "#6d28d9" },
  "Kosmetik": { icon: "lipstick", bg: "#be185d" },
  "Rücklage": { icon: "piggy", bg: "#a16207" },
  "Jahres Rückstellung": { icon: "wrench", bg: "#0369a1" },
  "Transit": { icon: "transfer", bg: "#1d4ed8" },
  "Abo & ETF": { icon: "tv", bg: "#7e22ce" },
  "Puffer": { icon: "shield", bg: "#15803d" },
  "Ausgaberest": { icon: "moneybag", bg: "#4338ca" },
};
// Diese Töpfe bekommen keinen einzelnen "monatlichen Startbetrag" zugewiesen
// (Transit wird aus mehreren Fixkosten-Positionen gespeist, Puffer ist ein
// reiner Reservetopf) und zeigen daher keinen Klammer-Betrag.
// "Ablösung" bekommt keine feste monatliche Fixkosten-Position, sondern wird
// unregelmäßig aus anderen Töpfen befüllt - deshalb ebenfalls ohne
// Klammer-Betrag.
const POTS_OHNE_STARTBETRAG = ["Transit", "Puffer", "Ablösung"];
// Diese Töpfe werden beim Monatsabschluss NICHT in den Ausgaberest gefegt,
// da sie Spar-/Rücklagentöpfe sind, kein monatliches Ausgabenbudget.
const POTS_OHNE_AUSGABEREST = ["Model 3", "Rücklage", "Jahres Rückstellung", "Transit", "Ausgaberest", "Ablösung"];
// Für diese Töpfe wird im Prognose-Tab eine 24-Monats-Vorschau berechnet.
// "Ablösung" bewusst NICHT hier: der Topf hat keine Zinssatz-Zeile in
// "Einstellungen" und keine automatische monatliche Zuweisung - er wird im
// eigenen Autokredit-Tab mit einer anderen (einfacheren) Logik geführt.
const PROGNOSE_TOEPFE = ["Model 3", "Rücklage"];
const ACCOUNT_COLOR = (name) => (ACCOUNT_BADGES[name] ? ACCOUNT_BADGES[name].bg : "#94a3b8");
// Dezenter Verlauf statt Flächenfarbe für die Topf-Kacheln.
function adjustHexColor(hex, amt) {
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const num = parseInt(hex.slice(1), 16);
  const r = clamp(((num >> 16) & 0xff) + amt);
  const g = clamp(((num >> 8) & 0xff) + amt);
  const b = clamp((num & 0xff) + amt);
  return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}
function potGradient(hex) {
  return `linear-gradient(135deg, ${adjustHexColor(hex, 28)} 0%, ${hex} 55%, ${adjustHexColor(hex, -22)} 100%)`;
}

// ============================== Autokredit (Tesla Model 3) ==============================
// WICHTIG: index.html wird auf ein ÖFFENTLICHES GitHub hochgeladen (Hosting),
// ist also für jeden einsehbar - echte Vertragsdaten (Kreditgeber,
// Finanzierungsnummer, Nettodarlehen, Zinssatz, Rate, Schlussrate...) dürfen
// deshalb NICHT hier als Konstante stehen, sondern kommen zur Laufzeit aus
// Supabase (Tabelle "autokredit_konfiguration", analog zu "einstellungen").
// Hier bleiben nur unkritische Anzeige-/Rechenparameter.
//
// "Model 3" wächst (laut bestehender Fixkosten-Automatik, unverändert)
// monatlich um diesen Betrag - bewusst OHNE Zins-Annahme in der

// insensitiver Teilstring-Abgleich, siehe faq.html). Reihenfolge ist
// bewusst so gewählt, dass speziellere Treffer (z.B. "Uber Eats") vor

function merchantKeywordMatches(text, keyword) {
  const t = text.toLowerCase();
  const k = keyword.toLowerCase();
  if (k.length <= 3) {
    const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`(^|[^a-zà-öø-ÿ0-9])${escaped}([^a-zà-öø-ÿ0-9]|$)`, "i");
    return re.test(t);
  }
  return t.includes(k);
}

function findMerchantLogoKey(titel) {
  if (!titel) return null;
  for (const entry of MERCHANT_MATCH) {
    for (const kw of entry.match) {
      if (merchantKeywordMatches(titel, kw)) return entry.key;
    }
  }
  return null;
}

// memo: verhindert, dass jede Zeile bei jedem Sync-Tick (z.B. "Geräte
// online"-Update alle 12s, unabhängig von Buchungen) unnötig neu die
// Logo-Zuordnung berechnet - titel/isLight sind einfache Werte, die
// React zuverlässig vergleichen kann.
// Töpfe, die statt ihres Namens ein Bank-Logo zeigen (siehe AccountIcon) -
// für diese beiden ergibt ein Topf-Icon als Buchungs-Ersatzlogo keinen Sinn.
const MERCHANT_ICON_POT_AUSNAHMEN = ["ING", "Trade Republic"];
function potIconFallbackName(quelle, ziel) {
  if (ACCOUNT_BADGES[ziel] && !MERCHANT_ICON_POT_AUSNAHMEN.includes(ziel)) return ziel;
  if (ACCOUNT_BADGES[quelle] && !MERCHANT_ICON_POT_AUSNAHMEN.includes(quelle)) return quelle;
  return null;
}
const MerchantIcon = memo(function MerchantIcon({ titel, isLight, quelle, ziel }) {
  const key = findMerchantLogoKey(titel);
  if (key && MERCHANT_LOGOS[key]) {
    const src = !isLight && MERCHANT_LOGOS_DARK[key] ? MERCHANT_LOGOS_DARK[key] : MERCHANT_LOGOS[key];
    return (
      <div className="flex h-[34px] w-[34px] shrink-0 items-center justify-center">
        <img src={src} alt="" className="h-full w-full object-contain" />
      </div>
    );
  }
  // Kein Markenlogo gefunden, aber Quelle/Ziel ist ein bekannter Topf (z.B.
  // automatische Monatsbuchungen auf Rücklage, Model 3, ...) - dessen Icon
  // statt eines nichtssagenden grauen Buchstabens nutzen.
  const potName = potIconFallbackName(quelle, ziel);
  if (potName) {
    const badge = ACCOUNT_BADGES[potName];
    return (
      <div className="flex h-[34px] w-[34px] shrink-0 items-center justify-center rounded-[9px]" style={{ background: potGradient(badge.bg) }}>
        <Icon name={badge.icon} size={17} className="text-white" />
      </div>
    );
  }
  const letter = (titel || "").trim().charAt(0).toUpperCase() || "?";
  return (
    <div className="flex h-[34px] w-[34px] shrink-0 items-center justify-center rounded-full bg-zinc-700 text-[13px] font-semibold text-zinc-300">
      {letter}
    </div>
  );
});

// Inhaltlicher Vergleich zweier Geräte-Listen (Performance: der Heartbeat
// liefert alle 12s ein neues Array, meist mit identischem Inhalt - ohne
// diesen Vergleich würde jeder Heartbeat einen unnötigen Re-Render der
// gesamten App auslösen, nur weil die Array-Referenz sich geändert hat).
function geraeteListenGleich(a, b) {
  if (a === b) return true;
  if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    const x = a[i], y = b[i];
    if (x.id !== y.id || x.name !== y.name || x.online !== y.online || x.gesperrt !== y.gesperrt || x.zuletztGesehen !== y.zuletztGesehen) return false;
  }
  return true;
}

const LOCK_PIN_HASH_KEY = "finanzindex_lock_pin_hash";
const LOCK_PIN_SALT_KEY = "finanzindex_lock_pin_salt";
const LOCK_WEBAUTHN_KEY = "finanzindex_lock_webauthn_id";

function isTouchDevice() {
  try { return ("ontouchstart" in window) || navigator.maxTouchPoints > 0; } catch (e) { return false; }
}

function randomHex(byteLen) {
  const arr = new Uint8Array(byteLen);
  crypto.getRandomValues(arr);
  return Array.from(arr).map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ":" + pin);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64) { return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); }

async function webauthnRegister() {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: "Finanzindex" },
      user: { id: userId, name: "nutzer", displayName: "Nutzer" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
      timeout: 60000,
    },
  });
  return bufToB64(cred.rawId);
}

async function webauthnVerify(credentialIdB64) {
  await navigator.credentials.get({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: "public-key", id: b64ToBuf(credentialIdB64) }],
      userVerification: "required",
      timeout: 60000,
    },
  });
  return true; // wirft bei Fehlschlag/Abbruch, kommt sonst nur bei Erfolg hier an
}

// Merkt sich den Zeitpunkt der letzten erfolgreichen Entsperrung NUR für die
// Dauer dieses Browser-Tabs (sessionStorage - verschwindet automatisch beim
// echten Schließen). Damit löst z. B. die Pull-to-Refresh-Geste (kompletter
// Seiten-Neuladen, aber derselbe Tab) nicht jedes Mal erneut die PIN-Abfrage
// aus, solange die letzte Entsperrung noch keine 3 Minuten her ist -
// dieselbe Karenzzeit wie beim Sperren nach Zeit im Hintergrund.
const UNLOCK_GRACE_MS = 3 * 60 * 1000;
function markUnlocked() {
  try { sessionStorage.setItem("finanzindex_unlock_ts", String(Date.now())); } catch (e) {}
}
function wasRecentlyUnlocked() {
  try {
    const ts = Number(sessionStorage.getItem("finanzindex_unlock_ts") || 0);
    return ts > 0 && (Date.now() - ts) < UNLOCK_GRACE_MS;
  } catch (e) { return false; }
}


function loadQueue() {
  try {
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveQueue(queue) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch (e) { /* Speicher nicht verfügbar */ }
}
// Überlagert die vom Server geladenen Transaktionen mit noch nicht
// synchronisierten Warteschlangen-Einträgen, damit lokal wartende Buchungen
// beim Synchronisieren nicht kurzzeitig aus der Ansicht verschwinden.
function mergeWithQueue(serverTx, queue) {
  let result = serverTx;
  queue.forEach((item) => {
    if (item.action === "create") {
      if (!result.some((t) => t.id === item.payload.id)) result = [item.payload, ...result];
    } else if (item.action === "update") {
      result = result.map((t) => (t.id === item.payload.id ? item.payload : t));
    } else if (item.action === "delete") {
      result = result.filter((t) => t.id !== item.payload.id);
    }
  });
  return result;
}
// Gleiches Prinzip wie mergeWithQueue, nur für Fixkosten_Plan-Positionen.
function mergeFixkostenWithQueue(serverFk, queue) {
  let result = serverFk;
  queue.forEach((item) => {
    if (item.action === "fixkosten-create") {
      if (!result.some((f) => f.id === item.payload.id)) result = [...result, item.payload];
    } else if (item.action === "fixkosten-update") {
      result = result.map((f) => (f.id === item.payload.id ? item.payload : f));
    } else if (item.action === "fixkosten-delete") {
      result = result.filter((f) => f.id !== item.payload.id);
    }
  });
  return result;
}

// Rekonstruiert den Gesamtvermögen-Verlauf der letzten "tage" Tage aus dem
// echten Transaktions-Journal - keine erfundenen Werte für den Dashboard-
// Trend. Nur Einnahme/Ausgabe verändern das Gesamtvermögen (ING + Trade
// Republic, inkl. aller virtuellen Töpfe darin, die real Teil des TR-Saldos
// sind); eine Umbuchung verschiebt Geld nur innerhalb dieser Summe und lässt
// sie unverändert. Rückwärts vom heutigen, echten Gesamtvermögen aus: Saldo
// eines Tages = Saldo des Folgetages minus dessen Netto-Zu-/Abfluss.
function berechneGesamtvermoegenVerlauf(transactions, gesamtvermoegenHeute, tage) {
  const heute = new Date();
  const tageISO = Array.from({ length: tage }, (_, i) => {
    const d = new Date(heute);
    d.setDate(d.getDate() - (tage - 1 - i));
    return toISO(d);
  });
  const nettoProTag = Object.fromEntries(tageISO.map((iso) => [iso, 0]));
  transactions.forEach((t) => {
    if (t.typ === "Umbuchung" || !(t.datum in nettoProTag)) return;
    nettoProTag[t.datum] += t.typ === "Einnahme" ? Number(t.betrag) : -Number(t.betrag);
  });
  const werte = new Array(tage);
  let laufend = gesamtvermoegenHeute;
  for (let i = tage - 1; i >= 0; i--) {
    werte[i] = Math.round(laufend * 100) / 100;
    laufend -= nettoProTag[tageISO[i]];
  }
  return { tage: tageISO, werte };
}

// Baut aus einer Werte-Reihe einen SVG-Pfad (Linie) sowie denselben Pfad
// als geschlossene Fläche (für den Verlaufsgradient) - min/max-normiert auf
// die gegebene Breite/Höhe. Bei nur einem einzigen Wert (z.B. brandneue
// Installation ohne Historie) eine flache Linie in der Mitte statt eines
// Fehlers.
function sparklinePfade(werte, width, height, padding) {
  if (werte.length === 0) return { linie: "", flaeche: "" };
  const min = Math.min(...werte);
  const max = Math.max(...werte);
  const range = max - min || 1;
  const stepX = werte.length > 1 ? (width - padding * 2) / (werte.length - 1) : 0;
  const punkte = werte.map((w, i) => {
    const x = padding + i * stepX;
    const y = padding + (height - padding * 2) * (1 - (w - min) / range);
    return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
  });
  const linie = punkte.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x},${y}`).join(" ");
  const flaeche = `${linie} L${punkte[punkte.length - 1][0]},${height} L${punkte[0][0]},${height} Z`;
  return { linie, flaeche };
}
const dateDE = (iso) => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? iso : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); };
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthKey = (iso) => (iso || "").slice(0, 7);
// Wandelt "MM/JJJJ" (Format des Autokredit-Plan-Verlaufs) in denselben
// "JJJJ-MM"-Schlüssel wie monthKey() um, zum Abgleich mit echten Buchungen.
const isoMonatZuMonthKey = (monat) => { const [m, y] = monat.split("/"); return `${y}-${m}`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function parseGermanNumber(v) {
  if (typeof v === "number") return v;
  if (v === null || v === undefined || v === "") return 0;
  let s = String(v).replace(/[^0-9,.\-]/g, "").trim();
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

function parseGermanDate(v) {
  if (!v) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v).slice(0, 10);
  const m = String(v).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (!m) return "";
  return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}

function easterSunday(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}
function germanHolidays(year) {
  const easter = easterSunday(year);
  const add = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  return [new Date(year,0,1), add(easter,-2), add(easter,1), new Date(year,4,1), add(easter,39), add(easter,50), new Date(year,9,3), new Date(year,11,25), new Date(year,11,26)];
}
function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isBankBusinessDay(date){ const day=date.getDay(); if(day===0||day===6) return false; return !germanHolidays(date.getFullYear()).some(h=>sameDate(h,date)); }
function lastBankBusinessDayOfMonth(year, monthIndex){ const d=new Date(year, monthIndex+1, 0); while(!isBankBusinessDay(d)) d.setDate(d.getDate()-1); return d; }
function istLetzterBankgeschaeftstagDesMonats(datum) {
  return sameDate(datum, lastBankBusinessDayOfMonth(datum.getFullYear(), datum.getMonth()));
}
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

// Liefert alle Fixkosten_Plan-Positionen, die für den angegebenen Monat gültig
// sind (Gültig-ab/-bis-Prüfung). Wird sowohl vom Monatslauf als auch von der
// Gehaltsverteilung und den Topf-Startbeträgen verwendet, damit überall
// exakt dieselbe Definition von "aktiv" gilt.
function getActiveFixedCosts(fixedCosts, year, monthIdx) {
  return fixedCosts.filter((f) => {
    const abOk = !f.gueltigAb || f.gueltigAb <= toISO(new Date(year, monthIdx, 28));
    const bisOk = !f.gueltigBis || f.gueltigBis >= toISO(new Date(year, monthIdx, 1));
    return abOk && bisOk;
  });
}

// Summiert je Zielkonto (Topf) alle aktiven Fixkosten-Positionen, die dorthin
// fließen - das ist der "monatliche Startbetrag" dieses Topfes.
function getMonthlyPotAllocations(fixedCosts) {
  const now = new Date();
  const active = getActiveFixedCosts(fixedCosts, now.getFullYear(), now.getMonth());
  const map = {};
  active.forEach((f) => {
    if (!f.ziel || f.ziel === "Extern") return;
    map[f.ziel] = (map[f.ziel] || 0) + Number(f.betrag || 0);
  });
  return map;
}

// Töpfe, die tatsächlich als "zur Seite gelegtes" Sparen zählen - bewusst
// nicht "Puffer" (Ausgabe-Puffer, wird monatlich verrechnet) und nicht die
// übrigen Positionen im Topf "Abo & ETF" (laufende Abo-Kosten, kein Sparen).
const SPAR_ZIELE = ["Rücklage", "Model 3", "Jahres Rückstellung"];

// Diese beiden Ziele sind zwar echtes monatliches Zurücklegen, werden aber
// absehbar wieder verbraucht (Model 3 bei Fälligkeit, Jahresrückstellung im
// Laufe des Jahres) - anders als Rücklage/ETF, die unbefristet angespart
// werden. Wird in der Sparen-Ansicht als "Verbrauchssparen" gekennzeichnet.
const VERBRAUCHSSPAREN_ZIELE = ["Model 3", "Jahres Rückstellung"];

// Fasst die aktiven Fixkosten-Positionen zusammen, die monatlich fürs Sparen
// zur Seite gelegt werden: Rücklage, Model 3, Jahresrückstellung, sowie
// gezielt die ETF-Sparrate (nicht die übrigen Abo-Kosten, die zufällig in
// denselben Topf "Abo & ETF" fließen).
function computeMonatlichesSparen(fixedCosts) {
  const now = new Date();
  const active = getActiveFixedCosts(fixedCosts, now.getFullYear(), now.getMonth());
  const posten = active
    .filter((f) => f.typ === "Ausgabe" && f.kategorie === "Sparen" && (SPAR_ZIELE.includes(f.ziel) || f.bezeichnung === "ETF"))
    .map((f) => ({ bezeichnung: f.bezeichnung, ziel: f.ziel, betrag: Number(f.betrag) || 0, verbrauchssparen: VERBRAUCHSSPAREN_ZIELE.includes(f.ziel) }));
  const summe = posten.reduce((s, p) => s + p.betrag, 0);
  return { posten, summe };
}

// Wie sich die Fixkosten (Ausgaben und Einnahmen) über die kommenden
// Monate entwickeln, basierend auf "Gültig ab/bis" - erkennt Positionen,
// die in dem Zeitraum teurer/günstiger werden, wegfallen oder neu
// hinzukommen (Namensabgleich zwischen den Monaten).
function computeVorausschau(fixedCosts, monateVoraus = 3) {
  const heute = new Date();
  const monate = [];
  for (let i = 0; i < monateVoraus; i++) {
    const d = new Date(heute.getFullYear(), heute.getMonth() + i, 1);
    const aktiv = getActiveFixedCosts(fixedCosts, d.getFullYear(), d.getMonth());
    // Die Puffer-Zeile selbst ausklammern (siehe computeGehaltsverteilungFuerMonat)
    // - ihr gespeicherter Betrag ist nur der Stand von heute und würde die
    // Summe hier sonst um denselben veralteten Wert verfälschen, sobald sich
    // eine andere Position ändert.
    const ausgaben = aktiv.filter((f) => f.typ === "Ausgabe" && f.ziel !== "Puffer").reduce((s, f) => s + (Number(f.betrag) || 0), 0);
    const einnahmen = aktiv.filter((f) => f.typ === "Einnahme").reduce((s, f) => s + (Number(f.betrag) || 0), 0);
    const jahresZusatz = d.getFullYear() !== heute.getFullYear() ? ` ${d.getFullYear()}` : "";
    const verteilung = computeGehaltsverteilungFuerMonat(fixedCosts, d.getFullYear(), d.getMonth());
    monate.push({ label: MONATSNAMEN_VOLL[d.getMonth()] + jahresZusatz, ausgaben, einnahmen, aktiv, ...verteilung });
  }

  // Leerzeichen am Anfang/Ende ignorieren - sonst werden zwei eigentlich
  // gleiche Positionen (z.B. einmal am PC direkt im Sheet eingetragen,
  // einmal über die App gespeichert) fälschlich als "läuft aus" + "neu"
  // statt als eine einzige Preisänderung erkannt.
  const normName = (n) => (n || "").trim();
  const changes = [];
  for (let i = 1; i < monate.length; i++) {
    const vorMap = new Map(monate[i - 1].aktiv.map((f) => [normName(f.bezeichnung), f]));
    const neuMap = new Map(monate[i].aktiv.map((f) => [normName(f.bezeichnung), f]));
    const namen = new Set([...vorMap.keys(), ...neuMap.keys()]);
    namen.forEach((name) => {
      const vor = vorMap.get(name);
      const neu = neuMap.get(name);
      if (vor && neu && Number(vor.betrag) !== Number(neu.betrag)) {
        changes.push({ bezeichnung: name, typ: neu.typ, von: Number(vor.betrag), nach: Number(neu.betrag), abMonat: monate[i].label, quelle: neu.quelle, ziel: neu.ziel, pufferAbMonat: monate[i].puffer });
      } else if (vor && !neu) {
        changes.push({ bezeichnung: name, typ: vor.typ, von: Number(vor.betrag), nach: null, abMonat: monate[i].label, quelle: vor.quelle, ziel: vor.ziel, pufferAbMonat: monate[i].puffer });
      } else if (!vor && neu) {
        changes.push({ bezeichnung: name, typ: neu.typ, von: null, nach: Number(neu.betrag), abMonat: monate[i].label, quelle: neu.quelle, ziel: neu.ziel, pufferAbMonat: monate[i].puffer });
      }
    });
  }

  return { monate, changes };
}
// Ob eine Vorausschau-Änderung überhaupt über die Gehaltsverteilung läuft
// und sich damit auf den Puffer auswirkt: Einnahmen immer (sie verändern
// direkt das Gehalt), sonst nur wenn die Quelle ING ist (egal ob die
// Position am Ende auf ING bleibt oder als Umbuchung in einen Topf wie
// "Abo & ETF" fließt - beides läuft über aufING/aufTRBenannt und damit
// über den Puffer). Positionen, deren Quelle direkt ein Topf ist, bypassen
// die Gehaltsverteilung komplett (siehe computeVorausschauTopfAuswirkungen).
function vorausschauBeeinflusstPuffer(c) {
  return c.typ === "Einnahme" || c.quelle === "ING";
}
// Ob eine Vorausschau-Änderung sich finanziell nachteilig auswirkt (für
// die rot/grün-Einfärbung in der Änderungsliste).
function vorausschauIstSchlechter(c) {
  if (c.nach === null) return c.typ === "Einnahme"; // wegfallende Einnahme ist schlechter
  if (c.von === null) return c.typ === "Ausgabe"; // neue Ausgabe ist schlechter
  return c.typ === "Ausgabe" ? c.nach > c.von : c.nach < c.von;
}
// Fasst zusammen, wie sich die erkannten Änderungen auf die monatlich
// "übrige" Summe je Topf auswirken - bei einer Ausgabe wird der Topf
// (Quelle) um die Differenz kleiner, bei einer Einnahme der Zieltopf um
// die Differenz größer. Nur echte Budget-Töpfe (nicht ING/Trade Republic),
// da "Topf" hier wörtlich gemeint ist.
function computeVorausschauTopfAuswirkungen(changes) {
  const summen = {};
  changes.forEach((c) => {
    const topf = c.typ === "Ausgabe" ? c.quelle : c.ziel;
    if (!topf || !ACCOUNT_BADGES[topf] || topf === "ING" || topf === "Trade Republic") return;
    const diff = (c.nach ?? 0) - (c.von ?? 0);
    const wirkung = c.typ === "Ausgabe" ? -diff : diff;
    summen[topf] = (summen[topf] || 0) + wirkung;
  });
  return Object.entries(summen)
    .filter(([, wirkung]) => Math.abs(wirkung) > 0.004)
    .map(([topf, wirkung]) => ({ topf, wirkung }))
    .sort((a, b) => a.wirkung - b.wirkung);
}

// Für einen beliebigen Monat (nicht nur "jetzt") - Grundlage sowohl für
// die aktuelle Gehaltsverteilung als auch für deren Entwicklung in der
// Vorausschau.
function computeGehaltsverteilungFuerMonat(fixedCosts, year, monthIdx) {
  const active = getActiveFixedCosts(fixedCosts, year, monthIdx);
  const gehalt = active.filter((f) => f.typ === "Einnahme").reduce((s, f) => s + Number(f.betrag || 0), 0);
  const aufING = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && (!f.ziel || f.ziel === "Extern"))
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  // Summe der Fixkosten-Positionen, die konkret einem Topf zugewiesen sind
  // (Rücklage, Model 3, ...). Die Überweisung insgesamt ist per Definition
  // Gehalt minus dem, was auf ING bleibt - nie mehr und nie weniger, sonst
  // würde das Gehalt nicht ausreichen.
  const aufTRBenannt = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && f.ziel && f.ziel !== "Extern")
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  // Puffer hat im Fixkosten-Plan zwar selbst eine Zeile (Konto=ING, Ziel=
  // Puffer), die sich dort aber live nachrechnet ("was bleibt heute übrig")
  // - für vergangene/zukünftige Monate in der Vorausschau ist dieser Wert
  // deshalb veraltet, sobald sich eine andere Position ändert. Wir ignorieren
  // den gespeicherten Betrag dieser Zeile bewusst und berechnen den Puffer
  // stattdessen selbst neu: alles, was nach ING und den ÜBRIGEN benannten
  // Töpfen von der Trade-Republic-Überweisung übrig bleibt. So zieht sich
  // die Puffer-Zeile nicht versehentlich von sich selbst ab (das drückte
  // den angezeigten Puffer künstlich auf ~0).
  const aufTRBenanntOhnePuffer = active
    .filter((f) => f.typ !== "Einnahme" && f.quelle === "ING" && f.ziel && f.ziel !== "Extern" && f.ziel !== "Puffer")
    .reduce((s, f) => s + Number(f.betrag || 0), 0);
  const aufTR = gehalt - aufING;
  const pufferRoh = aufTR - aufTRBenanntOhnePuffer;
  // Rundungsreste (z.B. -0.0000000001) nicht als "-0,00 €" anzeigen.
  const puffer = Math.abs(pufferRoh) < 0.005 ? 0 : pufferRoh;
  return { gehalt, aufING, aufTR, aufTRBenannt, puffer };
}
function computeGehaltsverteilung(fixedCosts) {
  const now = new Date();
  return computeGehaltsverteilungFuerMonat(fixedCosts, now.getFullYear(), now.getMonth());
}

// Zinssatz-Zellen können als "2,25%" (Text), 2.25 (Zahl, gemeint als Prozent)
// oder 0.0225 (Zahl, gemeint als Dezimalanteil) vorliegen - alle drei Formen abdecken.
function parseRate(v) {
  if (typeof v === "number") return v > 1 ? v / 100 : v;
  if (!v) return 0;
  let s = String(v).trim();
  const hatProzent = s.includes("%");
  s = s.replace(/[^0-9,.\-]/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s) || 0;
  if (hatProzent) return n / 100;
  return n > 1 ? n / 100 : n;
}

function getRateSchedule(einstellungen, kontoName) {
  return einstellungen
    .filter((r) => r.konto === kontoName)
    .map((r) => ({
      ab: parseGermanDate(r.gueltig_ab),
      bis: parseGermanDate(r.gueltig_bis) || null,
      satz: parseRate(r.zinssatz),
    }))
    .filter((r) => r.ab)
    .sort((a, b) => (a.ab < b.ab ? -1 : 1));
}

// Liefert den gültigen Zinssatz für ein Datum, oder null, wenn keine Zeile im
// Blatt "Einstellungen" dieses Datum abdeckt (Lücke oder fehlende Zeile) -
// damit lässt sich das im Aufrufer als klare Fehlermeldung statt als
// stillschweigend falsche Zahl behandeln.
function rateForDate(schedule, isoDate) {
  const treffer = schedule.find((r) => r.ab <= isoDate && (!r.bis || r.bis >= isoDate));
  return treffer ? treffer.satz : null;
}

// Tagesgenaue Simulation: Zinsen werden täglich berechnet (Tagessaldo * Jahreszins / 365)
// und am Monatsende gutgeschrieben. Der bereits VERGANGENE Teil des laufenden
// Monats wird taggenau aus den echten Buchungen dieses Kontos nachvollzogen -
// nur für Tage, die wirklich noch in der Zukunft liegen, wird die aktuell
// hinterlegte monatliche Fixkosten-Zuweisung als Annahme verwendet, da
// zukünftige, ungeplante Buchungen naturgemäß niemand vorhersehen kann.
function simulateForecast(accountName, accounts, transactions, monthlyContribution, schedule, monthsAhead) {
  const heute = new Date();
  heute.setHours(0, 0, 0, 0);
  const start = new Date(heute.getFullYear(), heute.getMonth(), 1);
  const end = new Date(start.getFullYear(), start.getMonth() + monthsAhead + 1, 0);
  const startIso = toISO(start);

  // Echter Kontostand unmittelbar VOR dem 1. des laufenden Monats als Basis.
  const vorMonatsTx = transactions.filter((t) => t.datum < startIso);
  let balance = computeBalances(accounts, vorMonatsTx)[accountName] || 0;

  // Echte Buchungen dieses Kontos innerhalb des laufenden Monats, chronologisch.
  const monatsTx = transactions
    .filter((t) => t.datum >= startIso && (t.quelle === accountName || t.ziel === accountName))
    .sort((a, b) => (a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0));

  let pending = 0;
  const rows = [];
  let d = new Date(start);
  let txIndex = 0;
  while (d <= end) {
    const heuteIso = toISO(d);
    // Echte, bereits erfolgte Buchungen dieses Tages anwenden.
    while (txIndex < monatsTx.length && monatsTx[txIndex].datum === heuteIso) {
      const t = monatsTx[txIndex];
      const betrag = Number(t.betrag) || 0;
      if (t.typ === "Ausgabe" && t.quelle === accountName) balance -= betrag;
      else if (t.typ === "Einnahme" && t.ziel === accountName) balance += betrag;
      else if (t.typ === "Umbuchung") {
        if (t.quelle === accountName) balance -= betrag;
        if (t.ziel === accountName) balance += betrag;
      }
      txIndex++;
    }
    // Nur für Tage, die noch in der Zukunft liegen, die bekannte monatliche
    // Zuweisung am 1. eines Folgemonats als Annahme hinzufügen.
    if (d.getDate() === 1 && d.getTime() > heute.getTime()) balance += monthlyContribution;

    const satz = rateForDate(schedule, heuteIso);
    if (satz === null) {
      throw new Error(`Kein gültiger Zinssatz für den ${dateDE(heuteIso)} im Blatt "Einstellungen" hinterlegt (Lücke zwischen zwei "Gültig Ab"/"Gültig bis"-Zeilen). Bitte prüfen.`);
    }
    pending += (balance * satz) / 365;

    const next = new Date(d); next.setDate(next.getDate() + 1);
    if (next.getMonth() !== d.getMonth()) {
      balance += pending;
      rows.push({ monat: `${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`, saldo: Math.round(balance * 100) / 100, zinsen: Math.round(pending * 100) / 100 });
      pending = 0;
    }
    d = next;
  }
  return rows.slice(0, monthsAhead);
}

/* ============================== Saldenlogik ============================== */

function computeBalances(accounts, transactions) {
  const balances = {};
  accounts.forEach((a) => (balances[a.name] = a.saldo));
  const externalSources = new Set(["extern", "arbeitgeber"]);

  // Reines Doppel-Buchungsprinzip, ohne Sonderfälle: "Trade Republic" ist hier
  // nur der freie, noch keinem Topf zugeordnete Betrag. Die auf dem Dashboard
  // angezeigte Trade-Republic-Gesamtsumme wird an anderer Stelle als
  // (freier Betrag + Summe aller Töpfe) DEFINIERT – dadurch kann sie
  // rechnerisch nie von der Realität abweichen, ganz gleich wie viele
  // Buchungen dazwischenliegen.
  transactions.forEach((t) => {
    const betrag = Number(t.betrag) || 0;
    if (t.typ === "Ausgabe") {
      if (balances[t.quelle] !== undefined) balances[t.quelle] -= betrag;
    } else if (t.typ === "Einnahme") {
      const qKey = (t.quelle || "").toLowerCase();
      if (!externalSources.has(qKey) && balances[t.quelle] !== undefined) balances[t.quelle] += betrag;
      if (balances[t.ziel] !== undefined) balances[t.ziel] += betrag;
    } else if (t.typ === "Umbuchung") {
      if (balances[t.quelle] !== undefined) balances[t.quelle] -= betrag;
      if (balances[t.ziel] !== undefined) balances[t.ziel] += betrag;
    }
  });
  return balances;
}

/* ============================== Autokredit-Berechnung ============================== */

// ISO-Datum ("YYYY-MM-DD") immer über Jahr/Monat/Tag in LOKALER Zeitzone
// parsen, nie per new Date(isoString) direkt - das würde als UTC-Mitternacht
// interpretiert und könnte je Zeitzone einen Tag verschieben (siehe toISO,
// das aus denselben Gründen umgekehrt arbeitet).
function isoZuDatum(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function monatsDiff(vonISO, bisISO) {
  const von = isoZuDatum(vonISO), bis = isoZuDatum(bisISO);
  return (bis.getFullYear() - von.getFullYear()) * 12 + (bis.getMonth() - von.getMonth());
}

// Monatliche Fortschreibung der Restschuld exakt nach Vertragslogik: Zinsen
// werden auf die Restschuld belastet, danach deckt die Rate zuerst diese
// Zinsen, der Rest reduziert die Restschuld (siehe Prompt-Hintergrund zum
// Kredit). Läuft von startDatumISO (exklusiv) bis bisDatumISO (inklusive),
// in Monatsschritten auf den 1. des jeweiligen Monats.
function simulateKreditTilgung(restschuldStart, startDatumISO, kredit, bisDatumISO) {
  const start = isoZuDatum(startDatumISO);
  const anzahlMonate = Math.max(0, monatsDiff(startDatumISO, bisDatumISO));
  const rows = [];
  let restschuld = restschuldStart;
  for (let i = 1; i <= anzahlMonate; i++) {
    const zinsen = restschuld > 0.005 ? (restschuld * kredit.sollzins) / 12 : 0;
    restschuld = Math.max(0, restschuld + zinsen - kredit.monatsrate);
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    rows.push({
      monat: `${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`,
      datumISO: toISO(d),
      restschuld: Math.round(restschuld * 100) / 100,
      zinsen: Math.round(zinsen * 100) / 100,
    });
  }
  return rows;
}

// Geschätzte Restzinsen, die bis zum regulären Vertragsende noch anfallen
// würden (Obergrenze für die Vorfälligkeitsentschädigung laut Vertrag) -
// nutzt dieselbe Tilgungssimulation, nur bis zum Fälligkeitsdatum der
// Schlussrate statt nur ein paar Monate voraus.
function geschaetzteRestzinsenBisEnde(restschuld, datumISO, kredit) {
  const rows = simulateKreditTilgung(restschuld, datumISO, kredit, kredit.schlussrateFaelligAm);
  return rows.reduce((s, r) => s + r.zinsen, 0);
}

// VFE laut Vertrag: max. 1% des vorzeitig gezahlten Betrags (0,5%, wenn
// Restlaufzeit <= 12 Monate), zusätzlich gedeckelt auf die Sollzinsen, die
// bis zum regulären Ende noch angefallen wären.
function berechneVfe(restschuld, datumISO, kredit) {
  if (restschuld <= 0.005) return 0;
  const restlaufzeit = monatsDiff(datumISO, kredit.schlussrateFaelligAm);
  const prozent = restlaufzeit <= kredit.vfeKurzSchwelleMonate ? kredit.vfeProzentKurz : kredit.vfeProzentNormal;
  const roh = restschuld * prozent;
  const obergrenze = geschaetzteRestzinsenBisEnde(restschuld, datumISO, kredit);
  return Math.round(Math.min(roh, obergrenze) * 100) / 100;
}

// Habenzinsen, die ein Betrag (liegt real bei Trade Republic, siehe
// trZinssatz - typischerweise die Summe aus "Ablösung" und "Model 3") über
// die angegebene Anzahl Monate noch abwerfen würde - rein informativ für die
// Nettokosten-Kennzahl weiter unten. Beeinflusst NICHT die Prognose/das
// Kreditfrei-Datum selbst (siehe simulateToepfeGesamtVerlauf, die bleibt
// bewusst ohne Zins-Annahme).
function berechneHabenzinsen(saldo, monate, sparzins) {
  if (saldo <= 0.005 || monate <= 0 || !sparzins) return 0;
  let wert = saldo;
  for (let i = 0; i < monate; i++) wert *= 1 + sparzins / 12;
  return Math.round((wert - saldo) * 100) / 100;
}

// Verlauf der beiden Spar-Töpfe zusammen: "Model 3" wächst (laut
// bestehender, unveränderter Fixkosten-Automatik) sicher um die bekannte
// Monatsrate - bewusst OHNE Zins-Annahme (siehe AUTOKREDIT_MODEL3_RATE).
// "Ablösung" wird nur durch manuelle Umbuchungen aus anderen Töpfen befüllt
// und bleibt in der Prognose deshalb als fester (aktueller) Betrag stehen -
// schiebt der Nutzer real etwas rein, hebt sich diese Linie beim nächsten
// Datenabgleich sofort, ganz ohne Annahme.
function simulateToepfeGesamtVerlauf(model3Saldo, abloesungSaldo, monateVoraus, model3MonatsRate) {
  const rows = [];
  for (let i = 1; i <= monateVoraus; i++) {
    const model3 = Math.round((model3Saldo + model3MonatsRate * i) * 100) / 100;
    rows.push({ model3, abloesung: abloesungSaldo, gesamt: Math.round((model3 + abloesungSaldo) * 100) / 100 });
  }
  return rows;
}

// Kombiniert Restschuld- und Töpfe-Prognose zu einer gemeinsamen Zeile pro
// Monat und findet den ersten Monat, in dem die Töpfe (zusammen) die
// Restschuld inklusive geschätzter VFE decken - das ist der Ablösemonat.
function simulateAutokreditVerlauf({ restschuldStart, restschuldDatum, model3Saldo, abloesungSaldo, kredit, model3MonatsRate, monateVoraus }) {
  const start = isoZuDatum(restschuldDatum);
  const bisDatumISO = toISO(new Date(start.getFullYear(), start.getMonth() + monateVoraus, 1));
  const restschuldRows = simulateKreditTilgung(restschuldStart, restschuldDatum, kredit, bisDatumISO);
  const toepfeRows = simulateToepfeGesamtVerlauf(model3Saldo, abloesungSaldo, restschuldRows.length, model3MonatsRate);

  let abloeseMonatIndex = null;
  const rows = restschuldRows.map((r, i) => {
    const toepfe = toepfeRows[i];
    const vfe = berechneVfe(r.restschuld, r.datumISO, kredit);
    const gedeckt = toepfe.gesamt >= r.restschuld + vfe;
    if (gedeckt && abloeseMonatIndex === null) abloeseMonatIndex = i;
    return {
      monat: r.monat,
      restschuld: r.restschuld,
      zinsen: r.zinsen,
      model3: toepfe.model3,
      abloesung: toepfe.abloesung,
      toepfeGesamt: toepfe.gesamt,
      vfe,
      gedeckt,
    };
  });
  return { rows, abloeseMonatIndex };
}

// Vergleicht vier Rückzahlungs-Szenarien (siehe Prompt-Hintergrund, Punkt 8).
// WICHTIG, in allen vier Szenarien gleichermaßen: die Monatsrate bleibt immer
// bei kredit.monatsrate (230 €) - sie wird NIE erhöht. "Model 3" wächst in
// jedem Szenario unverändert mit model3MonatsRate weiter. Eine Sondertilgung
// kommt ausschließlich aus dem aktuellen Saldo von "Ablösung" (nie aus
// "Model 3") und reduziert Restschuld UND Ablösung-Saldo gleichermaßen, bevor
// die normale Sammeln-&-Ablösen-Logik ab diesem neuen (kleineren) Stand
// weiterläuft. "nettokosten" (Zinsen+VFE minus entgangene Habenzinsen auf das
// Geld, das bis zur Ablösung noch in "Ablösung" UND "Model 3" liegt) ist eine
// reine Zusatz-Kennzahl und wirkt NICHT auf "kreditfreiAb" zurück.
function simulateAutokreditSzenario(sofortBetrag, { restschuldStart, restschuldDatum, model3Saldo, abloesungSaldo, kredit, model3MonatsRate, monateVoraus, sparzins }) {
  const neueRestschuld = Math.max(0, restschuldStart - sofortBetrag);
  const neueAbloesung = Math.max(0, abloesungSaldo - sofortBetrag);
  const vfeSofort = sofortBetrag > 0.005 ? berechneVfe(sofortBetrag, restschuldDatum, kredit) : 0;
  const { rows, abloeseMonatIndex } = simulateAutokreditVerlauf({
    restschuldStart: neueRestschuld, restschuldDatum, model3Saldo, abloesungSaldo: neueAbloesung, kredit, model3MonatsRate, monateVoraus,
  });
  if (abloeseMonatIndex === null) return { kreditfreiAb: null, zinsen: null, vfe: null, habenzinsen: null, nettokosten: null };
  const zinsen = rows.slice(0, abloeseMonatIndex + 1).reduce((s, r) => s + r.zinsen, 0);
  const vfe = Math.round((vfeSofort + rows[abloeseMonatIndex].vfe) * 100) / 100;
  const habenzinsen = berechneHabenzinsen(model3Saldo + neueAbloesung, abloeseMonatIndex + 1, sparzins);
  return {
    kreditfreiAb: rows[abloeseMonatIndex].monat,
    zinsen: Math.round(zinsen * 100) / 100,
    vfe,
    habenzinsen,
    nettokosten: Math.round((zinsen + vfe - habenzinsen) * 100) / 100,
  };
}

function simulateAutokreditSzenarien(params) {
  const { restschuldStart, restschuldDatum, kredit, model3Saldo, abloesungSaldo, sparzins, bereitsSondertilgt = 0 } = params;
  const geplantRows = simulateKreditTilgung(restschuldStart, restschuldDatum, kredit, kredit.schlussrateFaelligAm);
  const geplantZinsen = Math.round(geplantRows.reduce((s, r) => s + r.zinsen, 0) * 100) / 100;
  const geplantHabenzinsen = berechneHabenzinsen(model3Saldo + abloesungSaldo, geplantRows.length, sparzins);
  const geplant = {
    kreditfreiAb: kredit.schlussrateFaelligAm,
    zinsen: geplantZinsen,
    vfe: 0,
    habenzinsen: geplantHabenzinsen,
    nettokosten: Math.round((geplantZinsen - geplantHabenzinsen) * 100) / 100,
  };

  // "Teilweise Sondertilgung" war als EINMALIGE Aktion geplant (Hälfte der
  // ursprünglichen Schlussrate), nicht als wiederkehrende - sobald real schon
  // eine Sondertilgung gebucht ist, schlägt diese Karte deshalb keine weitere
  // vor (sofortBetrag 0). Sie peilt danach GENAUSO wie "Sammeln & Ablösen"
  // irgendwann einen vollen Ablöse-Zeitpunkt an ("auszulösen, wenn die
  // Restschuld zusammen ist" - das war die ganze Zeit der eigentliche Plan),
  // nur eben vom ECHTEN, schon reduzierten heutigen Stand aus.
  //
  // "Sammeln & Ablösen" ist dagegen der reine Vergleichs-Pfad "hätte ich nie
  // sondergetilgt": Restschuld und Ablösung-Topf werden dafür OHNE jede reale
  // Sondertilgung rekonstruiert (reine Simulation ab Vertragsbeginn bis zum
  // selben Stichtag + der volle, nie entnommene Ablösung-Topf). Ohne Historie
  // (bereitsSondertilgt 0) ist das ein No-Op und entspricht exakt dem echten
  // heutigen Stand - die beiden Karten unterscheiden sich dann nur noch
  // dadurch, dass "Teilweise Sondertilgung" aktiv die Hälfte vorschlägt.
  const rekonstruierteRows = bereitsSondertilgt > 0.005
    ? simulateKreditTilgung(kredit.nettodarlehen, kredit.auszahlungsdatum, kredit, restschuldDatum)
    : null;
  const restschuldOhneSondertilgung = rekonstruierteRows && rekonstruierteRows.length > 0
    ? rekonstruierteRows[rekonstruierteRows.length - 1].restschuld
    : restschuldStart;
  const bereitsGezahltOhneSondertilgung = rekonstruierteRows
    ? Math.round(rekonstruierteRows.reduce((s, r) => s + r.zinsen, 0) * 100) / 100
    : null;
  const abloesungSaldoOhneSondertilgung = bereitsSondertilgt > 0.005 ? abloesungSaldo + bereitsSondertilgt : abloesungSaldo;

  return {
    geplant,
    sammelnAbloesen: simulateAutokreditSzenario(0, {
      ...params,
      restschuldStart: restschuldOhneSondertilgung,
      abloesungSaldo: abloesungSaldoOhneSondertilgung,
    }),
    bereitsGezahltOhneSondertilgung,
    teilweiseSondertilgung: simulateAutokreditSzenario(
      bereitsSondertilgt > 0.005 ? 0 : Math.round((abloesungSaldo / 2) * 100) / 100,
      params
    ),
    sofortigeSondertilgung: simulateAutokreditSzenario(abloesungSaldo, params),
  };
}

// Reine Vertrags-Simulation ab Auszahlung, OHNE jede Sondertilgung - feste
// Referenzgröße für "was hätte der Kredit insgesamt gekostet, hätte ich nie
// vorzeitig getilgt". Hängt nur von den festen Vertragsdaten ab, nicht vom
// aktuellen Buchungsstand - ändert sich also nie durch eine reale Buchung.
function berechneUrspruenglicheKreditkosten(kredit) {
  const rows = simulateKreditTilgung(kredit.nettodarlehen, kredit.auszahlungsdatum, kredit, kredit.schlussrateFaelligAm);
  return Math.round(rows.reduce((s, r) => s + r.zinsen, 0) * 100) / 100;
}

// Effekt einer einzelnen, bereits gebuchten Sondertilgung: geschätzte VFE,
// die dadurch (geschätzt) gesunkene neue Schlussrate - die Bank senkt bei
// diesem Vertrag die Schlussrate statt die Laufzeit zu verkürzen - und die
// dadurch gesparten Zinsen (Restzinsen ohne diese Zahlung minus Restzinsen
// mit ihr, minus die VFE). Rein informativ für den Verlauf, wirkt auf keine
// andere Berechnung zurück.
function berechneSondertilgungsEffekt(restschuldVor, restschuldNach, datumISO, kredit) {
  const betrag = Math.round((restschuldVor - restschuldNach) * 100) / 100;
  const vfe = berechneVfe(betrag, datumISO, kredit);
  const ohneRows = simulateKreditTilgung(restschuldVor, datumISO, kredit, kredit.schlussrateFaelligAm);
  const mitRows = simulateKreditTilgung(restschuldNach, datumISO, kredit, kredit.schlussrateFaelligAm);
  const ohneZinsen = ohneRows.reduce((s, r) => s + r.zinsen, 0);
  const mitZinsen = mitRows.reduce((s, r) => s + r.zinsen, 0);
  const neueSchlussrate = mitRows.length > 0 ? mitRows[mitRows.length - 1].restschuld : restschuldNach;
  return {
    betrag,
    vfe,
    neueSchlussrate: Math.round(neueSchlussrate * 100) / 100,
    ersparnis: Math.round((ohneZinsen - mitZinsen - vfe) * 100) / 100,
  };
}

// Bereits gezahlte Zinsen (inkl. der beiden kleinen, bewusst nicht separat
// erfassten Kontoauszug-/Portogebühren) seit Vertragsbeginn: Summe aller
// bisherigen Buchungen minus die dadurch erzielte Tilgung (Nettodarlehen
// minus aktuelle Restschuld laut letzter Buchung). Rein historisch - ändert
// sich nicht zwischen den Szenarien, nur die Buchungen selbst können es
// ändern.
function berechneBereitsGezahlteZinsen(kreditBuchungen, nettodarlehen) {
  if (kreditBuchungen.length === 0) return 0;
  const gezahltGesamt = kreditBuchungen.reduce((s, b) => s + b.betrag, 0);
  const letzte = kreditBuchungen[kreditBuchungen.length - 1];
  const getilgt = nettodarlehen - letzte.restschuldNach;
  return Math.round((gezahltGesamt - getilgt) * 100) / 100;
}

/* ============================== Lokale Persistenz (localStorage) ============================== */

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveLocal(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* Speicher nicht verfügbar */ }
}
// Verhindert, dass eine einzelne Anfrage bei schlechter Verbindung unbegrenzt
// "hängen" bleibt - nach 15 Sekunden wird abgebrochen und als Fehler
// behandelt (statt endlos zu warten). Supabase antwortet normalerweise in
// Bruchteilen einer Sekunde, 15s lässt trotzdem genug Spielraum für eine
// schwache Mobilfunkverbindung.
async function fetchWithTimeout(url, options, timeoutMs = 15000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } catch (err) {
    if (err.name === "AbortError") throw new Error(`Zeitüberschreitung - keine Antwort innerhalb von ${timeoutMs / 1000} Sekunden.`);
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/* ============================== Supabase-Client ============================== */

async function supaRequest(path, options = {}) {
  const url = loadSupabaseUrl();
  const key = loadSupabaseAnonKey();
  if (!url || !key) throw new Error("Supabase-URL oder -Schlüssel fehlt (siehe Einstellungen).");
  const res = await fetchWithTimeout(url.replace(/\/$/, "") + path, {
    ...options,
    headers: {
      apikey: key,
      Authorization: "Bearer " + key,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).message || ""; } catch (e) { /* keine JSON-Fehlermeldung vorhanden */ }
    throw new Error(`Supabase-Fehler (${res.status})` + (detail ? ": " + detail : ""));
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function supaGetAll() {
  const [transaktionen, konten, kategorien, fixkosten, einstellungen, autokreditBuchungen, autokreditCheckliste, autokreditKonfiguration, autokreditPlanVerlauf] = await Promise.all([
    supaRequest("/rest/v1/transaktionen?select=*&order=erstellt_am.desc,datum.desc"),
    supaRequest("/rest/v1/konten?select=*"),
    supaRequest("/rest/v1/kategorien?select=*"),
    supaRequest("/rest/v1/fixkosten_plan?select=*"),
    supaRequest("/rest/v1/einstellungen?select=*"),
    supaRequest("/rest/v1/autokredit_buchungen?select=*&order=datum.asc"),
    supaRequest("/rest/v1/autokredit_checkliste?select=*"),
    supaRequest("/rest/v1/autokredit_konfiguration?select=*&id=eq.default"),
    supaRequest("/rest/v1/autokredit_plan_verlauf?select=*"),
  ]);
  return { transaktionen, konten, kategorien, fixkosten, einstellungen, autokreditBuchungen, autokreditCheckliste, autokreditKonfiguration, autokreditPlanVerlauf };
}

// Die Fixkosten-Felder aus dem Frontend (quelle/ziel/gueltigAb/gueltigBis)
// heißen in der Datenbank anders (konto/zielkonto/gueltig_ab/gueltig_bis) -
// hier einmal zentral übersetzt, statt an jeder Aufrufstelle einzeln.
// Analog zu toFixkostenRow: "restschuldNach" aus dem Frontend heißt in der
// Datenbank "restschuld_nach" - ohne diese Übersetzung schlägt jede manuell
// nachgetragene Buchung (Sondertilgung, Gebühr, Ablösung) beim Speichern
// fehl, da restschuld_nach als Pflichtfeld unausgefüllt bliebe.
function toAutokreditBuchungRow(payload) {
  return {
    id: payload.id,
    datum: payload.datum,
    typ: payload.typ,
    betrag: payload.betrag,
    restschuld_nach: payload.restschuldNach,
    notiz: payload.notiz || null,
  };
}

function toFixkostenRow(payload) {
  return {
    bezeichnung: payload.bezeichnung,
    betrag: payload.betrag,
    kategorie: payload.kategorie,
    typ: payload.typ,
    konto: payload.quelle,
    zielkonto: payload.ziel || null,
    gueltig_ab: payload.gueltigAb || null,
    gueltig_bis: payload.gueltigBis || null,
    id: payload.id,
  };
}

async function supaWrite(action, payload) {
  if (action === "create") {
    await supaRequest("/rest/v1/transaktionen", { method: "POST", body: JSON.stringify([payload]) });
  } else if (action === "update") {
    const { id, ...rest } = payload;
    await supaRequest(`/rest/v1/transaktionen?id=eq.${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify(rest) });
  } else if (action === "delete") {
    await supaRequest(`/rest/v1/transaktionen?id=eq.${encodeURIComponent(payload.id)}`, { method: "DELETE" });
  } else if (action === "fixkosten-create") {
    await supaRequest("/rest/v1/fixkosten_plan", { method: "POST", body: JSON.stringify([toFixkostenRow(payload)]) });
  } else if (action === "fixkosten-update") {
    const { id, ...rest } = toFixkostenRow(payload);
    await supaRequest(`/rest/v1/fixkosten_plan?id=eq.${encodeURIComponent(payload.id)}`, { method: "PATCH", body: JSON.stringify(rest) });
  } else if (action === "fixkosten-delete") {
    await supaRequest(`/rest/v1/fixkosten_plan?id=eq.${encodeURIComponent(payload.id)}`, { method: "DELETE" });
  } else if (action === "autokredit-buchung-create") {
    await supaRequest("/rest/v1/autokredit_buchungen", { method: "POST", body: JSON.stringify([toAutokreditBuchungRow(payload)]) });
  } else if (action === "autokredit-buchung-delete") {
    await supaRequest(`/rest/v1/autokredit_buchungen?id=eq.${encodeURIComponent(payload.id)}`, { method: "DELETE" });
  } else if (action === "autokredit-checkliste-toggle") {
    await supaRequest(`/rest/v1/autokredit_checkliste?item=eq.${encodeURIComponent(payload.item)}`, {
      method: "PATCH",
      body: JSON.stringify({ erledigt: payload.erledigt, erledigt_am: payload.erledigt ? toISO(new Date()) : null }),
    });
  } else if (action === "autokredit-strategie-update") {
    await supaRequest(`/rest/v1/autokredit_konfiguration?id=eq.default`, { method: "PATCH", body: JSON.stringify({ strategie: payload.strategie }) });
  } else {
    throw new Error("Unbekannte Aktion für Supabase: " + action);
  }
}

// Ein Gerät gilt als "online", wenn sein letztes Lebenszeichen höchstens
// GERAETE_TIMEOUT_MS alt ist - gut das Doppelte des Heartbeat-Intervalls
// (12s), damit ein einzelner verpasster Heartbeat nicht sofort als
// "offline" gilt.
const GERAETE_TIMEOUT_MS = 28 * 1000;

// Meldet dieses Gerät als "online" (Upsert über geraete_id, "gesperrt" bleibt
// dabei absichtlich unangetastet - siehe Kommentar bei toFixkostenRow-Nachbarn
// oben zum PostgREST-Upsert-Verhalten: nur mitgeschickte Felder werden
// überschrieben). Räumt nebenbei veraltete, vertraute Geräte auf - ersetzt
// den bisherigen 1x/Minute-Apps-Script-Trigger durch eine opportunistische
// Aufräumaktion bei jedem Heartbeat irgendeines Geräts.
async function supaHeartbeat(geraeteId, geraeteName) {
  await supaRequest("/rest/v1/geraete?on_conflict=geraete_id", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify([{ geraete_id: geraeteId, name: geraeteName, zuletzt_gesehen: new Date().toISOString() }]),
  });
  const [alle, vertraute] = await Promise.all([
    supaRequest("/rest/v1/geraete?select=*"),
    supaRequest("/rest/v1/vertraute_geraete?select=geraete_id"),
  ]);
  const vertrauteIds = new Set((vertraute || []).map((v) => v.geraete_id));
  const jetzt = Date.now();
  const veraltet = (alle || []).filter((g) => {
    if (g.geraete_id === geraeteId) return false; // eigenes, gerade aktualisiertes Gerät nie automatisch entfernen
    if (g.gesperrt) return false; // gesperrte Geräte nie automatisch entfernen
    if (!vertrauteIds.has(g.geraete_id)) return false; // nur vertraute (bekannte) Geräte automatisch aufräumen
    const letzterKontakt = g.zuletzt_gesehen ? new Date(g.zuletzt_gesehen).getTime() : null;
    return letzterKontakt !== null && jetzt - letzterKontakt > GERAETE_TIMEOUT_MS;
  });
  if (veraltet.length > 0) {
    await Promise.all(
      veraltet.map((g) =>
        supaRequest(`/rest/v1/geraete?geraete_id=eq.${encodeURIComponent(g.geraete_id)}`, { method: "DELETE" }).catch(() => {})
      )
    );
  }
  const aktuelleListe = (alle || [])
    .filter((g) => !veraltet.some((v) => v.geraete_id === g.geraete_id))
    .map((g) => {
      const letzterKontakt = g.zuletzt_gesehen ? new Date(g.zuletzt_gesehen).getTime() : null;
      return {
        id: g.geraete_id,
        name: g.name,
        zuletztGesehen: g.zuletzt_gesehen,
        online: letzterKontakt !== null && jetzt - letzterKontakt < GERAETE_TIMEOUT_MS,
        gesperrt: !!g.gesperrt,
      };
    });
  const eigenesGeraet = aktuelleListe.find((g) => g.id === geraeteId);
  return { gesperrt: eigenesGeraet ? eigenesGeraet.gesperrt : false, geraete: aktuelleListe };
}

async function supaSperreGeraet(geraeteId) {
  await supaRequest(`/rest/v1/geraete?geraete_id=eq.${encodeURIComponent(geraeteId)}`, {
    method: "PATCH",
    body: JSON.stringify({ gesperrt: true }),
  });
}

// Entsperrt ein Gerät per PIN über eine eigene Edge Function - der PIN wird
// ausschließlich dort serverseitig geprüft, nie in einer per anon key
// lesbaren Tabelle. Wirft bei falschem PIN/zu vielen Fehlversuchen einen
// Error mit der jeweiligen Meldung (übernommen von der Edge Function).
async function supaEntsperren(geraeteId, pin) {
  const url = loadSupabaseUrl();
  const key = loadSupabaseAnonKey();
  if (!url || !key) throw new Error("Supabase-URL oder -Schlüssel fehlt (siehe Einstellungen).");
  const res = await fetchWithTimeout(url.replace(/\/$/, "") + "/functions/v1/geraet-entsperren", {
    method: "POST",
    headers: { apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json" },
    body: JSON.stringify({ pin, geraeteId }),
  });
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (parseErr) {
    throw new Error("Antwort konnte nicht gelesen werden.");
  }
  if (!res.ok) throw new Error(json.error || `Entsperren fehlgeschlagen (${res.status})`);
  return json;
}

// Kontoauszüge liegen als PDF in einem privaten Supabase-Storage-Bucket (nicht
// in einer Tabelle) - erst auflisten, dann je Datei eine zeitlich begrenzte
// Download-Adresse erzeugen (der Bucket ist bewusst nicht "public", Zugriff
// läuft wie überall sonst über den Supabase-Schlüssel).
async function supaListKontoauszuege() {
  const url = loadSupabaseUrl();
  const key = loadSupabaseAnonKey();
  if (!url || !key) return [];
  const base = url.replace(/\/$/, "");
  const authHeaders = { apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json" };
  let objekte;
  try {
    objekte = await fetchWithTimeout(base + "/storage/v1/object/list/kontoauszuege", {
      method: "POST",
      headers: authHeaders,
      body: JSON.stringify({ prefix: "", limit: 100, sortBy: { column: "name", order: "desc" } }),
    }).then((res) => (res.ok ? res.json() : []));
  } catch (err) {
    return [];
  }
  const dateien = (objekte || []).filter((o) => o.name && o.name.toLowerCase().endsWith(".pdf"));
  const signiert = await Promise.all(
    dateien.map(async (o) => {
      try {
        const signRes = await fetchWithTimeout(base + "/storage/v1/object/sign/kontoauszuege/" + encodeURIComponent(o.name), {
          method: "POST",
          headers: authHeaders,
          body: JSON.stringify({ expiresIn: 3600 }),
        });
        if (!signRes.ok) return null;
        const { signedURL } = await signRes.json();
        return { name: o.name, url: base + "/storage/v1" + signedURL };
      } catch (err) {
        return null;
      }
    })
  );
  return signiert.filter(Boolean);
}

// KI-Assistent: ruft eine Supabase Edge Function auf (statt Apps Script),
// die ihrerseits Groq mit einem serverseitig geheim gehaltenen API-Schlüssel
// anspricht - der Schlüssel taucht dadurch nie im Browser auf.
async function supaAiChat(nachricht, verlauf, timeoutMs) {
  const url = loadSupabaseUrl();
  const key = loadSupabaseAnonKey();
  if (!url || !key) throw new Error("Supabase-URL oder -Schlüssel fehlt (siehe Einstellungen).");
  const res = await fetchWithTimeout(
    url.replace(/\/$/, "") + "/functions/v1/ai-chat",
    {
      method: "POST",
      headers: { apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ nachricht, verlauf }),
    },
    timeoutMs
  );
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (parseErr) {
    throw new Error("Antwort des KI-Assistenten konnte nicht gelesen werden.");
  }
  if (!res.ok) throw new Error(json.error || `KI-Assistent-Fehler (${res.status})`);
  return json;
}

function mapRemoteData(data) {
  const accounts = (data.konten || [])
    .filter((r) => r.konto)
    .map((r) => ({
      id: r.konto,
      name: r.konto,
      saldo: parseGermanNumber(r.aktueller_saldo),
      typ: REAL_ACCOUNTS.includes(r.konto) ? "echt" : "virtuell",
      farbe: ACCOUNT_COLOR(r.konto),
    }));

  // Der gespeicherte Wert für "Trade Republic" ist der ECHTE Gesamtbetrag
  // (zum Abgleich mit der Trade-Republic-App), nicht der freie Rest. Da
  // Trade Republic komplett aus den Töpfen besteht, ziehen wir die Summe
  // der Topf-Eröffnungssalden einmalig ab, um den tatsächlich freien,
  // keinem Topf zugeordneten Betrag zu erhalten. Ab da wird nur noch dieser
  // freie Betrag fortgeschrieben – die Töpfe laufen ohnehin separat mit.
  const trAccount = accounts.find((a) => a.name === "Trade Republic");
  if (trAccount) {
    const potSum = accounts.filter((a) => a.typ === "virtuell").reduce((s, a) => s + a.saldo, 0);
    trAccount.saldo = trAccount.saldo - potSum;
  }

  const categories = (data.kategorien || []).map((r, i) => ({
    id: "cat-" + i, name: r.kategorie, typ: r.typ,
  }));

  const fixedCosts = (data.fixkosten || []).map((r, i) => ({
    id: r.id || ("fix-" + i),
    bezeichnung: r.bezeichnung,
    betrag: parseGermanNumber(r.betrag),
    kategorie: r.kategorie,
    typ: r.typ,
    quelle: r.konto,
    ziel: r.zielkonto || "",
    gueltigAb: parseGermanDate(r.gueltig_ab),
    gueltigBis: parseGermanDate(r.gueltig_bis),
  }));

  // Primär nach Erstellungszeitpunkt sortiert, NICHT nach "Datum" - das Datum
  // kann frei gewählt werden (z. B. eine Buchung von vorgestern heute
  // nachtragen) und spiegelt daher nicht wider, wann etwas wirklich
  // eingegeben wurde. Jede neue Buchung landet so zuverlässig ganz oben, in
  // echter Eingabereihenfolge. "Datum" dient nur als zweites, tie-breaking
  // Kriterium (siehe "order=erstellt_am.desc,datum.desc" bei supaGetAll):
  // Alle beim CSV-Umzug importierten Alt-Buchungen haben durch den
  // Ein-Schritt-Import praktisch denselben Erstellungszeitpunkt - ohne dieses
  // zweite Kriterium wäre ihre Reihenfolge untereinander technisch beliebig
  // und könnte sich schon durchs bloße Bearbeiten einer von ihnen verschieben.
  const transactions = (data.transaktionen || [])
    .filter((r) => r.id)
    .map((r) => ({
      id: r.id, datum: parseGermanDate(r.datum) || r.datum, titel: r.titel,
      kategorie: r.kategorie || "", typ: r.typ, betrag: parseGermanNumber(r.betrag),
      quelle: r.quelle, ziel: r.ziel || "", notiz: r.notiz || "",
    }));

  const einstellungen = data.einstellungen || [];

  // Ist-Historie des Autokredits (Zinsbelastung/Tilgung/Gebühr/Sondertilgung
  // aus den Kontoauszügen), chronologisch (siehe "order=datum.asc" bei
  // supaGetAll) - der letzte Eintrag ist der aktuelle Ist-Stand.
  const autokreditBuchungen = (data.autokreditBuchungen || [])
    .filter((r) => r.id)
    .map((r) => ({
      id: r.id,
      datum: r.datum,
      typ: r.typ,
      betrag: parseGermanNumber(r.betrag),
      restschuldNach: parseGermanNumber(r.restschuld_nach),
      notiz: r.notiz || "",
    }));

  // Fällt auf die feste Reihenfolge zurück, falls die Tabelle noch leer ist
  // (z.B. Migration gerade erst eingespielt, aber nicht abgerufen) - damit
  // die Checkliste auch dann sofort etwas Sinnvolles anzeigt.
  const autokreditCheckliste = (data.autokreditCheckliste && data.autokreditCheckliste.length > 0)
    ? data.autokreditCheckliste.map((r) => ({ item: r.item, erledigt: !!r.erledigt, erledigtAm: r.erledigt_am || null }))
    : AUTOKREDIT_CHECKLISTE_FALLBACK.map((item) => ({ item, erledigt: false, erledigtAm: null }));

  // Echte Vertragsdaten (Kreditgeber, Finanzierungsnummer, Beträge,
  // Zinssatz...) kommen bewusst NUR aus Supabase, nie als Konstante aus
  // index.html - diese Datei wird öffentlich hochgeladen (siehe Kommentar
  // bei AUTOKREDIT_MODEL3_RATE). "null", solange die Tabelle noch leer ist
  // (Migration eingespielt, aber Platzhalter-Zeile nicht ersetzt) - die
  // Autokredit-Ansicht zeigt dann einen Einrichtungs-Hinweis statt Zahlen.
  const kreditRow = (data.autokreditKonfiguration || [])[0];
  const autokreditKonfiguration = kreditRow ? {
    kreditgeber: kreditRow.kreditgeber,
    finanzierungsnummer: kreditRow.finanzierungsnummer,
    nettodarlehen: parseGermanNumber(kreditRow.nettodarlehen),
    auszahlungsdatum: kreditRow.auszahlungsdatum,
    sollzins: parseGermanNumber(kreditRow.sollzins),
    effektivzins: parseGermanNumber(kreditRow.effektivzins),
    monatsrate: parseGermanNumber(kreditRow.monatsrate),
    schlussrate: parseGermanNumber(kreditRow.schlussrate),
    schlussrateAktuell: kreditRow.schlussrate_aktuell != null ? parseGermanNumber(kreditRow.schlussrate_aktuell) : null,
    schlussrateFaelligAm: kreditRow.schlussrate_faellig_am,
    vfeProzentNormal: parseGermanNumber(kreditRow.vfe_prozent_normal),
    vfeProzentKurz: parseGermanNumber(kreditRow.vfe_prozent_kurz),
    vfeKurzSchwelleMonate: Number(kreditRow.vfe_kurz_schwelle_monate),
    strategie: kreditRow.strategie || "sammeln_ablosen",
  } : null;

  // Chronologisch sortiert - "monat" ist Text im Format "MM/JJJJ" und lässt
  // sich daher nicht direkt alphabetisch sortieren (siehe isoMonatZuMonthKey).
  const autokreditPlanVerlauf = (data.autokreditPlanVerlauf || [])
    .map((r) => ({ monat: r.monat, restschuld: parseGermanNumber(r.restschuld), toepfe: parseGermanNumber(r.toepfe) }))
    .sort((a, b) => (isoMonatZuMonthKey(a.monat) < isoMonatZuMonthKey(b.monat) ? -1 : 1));

  // Geräte-Liste kommt ausschließlich über den Heartbeat (siehe supaHeartbeat),
  // Kontoauszüge ausschließlich über supaListKontoauszuege - beides nicht Teil
  // der normalen Tabellen-Synchronisierung hier.
  const geraete = Array.isArray(data.geraete) ? data.geraete : null;
  const geraetGesperrt = data.gesperrt === true;

  return { accounts, categories, fixedCosts, transactions, einstellungen, autokreditBuchungen, autokreditCheckliste, autokreditKonfiguration, autokreditPlanVerlauf, geraete, geraetGesperrt };
}
