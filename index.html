              <p className={`shrink-0 text-sm font-medium tabular-nums ${amountColor(trGesamt)}${blurCls(betraegeVersteckt)}`}>{amountDisplay(trGesamt, betraegeVersteckt)}</p>
            </div>
            <div className="flex items-center justify-between gap-2.5 px-3 py-2.5">
              <div className="flex items-center gap-2.5">
                <AccountIcon name="ING" fallbackColor="#10b981" balance={ingBalance} />
                <div><p className="text-sm text-zinc-200">ING</p><p className="text-[11px] text-zinc-500">Realkonto</p></div>
              </div>
              <p className={`shrink-0 text-sm font-medium tabular-nums ${amountColor(ingBalance)}${blurCls(betraegeVersteckt)}`}>{amountDisplay(ingBalance, betraegeVersteckt)}</p>
            </div>
          </div>
          <p className="mb-2 mt-4 text-[11px] font-medium uppercase tracking-wide text-zinc-600">Töpfe innerhalb von Trade Republic</p>
          <ToepfeKarussell virtualAccounts={virtualAccounts} balances={balances} potAllocations={potAllocations} />
        </div>
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4 lg:col-span-2">
          <h2 className="mb-3 text-sm font-semibold text-zinc-200">Letzte Buchungen</h2>
          <div className="space-y-1">
            {recent.map((t) => (
              <div key={t.id} className="flex items-center justify-between rounded-lg px-2 py-2 hover:bg-zinc-800/40">
                <div className="flex min-w-0 items-center gap-2.5">
                  <MerchantIcon titel={t.titel} isLight={isLight} quelle={t.quelle} ziel={t.ziel} />
                  <div className="min-w-0"><p className="truncate text-sm text-zinc-200">{t.titel}</p><p className="text-[11px] text-zinc-500">{dateDE(t.datum)} · {t.kategorie}</p></div>
                </div>
                <p className={`shrink-0 pl-2 text-sm font-medium tabular-nums ${t.typ === "Einnahme" ? "text-emerald-400" : t.typ === "Ausgabe" ? "text-rose-400" : "text-cyan-400"}`}>
                  {t.typ === "Ausgabe" ? "-" : t.typ === "Einnahme" ? "+" : "↔"} {eur(t.betrag)}
                </p>
              </div>
            ))}
            {recent.length === 0 && <p className="py-6 text-center text-sm text-zinc-500">Noch keine Buchungen vorhanden.</p>}
          </div>
        </div>
      </div>
    </div>
  );
});

/* ============================== Buchungsformular ============================== */

function emptyForm() { return { id: null, datum: todayISO(), titel: "", kategorie: "", typ: "Ausgabe", betrag: "", quelle: "", ziel: "", notiz: "" }; }

function BuchungsForm({ accounts, categories, transactions, onSubmit, submitting, initial, onCancel }) {
  const [form, setForm] = useState(initial || emptyForm());
  const [errors, setErrors] = useState({});
  const [showSuggestions, setShowSuggestions] = useState(false);
  const accountOptions = accounts.map((a) => a.name);
  const catOptions = categories.filter((c) => c.typ === form.typ || form.typ === "Umbuchung");

  // Für jeden bisher verwendeten Titel (passend zum aktuell gewählten Typ)
  // die zuletzt genutzte Buchung merken, um Kategorie/Quelle/Ziel beim
  // Auswählen eines Vorschlags automatisch mit übernehmen zu können.
  const titelVorschlaege = useMemo(() => {
    if (!transactions) return [];
    const map = new Map();
    transactions.forEach((t) => {
      if (t.typ !== form.typ || !t.titel) return;
      if (!map.has(t.titel)) map.set(t.titel, t); // Journal ist neueste zuerst sortiert
    });
    return Array.from(map.values());
  }, [transactions, form.typ]);

  const gefilterteVorschlaege = form.titel.trim()
    ? titelVorschlaege.filter((t) => t.titel.toLowerCase().includes(form.titel.toLowerCase()) && t.titel.toLowerCase() !== form.titel.toLowerCase()).slice(0, 5)
    : [];

  const vorschlagWaehlen = (t) => {
    setForm((f) => ({ ...f, titel: t.titel, kategorie: t.kategorie || f.kategorie, quelle: t.quelle || f.quelle, ziel: t.ziel || f.ziel }));
    setShowSuggestions(false);
  };

  const validate = () => {
    const e = {};
    if (!form.titel.trim()) e.titel = "Titel erforderlich";
    if (!form.betrag || Number(form.betrag) <= 0) e.betrag = "Gültigen Betrag angeben";
    if (!form.quelle) e.quelle = form.typ === "Einnahme" ? "Herkunft angeben" : "Quelle wählen";
    if (form.typ !== "Ausgabe" && !form.ziel) e.ziel = "Ziel wählen";
    if (form.typ === "Ausgabe" && !form.kategorie) e.kategorie = "Kategorie wählen";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    onSubmit({ ...form, betrag: Number(form.betrag) });
    if (!initial) setForm(emptyForm());
  };
  const setTyp = (typ) => setForm((f) => ({ ...f, typ, kategorie: "", quelle: "", ziel: "" }));

  return (
    <form onSubmit={handleSubmit} className="mx-auto max-w-xl space-y-5">
      {!initial && <h2 className="text-base font-semibold text-zinc-200">Neue Buchung</h2>}
      <div className="grid grid-cols-3 gap-2">
        {["Ausgabe", "Einnahme", "Umbuchung"].map((typ) => {
          const active = form.typ === typ;
          const colors = { Ausgabe: "border-rose-500/50 bg-rose-500/10 text-rose-300", Einnahme: "border-emerald-500/50 bg-emerald-500/10 text-emerald-300", Umbuchung: "border-cyan-500/50 bg-cyan-500/10 text-cyan-300" };
          return <button key={typ} type="button" onClick={() => setTyp(typ)} className={`rounded-xl border px-3 py-2.5 text-sm font-medium transition-colors ${active ? colors[typ] : "border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200"}`}>{typ}</button>;
        })}
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Datum"><input type="date" className={inputCls} value={form.datum} onChange={(e) => setForm((f) => ({ ...f, datum: e.target.value }))} /></Field>
        <Field label="Betrag (€)">
          <input type="number" step="0.01" min="0" placeholder="0,00" className={inputCls} value={form.betrag} onChange={(e) => setForm((f) => ({ ...f, betrag: e.target.value }))} />
          {errors.betrag && <p className="mt-1 text-xs text-rose-400">{errors.betrag}</p>}
        </Field>
      </div>
      <Field label="Titel">
        <div className="relative">
          <input
            type="text"
            placeholder="z. B. Wocheneinkauf Rewe"
            className={inputCls}
            value={form.titel}
            onChange={(e) => { setForm((f) => ({ ...f, titel: e.target.value })); setShowSuggestions(true); }}
            onFocus={() => setShowSuggestions(true)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
            autoComplete="off"
          />
          {showSuggestions && gefilterteVorschlaege.length > 0 && (
            <div className="absolute z-20 mt-1 w-full overflow-hidden rounded-lg border border-zinc-700 bg-zinc-800 shadow-lg">
              {gefilterteVorschlaege.map((t) => (
                <button
                  key={t.titel}
                  type="button"
                  onMouseDown={() => vorschlagWaehlen(t)}
                  className="flex w-full items-center justify-between px-3 py-2 text-left text-sm text-zinc-200 hover:bg-zinc-700"
                >
                  <span className="truncate">{t.titel}</span>
                  <span className="ml-2 shrink-0 text-[11px] text-zinc-500">{t.kategorie}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        {errors.titel && <p className="mt-1 text-xs text-rose-400">{errors.titel}</p>}
      </Field>
      {form.typ !== "Umbuchung" && (
        <Field label="Kategorie">
          <select className={inputCls} value={form.kategorie} onChange={(e) => setForm((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="">Kategorie wählen</option>
            {catOptions.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          {errors.kategorie && <p className="mt-1 text-xs text-rose-400">{errors.kategorie}</p>}
        </Field>
      )}
      <div className="grid grid-cols-2 gap-3">
        <Field label={form.typ === "Einnahme" ? "Herkunft" : "Quelle"}>
          {form.typ === "Einnahme" ? (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Wählen</option><option value="arbeitgeber">Arbeitgeber</option><option value="extern">Extern</option>
              {accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          ) : (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Konto wählen</option>{accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          )}
          {errors.quelle && <p className="mt-1 text-xs text-rose-400">{errors.quelle}</p>}
        </Field>
        {form.typ !== "Ausgabe" && (
          <Field label="Ziel">
            <select className={inputCls} value={form.ziel} onChange={(e) => setForm((f) => ({ ...f, ziel: e.target.value }))}>
              <option value="">Konto wählen</option>
              {accountOptions.filter((n) => n !== form.quelle).map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            {errors.ziel && <p className="mt-1 text-xs text-rose-400">{errors.ziel}</p>}
          </Field>
        )}
      </div>
      <Field label="Notiz (optional)"><textarea rows={2} className={inputCls} value={form.notiz} onChange={(e) => setForm((f) => ({ ...f, notiz: e.target.value }))} placeholder="Zusätzliche Details" /></Field>
      <div className="flex items-center gap-2 pt-1">
        <button type="submit" disabled={submitting} className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-emerald-500 disabled:opacity-60">
          {submitting && <StrichmaennchenIcon zustand="rechnend" size={22} />}{initial ? "Änderungen speichern" : "Buchung speichern"}
        </button>
        {onCancel && <button type="button" onClick={onCancel} className="rounded-xl border border-zinc-700 px-4 py-2.5 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>}
      </div>
    </form>
  );
}

/* ============================== Journal ============================== */

// memo: transactions/accounts/categories/filter ändern sich nur bei
// echten Datenänderungen, nicht bei jedem Sync-Tick (z.B. "Geräte
// online") - onEdit/onDelete kommen als stabile useCallback-Referenzen
// von App, damit der Vergleich hier tatsächlich greift.
const Journal = memo(function Journal({ transactions, accounts, categories, filter, setFilter, showFilters, setShowFilters, onEdit, onDelete, isLight }) {
  const [detailTx, setDetailTx] = useState(null);
  const months = Array.from(new Set(transactions.map((t) => monthKey(t.datum)))).sort().reverse();
  const filtered = transactions.filter((t) => {
    if (filter.monat !== "alle" && monthKey(t.datum) !== filter.monat) return false;
    if (filter.konto !== "alle" && t.quelle !== filter.konto && t.ziel !== filter.konto) return false;
    if (filter.kategorie !== "alle" && t.kategorie !== filter.kategorie) return false;
    if (filter.typ !== "alle" && t.typ !== filter.typ) return false;
    return true;
  });
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Journal</h2>
        <button onClick={() => setShowFilters((s) => !s)} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">
          <Icon name="filter" size={13} /> Filter <Icon name="chevron" size={13} className={showFilters ? "rotate-180 transition-transform" : "transition-transform"} />
        </button>
      </div>
      {showFilters && (
        <div className="grid grid-cols-2 gap-2.5 rounded-xl border border-zinc-800 bg-zinc-900/50 p-3 md:grid-cols-4">
          <select className={inputCls} value={filter.monat} onChange={(e) => setFilter((f) => ({ ...f, monat: e.target.value }))}>
            <option value="alle">Alle Monate</option>{months.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
          <select className={inputCls} value={filter.konto} onChange={(e) => setFilter((f) => ({ ...f, konto: e.target.value }))}>
            <option value="alle">Alle Konten</option>{accounts.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
          <select className={inputCls} value={filter.kategorie} onChange={(e) => setFilter((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="alle">Alle Kategorien</option>{categories.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          <select className={inputCls} value={filter.typ} onChange={(e) => setFilter((f) => ({ ...f, typ: e.target.value }))}>
            <option value="alle">Alle Typen</option><option value="Ausgabe">Ausgabe</option><option value="Einnahme">Einnahme</option><option value="Umbuchung">Umbuchung</option>
          </select>
        </div>
      )}
      <div className="space-y-2">
        {filtered.map((t) => (
          <div key={t.id} onClick={() => setDetailTx(t)} className="flex cursor-pointer items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-3 hover:border-zinc-700 hover:bg-zinc-900">
            <div className="flex min-w-0 flex-1 items-center gap-2.5">
              <MerchantIcon titel={t.titel} isLight={isLight} quelle={t.quelle} ziel={t.ziel} />
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2"><p className="truncate text-sm font-medium text-zinc-200">{t.titel}</p><TypBadge typ={t.typ} /></div>
                <p className="mt-1 truncate text-[11.5px] text-zinc-500">{dateDE(t.datum)} · {t.kategorie} · {t.typ === "Ausgabe" ? t.quelle : `${t.quelle} → ${t.ziel}`}{t.notiz ? ` · ${t.notiz}` : ""}</p>
              </div>
            </div>
            <p className={`shrink-0 text-sm font-semibold tabular-nums ${t.typ === "Einnahme" ? "text-emerald-400" : t.typ === "Ausgabe" ? "text-rose-400" : "text-cyan-400"}`}>
              {t.typ === "Ausgabe" ? "-" : t.typ === "Einnahme" ? "+" : "↔"} {eur(t.betrag)}
            </p>
            <div className="flex shrink-0 items-center gap-1">
              <button onClick={(e) => { e.stopPropagation(); onEdit(t); }} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200"><Icon name="pencil" size={15} /></button>
              <button onClick={(e) => { e.stopPropagation(); onDelete(t.id); }} className="rounded-lg p-1.5 text-zinc-400 hover:bg-rose-500/10 hover:text-rose-400"><Icon name="trash" size={15} /></button>
            </div>
          </div>
        ))}
        {filtered.length === 0 && <p className="py-10 text-center text-sm text-zinc-500">Keine Buchungen für diese Filter gefunden.</p>}
      </div>
      {detailTx && (
        <DetailModal
          title={detailTx.titel}
          betrag={detailTx.betrag}
          typ={detailTx.typ}
          fields={[
            ["Datum", dateDE(detailTx.datum)],
            ["Kategorie", detailTx.kategorie],
            [detailTx.typ === "Ausgabe" ? "Konto" : "Von → Nach", detailTx.typ === "Ausgabe" ? detailTx.quelle : `${detailTx.quelle} → ${detailTx.ziel}`],
            ["Notiz", detailTx.notiz],
          ]}
          onClose={() => setDetailTx(null)}
          onEdit={() => { setDetailTx(null); onEdit(detailTx); }}
          onDelete={() => { setDetailTx(null); onDelete(detailTx.id); }}
        />
      )}
    </div>
  );
});

function EditModal({ tx, accounts, categories, transactions, onClose, onSave }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm md:items-center">

        <div className="mb-4 flex items-center justify-between"><h3 className="text-base font-semibold text-zinc-200">Buchung bearbeiten</h3><button onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800"><Icon name="x" size={18} /></button></div>

}

// "tone" unterscheidet eine gefährliche Aktion (Standard: rot, Löschen) von

        <p className="mb-5 text-sm text-zinc-400">{message}</p>

          <button onClick={onConfirm} className={`flex-1 rounded-xl px-4 py-2 text-sm font-medium text-white ${istGefahr ? "bg-rose-600 hover:bg-rose-500" : "bg-emerald-600 hover:bg-emerald-500"}`}>{confirmLabel}</button>

}

        </div>

}

      </div>

        <button type="submit" className="flex-1 rounded-xl bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500">Speichern</button>

/* ============================== KI-Assistent ============================== */

function AiAssistent({ messages, loading, onSend, onBuchen, onVerwerfen, vorlesen, onToggleVorlesen, voiceName, onVoiceChange, micTrigger, speaking, onStopSpeaking }) {
  const [input, setInput] = useState("");
  const [listening, setListening] = useState(false);
  // Avatar-Zustand des Hasen: Priorität rechnend > spricht > hört zu > idle,
  // da immer nur einer davon gleichzeitig wirklich zutrifft, aber loading
  // theoretisch mit einer noch laufenden alten Sprachausgabe überlappen könnte.
  const avatarZustand = loading ? "rechnend" : speaking ? "spricht" : listening ? "hoert" : "idle";
  const [deutscheStimmen, setDeutscheStimmen] = useState([]);
  const recognitionRef = useRef(null);
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
  }, [messages, loading]);

  // Browser laden die Liste der verfügbaren Stimmen teils erst asynchron
  // nach - direkt beim Öffnen des Tabs ist getVoices() oft noch leer, daher
  // zusätzlich auf "voiceschanged" hören.
  useEffect(() => {
    if (!("speechSynthesis" in window)) return;
    const ladeStimmen = () => {
      setDeutscheStimmen(window.speechSynthesis.getVoices().filter((v) => v.lang && v.lang.toLowerCase().startsWith("de")));
    };
    ladeStimmen();
    window.speechSynthesis.addEventListener("voiceschanged", ladeStimmen);
    return () => window.speechSynthesis.removeEventListener("voiceschanged", ladeStimmen);
  }, []);

  const stimmeTesten = () => {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("Hallo, so klingt diese Stimme.");
    u.lang = "de-DE";
    const stimme = waehleDeutscheStimme(window.speechSynthesis.getVoices(), voiceName);
    if (stimme) u.voice = stimme;
    window.speechSynthesis.speak(u);
  };

  // Nur in Chrome/Chromium-Browsern zuverlässig verfügbar - andere Browser
  // zeigen dann einfach keinen funktionierenden Mikrofon-Knopf, Tippen geht
  // aber immer.
  const speechSupported = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  const startListening = () => {
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionCtor) return;
    // Falls schon eine Aufnahme läuft (z.B. Stern-Symbol erneut angetippt,
    // während das Mikrofon noch aktiv ist) - erst die alte sauber beenden,
    // bevor eine neue gestartet wird, statt zwei Aufnahmen gleichzeitig
    // laufen zu lassen.
    if (recognitionRef.current) recognitionRef.current.abort();
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = "de-DE";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      onSend(transcript);
    };
    // Prüft, ob "recognition" noch die aktuell aktive Aufnahme ist, bevor der
    // "Nicht mehr zuhören"-Status gesetzt wird - verhindert, dass das Ende-
    // Ereignis einer gerade abgebrochenen, alten Aufnahme die Anzeige der
    // neuen, bereits gestarteten Aufnahme fälschlich auf "aus" zurücksetzt.
    recognition.onend = () => { if (recognitionRef.current === recognition) setListening(false); };
    recognition.onerror = () => { if (recognitionRef.current === recognition) setListening(false); };
    recognitionRef.current = recognition;
    setListening(true);
    recognition.start();
  };

  const stopListening = () => {
    recognitionRef.current?.stop();
    setListening(false);
  };

  // Sofort zuhören, sobald der Tab geöffnet wird (Effekt läuft immer einmal
  // beim Mounten) - der Tap auf das Stern-Symbol selbst zählt als
  // Nutzeraktion und öffnet direkt das Mikrofon, ohne dass zusätzlich noch
  // der Mikrofon-Knopf angetippt werden muss. Reagiert zusätzlich auf
  // micTrigger: Tippt man das Stern-Symbol erneut an, während der Tab schon
  // offen ist (z.B. um eine neue Nachricht zu sprechen), zählt der Zähler in
  // der übergeordneten Komponente hoch und startet die Spracherkennung hier
  // erneut - ohne micTrigger würde ein erneutes Antippen ins Leere laufen,
  // da der Tab ja schon aktiv ist und sich nicht neu öffnet.
  useEffect(() => {
    if (speechSupported) startListening();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [micTrigger]);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!input.trim()) return;
    onSend(input);
    setInput("");
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <AssistentKopfIcon zustand={avatarZustand} size={52} />
          <h2 className="text-base font-semibold text-zinc-200">Finz</h2>
        </div>
        <label className="flex items-center gap-1.5 text-[11px] text-zinc-500">
          <input type="checkbox" checked={vorlesen} onChange={onToggleVorlesen} className="h-3.5 w-3.5 accent-emerald-500" />
          Antworten vorlesen
        </label>
      </div>
      {vorlesen && deutscheStimmen.length > 0 && (
        <div className="-mt-2 flex items-center gap-2">
          <select value={voiceName} onChange={(e) => onVoiceChange(e.target.value)} className="min-w-0 flex-grow rounded-lg border border-zinc-700 bg-zinc-800/70 px-2.5 py-1.5 text-[12px] text-zinc-200">
            <option value="">Automatisch (beste verfügbare)</option>
            {deutscheStimmen.map((v) => (
              <option key={v.name} value={v.name}>{v.name}{v.localService ? "" : " (Netzwerk)"}</option>
            ))}
          </select>
          <button type="button" onClick={stimmeTesten} className="shrink-0 rounded-lg border border-zinc-700 px-2.5 py-1.5 text-[12px] text-zinc-400">Testen</button>
        </div>
      )}
      <p className="-mt-2 text-[11.5px] text-zinc-500">Frag mich etwas zu deinen Finanzen oder ganz allgemein, oder buche per Text/Sprache - jede Buchung zeige ich dir erst als Vorschlag zur Bestätigung.</p>

      <div className="space-y-2.5">
        {messages.length === 0 && (
          <p className="rounded-2xl border border-zinc-800 bg-zinc-900/40 p-4 text-center text-sm text-zinc-500">Noch keine Unterhaltung – frag einfach los.</p>
        )}
        {messages.map((m, i) => {
          const spichtGerade = m.role !== "user" && i === messages.length - 1 && speaking;
          return (
          <div key={m.id} className={`flex items-end gap-1.5 ${m.role === "user" ? "justify-end" : "justify-start"}`}>
            {m.role !== "user" && (
              <AssistentKopfIcon zustand={spichtGerade ? "spricht" : "idle"} size={46} className="mb-0.5 shrink-0" />
            )}
            <div className="flex max-w-[85%] flex-col gap-1.5">
            <div
              className={`rounded-2xl px-3.5 py-2.5 text-[13.5px] leading-relaxed ${
                m.role === "user"
                  ? "rounded-br-sm border border-emerald-500/30 bg-emerald-500/10 text-emerald-50"
                  : m.isError
                  ? "rounded-bl-sm border border-rose-500/30 bg-rose-500/10 text-rose-200"
                  : "rounded-bl-sm border border-zinc-800 bg-zinc-900/70 text-zinc-200"
              }`}
            >
              {m.text}
              {m.buchungsvorschlag && (
                <div className="mt-2.5 space-y-2 rounded-xl border border-zinc-800 bg-zinc-950/60 p-2.5">
                  <p className="text-[11px] text-zinc-500">
                    {m.vorschlagStatus === "gebucht" ? (m.buchungsvorschlag.id ? "Geändert:" : "Gebucht:") : m.vorschlagStatus === "verworfen" ? "Verworfen:" : m.buchungsvorschlag.id ? "Änderung – bitte prüfen:" : "Vorschlag – bitte prüfen:"}
                  </p>
                  <div className="space-y-1 text-[12.5px]">
                    <div className="flex justify-between">
                      <span className="text-zinc-500">{m.buchungsvorschlag.typ}</span>
                      <span className={`font-semibold ${m.buchungsvorschlag.typ === "Ausgabe" ? "text-rose-300" : "text-emerald-300"}`}>{eur(Number(m.buchungsvorschlag.betrag) || 0)}</span>
                    </div>
                    <div className="flex justify-between"><span className="text-zinc-500">Titel</span><span className="text-zinc-200">{m.buchungsvorschlag.titel}</span></div>
                    <div className="flex justify-between"><span className="text-zinc-500">Kategorie</span><span className="text-zinc-200">{m.buchungsvorschlag.kategorie}</span></div>
                    <div className="flex justify-between"><span className="text-zinc-500">Konto</span><span className="text-zinc-200">{m.buchungsvorschlag.quelle}{m.buchungsvorschlag.ziel ? " → " + m.buchungsvorschlag.ziel : ""}</span></div>
                  </div>
                  {!m.vorschlagStatus && (
                    <div className="flex gap-2 pt-0.5">
                      <button onClick={() => onBuchen(m.id, m.buchungsvorschlag)} className="flex-1 rounded-lg bg-emerald-500 py-1.5 text-[12.5px] font-semibold text-emerald-950">{m.buchungsvorschlag.id ? "Ändern" : "Buchen"}</button>
                      <button onClick={() => onVerwerfen(m.id)} className="flex-1 rounded-lg border border-zinc-700 py-1.5 text-[12.5px] text-zinc-400">Verwerfen</button>
                    </div>
                  )}
                </div>
              )}
            </div>
            {spichtGerade && (
              <button
                type="button"
                onClick={onStopSpeaking}
                className="inline-flex w-fit items-center gap-1.5 self-start rounded-full border border-zinc-700 bg-zinc-900 px-2.5 py-1 text-[11px] font-medium text-zinc-400"
              >
                <Icon name="stop" size={11} className="text-rose-400" />
                Vorlesen stoppen
              </button>
            )}
            </div>
          </div>
          );
        })}
        {loading && (
          <div className="flex items-end justify-start gap-1.5">
            <AssistentKopfIcon zustand="rechnend" size={46} className="mb-0.5 shrink-0" />
            <div className="rounded-2xl rounded-bl-sm border border-zinc-800 bg-zinc-900/70 px-3.5 py-2.5 text-[13px] text-zinc-500">…denkt nach</div>
          </div>
        )}
      </div>

      <form onSubmit={handleSubmit} className="flex items-center gap-2">
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          placeholder="Frag mich etwas oder buche per Sprache…"
          className="flex-grow rounded-full border border-zinc-700 bg-zinc-800/70 px-4 py-2.5 text-[13.5px] text-zinc-100 outline-none focus:border-emerald-500"
        />
        {speechSupported && (
          <button
            type="button"
            onClick={listening ? stopListening : startListening}
            title={listening ? "Aufnahme beenden" : "Spracheingabe starten"}
            className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${listening ? "animate-pulse bg-rose-500" : "bg-emerald-500"}`}
          >
            <Icon name="mic" size={17} className={listening ? "text-white" : "text-emerald-950"} />
          </button>
        )}
        <button type="submit" disabled={!input.trim()} title="Senden" className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-zinc-700 text-zinc-300 disabled:opacity-40">
          <Icon name="send" size={16} />
        </button>
      </form>
      <div ref={bottomRef} />
    </div>
  );
}

/* ============================== Prognose ============================== */

function Prognose({ accounts, balances, fixedCosts, einstellungen, transactions }) {
  const MONATE_VORAUS = 24;
  const potAllocations = useMemo(() => getMonthlyPotAllocations(fixedCosts), [fixedCosts]);
  const trSchedule = useMemo(() => getRateSchedule(einstellungen, "Trade Republic"), [einstellungen]);

  const verfuegbareToepfe = PROGNOSE_TOEPFE.filter((name) => accounts.some((a) => a.name === name));

  let prognoseFehler = null;
  const reihen = useMemo(() => {
    return verfuegbareToepfe.map((name) => {
      try {
        return { name, daten: simulateForecast(name, accounts, transactions, potAllocations[name] || 0, trSchedule, MONATE_VORAUS) };
      } catch (err) {
        return { name, daten: [], fehler: err.message };
      }
    });
  }, [verfuegbareToepfe.join(","), accounts, transactions, potAllocations, trSchedule]);
  reihen.forEach((r) => { if (r.fehler && !prognoseFehler) prognoseFehler = r.fehler; });

  // useMemo statt Neuberechnung bei jedem Render: "rows" wird dadurch eine
  // stabile Referenz, solange sich "reihen"/"prognoseFehler" nicht wirklich
  // ändern - das spart weiter unten den teuren JSON.stringify-Vergleich zum

              ))}

        )}
      </div>
    </div>
  );
}

/* ============================== Auswertung ============================== */

function computeVermoegensverlauf(accounts, transactions) {
  const currentMK = monthKey(todayISO());
  const monthsSet = new Set(transactions.map((t) => monthKey(t.datum)));
  monthsSet.add(currentMK);
  const months = Array.from(monthsSet).filter(Boolean).sort();
  return months.map((mk) => {
    const [y, m] = mk.split("-").map(Number);
    const cutoff = toISO(new Date(y, m, 0));
    const txUpTo = transactions.filter((t) => t.datum <= cutoff);
    const bal = computeBalances(accounts, txUpTo);
    const ing = bal["ING"] || 0;
    const trFrei = bal["Trade Republic"] || 0;
    const pots = accounts.filter((a) => a.typ === "virtuell").reduce((s, a) => s + (bal[a.name] || 0), 0);
    return { monat: mk, gesamt: Math.round((ing + trFrei + pots) * 100) / 100 };
  });
}

function computeKategorienAuswertung(transactions, monatsFilter) {
  const monthTx = transactions.filter((t) => t.typ === "Ausgabe" && (!monatsFilter || monthKey(t.datum) === monatsFilter));
  const map = {};
  monthTx.forEach((t) => { map[t.kategorie || "Sonstiges"] = (map[t.kategorie || "Sonstiges"] || 0) + Number(t.betrag || 0); });
  return Object.entries(map).map(([kategorie, betrag]) => ({ kategorie, betrag: Math.round(betrag * 100) / 100 })).sort((a, b) => b.betrag - a.betrag);
}

// Bewusst weit auseinanderliegende Farbtöne (nicht mehrere Violett-/Rosatöne
// nebeneinander wie zuvor), mittlere Helligkeit/Sättigung, damit jede Farbe
// sowohl auf hellem als auch auf dunklem Hintergrund gut lesbar bleibt.
// Bewährte, gut unterscheidbare Kategorie-Palette (Tableau10-Variante),
// abgestimmt für gute Lesbarkeit sowohl im hellen als auch im dunklen Design.
const KATEGORIE_FARBPALETTE = ["#4e79a7", "#f28e2b", "#59a14f", "#e15759", "#b07aa1", "#76b7b2", "#ff9da7", "#9c755f", "#d4a017", "#8c8681"];
// Feste Farbe pro Kategorie-Name (statt nach Rang), damit dieselbe Kategorie
// über alle Ansichten und Monate hinweg immer dieselbe Farbe hat - Grundlage
// für einen sinnvollen Vergleich im Jahresverlauf. Nur Ausgabe-Kategorien
// werden gezählt, da Einnahme-Kategorien (z. B. "Gehalt") in diesem
// Ausgaben-Diagramm ohnehin nie auftauchen und sonst unnötig eine
// Farb-Position "verbrauchen" würden.
function getKategorieFarbe(name, categories) {
  const ausgabeNamen = categories.filter((c) => c.typ === "Ausgabe").map((c) => c.name);
  const alleNamen = Array.from(new Set([...ausgabeNamen, "Sonstiges"])).sort();
  const index = alleNamen.indexOf(name);
  return KATEGORIE_FARBPALETTE[(index >= 0 ? index : 0) % KATEGORIE_FARBPALETTE.length];
}

// Nur die letzten zwei Kalenderjahre stehen zur Auswahl (aktuelles Jahr und
// ggf. das direkt vorherige, falls dafür Daten existieren) - ältere Jahre
// fallen automatisch aus der Auswahl heraus.
function getVerfuegbareJahre(transactions) {
  const heute = new Date().getFullYear();
  const vorhanden = new Set(transactions.map((t) => Number((t.datum || "").slice(0, 4))).filter((y) => !isNaN(y)));
  return [heute - 1, heute].filter((y) => vorhanden.has(y) || y === heute);
}

const MONATSNAMEN_KURZ = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const MONATSNAMEN_VOLL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
// Dieselben Töpfe, die auch den Ausgaberest speisen - Grundlage für die
// zusätzliche, rein berechnete "Budgetrest"-Anzeige (kein echtes Konto).
const POTS_BUDGETREST = ["Laden", "E-Liquids", "Lebensmittel", "Freizeit", "Kosmetik", "Abo & ETF", "Puffer"];

function computeJahresverlauf(transactions, jahr) {
  const heute = new Date();
  const maxMonat = jahr === heute.getFullYear() ? heute.getMonth() : 11;
  const monate = [];
  for (let m = 0; m <= maxMonat; m++) {
    const mk = `${jahr}-${String(m + 1).padStart(2, "0")}`;
    const monthTx = transactions.filter((t) => t.typ === "Ausgabe" && monthKey(t.datum) === mk);
    const perKategorie = {};
    monthTx.forEach((t) => { const k = t.kategorie || "Sonstiges"; perKategorie[k] = (perKategorie[k] || 0) + Number(t.betrag || 0); });
    monate.push({ label: MONATSNAMEN_KURZ[m], kategorien: perKategorie });
  }
  const alleKategorien = Array.from(new Set(monate.flatMap((m) => Object.keys(m.kategorien))));
  return { monate, kategorien: alleKategorien };
}

function Auswertung({ transactions, accounts, categories, kontoauszuege, fixedCosts }) {
  const [ansicht, setAnsicht] = useState("monat");
  const currentMK = monthKey(todayISO());
  const verfuegbareJahre = useMemo(() => getVerfuegbareJahre(transactions), [transactions]);
  const istJahresansicht = ansicht.startsWith("jahr-");
  const ausgewaehltesJahr = istJahresansicht ? Number(ansicht.split("-")[1]) : null;
  const sparen = useMemo(() => computeMonatlichesSparen(fixedCosts), [fixedCosts]);
  const vorausschau = useMemo(() => computeVorausschau(fixedCosts), [fixedCosts]);
  const topfAuswirkungen = useMemo(() => computeVorausschauTopfAuswirkungen(vorausschau.changes), [vorausschau.changes]);
  const SPAR_FARBEN = ["#34d399", "#10b981", "#059669", "#065f46"];

  const verlauf = useMemo(() => computeVermoegensverlauf(accounts, transactions), [accounts, transactions]);
  const kategorien = useMemo(() => computeKategorienAuswertung(transactions, ansicht === "monat" ? currentMK : null), [transactions, ansicht]);
  const jahresdaten = useMemo(() => (istJahresansicht ? computeJahresverlauf(transactions, ausgewaehltesJahr) : null), [transactions, ansicht]);

  const verlaufRef = useRef(null);
  const verlaufChart = useRef(null);
  const katRef = useRef(null);
  const katChart = useRef(null);
  const jahrRef = useRef(null);
  const jahrChart = useRef(null);
  const sparRef = useRef(null);
  const sparChartRef = useRef(null);
  const vorausschauRef = useRef(null);
  const vorausschauChartRef = useRef(null);

  useEffect(() => {
    if (!verlaufRef.current || typeof Chart === "undefined" || verlauf.length === 0) return;
    if (verlaufChart.current) verlaufChart.current.destroy();
    verlaufChart.current = new Chart(verlaufRef.current, {
      type: "line",
      data: {
        labels: verlauf.map((r) => r.monat),
        datasets: [{ label: "Gesamtvermögen", data: verlauf.map((r) => r.gesamt), borderColor: "#10b981", backgroundColor: "rgba(16,185,129,0.15)", fill: true, tension: 0.3, pointRadius: 3 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#898781", maxRotation: 45 }, grid: { display: false } },
          y: { ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
        },
      },
    });
    return () => { if (verlaufChart.current) verlaufChart.current.destroy(); };
  }, [verlauf]);

  useEffect(() => {
    if (ansicht === "sparen" || ansicht === "vorausschau" || istJahresansicht || !katRef.current || typeof Chart === "undefined") return;
    if (katChart.current) katChart.current.destroy();
    katChart.current = new Chart(katRef.current, {
      type: "bar",
      data: {
        labels: kategorien.map((k) => k.kategorie),

      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
          y: { ticks: { color: "#898781" }, grid: { display: false } },
        },
      },
    });
    return () => { if (katChart.current) katChart.current.destroy(); };
  }, [kategorien, istJahresansicht, ansicht]);

  useEffect(() => {
    if (!istJahresansicht || !jahrRef.current || typeof Chart === "undefined" || !jahresdaten) return;
    if (jahrChart.current) jahrChart.current.destroy();

          backgroundColor: getKategorieFarbe(kat, categories),
          borderRadius: 3,
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { stacked: true, ticks: { color: "#898781" }, grid: { display: false } },
          y: { stacked: true, ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
        },
      },
    });
    return () => { if (jahrChart.current) jahrChart.current.destroy(); };
  }, [jahresdaten, istJahresansicht]);

  useEffect(() => {
    if (ansicht !== "sparen" || !sparRef.current || typeof Chart === "undefined" || sparen.posten.length === 0) return;
    if (sparChartRef.current) sparChartRef.current.destroy();
    sparChartRef.current = new Chart(sparRef.current, {
      type: "bar",
      data: {
        // Zweizeiliges Label für Verbrauchssparen-Posten (Chart.js rendert ein

        // technisch bedingt in derselben Schriftgröße wie die erste Zeile.
        labels: sparen.posten.map((p) => (p.verbrauchssparen ? [p.bezeichnung, "(Verbrauchssparen)"] : p.bezeichnung)),

      type: "bar",
      data: {
        labels: vorausschau.monate.map((m) => m.label),
        datasets: [{ label: "Ausgaben", data: vorausschau.monate.map((m) => m.ausgaben), backgroundColor: "#10b981", borderRadius: 6 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#898781" }, grid: { display: false } },
          y: { ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
        },
      },
    });
    return () => { if (vorausschauChartRef.current) vorausschauChartRef.current.destroy(); };
  }, [vorausschau.monate, ansicht]);

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-base font-semibold text-zinc-200">Vermögensverlauf</h2>
        <p className="mt-1 text-[12.5px] text-zinc-500">Rückblickend berechnet aus deinen tatsächlichen Buchungen – Gesamtvermögen (ING + Trade Republic) am Ende jedes Monats.</p>
      </div>
      <div className="relative h-64 w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        {verlauf.length > 1 ? <canvas ref={verlaufRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Noch nicht genug Buchungen für einen Verlauf.</p>}
      </div>

      <div className="flex flex-col gap-3">
        <h2 className="text-base font-semibold text-zinc-200">{ansicht === "sparen" ? "Was legst du monatlich zur Seite?" : ansicht === "vorausschau" ? "Wie entwickeln sich deine Fixkosten?" : "Wofür geht dein Geld weg?"}</h2>
        <div className="flex gap-0.5 rounded-lg border border-zinc-800 bg-zinc-900/50 p-1">

/* ============================== Autokredit ============================== */

// Welche der vier Szenario-Zusammenfassungen (aus simulateAutokreditSzenarien)
// zu welchem gespeicherten strategie-Wert gehört.
const AUTOKREDIT_STRATEGIE_FELD = {
  geplant: "geplant",
  sammeln_ablosen: "sammelnAbloesen",
  teilweise_sondertilgung: "teilweiseSondertilgung",
  sofortige_sondertilgung: "sofortigeSondertilgung",
};
// Reihenfolge, Beschriftung und Risikoeinschätzung der vier auswählbaren
// Karten. "sub" und "risikoText" sind Funktionen von (ab, bereitsSondertilgt):
// "ab" ist der AKTUELLE Ablösung-Saldo, "bereitsSondertilgt" die Summe aller
// bereits real gebuchten Sondertilgungen. Ohne das wäre z.B. "Sammeln &
// Ablösen" nach einer echten Sondertilgung falsch beschriftet ("Ablösung
// bleibt vollständig verfügbar", obwohl die Rücklage schon angetastet wurde),
// und "Teilweise/Sofortige Sondertilgung" würden wie ein erster statt ein
// zusätzlicher Schritt wirken.
const AUTOKREDIT_SZENARIO_DEFS = [
  {
    key: "geplant", label: "Regulärer Verlauf", sub: () => "Laut Vertrag, keine Sondertilgung", tag: () => null,
    risikoLevel: () => "niedrig",
    risikoText: () => "Höchste Gesamtkosten – reiner Vergleichswert ohne jede Sondertilgung.",
  },
  {
    // Reiner Vergleichs-Pfad "hätte ich nie sondergetilgt" (siehe
    // simulateAutokreditSzenarien: Restschuld/Ablösung-Topf dafür OHNE jede
    // reale Sondertilgung rekonstruiert). Ohne Historie ist das identisch zum
    // echten heutigen Stand - der Text unterscheidet deshalb beide Fälle.
    key: "sammeln_ablosen", label: "Sammeln & Ablösen", sub: () => "Kein weiterer Sofort-Einsatz aus Ablösung", tag: () => null,
    risikoLevel: () => "niedrig",
    risikoText: (ab, bereits) => bereits > 0.005
      ? "Reiner Vergleich: so hätte es sich entwickelt ohne die bereits geleistete Sondertilgung. Ablösung bliebe in diesem Szenario vollständig verfügbar."
      : "Ablösung bleibt vollständig verfügbar.",
  },
  {
    // War als EINMALIGE Sondertilgung (Hälfte der ursprünglichen Schlussrate)
    // geplant - nicht als wiederkehrende Aktion. Sobald real schon eine
    // Sondertilgung gebucht ist, schlägt diese Karte deshalb KEINE weitere
    // Zahlung mehr vor (sofortBetrag 0 in simulateAutokreditSzenarien) - peilt
    // danach aber GENAUSO wie "Sammeln & Ablösen" irgendwann einen vollen
    // Ablöse-Zeitpunkt an ("auszulösen, wenn die Restschuld zusammen ist" war
    // die ganze Zeit der eigentliche Plan), nur eben vom echten, schon
    // reduzierten heutigen Stand aus - deshalb günstiger und etwas früher
    // fertig als "Sammeln & Ablösen" (die rein rechnerisch so tut, als wäre
    // nie sondergetilgt worden). Das Liquiditätsrisiko bleibt bewusst
    // "mittel": die eingesetzten 5.895 € sind dauerhaft weg aus der Rücklage -
    // anders als bei "Sammeln & Ablösen", wo noch gar nichts angefasst wurde.
    key: "teilweise_sondertilgung", label: "Teilweise Sondertilgung",
    sub: (ab, bereits) => bereits > 0.005 ? "Bereits umgesetzt – läuft normal weiter" : `${eur(ab / 2)} sofort aus Ablösung`,
    tag: (bereits) => bereits > 0.005
      ? { text: "Umgesetzt", className: "border-emerald-500/30 bg-emerald-500/10 text-emerald-300" }
      : { text: "Mittelweg", className: "border-sky-500/30 bg-sky-500/10 text-sky-300" },
    risikoLevel: () => "mittel",
    risikoText: (ab, bereits) => bereits > 0.005
      ? `Bereits ${eur(bereits)} dauerhaft aus der Rücklage eingesetzt. Keine weitere Sofort-Zahlung geplant – sammelt im normalen Rhythmus (230 €/Monat an die Bank, 200 €/Monat in Model 3) weiter, bis für die volle Ablösung reicht.`
      : "Halbe Ablösung bleibt als Puffer.",
  },
  {
    key: "sofortige_sondertilgung", label: "Sofortige Sondertilgung", sub: (ab, bereits) => `${eur(ab)} ${bereits > 0.005 ? "zusätzlich " : ""}sofort aus Ablösung`,
    tag: () => ({ text: "Günstigste", className: "border-emerald-500/30 bg-emerald-500/10 text-emerald-300" }), risikoLevel: () => "hoch",
    risikoText: (ab, bereits) => bereits > 0.005
      ? `Zusätzlich zur bereits geleisteten Sondertilgung (${eur(bereits)}) den kompletten jetzigen Ablösung-Topf einsetzen – Rücklage bleibt unberührt.`
      : "Ablöse-Topf fällt auf 0 €, Rücklage bleibt.",
  },
];
const AUTOKREDIT_RISIKO_FARBE = { niedrig: "text-emerald-400", mittel: "text-amber-400", hoch: "text-rose-400" };

// "kreditfreiAb" ist je nach Szenario entweder ein ISO-Datum (Schlussrate-
// Fälligkeit beim "Regulärer Verlauf") oder ein "MM/JJJJ"-String (alle
// anderen, aus simulateAutokreditVerlauf) - hier einheitlich fürs Anzeigen
// bzw. für die Monatsdifferenz zu heute aufbereitet.
function formatKreditfreiAb(wert) {
  if (!wert) return "–";
  return wert.includes("-") ? dateDE(wert) : wert;
}
function monateBisKreditfrei(wert, heuteISO) {
  if (!wert) return null;
  if (wert.includes("-")) return monatsDiff(heuteISO, wert);
  const [m, y] = wert.split("/").map(Number);
  const heute = isoZuDatum(heuteISO);
  return (y - heute.getFullYear()) * 12 + (m - 1 - heute.getMonth());
}

function Autokredit({ balances, einstellungen, kredit, planVerlauf, kreditBuchungen, kreditCheckliste, transactions, onAddBuchung, onDeleteBuchung, onToggleChecklisteItem, onWaehleStrategie }) {
  const heuteISO = todayISO();
  // Fallback NUR damit die Hooks unten immer mit gültigen Zahlen rechnen
  // können (Hooks müssen in jedem Render unabhängig vom Ladezustand in
  // derselben Reihenfolge laufen) - sobald kredit null ist, wird am Ende
  // ohnehin ein Einrichtungs-Hinweis statt der eigentlichen Ansicht gezeigt.
  const kreditOderFallback = kredit || {
    nettodarlehen: 0, auszahlungsdatum: heuteISO, sollzins: 0, monatsrate: 0, schlussrate: 0,
    schlussrateAktuell: null, schlussrateFaelligAm: heuteISO, vfeProzentNormal: 0, vfeProzentKurz: 0, vfeKurzSchwelleMonate: 0,
  };
  const letzteBuchung = kreditBuchungen.length > 0 ? kreditBuchungen[kreditBuchungen.length - 1] : null;
  const restschuldAktuell = letzteBuchung ? letzteBuchung.restschuldNach : kreditOderFallback.nettodarlehen;
  const restschuldDatum = letzteBuchung ? letzteBuchung.datum : kreditOderFallback.auszahlungsdatum;

  const model3Saldo = balances["Model 3"] || 0;
  const abloesungSaldo = balances["Ablösung"] || 0;
  const toepfeGesamtAktuell = Math.round((model3Saldo + abloesungSaldo) * 100) / 100;

  const vfeAktuell = useMemo(() => berechneVfe(restschuldAktuell, heuteISO, kreditOderFallback), [restschuldAktuell, heuteISO, kredit]);
  const nochOffen = Math.max(0, Math.round((restschuldAktuell + vfeAktuell - toepfeGesamtAktuell) * 100) / 100);
  const deckungsgrad = restschuldAktuell + vfeAktuell > 0 ? Math.min(100, Math.round((toepfeGesamtAktuell / (restschuldAktuell + vfeAktuell)) * 100)) : 100;
  const bereitsGedeckt = toepfeGesamtAktuell >= restschuldAktuell + vfeAktuell;
  const istVollstaendigAbgeloest = restschuldAktuell <= 0.005;

  // Entspricht szenarien.sammelnAbloesen, aber mit vollem Monatsverlauf (für
  // die Plan/Ist/Prognose-Tabelle unten, die sich bewusst immer auf diese
  // eine Strategie bezieht - genau die, für die auch autokredit_plan_verlauf
  // seinerzeit erstellt wurde, unabhängig von der aktuell gewählten Karte).
  const { rows } = useMemo(() => simulateAutokreditVerlauf({
    restschuldStart: restschuldAktuell,
    restschuldDatum,
    model3Saldo,
    abloesungSaldo,
    kredit: kreditOderFallback,
    model3MonatsRate: AUTOKREDIT_MODEL3_RATE,
    monateVoraus: AUTOKREDIT_MONATE_VORAUS,
  }), [restschuldAktuell, restschuldDatum, model3Saldo, abloesungSaldo, kredit]);

  // Der Topf "Ablösung" liegt real bei Trade Republic - derselbe Zinssatz,
  // der auch die "Tagesgeld-Zins gefallen"-Warnung unten speist, wird hier für
  // die Habenzinsen/Nettokosten-Kennzahl wiederverwendet (zentral über die
  // Einstellungen konfigurierbar, keine eigene Autokredit-Konfiguration nötig).
  const trZinssatz = useMemo(() => {
    const schedule = getRateSchedule(einstellungen, "Trade Republic");
    return rateForDate(schedule, heuteISO);
  }, [einstellungen, heuteISO]);

  // Summe aller real gebuchten Sondertilgungen - macht die Risikotexte der
  // Szenario-Karten ehrlich (siehe AUTOKREDIT_SZENARIO_DEFS) und sorgt dafür,
  // dass "Teilweise Sondertilgung" nach ihrer (einmaligen) Umsetzung keine
  // weitere Sofort-Zahlung mehr vorschlägt (siehe simulateAutokreditSzenarien).
  const bereitsSondertilgtGesamt = useMemo(
    () => kreditBuchungen.filter((b) => b.typ === "Sondertilgung").reduce((s, b) => s + b.betrag, 0),
    [kreditBuchungen]
  );

  const szenarien = useMemo(() => simulateAutokreditSzenarien({
    restschuldStart: restschuldAktuell,
    restschuldDatum,
    model3Saldo,
    abloesungSaldo,
    kredit: kreditOderFallback,
    model3MonatsRate: AUTOKREDIT_MODEL3_RATE,
    monateVoraus: AUTOKREDIT_MONATE_VORAUS,
    sparzins: trZinssatz || 0,
    bereitsSondertilgt: bereitsSondertilgtGesamt,
  }), [restschuldAktuell, restschuldDatum, model3Saldo, abloesungSaldo, kredit, trZinssatz, bereitsSondertilgtGesamt]);

  const gewaehlteStrategie = kredit && AUTOKREDIT_STRATEGIE_FELD[kredit.strategie] ? kredit.strategie : "sammeln_ablosen";
  const ausgewaehltesSzenario = szenarien[AUTOKREDIT_STRATEGIE_FELD[gewaehlteStrategie]];
  const monateBisAusgewaehlt = monateBisKreditfrei(ausgewaehltesSzenario.kreditfreiAb, heuteISO);

  // Für die "Kreditkosten (seit Vertragsbeginn)"-Zeile je Szenario-Karte -
  // historisch, bei jeder Karte gleich (siehe berechneBereitsGezahlteZinsen).
  const bereitsGezahlteZinsen = useMemo(
    () => berechneBereitsGezahlteZinsen(kreditBuchungen, kreditOderFallback.nettodarlehen),
    [kreditBuchungen, kredit]
  );

  const rücklageSaldo = balances["Rücklage"] || 0;

  // Feste Referenzgröße für den Verlauf: was hätte der Kredit insgesamt
  // gekostet, ohne jede Sondertilgung - hängt nur von den Vertragsdaten ab.
  const urspruenglicheKreditkosten = useMemo(
    () => berechneUrspruenglicheKreditkosten(kreditOderFallback),
    [kredit]
  );
  const gesamtkostenGewaehlteStrategie = ausgewaehltesSzenario.nettokosten !== null
    ? Math.round((bereitsGezahlteZinsen + ausgewaehltesSzenario.nettokosten) * 100) / 100
    : null;
  const ersparnisInsgesamt = gesamtkostenGewaehlteStrategie !== null
    ? Math.round((urspruenglicheKreditkosten - gesamtkostenGewaehlteStrategie) * 100) / 100
    : null;

  // "% abbezahlt"-Ring in der Übersicht: bewusst wie die Bank-App auf Basis
  // der GESAMTKOSTEN (Kapital + Zinsen) berechnet, nicht nur auf Basis des
  // reinen Kapitals - sonst weicht unsere Zahl von der echten Banking-App ab
  // (dort z.B. 38 % statt unserer vorherigen, rein kapitalbasierten 35 %).
  // "Offener Gesamtbetrag" = Restschuld + alle noch anfallenden Zinsen bei
  // regulärem Verlauf bis zum Vertragsende (= szenarien.geplant.zinsen,
  // ohne VFE, da ein regulärer Verlauf nie "vorzeitig" ist) - das ist
  // rechnerisch exakt die Summe aller noch ausstehenden nominalen Raten
  // inkl. Schlussrate, die auch die Bank als "Offener Darlehensbetrag"
  // ausweist (mit echten Zahlen gegengerechnet: 13.505,97 € Restschuld +
  // Restzinsen = 15.596,96 € - exakt der Betrag aus dem Bankschreiben).
  // "Ursprünglicher Gesamtbetrag" = Nettodarlehen + urspruenglicheKreditkosten
  // (Gesamtzinsen über die volle Laufzeit ohne jede Sondertilgung).
  const offenerGesamtbetrag = Math.round((restschuldAktuell + szenarien.geplant.zinsen) * 100) / 100;
  const urspruenglicherGesamtbetrag = Math.round((kreditOderFallback.nettodarlehen + urspruenglicheKreditkosten) * 100) / 100;
  const bereitsBezahltGesamt = Math.max(0, Math.round((urspruenglicherGesamtbetrag - offenerGesamtbetrag) * 100) / 100);
  const prozentAbbezahlt = urspruenglicherGesamtbetrag > 0
    ? Math.min(100, Math.round((bereitsBezahltGesamt / urspruenglicherGesamtbetrag) * 100))
    : 0;
  const ringRadius = 34;
  const ringUmfang = 2 * Math.PI * ringRadius;
  const ringOffset = ringUmfang * (1 - prozentAbbezahlt / 100);

  // Jede gebuchte Sondertilgung als eigene Verlaufs-Station, mit Effekt
  // (VFE, neue Schlussrate, Ersparnis) - "Restschuld vor" ist die letzte
  // Buchung davor (kreditBuchungen ist chronologisch sortiert), bzw. das
  // Nettodarlehen, falls es die allererste Buchung überhaupt ist. Bei der
  // JÜNGSTEN SONDERTILGUNG (nicht der jüngsten Buchung überhaupt - spätere
  // reguläre Monats-Tilgungen ändern daran nichts) zeigt die Station den von
  // der Bank bestätigten Wert aus "schlussrateAktuell" statt der eigenen
  // Schätzung, falls vorhanden - bei älteren Sondertilgungen bleibt es bei
  // der Schätzung, da "schlussrateAktuell" immer nur den jeweils neuesten
  // Stand speichert, nicht einen Wert je Sondertilgung.
  const sondertilgungsStationen = useMemo(() => {
    const letzteSondertilgungId = [...kreditBuchungen].reverse().find((b) => b.typ === "Sondertilgung")?.id ?? null;
    return kreditBuchungen
      .map((b, i) => {
        if (b.typ !== "Sondertilgung") return null;
        const restschuldVor = i > 0 ? kreditBuchungen[i - 1].restschuldNach : kreditOderFallback.nettodarlehen;
        const istJuengsteSondertilgung = b.id === letzteSondertilgungId;
        const schlussrateBestaetigt = istJuengsteSondertilgung && kreditOderFallback.schlussrateAktuell != null
          ? kreditOderFallback.schlussrateAktuell
          : null;
        return { ...b, restschuldVor, schlussrateBestaetigt, ...berechneSondertilgungsEffekt(restschuldVor, b.restschuldNach, b.datum, kreditOderFallback) };
      })
      .filter(Boolean);
  }, [kreditBuchungen, kredit]);

  // Fortschreibender Verlauf: jede Autokredit-Buchung chronologisch, dazu
  // Umbuchungen aus dem normalen Journal, bei denen "Ablösung" Quelle oder
  // Ziel ist (bewusste, unregelmäßige Aktionen wie eine Ablösung-&rarr;-
  // Model-3-Umschichtung). Die reguläre monatliche Model-3-Zuführung taucht
  // NICHT einzeln auf (wäre jeden Monat dasselbe, rein routinemäßig) -
  // steckt aber im "Zurückgelegt"-Wert bei "Heute" mit drin. Reguläre
  // Tilgungen/Zinsbelastungen/Gebühren werden "kompakt" dargestellt,
  // Sondertilgung/Ablösung/Umbuchung ausführlich.
  const sondertilgungNachId = useMemo(
    () => Object.fromEntries(sondertilgungsStationen.map((s) => [s.id, s])),
    [sondertilgungsStationen]
  );
  const verlaufsEintraege = useMemo(() => {
    const ausBuchungen = kreditBuchungen.map((b) => ({
      key: "b-" + b.id,
      datum: b.datum,
      art: b.typ === "Sondertilgung" ? "sondertilgung" : b.typ === "Ablösung" ? "ablösung" : "kompakt",
      buchung: b.typ === "Sondertilgung" ? sondertilgungNachId[b.id] : b,
    }));
    const ausUmbuchungen = (transactions || [])
      .filter((t) => t.typ === "Umbuchung" && (t.quelle === "Ablösung" || t.ziel === "Ablösung"))
      .map((t) => ({ key: "t-" + t.id, datum: t.datum, art: "umbuchung", umbuchung: t }));
    return [...ausBuchungen, ...ausUmbuchungen].sort((a, b) => (a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0));
  }, [kreditBuchungen, sondertilgungNachId, transactions]);

  // Aufeinanderfolgende "kompakt"-Einträge (reguläre Tilgung/Zinsbelastung/
  // Gebühr) zu festen 4er-Gruppen zusammenfassen - jede Gruppe (auch mit nur
  // einem Eintrag) bekommt dieselbe Kachel-Darstellung mit einer "Reguläre
  // Tilgung"-Überschrift, statt dass eine einzelne Buchung optisch kleiner
  // wirkt als die umrandeten Sondertilgungs-/Umbuchungs-Karten. Ein
  // Sondertilgungs-/Ablösungs-/Umbuchungs-Eintrag unterbricht die Kette und
  // startet beim nächsten regulären Eintrag eine frische Gruppe.
  const verlaufsGruppen = useMemo(() => {
    const ergebnis = [];
    verlaufsEintraege.forEach((e) => {
      if (e.art !== "kompakt") {
        ergebnis.push(e);
        return;
      }
      const letzte = ergebnis[ergebnis.length - 1];
      if (letzte && letzte.art === "kompakt-gruppe" && letzte.eintraege.length < 4) {
        letzte.eintraege.push(e);
      } else {
        ergebnis.push({ key: "gruppe-" + e.key, art: "kompakt-gruppe", eintraege: [e] });
      }
    });
    return ergebnis;
  }, [verlaufsEintraege]);

  // Zweifarbiger Deckungsbalken: wie viel vom Ziel (Restschuld + VFE) auf
  // "Ablösung" (entspricht der Schlussrate) bzw. "Model 3" (zusätzlich
  // Zurückgelegtes) entfällt.
  const deckungsNenner = restschuldAktuell + vfeAktuell;
  const abloesungAnteilProzent = deckungsNenner > 0 ? Math.min(100, (abloesungSaldo / deckungsNenner) * 100) : 0;
  const model3AnteilProzent = deckungsNenner > 0 ? Math.min(100 - abloesungAnteilProzent, (model3Saldo / deckungsNenner) * 100) : 0;

  // Unterreiter, um die sonst sehr lange Seite in drei fokussierte
  // Abschnitte aufzuteilen: Übersicht (inkl. Verlauf), Strategien,
  // Verwaltung (Plan/Ist/Prognose, Buchung nachtragen, Checkliste).
  const [unterTab, setUnterTab] = useState("uebersicht");

  // Hält den Kartenschlüssel fest, der gerade angetippt wurde, bis die
  // Rückfrage bestätigt oder abgebrochen wird - ändert selbst noch nichts.
  const [pendingStrategie, setPendingStrategie] = useState(null);

  // Freie Sondertilgungs-Simulation (Schieberegler) - nutzt dieselbe
  // Funktion wie die vier festen Szenario-Karten, nur mit frei wählbarem
  // Betrag statt der festen 0/halbe/volle-Ablösung-Beträge. Rein
  // informativ, bucht nichts.
  const [sliderBetrag, setSliderBetrag] = useState(0);
  const sliderErgebnis = useMemo(() => simulateAutokreditSzenario(sliderBetrag, {
    restschuldStart: restschuldAktuell,
    restschuldDatum,
    model3Saldo,
    abloesungSaldo,
    kredit: kreditOderFallback,
    model3MonatsRate: AUTOKREDIT_MODEL3_RATE,
    monateVoraus: AUTOKREDIT_MONATE_VORAUS,
    sparzins: trZinssatz || 0,
  }), [sliderBetrag, restschuldAktuell, restschuldDatum, model3Saldo, abloesungSaldo, kredit, trZinssatz]);
  const sliderErsparnis = sliderErgebnis.nettokosten !== null
    ? Math.round((szenarien.geplant.nettokosten - sliderErgebnis.nettokosten) * 100) / 100
    : null;

  const [neueBuchung, setNeueBuchung] = useState({ datum: heuteISO, typ: "Zinsbelastung", betrag: "", restschuldNach: "", notiz: "" });
  // Bei "Sondertilgung" ist die neue Restschuld ohne Zinsen berechenbar
  // (aktuelle Restschuld minus Betrag) - anders als bei Zinsbelastung/Gebühr/
  // Ablösung, die vom Kontoauszug abgelesen werden. Feld bleibt trotzdem
  // überschreibbar, falls der Kontoauszug minimal abweicht.
  const berechneRestschuldSondertilgung = (betragStr) => {
    const betrag = Number(betragStr);
    if (!betragStr || isNaN(betrag)) return "";
    return String(Math.max(0, Math.round((restschuldAktuell - betrag) * 100) / 100));
  };
  const handleBuchungSubmit = (e) => {
    e.preventDefault();
    if (!neueBuchung.betrag || !neueBuchung.restschuldNach) return;
    onAddBuchung({
      datum: neueBuchung.datum,
      typ: neueBuchung.typ,
      betrag: Number(neueBuchung.betrag),
      restschuldNach: Number(neueBuchung.restschuldNach),
      notiz: neueBuchung.notiz,
    });
    setNeueBuchung({ datum: heuteISO, typ: "Zinsbelastung", betrag: "", restschuldNach: "", notiz: "" });
  };

  const checkliste = kreditCheckliste.length > 0 ? kreditCheckliste : AUTOKREDIT_CHECKLISTE_FALLBACK.map((item) => ({ item, erledigt: false }));

  // Plan/Ist/Prognose-Vergleich: pro Plan-Monat den passenden Ist-Wert (aus
  // Buchungen, falls für diesen Monat vorhanden) bzw. Prognose-Wert (aus der
  // Simulation) daneben stellen.
  const vergleichsZeilen = planVerlauf.map((plan) => {
    const istTreffer = [...kreditBuchungen].reverse().find((b) => monthKey(b.datum) === isoMonatZuMonthKey(plan.monat));
    const prognoseTreffer = rows.find((r) => r.monat === plan.monat);
    return {
      monat: plan.monat,
      planRestschuld: plan.restschuld,
      istRestschuld: istTreffer ? istTreffer.restschuldNach : null,
      prognoseRestschuld: prognoseTreffer ? prognoseTreffer.restschuld : null,
    };
  });

  if (!kredit) {
    return (
      <div className="space-y-3">
        <h2 className="text-base font-semibold text-zinc-200">Autokredit – Ablösung</h2>
        <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 px-4 py-3 text-sm text-amber-200">
          Keine Vertragsdaten gefunden. Bitte in Supabase die Tabelle "autokredit_konfiguration" einmalig mit den echten
          Werten befüllen (Zeile mit id = "default" – siehe supabase-schema-autokredit.sql).
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-5">
      <div className="flex gap-1.5 rounded-xl bg-zinc-900/70 p-1">
        {[
          { key: "uebersicht", label: "Übersicht" },
          { key: "strategien", label: "Strategien" },
          { key: "verwaltung", label: "Verwaltung" },
        ].map((t) => (
          <button key={t.key} type="button" onClick={() => setUnterTab(t.key)}
            className={`flex-1 rounded-lg py-2 text-[12px] font-semibold transition-colors ${unterTab === t.key ? "bg-zinc-800 text-zinc-100" : "text-zinc-500"}`}>
            {t.label}
          </button>
        ))}
      </div>

      {unterTab === "uebersicht" && (
      <>
      <div className="rounded-2xl border border-zinc-800 bg-gradient-to-br from-zinc-900/80 to-zinc-900/40 p-4">
        <p className="text-[10.5px] uppercase tracking-wide text-zinc-500">{kredit.kreditgeber} · Finanzierungs-Nr. {kredit.finanzierungsnummer}</p>

        <div className="mt-3 flex items-center gap-4">
          <svg width="80" height="80" viewBox="0 0 80 80" className="shrink-0">
            <circle cx="40" cy="40" r={ringRadius} fill="none" stroke="#27272a" strokeWidth="8" />
            <circle cx="40" cy="40" r={ringRadius} fill="none" stroke="#34d399" strokeWidth="8"
              strokeDasharray={ringUmfang} strokeDashoffset={ringOffset} strokeLinecap="round"
              transform="rotate(-90 40 40)" />
            <text x="40" y="38" textAnchor="middle" fontSize="17" fontWeight="800" fill="#f4f4f5">{prozentAbbezahlt}%</text>
            <text x="40" y="51" textAnchor="middle" fontSize="8" fill="#a1a1aa">abbezahlt</text>
          </svg>
          <div className="min-w-0 flex-1 space-y-1">
            <div className="flex justify-between text-[11.5px]"><span className="text-zinc-400">Nettodarlehen</span><span className="font-semibold text-zinc-200">{eur(kreditOderFallback.nettodarlehen)}</span></div>
            <div className="flex justify-between text-[11.5px]"><span className="text-zinc-400">Restschuld</span><span className="font-semibold text-rose-400">{eur(restschuldAktuell)}</span></div>
            <div className="flex justify-between text-[11.5px]"><span className="text-zinc-400">Bereits bezahlt (gesamt)</span><span className="font-semibold text-emerald-400">{eur(bereitsBezahltGesamt)}</span></div>
          </div>
        </div>

        <div className="mt-4 border-t border-zinc-800/80 pt-4 flex items-center gap-4">
          <svg width="80" height="80" viewBox="0 0 80 80" className="shrink-0">
            <circle cx="40" cy="40" r={ringRadius} fill="none" stroke="#27272a" strokeWidth="8" />
            <circle cx="40" cy="40" r={ringRadius} fill="none" stroke="#34d399" strokeWidth="8"
              strokeDasharray={`${ringUmfang * (abloesungAnteilProzent / 100)} ${ringUmfang}`}
              strokeDashoffset="0" strokeLinecap="round" transform="rotate(-90 40 40)" />
            <circle cx="40" cy="40" r={ringRadius} fill="none" stroke="#60a5fa" strokeWidth="8"
              strokeDasharray={`${ringUmfang * (model3AnteilProzent / 100)} ${ringUmfang}`}
              strokeDashoffset={-(ringUmfang * (abloesungAnteilProzent / 100))} strokeLinecap="round" transform="rotate(-90 40 40)" />
            <text x="40" y="38" textAnchor="middle" fontSize="17" fontWeight="800" fill="#f4f4f5">{deckungsgrad}%</text>
            <text x="40" y="51" textAnchor="middle" fontSize="8" fill="#a1a1aa">gedeckt</text>
          </svg>
          <div className="min-w-0 flex-1 space-y-1">
            <div className="flex justify-between text-[11.5px]"><span className="text-zinc-400">Zurückgelegt</span><span className="font-semibold text-emerald-400">{eur(toepfeGesamtAktuell)}</span></div>
            <div className="flex justify-between text-[11.5px]"><span className="text-zinc-400">Noch offen</span><span className="font-semibold text-zinc-200">{eur(nochOffen)}</span></div>
            <div className="flex justify-between text-[11.5px]"><span className="text-zinc-400">Ziel (Restschuld + VFE)</span><span className="font-semibold text-zinc-200">{eur(restschuldAktuell + vfeAktuell)}</span></div>
            <div className="flex gap-3 pt-0.5 text-[10px] text-zinc-400">
              <span><span className="mr-1 inline-block h-1.5 w-1.5 rounded-full bg-emerald-500" />Ablösung {abloesungAnteilProzent.toFixed(1)} %</span>
              <span><span className="mr-1 inline-block h-1.5 w-1.5 rounded-full bg-sky-400" />Model 3 {model3AnteilProzent.toFixed(1)} %</span>
            </div>
          </div>
        </div>

        <div className="mt-3 flex items-center gap-2 rounded-xl border border-emerald-500/25 bg-emerald-500/8 px-3 py-2 text-[12px] text-emerald-200">
          <Icon name="trend" size={14} className="shrink-0" />
          <span>Kreditfrei ab {formatKreditfreiAb(ausgewaehltesSzenario.kreditfreiAb)} (gewählte Strategie: {AUTOKREDIT_SZENARIO_DEFS.find((d) => d.key === gewaehlteStrategie).label})</span>
        </div>

        <div className="mt-3 flex flex-wrap gap-1.5">
          <span className="rounded-lg border border-zinc-800 bg-zinc-900/50 px-2.5 py-1.5 text-[11px] text-zinc-400">Nettodarlehen <b className="text-zinc-200">{eur(kredit.nettodarlehen)}</b></span>
          <span className="rounded-lg border border-zinc-800 bg-zinc-900/50 px-2.5 py-1.5 text-[11px] text-zinc-400">Sollzins <b className="text-zinc-200">{(kredit.sollzins * 100).toFixed(2).replace(".", ",")} %</b></span>
          <span className="rounded-lg border border-zinc-800 bg-zinc-900/50 px-2.5 py-1.5 text-[11px] text-zinc-400">Rate <b className="text-zinc-200">{eur(kredit.monatsrate)}/Monat</b></span>
          <span className="rounded-lg border border-zinc-800 bg-zinc-900/50 px-2.5 py-1.5 text-[11px] text-zinc-400">Schlussrate <b className="text-zinc-200">{eur(kredit.schlussrateAktuell != null ? kredit.schlussrateAktuell : kredit.schlussrate)}</b> ({dateDE(kredit.schlussrateFaelligAm)})</span>
        </div>
      </div>

      {istVollstaendigAbgeloest && (
        <div className="flex gap-2 rounded-xl border border-emerald-500/30 bg-emerald-500/5 px-3.5 py-3 text-[12.5px] text-emerald-300">
          <Icon name="check" size={15} className="mt-0.5 shrink-0" />
          <span>Kredit vollständig abgelöst.</span>
        </div>
      )}
      {bereitsGedeckt && !istVollstaendigAbgeloest && (
        <div className="flex gap-2 rounded-xl border border-emerald-500/30 bg-emerald-500/5 px-3.5 py-3 text-[12.5px] text-emerald-300">
          <Icon name="check" size={15} className="mt-0.5 shrink-0" />
          <span>Ablösung jetzt möglich. Restschuld und geschätzte VFE vollständig gedeckt.</span>
        </div>
      )}
      {!bereitsGedeckt && monateBisAusgewaehlt !== null && monateBisAusgewaehlt <= 2 && (
        <div className="flex gap-2 rounded-xl border border-amber-500/30 bg-amber-500/5 px-3.5 py-3 text-[12.5px] text-amber-200">
          <Icon name="alert" size={15} className="mt-0.5 shrink-0" />
          <span>Laut gewählter Strategie Deckung in ca. {Math.max(1, monateBisAusgewaehlt + 1)} Monat(en). Ablöseangebot (inkl. VFE-Berechnung) rechtzeitig anfordern.</span>
        </div>
      )}
      {trZinssatz !== null && trZinssatz < 0.015 && (
        <div className="flex gap-2 rounded-xl border border-amber-500/30 bg-amber-500/5 px-3.5 py-3 text-[12.5px] text-amber-200">
          <Icon name="alert" size={15} className="mt-0.5 shrink-0" />
          <span>Tagesgeld-Zins auf {(trZinssatz * 100).toFixed(2).replace(".", ",")} % gefallen. Unter 1,5 % lohnt sich eine erneute Prüfung – eine Sondertilgung könnte günstiger sein.</span>
        </div>
      )}
      {rücklageSaldo < 1000 && (
        <div className="flex gap-2 rounded-xl border border-rose-500/30 bg-rose-500/5 px-3.5 py-3 text-[12.5px] text-rose-200">
          <Icon name="alert" size={15} className="mt-0.5 shrink-0" />
          <span>Warnung: Rücklage bei {eur(rücklageSaldo)}, unter 1.000 €.</span>
        </div>
      )}

      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="text-[12.5px] font-semibold text-zinc-400">Verlauf</p>
        <p className="mt-1 text-[11px] text-zinc-500">Start, Sondertilgungen und aktueller Stand.</p>

        <div className="relative mt-4 pl-6">
          <div className="absolute bottom-1.5 left-[9px] top-1.5 w-px bg-zinc-800" />

          <div className="relative mb-5">
            <div className="absolute -left-6 top-0.5 flex h-5 w-5 items-center justify-center rounded-full border-2 border-zinc-900 bg-orange-500/20 text-[10px] text-orange-400">●</div>
            <div className="flex flex-wrap items-baseline gap-2">
              <span className="text-[12.5px] font-bold text-zinc-100">Start</span>
              <span className="text-[10.5px] text-zinc-500">{dateDE(kredit.auszahlungsdatum)}</span>
            </div>
            <div className="mt-1.5 rounded-xl border border-zinc-800/80 bg-zinc-950/40 p-2.5">
              <div className="flex justify-between text-[11.5px]"><span className="text-zinc-400">Nettodarlehen</span><span className="font-semibold text-zinc-200">{eur(kredit.nettodarlehen)}</span></div>
              <div className="mt-0.5 flex justify-between text-[11.5px]"><span className="text-zinc-400">Schlussrate (ursprünglich)</span><span className="font-semibold text-zinc-200">{eur(kredit.schlussrate)}</span></div>
            </div>
          </div>

          {verlaufsGruppen.map((e) => {
            if (e.art === "kompakt-gruppe") {
              const items = e.eintraege;
              const ersteDatum = dateDE(items[0].buchung.datum);
