              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <AccountIcon name="Trade Republic" fallbackColor="#10b981" balance={trGesamt} />
                  <div><p className="text-sm text-zinc-200">Trade Republic</p><p className="text-[11px] text-zinc-500">Realkonto · besteht komplett aus den Töpfen unten</p></div>
                </div>
                <p className={`text-sm font-medium tabular-nums ${amountColor(trGesamt)}`}>{eur(trGesamt)}</p>
              </div>
            </div>
            <div className="flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
              <div className="flex items-center gap-2.5">
                <AccountIcon name="ING" fallbackColor="#10b981" balance={ingBalance} />
                <div><p className="text-sm text-zinc-200">ING</p><p className="text-[11px] text-zinc-500">Realkonto</p></div>
              </div>
              <p className={`text-sm font-medium tabular-nums ${amountColor(ingBalance)}`}>{eur(ingBalance)}</p>
            </div>
          </div>
          <p className="mb-2 mt-4 text-[11px] font-medium uppercase tracking-wide text-zinc-600">Töpfe innerhalb von Trade Republic</p>
          <ToepfeKarussell virtualAccounts={virtualAccounts} balances={balances} potAllocations={potAllocations} />
        </div>
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4 lg:col-span-2">
          <h2 className="mb-3 text-sm font-semibold text-zinc-200">Letzte Buchungen</h2>
          <div className="space-y-1">
            {recent.map((t) => (
              <div key={t.id} className="flex items-center justify-between rounded-lg px-2 py-2 hover:bg-zinc-800/40">
                <div className="flex min-w-0 items-center gap-2.5">
                  <MerchantIcon titel={t.titel} isLight={isLight} />
                  <div className="min-w-0"><p className="truncate text-sm text-zinc-200">{t.titel}</p><p className="text-[11px] text-zinc-500">{dateDE(t.datum)} · {t.kategorie}</p></div>
                </div>
                <p className={`shrink-0 pl-2 text-sm font-medium tabular-nums ${t.typ === "Einnahme" ? "text-emerald-400" : t.typ === "Ausgabe" ? "text-rose-400" : "text-cyan-400"}`}>
                  {t.typ === "Ausgabe" ? "-" : t.typ === "Einnahme" ? "+" : "↔"} {eur(t.betrag)}
                </p>
              </div>
            ))}
            {recent.length === 0 && <p className="py-6 text-center text-sm text-zinc-500">Noch keine Buchungen vorhanden.</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== Buchungsformular ============================== */

function emptyForm() { return { id: null, datum: todayISO(), titel: "", kategorie: "", typ: "Ausgabe", betrag: "", quelle: "", ziel: "", notiz: "" }; }

function BuchungsForm({ accounts, categories, transactions, onSubmit, submitting, initial, onCancel }) {
  const [form, setForm] = useState(initial || emptyForm());
  const [errors, setErrors] = useState({});
  const [showSuggestions, setShowSuggestions] = useState(false);
  const accountOptions = accounts.map((a) => a.name);
  const catOptions = categories.filter((c) => c.typ === form.typ || form.typ === "Umbuchung");

  // Für jeden bisher verwendeten Titel (passend zum aktuell gewählten Typ)
  // die zuletzt genutzte Buchung merken, um Kategorie/Quelle/Ziel beim
  // Auswählen eines Vorschlags automatisch mit übernehmen zu können.
  const titelVorschlaege = useMemo(() => {
    if (!transactions) return [];
    const map = new Map();
    transactions.forEach((t) => {
      if (t.typ !== form.typ || !t.titel) return;
      if (!map.has(t.titel)) map.set(t.titel, t); // Journal ist neueste zuerst sortiert
    });
    return Array.from(map.values());
  }, [transactions, form.typ]);

  const gefilterteVorschlaege = form.titel.trim()
    ? titelVorschlaege.filter((t) => t.titel.toLowerCase().includes(form.titel.toLowerCase()) && t.titel.toLowerCase() !== form.titel.toLowerCase()).slice(0, 5)
    : [];

  const vorschlagWaehlen = (t) => {
    setForm((f) => ({ ...f, titel: t.titel, kategorie: t.kategorie || f.kategorie, quelle: t.quelle || f.quelle, ziel: t.ziel || f.ziel }));
    setShowSuggestions(false);
  };

  const validate = () => {
    const e = {};
    if (!form.titel.trim()) e.titel = "Titel erforderlich";
    if (!form.betrag || Number(form.betrag) <= 0) e.betrag = "Gültigen Betrag angeben";
    if (!form.quelle) e.quelle = form.typ === "Einnahme" ? "Herkunft angeben" : "Quelle wählen";
    if (form.typ !== "Ausgabe" && !form.ziel) e.ziel = "Ziel wählen";
    if (form.typ === "Ausgabe" && !form.kategorie) e.kategorie = "Kategorie wählen";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    onSubmit({ ...form, betrag: Number(form.betrag) });
    if (!initial) setForm(emptyForm());
  };
  const setTyp = (typ) => setForm((f) => ({ ...f, typ, kategorie: "", quelle: "", ziel: "" }));

  return (
    <form onSubmit={handleSubmit} className="mx-auto max-w-xl space-y-5">
      {!initial && <h2 className="text-base font-semibold text-zinc-200">Neue Buchung</h2>}
      <div className="grid grid-cols-3 gap-2">
        {["Ausgabe", "Einnahme", "Umbuchung"].map((typ) => {
          const active = form.typ === typ;
          const colors = { Ausgabe: "border-rose-500/50 bg-rose-500/10 text-rose-300", Einnahme: "border-emerald-500/50 bg-emerald-500/10 text-emerald-300", Umbuchung: "border-cyan-500/50 bg-cyan-500/10 text-cyan-300" };
          return <button key={typ} type="button" onClick={() => setTyp(typ)} className={`rounded-xl border px-3 py-2.5 text-sm font-medium transition-colors ${active ? colors[typ] : "border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200"}`}>{typ}</button>;
        })}
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Datum"><input type="date" className={inputCls} value={form.datum} onChange={(e) => setForm((f) => ({ ...f, datum: e.target.value }))} /></Field>
        <Field label="Betrag (€)">
          <input type="number" step="0.01" min="0" placeholder="0,00" className={inputCls} value={form.betrag} onChange={(e) => setForm((f) => ({ ...f, betrag: e.target.value }))} />
          {errors.betrag && <p className="mt-1 text-xs text-rose-400">{errors.betrag}</p>}
        </Field>
      </div>
      <Field label="Titel">
        <div className="relative">
          <input
            type="text"
            placeholder="z. B. Wocheneinkauf Rewe"
            className={inputCls}
            value={form.titel}
            onChange={(e) => { setForm((f) => ({ ...f, titel: e.target.value })); setShowSuggestions(true); }}
            onFocus={() => setShowSuggestions(true)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
            autoComplete="off"
          />
          {showSuggestions && gefilterteVorschlaege.length > 0 && (
            <div className="absolute z-20 mt-1 w-full overflow-hidden rounded-lg border border-zinc-700 bg-zinc-800 shadow-lg">
              {gefilterteVorschlaege.map((t) => (
                <button
                  key={t.titel}
                  type="button"
                  onMouseDown={() => vorschlagWaehlen(t)}
                  className="flex w-full items-center justify-between px-3 py-2 text-left text-sm text-zinc-200 hover:bg-zinc-700"
                >
                  <span className="truncate">{t.titel}</span>
                  <span className="ml-2 shrink-0 text-[11px] text-zinc-500">{t.kategorie}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        {errors.titel && <p className="mt-1 text-xs text-rose-400">{errors.titel}</p>}
      </Field>
      {form.typ !== "Umbuchung" && (
        <Field label="Kategorie">
          <select className={inputCls} value={form.kategorie} onChange={(e) => setForm((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="">Kategorie wählen</option>
            {catOptions.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          {errors.kategorie && <p className="mt-1 text-xs text-rose-400">{errors.kategorie}</p>}
        </Field>
      )}
      <div className="grid grid-cols-2 gap-3">
        <Field label={form.typ === "Einnahme" ? "Herkunft" : "Quelle"}>
          {form.typ === "Einnahme" ? (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Wählen</option><option value="arbeitgeber">Arbeitgeber</option><option value="extern">Extern</option>
              {accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          ) : (
            <select className={inputCls} value={form.quelle} onChange={(e) => setForm((f) => ({ ...f, quelle: e.target.value }))}>
              <option value="">Konto wählen</option>{accountOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          )}
          {errors.quelle && <p className="mt-1 text-xs text-rose-400">{errors.quelle}</p>}
        </Field>
        {form.typ !== "Ausgabe" && (
          <Field label="Ziel">
            <select className={inputCls} value={form.ziel} onChange={(e) => setForm((f) => ({ ...f, ziel: e.target.value }))}>
              <option value="">Konto wählen</option>
              {accountOptions.filter((n) => n !== form.quelle).map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            {errors.ziel && <p className="mt-1 text-xs text-rose-400">{errors.ziel}</p>}
          </Field>
        )}
      </div>
      <Field label="Notiz (optional)"><textarea rows={2} className={inputCls} value={form.notiz} onChange={(e) => setForm((f) => ({ ...f, notiz: e.target.value }))} placeholder="Zusätzliche Details" /></Field>
      <div className="flex items-center gap-2 pt-1">
        <button type="submit" disabled={submitting} className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-emerald-500 disabled:opacity-60">
          {submitting && <Icon name="loader" size={15} className="animate-spin" />}{initial ? "Änderungen speichern" : "Buchung speichern"}
        </button>
        {onCancel && <button type="button" onClick={onCancel} className="rounded-xl border border-zinc-700 px-4 py-2.5 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>}
      </div>
    </form>
  );
}

/* ============================== Journal ============================== */

function Journal({ transactions, accounts, categories, filter, setFilter, showFilters, setShowFilters, onEdit, onDelete, isLight }) {
  const months = Array.from(new Set(transactions.map((t) => monthKey(t.datum)))).sort().reverse();
  const filtered = transactions.filter((t) => {
    if (filter.monat !== "alle" && monthKey(t.datum) !== filter.monat) return false;
    if (filter.konto !== "alle" && t.quelle !== filter.konto && t.ziel !== filter.konto) return false;
    if (filter.kategorie !== "alle" && t.kategorie !== filter.kategorie) return false;
    if (filter.typ !== "alle" && t.typ !== filter.typ) return false;
    return true;
  });
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Journal</h2>
        <button onClick={() => setShowFilters((s) => !s)} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">
          <Icon name="filter" size={13} /> Filter <Icon name="chevron" size={13} className={showFilters ? "rotate-180 transition-transform" : "transition-transform"} />
        </button>
      </div>
      {showFilters && (
        <div className="grid grid-cols-2 gap-2.5 rounded-xl border border-zinc-800 bg-zinc-900/50 p-3 md:grid-cols-4">
          <select className={inputCls} value={filter.monat} onChange={(e) => setFilter((f) => ({ ...f, monat: e.target.value }))}>
            <option value="alle">Alle Monate</option>{months.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
          <select className={inputCls} value={filter.konto} onChange={(e) => setFilter((f) => ({ ...f, konto: e.target.value }))}>
            <option value="alle">Alle Konten</option>{accounts.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
          <select className={inputCls} value={filter.kategorie} onChange={(e) => setFilter((f) => ({ ...f, kategorie: e.target.value }))}>
            <option value="alle">Alle Kategorien</option>{categories.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          <select className={inputCls} value={filter.typ} onChange={(e) => setFilter((f) => ({ ...f, typ: e.target.value }))}>
            <option value="alle">Alle Typen</option><option value="Ausgabe">Ausgabe</option><option value="Einnahme">Einnahme</option><option value="Umbuchung">Umbuchung</option>
          </select>
        </div>
      )}
      <div className="space-y-2">
        {filtered.map((t) => (
          <div key={t.id} className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-3">
            <div className="flex min-w-0 flex-1 items-center gap-2.5">
              <MerchantIcon titel={t.titel} isLight={isLight} />
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2"><p className="truncate text-sm font-medium text-zinc-200">{t.titel}</p><TypBadge typ={t.typ} /></div>
                <p className="mt-1 truncate text-[11.5px] text-zinc-500">{dateDE(t.datum)} · {t.kategorie} · {t.typ === "Ausgabe" ? t.quelle : `${t.quelle} → ${t.ziel}`}{t.notiz ? ` · ${t.notiz}` : ""}</p>
              </div>
            </div>
            <p className={`shrink-0 text-sm font-semibold tabular-nums ${t.typ === "Einnahme" ? "text-emerald-400" : t.typ === "Ausgabe" ? "text-rose-400" : "text-cyan-400"}`}>
              {t.typ === "Ausgabe" ? "-" : t.typ === "Einnahme" ? "+" : "↔"} {eur(t.betrag)}
            </p>
            <div className="flex shrink-0 items-center gap-1">
              <button onClick={() => onEdit(t)} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200"><Icon name="pencil" size={15} /></button>
              <button onClick={() => onDelete(t.id)} className="rounded-lg p-1.5 text-zinc-400 hover:bg-rose-500/10 hover:text-rose-400"><Icon name="trash" size={15} /></button>
            </div>
          </div>
        ))}
        {filtered.length === 0 && <p className="py-10 text-center text-sm text-zinc-500">Keine Buchungen für diese Filter gefunden.</p>}
      </div>
    </div>
  );
}

function EditModal({ tx, accounts, categories, transactions, onClose, onSave }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm md:items-center">
      <div className="max-h-[90dvh] w-full max-w-xl overflow-y-auto rounded-t-2xl border border-zinc-800 bg-zinc-950 p-5 md:rounded-2xl">
        <div className="mb-4 flex items-center justify-between"><h3 className="text-base font-semibold text-zinc-200">Buchung bearbeiten</h3><button onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800"><Icon name="x" size={18} /></button></div>
        <BuchungsForm accounts={accounts} categories={categories} transactions={transactions} initial={tx} onSubmit={onSave} onCancel={onClose} />
      </div>
    </div>
  );
}

function ConfirmModal({ title, message, onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 px-4 backdrop-blur-sm">
      <div className="w-full max-w-sm rounded-2xl border border-zinc-800 bg-zinc-900 p-5">
        <div className="mb-3 flex items-center gap-2 text-rose-400"><Icon name="alert" size={18} /><h3 className="text-sm font-semibold">{title}</h3></div>
        <p className="mb-5 text-sm text-zinc-400">{message}</p>
        <div className="flex gap-2">
          <button onClick={onConfirm} className="flex-1 rounded-xl bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-500">Löschen</button>
          <button onClick={onCancel} className="flex-1 rounded-xl border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800">Abbrechen</button>
        </div>
      </div>
    </div>
  );
}

/* ============================== Fixkosten ============================== */

function Fixkosten({ fixedCosts, onSaveFixkosten, onDeleteFixkosten, categories, accounts, forceRun, setForceRun, onRun, lastRunInfo, showToast }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const verteilung = useMemo(() => computeGehaltsverteilung(fixedCosts), [fixedCosts]);
  const remove = (id) => { onDeleteFixkosten(id); setConfirmDeleteId(null); };
  const save = (form) => {
    onSaveFixkosten(form);
    setShowForm(false); setEditing(null);
  };
  return (
    <div className="space-y-5">
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <h2 className="mb-3 text-sm font-semibold text-zinc-200">Gehaltsverteilung (aktueller Monat)</h2>
        <div className="grid grid-cols-1 gap-2.5 sm:grid-cols-3">
          <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
            <p className="text-[11px] text-zinc-500">Gehaltseingang gesamt</p>
            <p className="mt-0.5 text-base font-semibold tabular-nums text-zinc-100">{eur(verteilung.gehalt)}</p>
          </div>
          <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
            <p className="text-[11px] text-zinc-500">Auf ING behalten</p>
            <p className="mt-0.5 text-base font-semibold tabular-nums text-amber-300">{eur(verteilung.aufING)}</p>
          </div>
          <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
            <p className="text-[11px] text-zinc-500">Auf Trade Republic überweisen</p>
            <p className="mt-0.5 text-base font-semibold tabular-nums text-cyan-300">{eur(verteilung.aufTR)}</p>
          </div>
        </div>
        {Math.abs(verteilung.differenz) > 0.5 && (
          <p className="mt-3 text-[11.5px] text-amber-300">
            Hinweis: Gehalt minus ING-Anteil minus Trade-Republic-Anteil ergibt eine Differenz von {eur(verteilung.differenz)}. Prüfe, ob alle Fixkosten-Positionen korrekt als Quelle "ING" hinterlegt sind.
          </p>
        )}
        <p className="mt-2 text-[11.5px] text-zinc-500">Berechnet aus den aktuell gültigen Positionen im Fixkosten_Plan. "Auf ING behalten" sind alle externen Zahlungen (Miete, Versicherungen usw.), "Auf Trade Republic überweisen" ist alles, was in deine Budget-Töpfe fließt.</p>
      </div>
      <div className="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-4">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div className="flex items-start gap-2.5">
            <Icon name="calendar" size={18} className="mt-0.5 shrink-0 text-amber-400" />
            <div>
              <p className="text-sm font-medium text-zinc-200">Monatliche Fixkosten & Besoldung jetzt buchen</p>
              <p className="text-xs text-zinc-500">Besoldung auf letzten Bankwerktag des Vormonats, Fixkosten auf den 1. des Monats. Positionen mit internem Zielkonto werden automatisch als Umbuchung gebucht. Läuft ab jetzt zusätzlich automatisch (siehe Google Apps Script) – dieser Button bleibt als manuelle Möglichkeit bestehen.</p>
            </div>
          </div>
          <div className="flex shrink-0 items-center gap-2">
            <label className="flex items-center gap-1.5 text-xs text-zinc-400"><input type="checkbox" checked={forceRun} onChange={(e) => setForceRun(e.target.checked)} className="accent-amber-500" />Erzwingen</label>
            <button onClick={onRun} className="rounded-xl bg-amber-500 px-4 py-2 text-sm font-medium text-zinc-900 hover:bg-amber-400">Jetzt buchen</button>
          </div>
        </div>
        {lastRunInfo && <p className="mt-3 border-t border-amber-500/20 pt-2.5 text-[11.5px] text-zinc-500">Letzter Lauf ({lastRunInfo.targetMonthKey}): Besoldungsdatum {dateDE(lastRunInfo.salaryDate)}, Fixkosten-Datum {dateDE(lastRunInfo.fixedDate)} · {lastRunInfo.created} gebucht, {lastRunInfo.skipped} übersprungen.</p>}
      </div>
      <div className="flex items-center justify-between">
        <h2 className="text-base font-semibold text-zinc-200">Fixkosten & Daueraufträge</h2>
        <button onClick={() => { setEditing(null); setShowForm(true); }} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="plus" size={14} /> Neue Position</button>
      </div>
      <div className="space-y-2">
        {fixedCosts.map((f) => (
          <div key={f.id} className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-3.5 py-3">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2"><p className="truncate text-sm font-medium text-zinc-200">{f.bezeichnung}</p><TypBadge typ={f.typ} /></div>
              <p className="mt-1 truncate text-[11.5px] text-zinc-500">{f.kategorie} · {f.typ === "Ausgabe" && (!f.ziel || f.ziel === "Extern") ? f.quelle : `${f.quelle} → ${f.ziel}`} · gültig ab {dateDE(f.gueltigAb)}{f.gueltigBis ? ` bis ${dateDE(f.gueltigBis)}` : ""}</p>

            <p className="shrink-0 text-sm font-semibold tabular-nums text-zinc-200">{eur(f.betrag)}</p>

              <button onClick={() => setConfirmDeleteId(f.id)} className="rounded-lg p-1.5 text-zinc-400 hover:bg-rose-500/10 hover:text-rose-400"><Icon name="trash" size={15} /></button>
            </div>
          </div>
        ))}
        {fixedCosts.length === 0 && <p className="py-8 text-center text-sm text-zinc-500">Noch keine Fixkosten geladen.</p>}
      </div>
      {showForm && (
        <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm md:items-center">
          <div className="max-h-[90dvh] w-full max-w-xl overflow-y-auto rounded-t-2xl border border-zinc-800 bg-zinc-950 p-5 md:rounded-2xl">
            <div className="mb-4 flex items-center justify-between">
              <h3 className="text-base font-semibold text-zinc-200">{editing ? "Position bearbeiten" : "Neue Fixkosten-Position"}</h3>
              <button onClick={() => { setShowForm(false); setEditing(null); }} className="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800"><Icon name="x" size={18} /></button>
            </div>
            <FixkostenForm categories={categories} accounts={accounts} initial={editing} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={save} />
          </div>
        </div>
      )}
      {confirmDeleteId && (

/* ============================== Auswertung ============================== */

function computeVermoegensverlauf(accounts, transactions) {
  const currentMK = monthKey(todayISO());
  const monthsSet = new Set(transactions.map((t) => monthKey(t.datum)));
  monthsSet.add(currentMK);
  const months = Array.from(monthsSet).filter(Boolean).sort();
  return months.map((mk) => {
    const [y, m] = mk.split("-").map(Number);
    const cutoff = toISO(new Date(y, m, 0));
    const txUpTo = transactions.filter((t) => t.datum <= cutoff);
    const bal = computeBalances(accounts, txUpTo);
    const ing = bal["ING"] || 0;
    const trFrei = bal["Trade Republic"] || 0;
    const pots = accounts.filter((a) => a.typ === "virtuell").reduce((s, a) => s + (bal[a.name] || 0), 0);
    return { monat: mk, gesamt: Math.round((ing + trFrei + pots) * 100) / 100 };
  });
}

function computeKategorienAuswertung(transactions, monatsFilter) {
  const monthTx = transactions.filter((t) => t.typ === "Ausgabe" && (!monatsFilter || monthKey(t.datum) === monatsFilter));
  const map = {};
  monthTx.forEach((t) => { map[t.kategorie || "Sonstiges"] = (map[t.kategorie || "Sonstiges"] || 0) + Number(t.betrag || 0); });
  return Object.entries(map).map(([kategorie, betrag]) => ({ kategorie, betrag: Math.round(betrag * 100) / 100 })).sort((a, b) => b.betrag - a.betrag);
}

// Bewusst weit auseinanderliegende Farbtöne (nicht mehrere Violett-/Rosatöne
// nebeneinander wie zuvor), mittlere Helligkeit/Sättigung, damit jede Farbe
// sowohl auf hellem als auch auf dunklem Hintergrund gut lesbar bleibt.
// Bewährte, gut unterscheidbare Kategorie-Palette (Tableau10-Variante),
// abgestimmt für gute Lesbarkeit sowohl im hellen als auch im dunklen Design.
const KATEGORIE_FARBPALETTE = ["#4e79a7", "#f28e2b", "#59a14f", "#e15759", "#b07aa1", "#76b7b2", "#ff9da7", "#9c755f", "#d4a017", "#8c8681"];
// Feste Farbe pro Kategorie-Name (statt nach Rang), damit dieselbe Kategorie
// über alle Ansichten und Monate hinweg immer dieselbe Farbe hat - Grundlage
// für einen sinnvollen Vergleich im Jahresverlauf. Nur Ausgabe-Kategorien
// werden gezählt, da Einnahme-Kategorien (z. B. "Gehalt") in diesem
// Ausgaben-Diagramm ohnehin nie auftauchen und sonst unnötig eine
// Farb-Position "verbrauchen" würden.
function getKategorieFarbe(name, categories) {
  const ausgabeNamen = categories.filter((c) => c.typ === "Ausgabe").map((c) => c.name);
  const alleNamen = Array.from(new Set([...ausgabeNamen, "Sonstiges"])).sort();
  const index = alleNamen.indexOf(name);
  return KATEGORIE_FARBPALETTE[(index >= 0 ? index : 0) % KATEGORIE_FARBPALETTE.length];
}

// Nur die letzten zwei Kalenderjahre stehen zur Auswahl (aktuelles Jahr und
// ggf. das direkt vorherige, falls dafür Daten existieren) - ältere Jahre
// fallen automatisch aus der Auswahl heraus.
function getVerfuegbareJahre(transactions) {
  const heute = new Date().getFullYear();
  const vorhanden = new Set(transactions.map((t) => Number((t.datum || "").slice(0, 4))).filter((y) => !isNaN(y)));
  return [heute - 1, heute].filter((y) => vorhanden.has(y) || y === heute);
}

const MONATSNAMEN_KURZ = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const MONATSNAMEN_VOLL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
// Dieselben Töpfe, die auch den Ausgaberest speisen - Grundlage für die
// zusätzliche, rein berechnete "Budgetrest"-Anzeige (kein echtes Konto).
const POTS_BUDGETREST = ["Laden", "E-Liquids", "Lebensmittel", "Freizeit", "Kosmetik", "Abo & ETF", "Puffer"];

function computeJahresverlauf(transactions, jahr) {
  const heute = new Date();
  const maxMonat = jahr === heute.getFullYear() ? heute.getMonth() : 11;
  const monate = [];
  for (let m = 0; m <= maxMonat; m++) {
    const mk = `${jahr}-${String(m + 1).padStart(2, "0")}`;
    const monthTx = transactions.filter((t) => t.typ === "Ausgabe" && monthKey(t.datum) === mk);
    const perKategorie = {};
    monthTx.forEach((t) => { const k = t.kategorie || "Sonstiges"; perKategorie[k] = (perKategorie[k] || 0) + Number(t.betrag || 0); });
    monate.push({ label: MONATSNAMEN_KURZ[m], kategorien: perKategorie });
  }
  const alleKategorien = Array.from(new Set(monate.flatMap((m) => Object.keys(m.kategorien))));
  return { monate, kategorien: alleKategorien };
}

        scales: {
          x: { stacked: true, ticks: { color: "#898781" }, grid: { display: false } },
          y: { stacked: true, ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
        },
      },
    });
    return () => { if (jahrChart.current) jahrChart.current.destroy(); };
  }, [JSON.stringify(jahresdaten), istJahresansicht]);

  useEffect(() => {
    if (ansicht !== "sparen" || !sparRef.current || typeof Chart === "undefined" || sparen.posten.length === 0) return;
    if (sparChartRef.current) sparChartRef.current.destroy();
    sparChartRef.current = new Chart(sparRef.current, {
      type: "bar",
      data: {
        // Zweizeiliges Label für Verbrauchssparen-Posten (Chart.js rendert ein
        // Array als mehrzeiligen Achsentext) - Klammerzusatz in eigener Zeile,
        // technisch bedingt in derselben Schriftgröße wie die erste Zeile.
        labels: sparen.posten.map((p) => (p.verbrauchssparen ? [p.bezeichnung, "(Verbrauchssparen)"] : p.bezeichnung)),
        datasets: [{ data: sparen.posten.map((p) => p.betrag), backgroundColor: sparen.posten.map((p, i) => SPAR_FARBEN[i % SPAR_FARBEN.length]), borderRadius: 4 }],
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#898781", callback: (v) => eur(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
          y: { ticks: { color: "#898781", font: { size: 11 } }, grid: { display: false } },
        },
      },
    });
    return () => { if (sparChartRef.current) sparChartRef.current.destroy(); };
  }, [JSON.stringify(sparen), ansicht]);

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-base font-semibold text-zinc-200">Vermögensverlauf</h2>
        <p className="mt-1 text-[12.5px] text-zinc-500">Rückblickend berechnet aus deinen tatsächlichen Buchungen – Gesamtvermögen (ING + Trade Republic) am Ende jedes Monats.</p>
      </div>
      <div className="relative h-64 w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        {verlauf.length > 1 ? <canvas ref={verlaufRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Noch nicht genug Buchungen für einen Verlauf.</p>}
      </div>

      <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <h2 className="text-base font-semibold text-zinc-200">{ansicht === "sparen" ? "Was legst du monatlich zur Seite?" : "Wofür geht dein Geld weg?"}</h2>
        <div className="flex flex-wrap gap-1 rounded-lg border border-zinc-800 bg-zinc-900/50 p-1">
          <button onClick={() => setAnsicht("monat")} className={`rounded-md px-2.5 py-1 text-xs ${ansicht === "monat" ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400"}`}>Dieser Monat</button>
          {verfuegbareJahre.map((jahr) => (
            <button key={jahr} onClick={() => setAnsicht("jahr-" + jahr)} className={`rounded-md px-2.5 py-1 text-xs ${ansicht === "jahr-" + jahr ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400"}`}>{jahr}</button>
          ))}
          <button onClick={() => setAnsicht("alle")} className={`rounded-md px-2.5 py-1 text-xs ${ansicht === "alle" ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400"}`}>Gesamt</button>
          <button onClick={() => setAnsicht("sparen")} className={`rounded-md px-2.5 py-1 text-xs ${ansicht === "sparen" ? "bg-emerald-500/15 text-emerald-400" : "text-zinc-400"}`}>Sparen</button>
        </div>
      </div>

      {ansicht === "sparen" ? (
        <>
          <div className="rounded-2xl border border-emerald-500/25 bg-emerald-500/[0.06] p-5">
            <p className="text-[11.5px] text-zinc-400">Monatliches Sparen gesamt</p>
            <p className="mt-1 text-3xl font-semibold text-emerald-400">{eur(sparen.summe)}</p>
            <p className="mt-1.5 text-[12.5px] leading-relaxed text-zinc-400">So viel legst du dir jeden Monat bewusst für die Zukunft zur Seite – ganz gleich, ob als Rücklage, für die nächste größere Anschaffung oder für Ausgaben, die erst einmal im Jahr fällig werden.</p>
            <p className="mt-1.5 text-[11.5px] text-zinc-500">Aus deinem aktuellen Fixkosten-Plan – ändert sich automatisch, sobald du dort Beträge anpasst.</p>
          </div>

          <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-2">
            {sparen.posten.length === 0 && <p className="p-3 text-sm text-zinc-500">Keine aktiven Sparraten im Fixkosten-Plan gefunden.</p>}
            {sparen.posten.map((p, i) => (
              <div key={p.bezeichnung + p.ziel} className="flex items-center justify-between rounded-xl px-3 py-2.5">
                <span className="flex items-center gap-2 text-sm text-zinc-300">
                  <span className="h-2.5 w-2.5 rounded-sm" style={{ backgroundColor: SPAR_FARBEN[i % SPAR_FARBEN.length] }} />
                  {p.bezeichnung}
                  {p.verbrauchssparen && <span className="text-[10.5px] text-zinc-500">(Verbrauchssparen)</span>}
                </span>
                <span className="text-sm text-zinc-200">{eur(p.betrag)}</span>
              </div>
            ))}
            {sparen.posten.length > 0 && (
              <div className="mt-1 flex items-center justify-between rounded-xl border-t border-zinc-800 px-3 py-2.5">
                <span className="text-sm font-medium text-zinc-100">Summe</span>
                <span className="text-sm font-semibold text-emerald-400">{eur(sparen.summe)}</span>
              </div>
            )}
          </div>

          {sparen.posten.length > 0 && (
            <div className="relative w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4" style={{ height: Math.max(220, sparen.posten.length * 46 + 40) }}>
              <canvas ref={sparRef} />
            </div>
          )}
        </>
      ) : istJahresansicht ? (
        <>
          {jahresdaten && jahresdaten.kategorien.length > 0 && (
            <div className="flex flex-wrap gap-3 text-[11.5px] text-zinc-400">
              {jahresdaten.kategorien.map((kat) => (
                <span key={kat} className="flex items-center gap-1.5">
                  <span className="h-2.5 w-2.5 rounded-sm" style={{ backgroundColor: getKategorieFarbe(kat, categories) }} />
                  {kat}
                </span>
              ))}
            </div>
          )}
          <div className="relative h-72 w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
            {jahresdaten && jahresdaten.kategorien.length > 0 ? <canvas ref={jahrRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Keine Ausgaben für {ausgewaehltesJahr} vorhanden.</p>}
          </div>
        </>
      ) : (
        <div className="relative rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4" style={{ height: Math.max(220, kategorien.length * 34 + 40) }}>
          {kategorien.length > 0 ? <canvas ref={katRef} /> : <p className="flex h-full items-center justify-center text-sm text-zinc-500">Keine Ausgaben in diesem Zeitraum.</p>}
        </div>
      )}

      <h2 className="text-base font-semibold text-zinc-200">Kontoauszüge</h2>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-2">
        {(kontoauszuege || []).length === 0 && (
          <p className="p-3 text-sm text-zinc-500">Noch keine Kontoauszüge vorhanden – der erste entsteht automatisch beim nächsten Monatswechsel.</p>
        )}
        {(kontoauszuege || []).map((k) => (
          <a key={k.url} href={k.url} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between rounded-xl px-3 py-2.5 text-sm text-zinc-300 hover:bg-zinc-800/50">
            <span className="flex items-center gap-2"><Icon name="download" size={14} className="text-zinc-500" />{k.name.replace(".pdf", "")}</span>
            <Icon name="chevron" size={14} className="-rotate-90 text-zinc-500" />
          </a>
        ))}
      </div>
    </div>
  );
}

/* ============================== Einstellungen ============================== */

function Einstellungen({ gasUrl, apiKey, onApplyGasUrl, onApplyApiKey, onDownloadBackup, onDownloadJahresbericht, onManualSync, queueCount, lockConfigured, onSetupLock, onDisableLock, isLight }) {
  const [value, setValue] = useState(gasUrl);
  const [keyValue, setKeyValue] = useState(apiKey);
  const [deviceName, setDeviceName] = useState(getDeviceName());
  const [showSecrets, setShowSecrets] = useState(false);
  const [confirmReveal, setConfirmReveal] = useState(false);
  const secretType = showSecrets ? "text" : "password";

  const handleToggleSecrets = () => {
    if (showSecrets) { setShowSecrets(false); return; }
    if (lockConfigured) setConfirmReveal(true);
    else setShowSecrets(true); // keine Sperre auf diesem Gerät eingerichtet - nichts zum Bestätigen
  };

  if (confirmReveal) {
    return (
      <LockScreen
        title="Zum Anzeigen bestätigen"
        onUnlock={() => { setShowSecrets(true); setConfirmReveal(false); }}
        onCancel={() => setConfirmReveal(false)}
      />
    );
  }

  return (
    <div className="mx-auto max-w-xl space-y-5">
      <h2 className="text-base font-semibold text-zinc-200">Einstellungen</h2>
      {queueCount > 0 && (
        <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 px-4 py-2.5 text-[12.5px] text-amber-200">
          {queueCount} Buchung(en) konnten noch nicht synchronisiert werden und warten lokal auf diesem Gerät. Sie werden automatisch nachgeholt, sobald wieder eine Verbindung besteht – oder klicke unten auf "Jetzt synchronisieren".
        </div>
      )}
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-3 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Verbindung</p>
          <button onClick={handleToggleSecrets} className="flex items-center gap-1 text-[11px] text-zinc-500 hover:text-zinc-300">
            <Icon name={showSecrets ? "eyeOff" : "eye"} size={13} />{showSecrets ? "Verbergen" : "Anzeigen"}
          </button>
        </div>
        <Field label="Google Apps Script Web-App URL">
          <input type={secretType} autoComplete="off" className={inputCls} placeholder="https://script.google.com/macros/s/…/exec" value={value} onChange={(e) => setValue(e.target.value)} />
        </Field>
        <div className="mt-3">
          <Field label="API-Schlüssel">
            <input type={secretType} autoComplete="off" className={inputCls} placeholder="im Apps Script bei API_SECRET eingetragener Wert" value={keyValue} onChange={(e) => setKeyValue(e.target.value)} />
          </Field>
        </div>
        <div className="mt-3 flex gap-2">
          <button onClick={() => { onApplyGasUrl(value.trim()); onApplyApiKey(keyValue.trim()); }} className="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500">Speichern & verbinden</button>
          <button onClick={onManualSync} className="rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800">Jetzt synchronisieren</button>
        </div>
        <p className="mt-2 text-[11.5px] text-zinc-500">Beide Werte werden nur lokal in diesem Browser gespeichert und bei jeder Anfrage an dein Apps-Script-Backend mitgeschickt. Ohne passenden API-Schlüssel antwortet das Skript auf keine Anfrage.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="mb-3 text-sm font-medium text-zinc-200">Gerätename</p>
        <Field label="Wie soll dieses Gerät in der Geräte-Liste heißen?">
          <input className={inputCls} placeholder="z. B. Mi 13, Mi Pad 7 Pro, PC" value={deviceName} onChange={(e) => setDeviceName(e.target.value)} />
        </Field>
        <button onClick={() => saveDeviceName(deviceName.trim())} className="mt-3 rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500">Speichern</button>
        <p className="mt-2 text-[11.5px] text-zinc-500">Erscheint im Kopfbereich beim Antippen von "X Geräte online", damit du deine eigenen Geräte wiedererkennst.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Datenexport</p>
          <button onClick={onDownloadBackup} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> Herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Lädt Konten, Kategorien, Transaktionen und Fixkosten als JSON-Datei herunter.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-medium text-zinc-200">Jahresbericht</p>
          <button onClick={onDownloadJahresbericht} className="flex items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800"><Icon name="download" size={13} /> CSV herunterladen</button>
        </div>
        <p className="text-[11.5px] text-zinc-500">Monatliche Einnahmen, Ausgaben und Netto für das laufende Jahr als CSV-Datei – öffnet sich direkt in Excel, Numbers oder Google Sheets.</p>
      </div>
      <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
        <p className="text-sm font-medium text-zinc-200">Automatisches Backup</p>
        <p className="mt-1 text-[11.5px] text-zinc-500">Läuft serverseitig über Google Apps Script (Funktion "backupErstellen"), unabhängig davon, ob diese App-Seite gerade geöffnet ist. Legt monatlich automatisch eine datierte Kopie deines gesamten Google Sheets in Google Drive ab. Einrichtung: siehe Kommentar am Anfang der Apps-Script-Datei.</p>
      </div>
      <a href="faq.html" className="flex items-center justify-between rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4 hover:border-zinc-700">
        <div>
          <p className="text-sm font-medium text-zinc-200">FAQ &amp; technischer Überblick</p>
          <p className="mt-1 text-[11.5px] text-zinc-500">Buchungslogik, Automatisierung, Backup und Aufbau der App zum Nachlesen.</p>
        </div>
        <Icon name="chevron" size={16} className="shrink-0 -rotate-90 text-zinc-500" />
      </a>
      {isTouchDevice() && (
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
          <p className="text-sm font-medium text-zinc-200">Sicherheitssperre (Fingerabdruck/PIN)</p>
          <p className="mt-1 text-[11.5px] text-zinc-500">
            {lockConfigured
              ? "Aktiv auf diesem Gerät. Sperrt beim Start und nach 3 Minuten im Hintergrund."
              : "Schützt die App auf diesem Gerät vor fremdem Zugriff. Auf dem PC nicht nötig, da dort nicht angeboten."}
          </p>
          <div className="mt-3 flex gap-2">
            {lockConfigured ? (
              <>
                <button onClick={onSetupLock} className="rounded-lg border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:border-zinc-600">PIN ändern</button>
                <button onClick={onDisableLock} className="rounded-lg border border-rose-500/30 px-3 py-1.5 text-xs text-rose-400 hover:bg-rose-500/10">Deaktivieren</button>
              </>
            ) : (
              <button onClick={onSetupLock} className="rounded-lg bg-emerald-500 px-3 py-1.5 text-xs font-medium text-emerald-950">Einrichten</button>
            )}
          </div>
        </div>
      )}
      <div className="pt-2 text-center">
        <p className="text-sm font-semibold text-zinc-200">Finanzindex</p>
        <p className="mt-0.5 text-[11px] font-medium tracking-wide text-zinc-600">Version {APP_VERSION}</p>
        <div className="mx-auto my-3.5 h-px w-full max-w-[240px] bg-zinc-800" />
        <p className="text-[11px] text-zinc-500">Konzeption &amp; Design:</p>
        <img src={isLight ? LOGO_AGH_SCHWARZ : LOGO_AGH_GOLD} alt="A.G.-H." className="mx-auto my-2 h-9 w-auto" />
        <p className="text-[11px] text-zinc-500">Technische Umsetzung: <span className="text-zinc-400">Claude (Anthropic)</span></p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
